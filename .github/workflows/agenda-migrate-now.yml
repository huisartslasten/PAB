name: agenda-migrate-now
on:
  push:
    branches: [refactor/professional-v1]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 1
      - name: Migrate Agenda runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          if 'function buildAgendaItemsForRender()' not in text:
              raise SystemExit('Agenda legacy runtime is already removed')
          block=re.compile(r'\n?let agendaWeekStart=null;.*?\nfunction showPrintCalendar',re.S)
          text,n=block.subn('\nfunction showPrintCalendar',text,count=1)
          if n!=1: raise SystemExit(f'Agenda runtime block count={n}')
          stale=re.compile(r'\n?\s*const pacoGOAgendaHost = Object\.freeze\(\{.*?window\.pacoGOAgendaReady = pacoGOAgendaReady;\s*',re.S)
          text=stale.sub('',text)
          bridge='''\n<script type="module">\nimport { installAgendaRuntimeEntry } from '/src/features/agenda/runtime-entry.js';\ninstallAgendaRuntimeEntry({\n  storage: window.localStorage,\n  currentStudent: () => currentStudent,\n  lessons: () => lessons,\n  demoItems: () => agendaDemoItems,\n  documentRef: document,\n  onEdit: id => editAgendaItem(id),\n  onDelete: id => deleteAgendaItem(id),\n  onLessonMatch: item => agendaLessonMatchHtml(item)\n}, window);\n</script>\n'''
          if text.count('</body>')!=1: raise SystemExit('Expected one closing body tag')
          text=text.replace('</body>',bridge+'</body>',1)
          p.write_text(text,encoding='utf-8')
      - name: Verify
        run: |
          ! grep -q 'function buildAgendaItemsForRender()' index.html
          ! grep -q 'function renderAgenda()' index.html
          ! grep -q 'function showAgenda()' index.html
          grep -q 'src/features/agenda/runtime-entry.js' index.html
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Complete professional agenda runtime migration'
          git push origin HEAD:refactor/professional-v1
      - name: Remove this runner
        run: |
          git rm .github/workflows/agenda-migrate-now.yml
          git commit -m 'Remove one-time Agenda migration runner'
          git push origin HEAD:refactor/professional-v1
