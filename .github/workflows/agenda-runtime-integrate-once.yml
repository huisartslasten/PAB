name: agenda-runtime-integrate-once

on:
  push:
    branches: [refactor/professional-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 1

      - name: Integrate Agenda runtime at the existing application seam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'window.pacoGOProfessionalPlayerReady = professionalPlayerReady;'
          block = '''

          const pacoGOAgendaHost = Object.freeze({
            storage: localStorage,
            currentStudent: () => currentStudent,
            lessons: () => lessons,
            demoItems: () => agendaDemoItems,
            documentRef: document,
            onEdit: id => editAgendaItem(id),
            onDelete: id => deleteAgendaItem(id),
            onLessonMatch: item => agendaLessonMatchHtml(item),
            now: () => new Date()
          });

          const pacoGOAgendaReady = import('./src/features/agenda/runtime-bootstrap.js')
            .then(({ bootstrapAgendaRuntime }) => bootstrapAgendaRuntime(pacoGOAgendaHost));

          window.pacoGOAgendaReady = pacoGOAgendaReady;
          '''
          if marker not in text:
              raise SystemExit('Agenda integration marker not found')
          if 'window.pacoGOAgendaReady' in text:
              raise SystemExit('Agenda runtime already integrated')
          path.write_text(text.replace(marker, marker + block, 1), encoding='utf-8')
          PY

      - name: Commit Agenda runtime integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate professional Agenda runtime'
          git push origin refactor/professional-v1

      - name: Remove one-time integration runner
        run: |
          git rm .github/workflows/agenda-runtime-integrate-once.yml
          git commit -m 'Remove one-time Agenda integration runner'
          git push origin refactor/professional-v1
