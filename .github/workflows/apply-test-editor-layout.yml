name: Apply TEST editor layout

on:
  push:
    branches: [test]
    paths:
      - 'tools/apply-editor-layout-v453.sh'
      - '.github/workflows/apply-test-editor-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
      - name: Apply compact editor layout
        run: bash tools/apply-editor-layout-v453.sh
