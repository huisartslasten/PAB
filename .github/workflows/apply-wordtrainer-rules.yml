name: Apply TEST WOORDENTRAINER rules

on:
  push:
    branches:
      - test
    paths:
      - 'tools/patch_wordtrainer_rules.py'
      - '.github/workflows/apply-wordtrainer-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Apply controlled patch to current TEST index
        run: python3 tools/patch_wordtrainer_rules.py

      - name: Commit patched TEST index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed."
            exit 0
          fi
          git add index.html
          git commit -m "TEST V4.53: WOORDENTRAINER hints and evaluation rules [skip ci]"
          git push origin HEAD:test

# Controlled TEST-only trigger; main is never touched.
