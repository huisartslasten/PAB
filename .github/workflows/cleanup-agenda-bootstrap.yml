name: Remove accidental agenda bootstrap wiring
on:
  push:
    branches: [refactor/professional-v1]
    paths: ['index.html', '.github/workflows/cleanup-agenda-bootstrap.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Remove accidental agenda bootstrap wiring') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: refactor/professional-v1, fetch-depth: 1}
      - name: Remove accidental tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<script type="module" src="src/features/agenda/agenda-runtime-bootstrap.js"></script>\n','')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/cleanup-agenda-bootstrap.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/cleanup-agenda-bootstrap.yml
          git commit -m 'Remove accidental agenda bootstrap wiring'
          git push origin HEAD:refactor/professional-v1
