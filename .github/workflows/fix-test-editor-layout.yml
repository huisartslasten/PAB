name: Verify TEST editor layout

on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/fix-test-editor-layout.yml'
      - 'index.html'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 1
      - name: Verify current TEST editor structure
        run: |
          grep -F '<!-- PacoGO TEST V4.77 -->' index.html
          grep -F 'TEST V4.77 — approved uniform editor styling' index.html
          grep -F '#editor .question-field input,#editor .answer-field input' index.html
          grep -F '#editor .word-rules-box input' index.html
          grep -F "</script></body></html>');" index.html
