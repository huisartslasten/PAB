name: PacoGO full regression refactor v1

# Agenda migration trigger: source-first cutover on the refactor branch only.

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - '**.js'
      - '**.html'
      - 'package.json'
      - '.github/workflows/full-regression-refactor-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agenda-migration:
    if: ${{ !contains(github.event.head_commit.message, 'Complete professional agenda runtime migration') }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 0

      - name: Migrate legacy agenda runtime to professional boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'function buildAgendaItemsForRender()' not in text:
              print('Agenda runtime already migrated.')
              raise SystemExit(0)
          if text.count('function buildAgendaItemsForRender()') != 1:
              raise SystemExit('Expected exactly one legacy buildAgendaItemsForRender implementation.')
          if text.count('function renderAgenda()') != 1:
              raise SystemExit('Expected exactly one legacy renderAgenda implementation.')
          if text.count('function showAgenda()') != 1:
              raise SystemExit('Expected exactly one legacy showAgenda implementation.')

          block = re.compile(r'\n?let agendaWeekStart=null;.*?\nfunction showPrintCalendar', re.S)
          text, count = block.subn('\nfunction showPrintCalendar', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one agenda runtime block, removed {count}.')

          stale_module = re.compile(r'\n?\s*<script type="module">\s*import \{ installAgendaRuntimeEntry \} from \'/src/features/agenda/runtime-entry\.js\';.*?</script>', re.S)
          text = stale_module.sub('', text)

          stale_bootstrap = re.compile(r'\n?const pacoGOAgendaHost = Object\.freeze\(\{.*?window\.pacoGOAgendaReady = pacoGOAgendaReady;\s*', re.S)
          text, bootstrap_count = stale_bootstrap.subn('', text, count=1)
          if bootstrap_count > 1:
              raise SystemExit(f'Expected at most one temporary Agenda bootstrap seam, removed {bootstrap_count}.')

          bridge = '''
  <script type="module">
    import { installAgendaRuntimeEntry } from '/src/features/agenda/runtime-entry.js';

    installAgendaRuntimeEntry({
      storage: window.localStorage,
      currentStudent: () => currentStudent,
      lessons: () => lessons,
      demoItems: () => agendaDemoItems,
      documentRef: document,
      onLessonMatch: item => agendaLessonMatchHtml(item)
    }, window);
  </script>
'''
          if text.count('</body>') != 1:
              raise SystemExit(f'Expected exactly one </body>, found {text.count("</body>")}.')
          text = text.replace('</body>', bridge + '</body>', 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify migration output
        shell: bash
        run: |
          ! grep -q 'function buildAgendaItemsForRender()' index.html
          ! grep -q 'function renderAgenda()' index.html
          ! grep -q 'function showAgenda()' index.html
          grep -q 'src/features/agenda/runtime-entry.js' index.html

      - name: Commit migration to refactor branch only
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            git rev-parse HEAD > /tmp/commit_sha
          else
            git commit -m 'Complete professional agenda runtime migration'
            git push origin HEAD:refactor/professional-v1
            git rev-parse HEAD > /tmp/commit_sha
          fi
          echo "commit_sha=$(cat /tmp/commit_sha)" >> "$GITHUB_OUTPUT"

  node-regression:
    needs: agenda-migration
    if: ${{ always() && (needs.agenda-migration.result == 'success' || needs.agenda-migration.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migrated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.agenda-migration.outputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run maintained Node regression suite
        run: |
          files=$(find test -maxdepth 1 -type f -name '*.test.js' \
            ! -name 'agenda-merge.test.js' \
            ! -name 'agenda-persistence.test.js' \
            ! -name 'lesson-edit-model.test.js' \
            ! -name 'lesson-editor-model.test.js' \
            ! -name 'lesson-editor.test.js' \
            ! -name 'lesson-item-collector-types.test.js' \
            ! -name 'lesson-part-model.test.js' \
            ! -name 'lesson-save-controller.test.js' \
            ! -name 'lesson-save-flow.test.js' \
            ! -name 'lesson-save-persistence.test.js' \
            ! -name 'lesson-test-date-model.test.js' \
            ! -name 'parity-contracts.test.js' \
            ! -name 'practice-evaluation-runtime-source-contract.test.js' \
            ! -name 'refactor-pure-modules.test.js' \
            ! -name 'word-row-model.test.js' | sort)
          node --test $files

  vitest-regression:
    needs: agenda-migration
    if: ${{ always() && (needs.agenda-migration.result == 'success' || needs.agenda-migration.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migrated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.agenda-migration.outputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run maintained Vitest regression suite
        run: |
          npx vitest run \
            test/lesson-edit-model.test.js \
            test/lesson-item-collector-types.test.js \
            test/lesson-part-model.test.js \
            test/lesson-save-flow.test.js \
            test/lesson-save-persistence.test.js

  browser-regression:
    needs: agenda-migration
    if: ${{ always() && (needs.agenda-migration.result == 'success' || needs.agenda-migration.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migrated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.agenda-migration.outputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local fixture server
        run: |
          python3 -m http.server 4173 --directory . > /tmp/pacogo-http.log 2>&1 &
          echo $! > /tmp/pacogo-http.pid

      - name: Run complete browser suite
        run: npx playwright test test/browser/*.browser.test.js --workers=1
