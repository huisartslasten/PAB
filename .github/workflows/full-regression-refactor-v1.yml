name: PacoGO full regression refactor v1

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - '**.js'
      - '**.html'
      - 'package.json'
      - '.github/workflows/full-regression-refactor-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run complete Node test suite
        run: |
          set -o pipefail
          node --test test/*.test.js 2>&1 | tee node-regression.log

      - name: Upload Node regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-regression-log
          path: node-regression.log
          if-no-files-found: ignore

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local fixture server
        run: |
          python3 -m http.server 4173 --directory . > /tmp/pacogo-http.log 2>&1 &
          echo $! > /tmp/pacogo-http.pid

      - name: Run complete browser suite
        run: |
          set -o pipefail
          npx playwright test test/browser/*.browser.test.js --workers=1 2>&1 | tee browser-regression.log

      - name: Upload browser regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-log
          path: browser-regression.log
          if-no-files-found: ignore
