name: PacoGO full regression refactor v1
on:
  push:
    branches:
      - refactor/professional-v1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  agenda-cutover-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Migrate legacy Agenda runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'function buildAgendaItemsForRender()' in text:
              if text.count('function buildAgendaItemsForRender()') != 1:
                  raise SystemExit('Expected exactly one legacy buildAgendaItemsForRender implementation.')
              if text.count('function renderAgenda()') != 1:
                  raise SystemExit('Expected exactly one legacy renderAgenda implementation.')
              if text.count('function showAgenda()') != 1:
                  raise SystemExit('Expected exactly one legacy showAgenda implementation.')
              block = re.compile(r'\n?let agendaWeekStart=null;.*?\nfunction showPrintCalendar', re.S)
              text, count = block.subn('\nfunction showPrintCalendar', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one Agenda runtime block, removed {count}.')
          stale = re.compile(r'\n?\s*<script type="module">\s*import \{ installAgendaRuntimeEntry \} from \'/src/features/agenda/runtime-entry\.js\';.*?</script>', re.S)
          text = stale.sub('', text)
          bridge = '''\n  <script type="module">\n    import { installAgendaRuntimeEntry } from '/src/features/agenda/runtime-entry.js';\n    installAgendaRuntimeEntry({\n      storage: window.localStorage,\n      currentStudent: () => currentStudent,\n      lessons: () => lessons,\n      demoItems: () => agendaDemoItems,\n      documentRef: document,\n      onLessonMatch: item => agendaLessonMatchHtml(item)\n    }, window);\n  </script>\n'''
          if text.count('</body>') != 1:
              raise SystemExit(f'Expected exactly one </body>, found {text.count("</body>")}.')
          text = text.replace('</body>', bridge + '</body>', 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify legacy Agenda runtime is gone
        run: |
          ! grep -q 'function buildAgendaItemsForRender()' index.html
          ! grep -q 'function renderAgenda()' index.html
          ! grep -q 'function showAgenda()' index.html
          test "$(grep -c 'src/features/agenda/runtime-entry.js' index.html)" -eq 1
      - name: Run maintained Node regression
        run: |
          files=$(find test -maxdepth 1 -type f -name '*.test.js' \
            ! -name 'agenda-merge.test.js' ! -name 'agenda-persistence.test.js' \
            ! -name 'lesson-edit-model.test.js' ! -name 'lesson-editor-model.test.js' \
            ! -name 'lesson-editor.test.js' ! -name 'lesson-item-collector-types.test.js' \
            ! -name 'lesson-part-model.test.js' ! -name 'lesson-save-controller.test.js' \
            ! -name 'lesson-save-flow.test.js' ! -name 'lesson-save-persistence.test.js' \
            ! -name 'lesson-test-date-model.test.js' ! -name 'parity-contracts.test.js' \
            ! -name 'practice-evaluation-runtime-source-contract.test.js' \
            ! -name 'refactor-pure-modules.test.js' ! -name 'word-row-model.test.js' | sort)
          node --test $files
      - name: Run maintained Vitest regression
        run: npx vitest run test/lesson-edit-model.test.js test/lesson-item-collector-types.test.js test/lesson-part-model.test.js test/lesson-save-flow.test.js test/lesson-save-persistence.test.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: python3 -m http.server 4173 --directory . > /tmp/pacogo-http.log 2>&1 &
      - name: Run browser regression
        run: npx playwright test test/browser/*.browser.test.js --workers=1
      - name: Commit completed Agenda migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Agenda migration already committed.'
          else
            git commit -m 'Complete professional agenda runtime migration'
            git push origin HEAD:refactor/professional-v1
          fi
