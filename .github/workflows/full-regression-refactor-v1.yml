name: PacoGO full regression — refactor/professional-v1

on:
  push:
    branches:
      - refactor/professional-v1
  workflow_dispatch:

jobs:
  agenda-cutover-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from committed lockfile
        run: npm ci --ignore-scripts
      - name: Verify zero known dependency vulnerabilities
        run: npm audit --audit-level=low
      - name: Verify canonical Agenda ownership boundary
        run: |
          test -f src/features/agenda/runtime-entry.js
          test -f src/features/agenda/runtime.js
          test -f src/features/agenda/read-service.js
          ! grep -q 'function buildAgendaItemsForRender()' index.html
          ! grep -q 'function renderAgenda()' index.html
          ! grep -q 'function showAgenda()' index.html
          ! grep -q 'function showAgendaImport()' index.html
          ! grep -q 'function analyzeAgendaVideo()' index.html
          ! grep -q 'function saveAgendaImportReview()' index.html
          ! grep -q 'src/features/agenda/runtime-entry.js' index.html
      - name: Verify canonical practice ownership boundary
        run: |
          test -f src/features/practice/practice-test-runtime.js
          test -f src/features/lessons/practice-presentation.js
          test -f src/features/lessons/practice-runtime-entry.js
          test -f src/features/lessons/practice-runtime.js
          test -f src/features/lessons/test-runtime.js
          grep -q "from './practice-presentation.js'" src/features/lessons/test-runtime.js
          grep -q 'createPracticePresentation' src/features/lessons/test-runtime.js
          ! grep -q 'createProfessionalPlayerBridge' src/features/lessons/test-runtime.js
          ! grep -q 'src/features/lessons/player-runtime-bootstrap.js' test.html
          ! grep -q 'createProfessionalPlayerBridge' test.html
          ! grep -q 'function renderTest()' index.html
          ! grep -q 'function updateTestProgress()' index.html
          ! grep -q "activity={kind:'test',type" index.html
          ! grep -q 'professionalPlayerHost' index.html
          ! grep -q 'player-runtime-bootstrap.js' index.html
          ! grep -q 'window.pacoGOProfessionalPlayerReady' index.html
      - name: Run maintained Node regression
        run: |
          files=$(find test -maxdepth 1 -type f -name '*.test.js' \
            ! -name 'agenda-merge.test.js' ! -name 'agenda-persistence.test.js' \
            ! -name 'lesson-edit-model.test.js' ! -name 'lesson-editor-model.test.js' \
            ! -name 'lesson-editor.test.js' ! -name 'lesson-item-collector-types.test.js' \
            ! -name 'lesson-part-model.test.js' ! -name 'lesson-save-controller.test.js' \
            ! -name 'lesson-save-flow.test.js' ! -name 'lesson-save-persistence.test.js' \
            ! -name 'lesson-test-date-model.test.js' ! -name 'parity-contracts.test.js' \
            ! -name 'practice-evaluation-runtime-source-contract.test.js' \
            ! -name 'refactor-pure-modules.test.js' ! -name 'word-row-model.test.js' \
            ! -name 'skill-definition-service.test.js' | sort)
          node --test $files
      - name: Run maintained Vitest regression
        run: npx vitest run test/lesson-item-collector-types.test.js test/lesson-part-model.test.js test/lesson-save-flow.test.js test/lesson-save-persistence.test.js src/services/learning-content-service.test.js test/skill-definition-service.test.js test/skill-configuration-service.test.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local fixture server
        run: python3 -m http.server 4173 --directory . > /tmp/pacogo-http.log 2>&1 &
      - name: Run browser regression
        run: npx playwright test test/browser/*.browser.test.js --workers=1
      - name: Verify working tree stayed clean
        run: |
          rm -rf test-results playwright-report node_modules
          status=$(git status --porcelain)
          printf '%s\n' "$status"
          test -z "$status"
