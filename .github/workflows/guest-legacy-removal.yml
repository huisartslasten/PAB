name: Controlled guest legacy removal
on:
  push:
    branches:
      - refactor/professional-v1
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
      - name: Remove exactly one legacy declaration
        run: |
          if ! grep -q 'async function setGuestLesson(' index.html; then
            echo 'Legacy setGuestLesson already absent; nothing to do.'
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          const source = fs.readFileSync(path, 'utf8');
          const marker = 'async function setGuestLesson(';
          const starts = [];
          let from = 0;
          while (true) {
            const at = source.indexOf(marker, from);
            if (at === -1) break;
            starts.push(at);
            from = at + marker.length;
          }
          if (starts.length !== 1) throw new Error(`Expected exactly one legacy declaration, found ${starts.length}.`);
          const start = starts[0];
          const braceStart = source.indexOf('{', start);
          if (braceStart < 0) throw new Error('Opening brace not found.');
          let depth = 0, quote = null, escaped = false, lineComment = false, blockComment = false, end = -1;
          for (let i = braceStart; i < source.length; i++) {
            const ch = source[i], next = source[i + 1];
            if (lineComment) { if (ch === '\n') lineComment = false; continue; }
            if (blockComment) { if (ch === '*' && next === '/') { blockComment = false; i++; } continue; }
            if (quote) { if (escaped) { escaped = false; continue; } if (ch === '\\') { escaped = true; continue; } if (ch === quote) quote = null; continue; }
            if (ch === '/' && next === '/') { lineComment = true; i++; continue; }
            if (ch === '/' && next === '*') { blockComment = true; i++; continue; }
            if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
            if (ch === '{') depth++;
            if (ch === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
          }
          if (end < 0) throw new Error('Closing brace not found.');
          const nl = source.indexOf('\n', end);
          const removalEnd = nl < 0 ? end : nl + 1;
          const updated = source.slice(0, start) + source.slice(removalEnd);
          if (/async function setGuestLesson\(/.test(updated) || /function setGuestLesson\(/.test(updated)) throw new Error('Legacy declaration remains.');
          fs.writeFileSync(path, updated);
          NODE
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor(lessons): remove legacy guest access handler"
          git push origin refactor/professional-v1
