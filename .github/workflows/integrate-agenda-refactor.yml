name: Integrate professional agenda runtime

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'src/features/agenda/**'
      - '.github/workflows/integrate-agenda-refactor.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate professional agenda runtime') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 1

      - name: Wire agenda runtime into the application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script type="module" src="src/features/agenda/agenda-runtime-bootstrap.js"></script>'
          if tag not in text:
              marker='</body>'
              if marker not in text:
                  raise SystemExit('index.html has no </body> marker')
              text=text.replace(marker, tag+'\n'+marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time integration workflow
        run: rm -f .github/workflows/integrate-agenda-refactor.yml

      - name: Commit application integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/integrate-agenda-refactor.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate professional agenda runtime'
          git push origin HEAD:refactor/professional-v1
