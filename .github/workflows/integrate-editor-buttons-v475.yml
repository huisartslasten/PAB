name: PacoGO TEST V4.75 editor button integration

on:
  push:
    branches: [test]
    paths:
      - 'tools/integrate-editor-buttons-v475.sh'
      - '.github/workflows/integrate-editor-buttons-v475.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
      - name: Apply local editor change
        run: bash tools/integrate-editor-buttons-v475.sh
      - name: Commit final TEST change and clean up helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f tools/integrate-editor-buttons-v475.sh .github/workflows/integrate-editor-buttons-v475.yml
          git commit -m 'PacoGO TEST V4.75 Les opslaan links in editor'
          git push origin test
