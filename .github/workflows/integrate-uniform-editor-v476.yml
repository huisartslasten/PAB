name: PacoGO TEST V4.76 uniform editor

on:
  push:
    branches: [test]
    paths:
      - 'tools/integrate-uniform-editor-v476.sh'
      - '.github/workflows/integrate-uniform-editor-v476.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
      - name: Apply approved editor styling
        run: bash tools/integrate-uniform-editor-v476.sh
      - name: Commit final TEST change and clean up helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f tools/integrate-uniform-editor-v476.sh .github/workflows/integrate-uniform-editor-v476.yml
          git commit -m 'PacoGO TEST V4.76 uniform editor styling'
          git push origin test
