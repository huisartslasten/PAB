name: Remove legacy test-attempt persistence

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - '.github/workflows/migrate-test-attempt-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-legacy-test-attempt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Remove exactly one legacy saveTestAttempt declaration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = 'async function saveTestAttempt(attempt){'
          end_marker = 'async function finishTest(){'
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Expected saveTestAttempt boundaries were not found exactly.')
          if text.find(start_marker, start + len(start_marker)) >= 0:
              raise SystemExit('More than one saveTestAttempt declaration found; refusing migration.')
          block = text[start:end]
          if block.count("const inserted=await db.from('test_attempts').insert") != 1:
              raise SystemExit('Unexpected legacy saveTestAttempt body; refusing migration.')
          if block.count("const answerInsert=await db.from('test_attempt_answers').insert(rows)") != 1:
              raise SystemExit('Unexpected answer persistence in saveTestAttempt; refusing migration.')
          text = text[:start] + text[end:]
          if 'async function saveTestAttempt(attempt){' in text or 'function saveTestAttempt(attempt){' in text:
              raise SystemExit('Legacy saveTestAttempt declaration still exists after removal.')
          marker = '  <script src="photo-storage.js"></script>'
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one photo-storage script marker.')
          if 'test-history-storage.js' in text:
              raise SystemExit('Test-history storage script already exists; refusing migration.')
          text = text.replace(marker, '  <script src="test-history-storage.js"></script>\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          print('Removed exactly one legacy saveTestAttempt declaration and installed the runtime facade.')
          PY

      - name: Verify and commit removal
        run: |
          test "$(grep -o "async function saveTestAttempt(attempt)" index.html | wc -l)" -eq 0
          test "$(grep -o "function saveTestAttempt(attempt)" index.html | wc -l)" -eq 0
          test "$(grep -o "test-history-storage.js" index.html | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "refactor: remove legacy test-attempt persistence"
          git push origin refactor/professional-v1

      - name: Remove this one-time migration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/migrate-test-attempt-runtime.yml
          git commit -m "chore: remove one-time test-attempt migration"
          git push origin refactor/professional-v1
