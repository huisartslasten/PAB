name: PacoGO migrate test-attempt runtime

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'index.html'
      - 'test-history-storage.js'
      - 'src/features/test-history/**'
      - 'test/test-attempt-*.test.js'
      - '.github/workflows/migrate-test-attempt-runtime.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Remove exact authoritative V4.78 saveTestAttempt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          start = 'async function saveTestAttempt(attempt){\n'
          end = '\nasync function finishTest(){'
          if text.count(start) != 1:
              raise SystemExit(f'Expected exactly one saveTestAttempt declaration, found {text.count(start)}')
          i = text.index(start)
          j = text.index(end, i)
          block = text[i:j]
          expected = """async function saveTestAttempt(attempt){
  if(!attempt?.answers?.length || !currentStudent || !currentLesson) return;
  const total=attempt.answers.length;
  const score=attempt.answers.filter(x=>x.correct).length;
  const inserted=await db.from('test_attempts').insert({lesson_id:currentLesson.id,student:currentStudent,score,total_questions:total,started_at:attempt.startedAt||new Date().toISOString(),completed_at:new Date().toISOString(),is_test:true}).select().single();
  if(inserted.error) throw inserted.error;
  const rows=attempt.answers.map((x,i)=>({attempt_id:inserted.data.id,question_order:i+1,question:String(x.item?.question??''),expected_answer:String(x.item?.answer??''),given_answer:String(x.value??''),is_correct:x.correct===true,question_type:attempt.type||currentLesson.type,answered_at:new Date().toISOString()}));
  const answerInsert=await db.from('test_attempt_answers').insert(rows);
  if(answerInsert.error) throw answerInsert.error;
}"""
          if block != expected:
              raise SystemExit('Legacy saveTestAttempt differs from authoritative V4.78; stopped.')
          path.write_text(text[:i] + text[j+1:])
          text = path.read_text()
          if 'async function saveTestAttempt(' in text or 'function saveTestAttempt(' in text:
              raise SystemExit('Legacy saveTestAttempt remains after removal.')
          marker = '  <script src="photo-storage.js"></script>'
          if text.count(marker) != 1 or 'test-history-storage.js' in text:
              raise SystemExit('Unexpected script markers; stopped.')
          path.write_text(text.replace(marker, '  <script src="test-history-storage.js"></script>\n' + marker, 1))
          print('Exact legacy function removed and facade script installed.')
          PY

      - name: Verify
        run: |
          grep -q 'test-history-storage.js' index.html
          ! grep -q 'async function saveTestAttempt(' index.html
          ! grep -q 'function saveTestAttempt(' index.html

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refactor: remove legacy test-attempt persistence'
          git push origin refactor/professional-v1

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/migrate-test-attempt-runtime.yml
          git commit -m 'chore: remove one-time test-attempt migration workflow'
          git push origin refactor/professional-v1
