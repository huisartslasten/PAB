name: one-time guest runtime wiring
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
      - name: Wire guest runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('photo-storage.js')
          text = p.read_text()
          anchor = "const lessonRecoveryRuntimeBootstrap = import('./src/features/lessons/lesson-recovery-runtime-bootstrap.js')"
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one recovery bootstrap anchor, found {text.count(anchor)}')
          if 'lessonGuestAccessRuntimeBridge' in text:
              raise SystemExit('Guest runtime bridge already exists; refusing duplicate wiring.')
          block = '''const lessonGuestAccessRuntimeBridge = Object.defineProperties({}, {
  requireParent: { get: () => requireParent },
  currentStudent: { get: () => currentStudent },
  db: { get: () => db },
  renderParentStudent: { get: () => renderParentStudent },
  showMessage: { get: () => showMessage }
});
const lessonGuestAccessRuntimeBootstrap = import('./src/features/lessons/lesson-guest-access-runtime-bootstrap.js')
  .then(({ bootstrapLessonGuestAccessRuntime }) => bootstrapLessonGuestAccessRuntime({
    runtime: lessonGuestAccessRuntimeBridge,
    target: window
  }));
window.pacoGOLessonGuestAccessRuntimeReady = lessonGuestAccessRuntimeBootstrap;
window.setGuestLesson = async function setGuestLessonRuntimeFacade(...args){
  const runtimeHandler = await lessonGuestAccessRuntimeBootstrap;
  return runtimeHandler.setGuestLesson(...args);
};

'''
          p.write_text(text.replace(anchor, block + anchor, 1))
          PY
          git diff --check
          grep -q "lessonGuestAccessRuntimeBridge" photo-storage.js
          grep -q "pacoGOLessonGuestAccessRuntimeReady" photo-storage.js
      - name: Commit wiring and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-storage.js
          git commit -m "refactor: wire guest lesson runtime"
          git rm .github/workflows/one-time-guest-runtime-wiring.yml
          git commit -m "chore: remove one-time guest runtime wiring workflow"
          git push origin HEAD:refactor/professional-v1
