name: PacoGO one-time professional player migration

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'scripts/migrate-professional-player.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic source migration
        run: node scripts/migrate-professional-player.mjs

      - name: Commit migrated V4.78 source and remove migration tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/migrate-professional-player.mjs .github/workflows/one-time-professional-player-migration.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate professional player runtime into V4.78"
          git push origin refactor/professional-v1
