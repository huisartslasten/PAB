name: PacoGO professional player gate

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'src/features/lessons/player-*.js'
      - 'src/features/lessons/test-engine.js'
      - 'test/player-*.test.js'
      - 'test/browser/player-*.fixture.html'
      - 'test/browser/player-*.spec.js'
      - '.github/workflows/professional-player-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run professional player contract tests
        run: >-
          node --test
          test/player-runtime-entry-orchestration.test.js
          test/player-runtime-bootstrap.test.js

  player-browser-proof:
    runs-on: ubuntu-latest
    needs: player-contract
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run professional player browser proof
        run: npx playwright test test/browser/player-submit-boundary.spec.js
