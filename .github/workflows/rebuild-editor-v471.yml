name: Rebuild TEST editor V4.71 clean

# Triggered on TEST so the rebuild is applied to index.html.

on:
  push:
    branches: [test]
    paths:
      - 'tools/rebuild-editor-v471.sh'
      - '.github/workflows/rebuild-editor-v471.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
      - name: Give required words proper space
        run: bash tools/rebuild-editor-v471.sh
