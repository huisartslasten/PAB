name: PacoGO browser refactor proof

# Controlled browser proof for refactored lesson-player and application runtimes.
on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'index.html'
      - 'photo-storage.js'
      - 'test-history-storage.js'
      - 'src/features/lessons/**'
      - 'src/features/test-history/**'
      - 'test/browser/**'
      - 'test/lesson-recovery-runtime-source-contract.test.js'
      - 'test/lesson-photo-runtime-source-contract.test.js'
      - 'test/test-attempt-runtime-source-contract.test.js'
      - 'test/lesson-load-runtime-source-contract.test.js'
      - 'test/lesson-order-runtime-source-contract.test.js'
      - 'package.json'
      - '.github/workflows/refactor-browser-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lesson-save-browser-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local fixture server
        run: |
          python3 -m http.server 4173 --directory . > /tmp/pacogo-http.log 2>&1 &
          echo $! > /tmp/pacogo-http.pid

      - name: Run V4.78 browser proof
        run: >-
          npx playwright test
          test/browser/lesson-save-runtime.browser.test.js
          test/browser/lesson-recovery-runtime.browser.test.js
          test/browser/lesson-guest-access-runtime.browser.test.js
          test/browser/lesson-photo-runtime.browser.test.js
          test/browser/test-attempt-runtime.browser.test.js
          test/browser/lesson-load-runtime.browser.test.js
          test/browser/lesson-order-runtime.browser.test.js
          test/browser/test-history-runtime.browser.test.js
          test/browser/player-submit-boundary.browser.test.js
          --workers=1
