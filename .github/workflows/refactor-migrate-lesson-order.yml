name: PacoGO migrate lesson-order boundary

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - '.github/workflows/refactor-migrate-lesson-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor == 'huisartslasten'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 1
      - name: Replace legacy lesson-order implementations with runtime facades
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('function getLessonOrderKey(')
          end = text.index('function normalizeSubvakKey(', start)

          replacement = '''const lessonOrderRuntimeBridge = Object.defineProperties({}, {
            db: { get: () => db },
            storage: { get: () => window.localStorage },
            isParentLoggedIn: { get: () => isParentLoggedIn }
          });

          const lessonOrderRuntimeBootstrap = import('./src/features/lessons/lesson-order-runtime-bootstrap.js')
            .then(({ bootstrapLessonOrderRuntime }) => bootstrapLessonOrderRuntime({
              runtime: lessonOrderRuntimeBridge,
              target: window
            }));
          window.pacoGOLessonOrderRuntimeReady = lessonOrderRuntimeBootstrap;

          async function getOrderedLessons(list, student, subject){
            const runtime = await lessonOrderRuntimeBootstrap;
            return runtime.getOrderedLessons(list, student, subject);
          }
          async function saveLessonOrder(student, subject, list){
            const runtime = await lessonOrderRuntimeBootstrap;
            return runtime.saveLessonOrder(student, subject, list);
          }
          '''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Verify legacy lesson-order ownership is gone
        run: |
          if grep -nE 'function getLessonOrderKey|function getLocalLessonOrder|function applyLessonOrder|function saveLessonOrder\(' index.html; then
            echo 'Legacy lesson-order implementation still present.'
            exit 1
          fi
          grep -n 'lessonOrderRuntimeBootstrap' index.html

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'refactor: wire lesson-order runtime boundary'
          git push
