name: PacoGO professional refactor tests

# Professional refactor contract gate.
on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'src/features/lessons/**'
      - 'src/features/test-history/**'
      - 'test/lesson-save-*.test.js'
      - 'test/lesson-write-service.test.js'
      - 'test/lesson-item-collector.test.js'
      - 'test/editor-items.test.js'
      - 'test/dictation-spellcheck.test.js'
      - 'test/lesson-test-calendar.test.js'
      - 'test/lesson-recovery-write-service.test.js'
      - 'test/lesson-recovery-runtime.test.js'
      - 'test/lesson-recovery-runtime-entry.test.js'
      - 'test/lesson-recovery-runtime-bootstrap.test.js'
      - 'test/lesson-recovery-runtime-source-contract.test.js'
      - 'test/lesson-save-runtime-source-contract.test.js'
      - 'test/lesson-guest-access-*.test.js'
      - 'test/lesson-photo-*.test.js'
      - 'test/test-attempt-*.test.js'
      - 'test/lesson-load-*.test.js'
      - 'test-history-storage.js'
      - 'photo-storage.js'
      - 'index.html'
      - '.github/workflows/refactor-professional-v1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lesson-save-refactor-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run V4.78 lesson-save refactor tests
        run: >-
          node --test
          test/lesson-item-collector.test.js
          test/editor-items.test.js
          test/dictation-spellcheck.test.js
          test/lesson-test-calendar.test.js
          test/lesson-save-model.test.js
          test/lesson-save-validation.test.js
          test/lesson-save-request.test.js
          test/lesson-save-preparation.test.js
          test/lesson-save-coordinator.test.js
          test/lesson-save-runtime-effects.test.js
          test/lesson-save-runtime-entry.test.js
          test/lesson-save-runtime-bootstrap.test.js
          test/lesson-save-runtime-source-contract.test.js
          test/lesson-save-runtime-integration.test.js
          test/lesson-write-service.test.js
          test/lesson-recovery-write-service.test.js
          test/lesson-recovery-runtime.test.js
          test/lesson-recovery-runtime-entry.test.js
          test/lesson-recovery-runtime-bootstrap.test.js
          test/lesson-recovery-runtime-source-contract.test.js
          test/lesson-guest-access-runtime.test.js
          test/lesson-guest-access-write-service.test.js
          test/lesson-guest-access-runtime-entry.test.js
          test/lesson-guest-access-runtime-bootstrap.test.js
          test/lesson-guest-access-runtime-source-contract.test.js
          test/lesson-photo-write-service.test.js
          test/lesson-photo-runtime.test.js
          test/lesson-photo-runtime-entry.test.js
          test/lesson-photo-runtime-bootstrap.test.js
          test/lesson-photo-runtime-source-contract.test.js
          test/test-attempt-write-service.test.js
          test/test-attempt-runtime.test.js
          test/test-attempt-runtime-entry.test.js
          test/test-attempt-runtime-bootstrap.test.js
          test/test-attempt-runtime-source-contract.test.js
          test/lesson-load-runtime.test.js
          test/lesson-load-runtime-entry.test.js
          test/lesson-load-runtime-source-contract.test.js
