name: PacoGO professional player regression

on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'src/features/lessons/**'
      - 'test/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/refactor-professional-v1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  professional-player-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run professional player regression
        run: node --test test/*player*.test.js test/test-engine.test.js
