name: PacoGO professional refactor tests

# Professional refactor full regression gate.
on:
  push:
    branches:
      - refactor/professional-v1
    paths:
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/refactor-professional-v1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  professional-refactor-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run full Node regression
        run: npm test
