name: PacoGO TEST repair photo script

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'PacoGO TEST repair photo script applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          script = '  <script src="photo-storage.js"></script>\n'
          if text.count(script) != 1:
              raise SystemExit(f'Expected exactly one photo-storage script, found {text.count(script)}')
          text = text.replace(script, '', 1)
          marker = '<!-- PacoGO TEST V4.72 -->'
          if marker not in text:
              raise SystemExit('Expected V4.72 marker not found')
          text = text.replace(marker, '<!-- PacoGO TEST V4.73 -->', 1)
          pos = text.rfind('</body>')
          if pos < 0:
              raise SystemExit('Final </body> not found')
          text = text[:pos] + script + text[pos:]
          p.write_text(text, encoding='utf-8')
      - name: Commit repaired TEST and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/repair-photo-script.yml
          git commit -m 'PacoGO TEST repair photo script applied'
          git push origin test
