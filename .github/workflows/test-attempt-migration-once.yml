name: Test Attempt One-Time Migration

on:
  push:
    branches:
      - refactor/professional-v1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
          fetch-depth: 1

      - name: Remove exactly the legacy saveTestAttempt implementation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          const source = fs.readFileSync(path, 'utf8');
          const marker = 'async function saveTestAttempt(attempt){';
          const matches = [...source.matchAll(/async function saveTestAttempt\s*\(attempt\)\s*\{/g)];
          if (matches.length === 0) {
            console.log('Legacy saveTestAttempt implementation already absent; nothing to migrate.');
            process.exit(0);
          }
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one legacy saveTestAttempt implementation, found ${matches.length}.`);
          }

          const start = matches[0].index;
          const braceStart = source.indexOf('{', start);
          if (braceStart < 0) throw new Error('Could not locate saveTestAttempt opening brace.');

          let depth = 0;
          let end = -1;
          for (let i = braceStart; i < source.length; i++) {
            const ch = source[i];
            if (ch === '{') depth++;
            else if (ch === '}') {
              depth--;
              if (depth === 0) {
                end = i + 1;
                break;
              }
            }
          }
          if (end < 0) throw new Error('Could not find saveTestAttempt closing brace.');

          const migrated = source.slice(0, start) + source.slice(end);

          if (/async function saveTestAttempt\s*\(/.test(migrated) || /function saveTestAttempt\s*\(/.test(migrated)) {
            throw new Error('Legacy saveTestAttempt implementation remains after migration.');
          }
          if (!/await saveTestAttempt\(attempt\)/.test(migrated)) {
            throw new Error('finishTest no longer contains the expected saveTestAttempt runtime call.');
          }
          if (!migrated.includes('test-history-storage.js')) {
            throw new Error('test-history-storage.js bridge is missing.');
          }

          fs.writeFileSync(path, migrated);
          console.log('Removed exactly the legacy saveTestAttempt implementation.');
          NODE

      - name: Run exact source-contract test
        run: node --test test/test-attempt-runtime-source-contract.test.js

      - name: Commit migration
        run: |
          if git diff --quiet -- index.html; then
            echo "No migration diff; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor(test-attempt): remove legacy saveTestAttempt"
          git push origin HEAD:refactor/professional-v1
