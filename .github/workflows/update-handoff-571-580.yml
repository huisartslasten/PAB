name: One-time guest checkpoint handoff update
on:
  push:
    branches:
      - refactor/professional-v1
permissions:
  contents: write
jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-v1
      - name: Update persistent handoff
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/refactor/PACOGO_HANDOFF.md';
          const source = fs.readFileSync(path, 'utf8');
          const historyMarker = '- 551–560: **controlled browser proof closed and legacy V4.78 `saveLesson()` deliberately removed from `index.html`**; source-contract guard added; one-time removal gate succeeded; migration workflow removed immediately';
          if ((source.match(/- 551–560:/g) || []).length !== 1) throw new Error('Expected exactly one 551–560 history entry.');
          const history = historyMarker + '\n- 561–570: lesson recovery/delete/archive/restore boundary extracted, runtime-wired, focused-tested, browser-proven, and legacy recovery implementations removed from `index.html`\n- 571–580: guest lesson access boundary extracted, runtime-wired, focused-tested, browser-proven, and legacy `setGuestLesson()` implementation removed from `index.html`';
          let updated = source.replace(historyMarker, history);
          const start = updated.indexOf('## Current state\n');
          const end = updated.indexOf('## Next gate\n', start);
          if (start < 0 || end < 0) throw new Error('Current state / Next gate markers not found.');
          const current = `## Current state
The guest lesson access boundary is now fully migrated on `refactor/professional-v1`.

The proven public guest access path is now exclusively:

**classic `window.setGuestLesson` facade → single bootstrap readiness promise → installed guest runtime entry → explicit V4.78 bridge → parent authorization → guest lookup → assignment lookup/update/create → parent-student refresh → success/error message.**

The legacy V4.78 `async function setGuestLesson(lessonId,active)` declaration has been deliberately removed from `index.html`. Call sites remain unchanged and continue to call the public facade.

A source-contract test in `test/lesson-guest-access-runtime-source-contract.test.js` now fails if `index.html` regains either `async function setGuestLesson()` or `function setGuestLesson()`, and verifies that `photo-storage.js` retains the refactored bootstrap/readiness facade.

The controlled legacy-removal workflow succeeded and was deleted immediately after the migration. It is not part of the permanent runtime architecture.

### Validation status
- Post-removal professional Node gate: **success**, run `37517619183`.
- Post-removal controlled browser proof: **success**, run `37517740123`.
- Browser proof covers save runtime, recovery runtime, and guest access runtime.
- No Supabase schema changes.
- No `main`/LIVE changes.
- No agenda-import changes.
- No lesson-editor AI behavior added.

The guest boundary was not patched into the legacy monolith. The implementation was first isolated and focused-tested, then wired through the existing classic-script runtime bridge, then browser-proven, and only afterward was the legacy declaration removed.

`index.html` remains the V4.78-compatible application shell; runtime ownership for guest lesson access now belongs to the refactored lesson feature boundary.

`;
          updated = updated.slice(0, start) + current + updated.slice(end);
          fs.writeFileSync(path, updated);
          NODE
      - name: Commit handoff update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/refactor/PACOGO_HANDOFF.md
          git commit -m "docs(refactor): record guest access checkpoint"
          git push origin refactor/professional-v1
