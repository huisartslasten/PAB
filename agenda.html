<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Agenda</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .agenda-page{display:grid;gap:18px}.agenda-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.agenda-toolbar-actions{display:flex;gap:9px;flex-wrap:wrap}.agenda-card{padding:18px;border:1px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07)}
    .agenda-school-week{display:grid;gap:14px}.agenda-school-week-title{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.agenda-school-week-title-center{text-align:center;display:grid;gap:2px;color:#102b57;font-family:"Baloo 2",Nunito,sans-serif}.agenda-school-week-title-center strong{font-size:24px}.agenda-school-week-title-center span{font:700 14px/1.2 Nunito;color:#667894}.agenda-week-nav-button{border:1px solid #cfe3f3;border-radius:14px;background:#edf8ff;color:#126fc9;padding:10px 14px;font:800 15px/1.1 "Baloo 2",Nunito,sans-serif;cursor:pointer}.agenda-week-days{display:grid;gap:10px}.agenda-weekday-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.agenda-weekend-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.agenda-week-day{min-height:190px;padding:12px;border:1px solid #dce9f6;border-radius:17px;background:#f8fbff}.agenda-week-day.weekend{background:#f2f7fb}.agenda-week-day.today{border:2px solid #1787f2;background:#eef8ff}.agenda-week-day-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid #dce9f6}.agenda-week-day-head .day-name{text-transform:capitalize;font:900 17px/1 "Baloo 2",Nunito;color:#102b57}.agenda-week-day-head .day-date{font-size:13px;font-weight:800;color:#667894}.agenda-today-pill{margin-left:auto;padding:4px 7px;border-radius:999px;background:#1787f2;color:#fff;font-size:10px;font-weight:900}.agenda-week-events{display:grid;gap:8px;padding-top:8px}.agenda-week-event{padding:9px;border:1px solid #dce9f6;border-radius:13px;background:#fff}.agenda-week-event-title{font-weight:900;color:#102b57}.agenda-week-event-meta{margin-top:3px;color:#667894;font-size:12px}.agenda-event-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.agenda-event-actions button{padding:6px 9px;border-radius:10px;font-size:12px}.agenda-day-empty{padding:10px 0;color:#8090a6;font-size:13px;font-weight:700}.agenda-more{margin-top:8px;color:#126fc9;font-size:12px;font-weight:900}.agenda-week-bottom-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.agenda-panel{display:grid;gap:12px}.agenda-panel h2{margin:0;color:#102b57;font:900 25px/1.1 "Baloo 2",Nunito}.agenda-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.agenda-form-grid label,.agenda-modal label{display:grid;gap:5px;color:#38577d;font-size:13px;font-weight:800}.agenda-form-grid input,.agenda-form-grid select,.agenda-form-grid textarea,.agenda-modal input,.agenda-modal select,.agenda-modal textarea{width:100%;border:1px solid #cfe3f3;border-radius:11px;padding:9px 10px;background:#fff;color:#102b57;font:600 14px Nunito}.agenda-mode-buttons{display:flex;gap:8px;flex-wrap:wrap}.agenda-mode-buttons button.active{background:#dff0ff;border-color:#1787f2;color:#126fc9}.agenda-import-review{display:grid;gap:10px}.agenda-import-found{padding:12px;border:1px solid #dce9f6;border-radius:14px;background:#f8fbff}.agenda-import-found-grid{display:grid;grid-template-columns:150px minmax(0,1fr) 180px;gap:8px}.agenda-review-description{opacity:.55}.agenda-review-description-active{opacity:1}.agenda-modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(16,43,87,.42)}.agenda-modal{width:min(650px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;border:1px solid #cfe3f3;border-radius:22px;background:#fff;box-shadow:0 22px 50px rgba(16,43,87,.24)}.agenda-modal h2{margin:0 0 16px;color:#102b57;font:900 27px/1.1 "Baloo 2",Nunito}.agenda-modal-grid{display:grid;gap:11px}.agenda-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.agenda-state{padding:14px 16px;border:1px solid #dce9f6;border-radius:16px;background:#f8fbff;color:#667894}.hidden{display:none!important}@media(max-width:900px){.agenda-weekday-row{grid-template-columns:repeat(2,minmax(0,1fr))}.agenda-form-grid{grid-template-columns:1fr}.agenda-import-found-grid{grid-template-columns:1fr}}@media(max-width:600px){.agenda-school-week-title{grid-template-columns:1fr}.agenda-school-week-title-center{order:-1}.agenda-weekday-row,.agenda-weekend-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createAgendaRuntimeEntry } from './src/features/agenda/runtime-entry.js';
    import { listStudents, isKnownStudent } from './src/features/students/students.js';
    import { setStudent } from './src/core/state.js';

    const params = new URLSearchParams(window.location.search);
    const requestedStudent = params.get('student') || '';
    const student = isKnownStudent(requestedStudent) ? requestedStudent : listStudents()[0] || '';
    const mount = document.querySelector('#paco-template-mount');
    const app = createPacoGOApp({ supabaseLib: window.supabase });
    setStudent(student);

    const content = document.createElement('div');
    content.className = 'agenda-page';
    content.innerHTML = `
      <div class="agenda-toolbar"><strong>Leerling: ${student || 'geen leerling gekozen'}</strong><div class="agenda-toolbar-actions"><button type="button" class="secondary" data-open-import>➕ Agenda toevoegen</button><button type="button" class="secondary" data-today>📍 Vandaag</button></div></div>
      <section class="agenda-card" data-agenda-content></section>
      <section class="agenda-card agenda-panel hidden" data-agenda-import>
        <div><h2>Agenda toevoegen</h2><p style="margin:6px 0;color:#667894">Voeg handmatig toe of analyseer een agenda-afbeelding/video.</p></div>
        <div class="agenda-mode-buttons"><button type="button" class="secondary active" data-mode="media">📷 Screenshot/video</button><button type="button" class="secondary" data-mode="manual">✍️ Handmatig</button></div>
        <div data-media-panel><input type="file" accept="image/*,video/*" data-media-file><img class="hidden" data-image-preview alt="Agenda screenshot" style="display:block;max-width:100%;margin-top:10px;border-radius:14px"><video class="hidden" data-video-preview controls style="max-width:100%;margin-top:10px;border-radius:14px"></video><button type="button" class="secondary hidden" data-media-analyze style="margin-top:10px">🤖 Analyseer</button><div class="agenda-state" data-media-status style="margin-top:10px">Kies een screenshot of video.</div></div>
        <div class="hidden" data-manual-panel><div class="agenda-form-grid"><label>Titel<input type="text" data-manual-title maxlength="120"></label><label>Type<select data-manual-type><option value="test">📝 Toets</option><option value="homework">📚 Huiswerk</option><option value="submit">📖 Inleveren</option><option value="activity">🎒 Schoolactiviteit</option><option value="free">🎉 Vrije dag</option><option value="other">📌 Overig</option></select></label><label>Datum<input type="date" data-manual-date></label><label>Begin<input type="date" data-manual-start></label><label>Einde<input type="date" data-manual-end></label></div><label style="display:grid;gap:5px;margin-top:10px">Omschrijving<textarea data-manual-meta maxlength="300"></textarea></label><div class="agenda-mode-buttons"><label><input type="radio" name="agendaRange" value="single" checked> Eén dag</label><label><input type="radio" name="agendaRange" value="range"> Periode</label></div><button type="button" class="secondary" data-manual-add>➕ Toevoegen</button><div class="agenda-state hidden" data-manual-status></div></div>
        <div class="agenda-import-review hidden" data-review><strong>Controleer de gevonden afspraken</strong><div data-review-list></div><div class="agenda-toolbar-actions"><button type="button" class="secondary" data-review-save>Opslaan</button><button type="button" class="secondary" data-review-clear>Wissen</button></div></div>
      </section>
      <div class="agenda-modal-backdrop hidden" data-edit-modal><div class="agenda-modal" role="dialog" aria-modal="true"><h2>Agenda-afspraak bewerken</h2><div class="agenda-modal-grid"><label>Titel<input type="text" id="agendaEditTitle"></label><label>Type<select id="agendaEditType"><option value="test">📝 Toets</option><option value="homework">📚 Huiswerk</option><option value="submit">📖 Inleveren</option><option value="activity">🎒 Schoolactiviteit</option><option value="free">🎉 Vrije dag</option><option value="other">📌 Overig</option></select></label><div id="agendaEditSingleFields"><label>Datum<input type="date" id="agendaEditDate"></label></div><div id="agendaEditRangeFields" class="hidden"><div class="agenda-form-grid"><label>Begin<input type="date" id="agendaEditStartDate"></label><label>Einde<input type="date" id="agendaEditEndDate"></label></div></div><label>Tijd<input type="time" id="agendaEditTime"></label><label>Omschrijving<textarea id="agendaEditMeta"></textarea></label></div><div class="agenda-modal-actions"><button type="button" class="secondary" data-edit-close>Annuleren</button><button type="button" class="secondary" data-edit-save>Opslaan</button></div></div></div>`;

    mountPacoPageTemplate({ mount, backLabel:'← Mijn lessen', backAction:() => { window.location.href=`lessons.html?student=${encodeURIComponent(student)}`; }, greeting:student ? `Hoi ${student}! 🐾` : 'PacoGO Agenda 📅', title:'Agenda', icon:'📅', subtitle:'Bekijk de schoolweek en beheer je afspraken.', navigation:createPacoNavigation({ active:'agenda', student }), content });

    const pageRoot = content;
    const agenda = createAgendaRuntimeEntry({
      storage: localStorage,
      documentRef: pageRoot,
      db: app.db,
      currentStudent: () => student,
      setCurrentStudent: setStudent,
      lessons: () => app.state.lessons,
      demoItems: () => [],
      onLessonMatch: item => item.lessonId ? `<button type="button" class="secondary agenda-lesson-link" data-lesson-id="${String(item.lessonId).replaceAll('"','&quot;')}" style="margin-top:7px;padding:5px 8px;border-radius:9px;font-size:11px">📚 Naar les</button>` : '',
      now: () => new Date()
    });

    const bindLessonLinks = () => pageRoot.querySelectorAll('.agenda-lesson-link').forEach(button => { if (button.dataset.bound) return; button.dataset.bound='1'; button.addEventListener('click', () => { window.location.href=`lesson-choice.html?lesson_id=${encodeURIComponent(button.dataset.lessonId)}&student=${encodeURIComponent(student)}`; }); });
    const contentObserver = new MutationObserver(bindLessonLinks);
    contentObserver.observe(pageRoot.querySelector('[data-agenda-content]'), { childList:true, subtree:true });

    pageRoot.querySelector('[data-today]').addEventListener('click', () => agenda.agendaGoToday());
    pageRoot.querySelector('[data-open-import]').addEventListener('click', () => agenda.showAgendaImport());
    pageRoot.querySelector('[data-edit-close]').addEventListener('click', agenda.closeAgendaEditModal);
    pageRoot.querySelector('[data-edit-save]').addEventListener('click', agenda.saveAgendaEditModal);
    pageRoot.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => { pageRoot.querySelectorAll('[data-mode]').forEach(item => item.classList.toggle('active', item === button)); agenda.setAgendaImportMode(button.dataset.mode); }));
    pageRoot.querySelector('[data-media-file]').addEventListener('change', agenda.handleAgendaMediaFile);
    pageRoot.querySelector('[data-media-analyze]').addEventListener('click', async () => { const file = pageRoot.querySelector('[data-media-file]').files?.[0]; if (file?.type.startsWith('video/')) await agenda.analyzeAgendaVideo(); else await agenda.analyzeAgendaImage(); });
    pageRoot.querySelector('[data-manual-add]').addEventListener('click', () => { const result=agenda.addManualAgendaItem(); const status=pageRoot.querySelector('[data-manual-status]'); status.textContent=result.ok?'Afspraak toegevoegd.':result.message; status.classList.remove('hidden'); if(result.ok) agenda.renderAgenda(); });
    pageRoot.querySelector('[data-review-save]').addEventListener('click', () => { agenda.saveAgendaImportReview(); agenda.renderAgenda(); });
    pageRoot.querySelector('[data-review-clear]').addEventListener('click', agenda.clearAgendaImportReview);
    pageRoot.querySelectorAll('input[name="agendaRange"]').forEach(input => input.addEventListener('change', () => agenda.setManualAgendaRange(input.value)));

    try { await app.initializeSession(); await app.loadLessons(); agenda.showAgenda(); } catch (error) { console.error('PacoGO Agenda initialization failed:', error); pageRoot.querySelector('[data-agenda-content]').innerHTML='<div class="agenda-state">De Agenda kon niet worden geladen.</div>'; }
  </script>
</body>
</html>
