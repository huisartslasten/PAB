<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Agenda</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .agenda-page{display:grid;gap:18px}
    .agenda-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .agenda-toolbar-actions{display:flex;gap:10px;flex-wrap:wrap}
    .agenda-card{border:1px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07);padding:18px}
    .agenda-state{padding:16px 18px;border:1px solid #dce9f6;border-radius:18px;background:#fff;color:#667894}
    .agenda-school-week{display:grid;gap:14px}
    .agenda-school-week-title{display:grid;grid-template-columns:auto minmax(180px,1fr) auto;gap:12px;align-items:center}
    .agenda-school-week-title-center{text-align:center;display:grid;gap:3px;color:#102b57;font-family:"Baloo 2",Nunito,sans-serif}
    .agenda-school-week-title-center strong{font-size:24px}
    .agenda-school-week-title-center span{font:700 14px/1.2 Nunito,sans-serif;color:#667894}
    .agenda-week-nav-button,.agenda-today-button{border:1px solid #cfe3f3;border-radius:14px;background:#edf8ff;color:#126fc9;padding:10px 14px;font:800 15px/1.1 "Baloo 2",Nunito,sans-serif;cursor:pointer}
    .agenda-week-nav-button:hover,.agenda-today-button:hover{background:#dff0ff}
    .agenda-week-days{display:grid;gap:12px}
    .agenda-weekday-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
    .agenda-weekend-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .agenda-week-day{min-height:190px;padding:13px;border:1px solid #dce9f6;border-radius:18px;background:#f8fbff}
    .agenda-week-day.weekend{background:#f2f7fb}
    .agenda-week-day.today{border:2px solid #1787f2;background:#eef8ff}
    .agenda-week-day-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid #dce9f6}
    .agenda-week-day-head .day-name{text-transform:capitalize;font:900 17px/1 "Baloo 2",Nunito,sans-serif;color:#102b57}
    .agenda-week-day-head .day-date{font-size:13px;font-weight:800;color:#667894}
    .agenda-today-pill{margin-left:auto;padding:4px 7px;border-radius:999px;background:#1787f2;color:#fff;font-size:10px;font-weight:900}
    .agenda-week-events{display:grid;gap:8px;padding-top:9px}
    .agenda-week-event{padding:9px;border:1px solid #dce9f6;border-radius:13px;background:#fff}
    .agenda-week-event-title{font-weight:900;color:#102b57;line-height:1.25}
    .agenda-week-event-meta{margin-top:3px;color:#667894;font-size:12px;line-height:1.35}
    .agenda-event-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .agenda-event-actions button{padding:6px 9px;border-radius:10px;font-size:12px}
    .agenda-day-empty{padding:10px 0;color:#8090a6;font-size:13px;font-weight:700}
    .agenda-more{margin-top:8px;color:#126fc9;font-size:12px;font-weight:900}
    .agenda-week-bottom-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .agenda-panel{display:grid;gap:12px}
    .agenda-panel h2{margin:0;color:#102b57;font:900 25px/1.1 "Baloo 2",Nunito,sans-serif}
    .agenda-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .agenda-form-grid label,.agenda-modal label{display:grid;gap:5px;color:#38577d;font-size:13px;font-weight:800}
    .agenda-form-grid input,.agenda-form-grid select,.agenda-form-grid textarea,.agenda-modal input,.agenda-modal select,.agenda-modal textarea{width:100%;border:1px solid #cfe3f3;border-radius:11px;padding:9px 10px;background:#fff;color:#102b57;font:600 14px Nunito,sans-serif}
    .agenda-form-grid textarea,.agenda-modal textarea{min-height:90px;resize:vertical}
    .agenda-mode-buttons{display:flex;gap:8px;flex-wrap:wrap}
    .agenda-mode-buttons button.active{background:#dff0ff;border-color:#1787f2;color:#126fc9}
    .agenda-import-review{display:grid;gap:10px;padding-top:8px}
    .agenda-import-found{padding:12px;border:1px solid #dce9f6;border-radius:14px;background:#f8fbff}
    .agenda-import-found-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:#102b57}
    .agenda-import-found-grid{display:grid;grid-template-columns:150px minmax(0,1fr) 180px;gap:8px}
    .agenda-review-description{opacity:.55}
    .agenda-review-description-active{opacity:1}
    .agenda-modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(16,43,87,.42)}
    .agenda-modal{width:min(650px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;border:1px solid #cfe3f3;border-radius:22px;background:#fff;box-shadow:0 22px 50px rgba(16,43,87,.24)}
    .agenda-modal h2{margin:0 0 16px;color:#102b57;font:900 27px/1.1 "Baloo 2",Nunito,sans-serif}
    .agenda-modal-grid{display:grid;gap:11px}
    .agenda-modal-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:16px}
    .hidden{display:none!important}
    @media(max-width:900px){.agenda-weekday-row{grid-template-columns:repeat(2,minmax(0,1fr))}.agenda-form-grid{grid-template-columns:1fr}.agenda-import-found-grid{grid-template-columns:1fr}}
    @media(max-width:600px){.agenda-school-week-title{grid-template-columns:1fr}.agenda-school-week-title-center{order:-1}.agenda-weekday-row,.agenda-weekend-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createAgendaRuntimeEntry } from './src/features/agenda/runtime-entry.js';
    import { listStudents, isKnownStudent } from './src/features/students/students.js';
    import { setStudent } from './src/core/state.js';

    const params = new URLSearchParams(window.location.search);
    const requestedStudent = params.get('student') || '';
    const selectedStudent = isKnownStudent(requestedStudent) ? requestedStudent : listStudents()[0] || '';
    const mount = document.querySelector('#paco-template-mount');
    const app = createPacoGOApp({ supabaseLib: window.supabase });
    setStudent(selectedStudent);

    const content = document.createElement('div');
    content.className = 'agenda-page';
    content.innerHTML = `
      <div class="agenda-toolbar">
        <strong class="agenda-student">Leerling: ${selectedStudent || 'geen leerling gekozen'}</strong>
        <div class="agenda-toolbar-actions">
          <button type="button" class="secondary" data-agenda-open-import>➕ Agenda toevoegen</button>
          <button type="button" class="secondary" data-agenda-today-top>📍 Vandaag</button>
        </div>
      </div>
      <section class="agenda-card" data-agenda-content></section>
      <section class="agenda-card agenda-panel hidden" data-agenda-import>
        <div>
          <h2>Agenda toevoegen</h2>
          <p style="margin:6px 0 0;color:#667894">Voeg een afspraak handmatig toe of laat PacoGO een screenshot/video analyseren.</p>
        </div>
        <div class="agenda-mode-buttons">
          <button type="button" class="secondary active" data-agenda-mode="media">📷 Screenshot/video</button>
          <button type="button" class="secondary" data-agenda-mode="manual">✍️ Handmatig</button>
        </div>
        <div data-agenda-import-media>
          <label class="agenda-form-grid" style="grid-template-columns:1fr">Bestand
            <input type="file" accept="image/*,video/*" data-agenda-media-file>
          </label>
          <div style="display:grid;gap:8px;margin-top:10px">
            <img class="hidden" data-agenda-image-preview alt="Voorbeeld agenda screenshot" style="max-width:100%;border-radius:14px">
            <video class="hidden" data-agenda-video-preview controls style="max-width:100%;border-radius:14px"></video>
          </div>
          <button type="button" class="secondary hidden" data-agenda-media-analyze style="margin-top:10px">🤖 Analyseer</button>
          <div class="agenda-state" data-agenda-media-status style="margin-top:10px">Kies een screenshot of video.</div>
        </div>
        <div class="hidden" data-agenda-import-manual>
          <div class="agenda-form-grid">
            <label>Titel<input type="text" data-agenda-manual-title maxlength="120"></label>
            <label>Type<select data-agenda-manual-type><option value="test">📝 Toets</option><option value="homework">📚 Huiswerk</option><option value="submit">📖 Inleveren</option><option value="activity">🎒 Schoolactiviteit</option><option value="free">🎉 Vrije dag</option><option value="other">📌 Overig</option></select></label>
            <label>Datum<input type="date" data-agenda-manual-date></label>
            <label>Begin<input type="date" data-agenda-manual-start></label>
            <label>Einde<input type="date" data-agenda-manual-end></label>
          </div>
          <label style="display:grid;gap:5px;margin-top:10px;color:#38577d;font-size:13px;font-weight:800">Omschrijving<textarea data-agenda-manual-meta maxlength="300"></textarea></label>
          <div class="agenda-mode-buttons" style="margin-top:10px"><label><input type="radio" name="agendaManualRange" value="single" checked> Eén dag</label><label><input type="radio" name="agendaManualRange" value="range"> Periode</label></div>
          <button type="button" class="secondary" data-agenda-manual-add style="margin-top:10px">➕ Toevoegen</button>
          <div class="agenda-state hidden" data-agenda-manual-status style="margin-top:10px"></div>
        </div>
        <div class="agenda-import-review hidden" data-agenda-import-review>
          <strong>Controleer de gevonden afspraken</strong>
          <div data-agenda-import-review-list></div>
          <div class="agenda-toolbar-actions"><button type="button" class="secondary" data-agenda-review-save>Opslaan</button><button type="button" class="secondary" data-agenda-review-clear>Wissen</button></div>
        </div>
      </section>
      <div class="agenda-modal-backdrop hidden" data-agenda-edit-modal>
        <div class="agenda-modal" role="dialog" aria-modal="true" aria-labelledby="agenda-edit-heading">
          <h2 id="agenda-edit-heading">Agenda-afspraak bewerken</h2>
          <div class="agenda-modal-grid">
            <label>Titel<input type="text" id="agendaEditTitle" maxlength="120"></label>
            <label>Type<select id="agendaEditType"><option value="test">📝 Toets</option><option value="homework">📚 Huiswerk</option><option value="submit">📖 Inleveren</option><option value="activity">🎒 Schoolactiviteit</option><option value="free">🎉 Vrije dag</option><option value="other">📌 Overig</option></select></label>
            <div id="agendaEditSingleFields"><label>Datum<input type="date" id="agendaEditDate"></label></div>
            <div id="agendaEditRangeFields" class="hidden"><div class="agenda-form-grid"><label>Begin<input type="date" id="agendaEditStartDate"></label><label>Einde<input type="date" id="agendaEditEndDate"></label></div></div>
            <label>Tijd<input type="time" id="agendaEditTime"></label>
            <label>Omschrijving<textarea id="agendaEditMeta" maxlength="300"></textarea></label>
          </div>
          <div class="agenda-modal-actions"><button type="button" class="secondary" data-agenda-edit-close>Annuleren</button><button type="button" class="secondary" data-agenda-edit-save>Opslaan</button></div>
        </div>
      </div>`;

    mountPacoPageTemplate({
      mount,
      backLabel: '← Mijn lessen',
      backAction: () => { window.location.href = `lessons.html?student=${encodeURIComponent(selectedStudent)}`; },
      greeting: selectedStudent ? `Hoi ${selectedStudent}! 🐾` : 'PacoGO Agenda 📅',
      title: 'Agenda',
      icon: '📅',
      subtitle: 'Bekijk de schoolweek en beheer je afspraken.',
      navigation: createPacoNavigation({ active: 'agenda', student: selectedStudent }),
      content
    });

    const pageRoot = content;
    const currentStudent = () => selectedStudent;
    const lessonMatch = item => item.lessonId ? `<button type="button" class="secondary" data-agenda-lesson-id="${String(item.lessonId).replaceAll('"', '&quot;')}" style="margin-top:7px;padding:5px 8px;border-radius:9px;font-size:11px">📚 Naar les</button>` : '';
    const agenda = createAgendaRuntimeEntry({
      storage: localStorage,
      documentRef: pageRoot,
      db: app.db,
      currentStudent,
      setCurrentStudent: setStudent,
      lessons: () => app.state.lessons,
      demoItems: () => [],
      onLessonMatch: lessonMatch,
      now: () => new Date()
    });

    function bindLessonLinks() {
      pageRoot.querySelectorAll('[data-agenda-lesson-id]').forEach(button => {
        if (button.dataset.bound) return;
        button.dataset.bound = '1';
        button.addEventListener('click', () => {
          window.location.href = `lesson-choice.html?lesson_id=${encodeURIComponent(button.dataset.agendaLessonId)}&student=${encodeURIComponent(selectedStudent)}`;
        });
      });
    }

    const originalRender = agenda.renderAgenda;
    agenda.renderAgenda = undefined;
    function renderAgenda() {
      const result = originalRender();
      bindLessonLinks();
      return result;
    }

    pageRoot.querySelector('[data-agenda-today-top]').addEventListener('click', () => { agenda.agendaGoToday(); bindLessonLinks(); });
    pageRoot.querySelector('[data-agenda-open-import]').addEventListener('click', () => { agenda.showAgendaImport(); });
    pageRoot.querySelector('[data-agenda-edit-close]').addEventListener('click', agenda.closeAgendaEditModal);
    pageRoot.querySelector('[data-agenda-edit-save]').addEventListener('click', () => { agenda.saveAgendaEditModal(); });

    pageRoot.querySelectorAll('[data-agenda-mode]').forEach(button => button.addEventListener('click', () => {
      pageRoot.querySelectorAll('[data-agenda-mode]').forEach(item => item.classList.toggle('active', item === button));
      agenda.setAgendaImportMode(button.dataset.agendaMode);
    }));
    pageRoot.querySelector('[data-agenda-media-file]').addEventListener('change', event => agenda.handleAgendaMediaFile(event));
    pageRoot.querySelector('[data-agenda-media-analyze]').addEventListener('click', () => agenda.analyzeAgendaImage());
    pageRoot.querySelector('[data-agenda-manual-add]').addEventListener('click', () => {
      const result = agenda.addManualAgendaItem();
      const status = pageRoot.querySelector('[data-agenda-manual-status]');
      status.textContent = result.ok ? 'Afspraak toegevoegd.' : result.message;
      status.classList.remove('hidden');
      if (result.ok) agenda.renderAgenda();
    });
    pageRoot.querySelector('[data-agenda-review-save]').addEventListener('click', () => { agenda.saveAgendaImportReview(); agenda.renderAgenda(); });
    pageRoot.querySelector('[data-agenda-review-clear]').addEventListener('click', agenda.clearAgendaImportReview);

    pageRoot.querySelectorAll('input[name="agendaManualRange"]').forEach(input => input.addEventListener('change', () => agenda.setManualAgendaRange(input.value)));

    const originalContent = pageRoot.querySelector('[data-agenda-content]');
    const observer = new MutationObserver(() => bindLessonLinks());
    observer.observe(originalContent, { childList: true, subtree: true });

    try {
      await app.initializeSession();
      await app.loadLessons();
      renderAgenda();
    } catch (error) {
      console.error('PacoGO Agenda initialization failed:', error);
      originalContent.innerHTML = '<div class="agenda-state">De Agenda kon niet worden geladen.</div>';
    }
  </script>
</body>
</html>
