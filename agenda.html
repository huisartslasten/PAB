<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Agenda</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .agenda-page{display:grid;gap:18px}.agenda-toolbar{display:flex;justify-content:flex-end;gap:12px;align-items:center;flex-wrap:wrap}.agenda-toolbar-actions{display:flex;gap:9px;flex-wrap:wrap}.agenda-card{padding:18px;border:1px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07)}
    .agenda-school-week{display:grid;gap:14px}.agenda-school-week-title{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.agenda-school-week-title-center{text-align:center;display:grid;gap:2px;color:#102b57;font-family:"Baloo 2",Nunito,sans-serif}.agenda-school-week-title-center strong{font-size:24px}.agenda-school-week-title-center span{font:700 14px/1.2 Nunito;color:#667894}.agenda-week-nav-button{border:1px solid #cfe3f3;border-radius:14px;background:#edf8ff;color:#126fc9;padding:10px 14px;font:800 15px/1.1 "Baloo 2",Nunito,sans-serif;cursor:pointer}.agenda-weekday-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.agenda-weekend-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.agenda-week-day{min-height:190px;padding:12px;border:1px solid #dce9f6;border-radius:17px;background:#f8fbff}.agenda-week-day.weekend{background:#f2f7fb}.agenda-week-day.today{border:2px solid #1787f2;background:#eef8ff}.agenda-week-day-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid #dce9f6}.agenda-week-day-head .day-name{text-transform:capitalize;font:900 17px/1 "Baloo 2",Nunito;color:#102b57}.agenda-week-day-head .day-date{font-size:13px;font-weight:800;color:#667894}.agenda-today-pill{margin-left:auto;padding:4px 7px;border-radius:999px;background:#1787f2;color:#fff;font-size:10px;font-weight:900}.agenda-week-events{display:grid;gap:8px;padding-top:8px}.agenda-week-event{padding:9px;border:1px solid #dce9f6;border-radius:13px;background:#fff}.agenda-week-event-title{font-weight:900;color:#102b57}.agenda-week-event-meta{margin-top:3px;color:#667894;font-size:12px}.agenda-event-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.agenda-event-actions button{padding:6px 9px;border-radius:10px;font-size:12px}.agenda-day-empty{padding:10px 0;color:#8090a6;font-size:13px;font-weight:700}.agenda-more{margin-top:8px;color:#126fc9;font-size:12px;font-weight:900}.agenda-week-bottom-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}.agenda-panel{display:grid;gap:12px}.agenda-panel h2{margin:0;color:#102b57;font:900 25px/1.1 "Baloo 2",Nunito}.agenda-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.agenda-form-grid label,.agenda-modal label{display:grid;gap:5px;color:#38577d;font-size:13px;font-weight:800}.agenda-form-grid input,.agenda-form-grid select,.agenda-form-grid textarea,.agenda-modal input,.agenda-modal select,.agenda-modal textarea{width:100%;border:1px solid #cfe3f3;border-radius:11px;padding:9px 10px;background:#fff;color:#102b57;font:600 14px Nunito}.agenda-mode-buttons{display:flex;gap:8px;flex-wrap:wrap}.agenda-mode-buttons button.active{background:#dff0ff;border-color:#1787f2;color:#126fc9}.agenda-import-review{display:grid;gap:10px}.agenda-import-found{padding:12px;border:1px solid #dce9f6;border-radius:14px;background:#f8fbff}.agenda-import-found-grid{display:grid;grid-template-columns:150px minmax(0,1fr) 180px;gap:8px}.agenda-review-description{opacity:.55}.agenda-review-description-active{opacity:1}.agenda-modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(16,43,87,.42)}.agenda-modal{width:min(650px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;border:1px solid #cfe3f3;border-radius:22px;background:#fff;box-shadow:0 22px 50px rgba(16,43,87,.24)}.agenda-modal h2{margin:0 0 16px;color:#102b57;font:900 27px/1.1 "Baloo 2",Nunito}.agenda-modal-grid{display:grid;gap:11px}.agenda-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.agenda-state{padding:14px 16px;border:1px solid #dce9f6;border-radius:16px;background:#f8fbff;color:#667894}.hidden{display:none!important}@media(max-width:900px){.agenda-weekday-row{grid-template-columns:repeat(2,minmax(0,1fr))}.agenda-form-grid{grid-template-columns:1fr}.agenda-import-found-grid{grid-template-columns:1fr}}@media(max-width:600px){.agenda-school-week-title{grid-template-columns:1fr}.agenda-school-week-title-center{order:-1}.agenda-weekday-row,.agenda-weekend-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="paco-template-mount"></div>
<script type="module">
import { mountPacoPageTemplate } from './src/components/page-template.js';
import { createPacoNavigation } from './src/components/page-navigation.js';
import { createPacoGOApp } from './src/app/bootstrap.js';
import { createAgendaRuntimeEntry } from './src/features/agenda/runtime-entry.js';
import { readViewContext, applyViewContext, buildViewUrl } from './src/core/view-context.js';

const context=readViewContext(new URLSearchParams(window.location.search));
const student=context.student;
const mount=document.querySelector('#paco-template-mount'); const app=createPacoGOApp({supabaseLib:window.supabase});
const content=document.createElement('div'); content.className='agenda-page'; content.innerHTML=`
<div class="agenda-toolbar"><div class="agenda-toolbar-actions"><button type="button" class="secondary" id="openAgendaImport">➕ Agenda toevoegen</button><button type="button" class="secondary" id="agendaTodayTop">📍 Vandaag</button></div></div>
<section class="agenda-card" id="agendaContent" data-agenda-content></section>
<section class="agenda-card agenda-panel hidden" id="agendaImport"><div><h2>Agenda toevoegen</h2><p style="margin:6px 0;color:#667894">Voeg handmatig toe of analyseer een agenda-afbeelding/video.</p></div>
<div class="agenda-mode-buttons"><button type="button" class="secondary active" id="agendaModeMedia">📷 Screenshot/video</button><button type="button" class="secondary" id="agendaModeManual">✍️ Handmatig</button></div>
<div id="agendaImportMediaStep"><input id="agendaMediaFile" type="file" accept="image/*,video/*"><img id="agendaImagePreview" class="hidden" alt="Agenda screenshot" style="display:block;max-width:100%;margin-top:10px;border-radius:14px"><video id="agendaVideoPreview" class="hidden" controls style="max-width:100%;margin-top:10px;border-radius:14px"></video><button type="button" class="secondary hidden" id="agendaMediaAnalyzeButton" style="margin-top:10px">🤖 Analyseer</button><div class="agenda-state" id="agendaMediaStatus" style="margin-top:10px">Kies een screenshot of video.</div></div>
<div class="hidden" id="agendaImportManualStep"><div class="agenda-form-grid"><label>Titel<input id="agendaManualTitle" type="text" maxlength="120"></label><label>Type<select id="agendaManualType"><option value="test">📝 Toets</option><option value="homework">📚 Huiswerk</option><option value="submit">📖 Inleveren</option><option value="activity">🎒 Schoolactiviteit</option><option value="free">🎉 Vrije dag</option><option value="other">📌 Overig</option></select></label><label>Datum<input id="agendaManualDate" type="date"></label><label>Begin<input id="agendaManualStartDate" type="date"></label><label>Einde<input id="agendaManualEndDate" type="date"></label></div><label style="display:grid;gap:5px;margin-top:10px">Omschrijving<textarea id="agendaManualMeta" maxlength="300"></textarea></label><div class="agenda-mode-buttons"><label><input type="radio" name="agendaManualRange" value="single" checked> Eén dag</label><label><input type="radio" name="agendaManualRange" value="range"> Periode</label></div><button type="button" class="secondary" id="agendaManualAdd">➕ Toevoegen</button><div class="agenda-state hidden" id="agendaManualStatus"></div></div>
<div class="agenda-import-review hidden" id="agendaImportReview"><strong>Controleer de gevonden afspraken</strong><div id="agendaImportReviewList"></div><div class="agenda-toolbar-actions"><button type="button" class="secondary" id="agendaReviewSave">Opslaan</button><button type="button" class="secondary" id="agendaReviewClear">Wissen</button></div></div></section>
<div class="agenda-modal-backdrop hidden" id="agendaEditModal"><div class="agenda-modal" role="dialog" aria-modal="true"><h2>Agenda-afspraak bewerken</h2><div class="agenda-modal-grid"><label>Titel<input id="agendaEditTitle" type="text"></label><label>Type<select id="agendaEditType"><option value="test">📝 Toets</option><option value="homework">📚 Huiswerk</option><option value="submit">📖 Inleveren</option><option value="activity">🎒 Schoolactiviteit</option><option value="free">🎉 Vrije dag</option><option value="other">📌 Overig</option></select></label><div id="agendaEditSingleFields"><label>Datum<input id="agendaEditDate" type="date"></label></div><div id="agendaEditRangeFields" class="hidden"><div class="agenda-form-grid"><label>Begin<input id="agendaEditStartDate" type="date"></label><label>Einde<input id="agendaEditEndDate" type="date"></label></div></div><label>Tijd<input id="agendaEditTime" type="time"></label><label>Omschrijving<textarea id="agendaEditMeta"></textarea></label></div><div class="agenda-modal-actions"><button type="button" class="secondary" id="agendaEditClose">Annuleren</button><button type="button" class="secondary" id="agendaEditSave">Opslaan</button></div></div></div>`;

mountPacoPageTemplate({mount,backLabel:'← Mijn lessen',backAction:()=>{window.location.href=buildViewUrl('lessons.html',{student,mode:context.mode}).toString()},greeting:student?`Hoi ${student}! 🐾`:'PacoGO Agenda 📅',title:'Agenda',icon:'📅',subtitle:context.isManagement?'Beheerweergave — je beheert hier de agenda van de geselecteerde leerling.':'Bekijk de schoolweek en beheer je afspraken.',navigation:createPacoNavigation({app,active:'agenda',student,viewMode:context.mode}),content});
const pageRoot=content;
const agenda=createAgendaRuntimeEntry({storage:localStorage,documentRef:pageRoot,db:app.db,currentStudent:()=>student,lessons:()=>app.state.lessons,demoItems:()=>[],onLessonMatch:item=>item.lessonId?`<button type="button" class="secondary agenda-lesson-link" data-lesson-id="${String(item.lessonId).replaceAll('"','&quot;')}" style="margin-top:7px;padding:5px 8px;border-radius:9px;font-size:11px">📚 Naar les</button>`:'',now:()=>new Date()});
const bindLessonLinks=()=>pageRoot.querySelectorAll('.agenda-lesson-link').forEach(button=>{if(button.dataset.bound)return;button.dataset.bound='1';button.addEventListener('click',()=>{const target=buildViewUrl('lesson-choice.html',{student,mode:context.mode});target.searchParams.set('lesson_id',button.dataset.lessonId);window.location.href=target.toString()})});
new MutationObserver(bindLessonLinks).observe(pageRoot.querySelector('#agendaContent'),{childList:true,subtree:true});
pageRoot.querySelector('#agendaTodayTop').addEventListener('click',()=>agenda.agendaGoToday()); pageRoot.querySelector('#openAgendaImport').addEventListener('click',()=>agenda.showAgendaImport()); pageRoot.querySelector('#agendaEditClose').addEventListener('click',agenda.closeAgendaEditModal); pageRoot.querySelector('#agendaEditSave').addEventListener('click',agenda.saveAgendaEditModal);
pageRoot.querySelector('#agendaModeMedia').addEventListener('click',()=>agenda.setAgendaImportMode('media')); pageRoot.querySelector('#agendaModeManual').addEventListener('click',()=>agenda.setAgendaImportMode('manual')); pageRoot.querySelector('#agendaMediaFile').addEventListener('change',agenda.handleAgendaMediaFile); pageRoot.querySelector('#agendaMediaAnalyzeButton').addEventListener('click',async()=>{if(pageRoot.querySelector('#agendaMediaFile').files?.[0]?.type.startsWith('video/'))await agenda.analyzeAgendaVideo();else await agenda.analyzeAgendaImage()});
pageRoot.querySelector('#agendaManualAdd').addEventListener('click',()=>{const result=agenda.addManualAgendaItem();const status=pageRoot.querySelector('#agendaManualStatus');status.textContent=result.ok?'Afspraak toegevoegd.':result.message;status.classList.remove('hidden');if(result.ok)agenda.renderAgenda()}); pageRoot.querySelector('#agendaReviewSave').addEventListener('click',()=>{agenda.saveAgendaImportReview();agenda.renderAgenda()}); pageRoot.querySelector('#agendaReviewClear').addEventListener('click',agenda.clearAgendaImportReview); pageRoot.querySelectorAll('input[name="agendaManualRange"]').forEach(input=>input.addEventListener('change',()=>agenda.setManualAgendaRange(input.value)));
async function initialize(){
  await app.initializeSession();
  if(context.isManagement) applyViewContext(context,{canManage:app.auth.isParent});
  else applyViewContext(context);
  if(!student) throw new Error('Geen leerling geselecteerd.');
  await app.loadLessons();
  agenda.showAgenda();
}
try{await initialize()}catch(error){console.error('PacoGO Agenda initialization failed:',error);pageRoot.querySelector('#agendaContent').innerHTML=error.message==='Geen leerling geselecteerd.'?'<div class="agenda-state">Selecteer eerst een leerling vanuit Beheer.</div>':'<div class="agenda-state">De Agenda kon niet worden geladen.</div>'}
</script>
</body>
</html>
