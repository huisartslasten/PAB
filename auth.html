<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Inloggen</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .auth-page{display:grid;gap:18px;max-width:620px;margin:0 auto}
    .auth-card{display:grid;gap:18px}
    .auth-card h2{margin:0;color:#102b57;font:800 25px/1.1 "Baloo 2",Nunito,sans-serif}
    .auth-card p{margin:0;color:#667894;line-height:1.5}
    .auth-form{display:grid;gap:14px}
    .auth-field{display:grid;gap:6px}
    .auth-field label{font-weight:900;color:#38577d}
    .auth-field input{width:100%;box-sizing:border-box;min-height:46px;padding:9px 12px;border:2px solid #cfe3f3;border-radius:14px;background:#fff;color:#102b57;font:700 15px/1.2 Nunito,sans-serif;box-shadow:0 3px 10px rgba(16,43,87,.04);transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
    .auth-field input:focus{outline:0;border-color:#1787f2;box-shadow:0 0 0 4px rgba(23,135,242,.12)}
    .auth-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .auth-message{padding:12px 14px;border-radius:14px;background:#eef8ff;color:#126fc9;font-weight:800}
    .auth-message.error{background:#fff0f0;color:#b42318}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';

    const params = new URLSearchParams(window.location.search);
    const resetMode = params.get('mode') === 'reset';
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    content.className = 'auth-page';
    const app = createPacoGOApp({ supabaseLib: window.supabase });

    const goStart = () => { window.location.href = 'dashboard.html'; };
    const goManagement = () => { window.location.href = 'management.html'; };
    const navigation = createPacoNavigation({ currentPage: 'auth', isParent: false, onNavigate: () => {} });
    mountPacoPageTemplate({
      mount,
      title: 'Inloggen',
      subtitle: 'Meld je aan om verder te gaan.',
      content,
      navigation
    });

    const message = (text, isError = false) => {
      const node = document.createElement('div');
      node.className = `auth-message${isError ? ' error' : ''}`;
      node.textContent = text;
      return node;
    };

    function renderLogin() {
      content.replaceChildren();
      const card = document.createElement('section');
      card.className = 'paco-card auth-card';
      card.innerHTML = '<h2>Welkom bij PacoGO</h2><p>Log in met je e-mailadres en wachtwoord.</p>';
      const form = document.createElement('form');
      form.className = 'auth-form';
      form.innerHTML = '<div class="auth-field"><label for="email">E-mailadres</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="auth-field"><label for="password">Wachtwoord</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>';
      const actions = document.createElement('div');
      actions.className = 'auth-actions';
      const button = document.createElement('button');
      button.type = 'submit';
      button.className = 'paco-button primary';
      button.textContent = 'Inloggen';
      actions.appendChild(button);
      form.appendChild(actions);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        button.disabled = true;
        try {
          const { error } = await app.authSession.signIn({
            email: form.email.value.trim(),
            password: form.password.value
          });
          if (error) throw error;
          await app.initializeSession();
          if (app.auth.isParent) goManagement();
          else goStart();
        } catch (error) {
          card.appendChild(message(error?.message || 'Inloggen mislukt.', true));
          button.disabled = false;
        }
      });
      card.appendChild(form);
      content.appendChild(card);
    }

    async function initialize() {
      let sessionError = null;
      try {
        await app.initializeSession();
      } catch (error) {
        sessionError = error;
      }
      if (sessionError) {
        content.replaceChildren(message(sessionError?.message || 'Authenticatie kon niet worden geladen.', true));
      } else if (resetMode && app.auth.isLoggedIn) {
        renderPasswordUpdate();
      } else if (app.auth.isParent) {
        renderLoggedIn();
      } else {
        renderLogin();
      }
    }

    function renderLoggedIn() {
      content.replaceChildren();
      const card = document.createElement('section');
      card.className = 'paco-card auth-card';
      card.innerHTML = '<h2>Je bent al ingelogd</h2><p>Ga verder naar PacoGO of log uit.</p>';
      const actions = document.createElement('div');
      actions.className = 'auth-actions';
      const goButton = document.createElement('button');
      goButton.type = 'button';
      goButton.className = 'paco-button primary';
      goButton.textContent = 'Verder';
      goButton.addEventListener('click', goManagement);
      const logoutButton = document.createElement('button');
      logoutButton.type = 'button';
      logoutButton.className = 'paco-button';
      logoutButton.textContent = 'Uitloggen';
      logoutButton.addEventListener('click', async () => {
        await app.authSession.signOut();
        app.auth.setSession(null);
        renderLogin();
      });
      actions.append(goButton, logoutButton);
      card.appendChild(actions);
      content.appendChild(card);
    }

    function renderPasswordUpdate() {
      content.replaceChildren();
      const card = document.createElement('section');
      card.className = 'paco-card auth-card';
      card.innerHTML = '<h2>Nieuw wachtwoord</h2><p>Kies een nieuw wachtwoord voor je account.</p>';
      const form = document.createElement('form');
      form.className = 'auth-form';
      form.innerHTML = '<div class="auth-field"><label for="new-password">Nieuw wachtwoord</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required></div>';
      const actions = document.createElement('div');
      actions.className = 'auth-actions';
      const button = document.createElement('button');
      button.type = 'submit';
      button.className = 'paco-button primary';
      button.textContent = 'Wachtwoord opslaan';
      actions.appendChild(button);
      form.appendChild(actions);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        button.disabled = true;
        try {
          const { error } = await app.authSession.updatePassword(form.querySelector('#new-password').value);
          if (error) throw error;
          card.appendChild(message('Je wachtwoord is opgeslagen.'));
          button.remove();
        } catch (error) {
          card.appendChild(message(error?.message || 'Wachtwoord opslaan mislukt.', true));
          button.disabled = false;
        }
      });
      card.appendChild(form);
      content.appendChild(card);
    }

    initialize();
  </script>
</body>
</html>
