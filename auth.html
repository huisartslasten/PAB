<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Inloggen</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .auth-page{display:grid;gap:18px;max-width:620px;margin:0 auto}
    .auth-card{display:grid;gap:18px}
    .auth-card h2{margin:0;color:#102b57;font:800 25px/1.1 "Baloo 2",Nunito,sans-serif}
    .auth-card p{margin:0;color:#667894;line-height:1.5}
    .auth-form{display:grid;gap:14px}
    .auth-field{display:grid;gap:6px}
    .auth-field label{font-weight:900;color:#38577d}
    .auth-field input{width:100%;box-sizing:border-box;min-height:46px;padding:9px 12px;border:2px solid #cfe3f3;border-radius:14px;background:#fff;color:#102b57;font:700 15px/1.2 Nunito,sans-serif;box-shadow:0 3px 10px rgba(16,43,87,.04);transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
    .auth-field input:focus{outline:0;border-color:#1787f2;box-shadow:0 0 0 4px rgba(23,135,242,.12)}
    .auth-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .auth-message{padding:12px 14px;border-radius:14px;background:#eef8ff;color:#126fc9;font-weight:800}
    .auth-message.error{background:#fff0f0;color:#b42318}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';

    const params = new URLSearchParams(window.location.search);
    const resetMode = params.get('mode') === 'reset';
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    content.className = 'auth-page';
    const app = createPacoGOApp({ supabaseLib: window.supabase });

    const goStart = () => { window.location.href = 'dashboard.html'; };
    const goManagement = () => { window.location.href = 'management.html'; };

    let session = null;
    let sessionError = null;
    try {
      session = await app.initializeSession();
    } catch (error) {
      sessionError = error;
      console.error('Auth session load error:', error);
    }

    const loggedInAsParent = Boolean(session && app.auth.isParent);

    const logoutFromNavigation = async () => {
      try {
        await app.authSession.signOut();
        app.auth.setSession(null);
        window.location.href = 'auth.html';
      } catch (error) {
        content.prepend(message(error?.message || 'Uitloggen mislukt.', true));
      }
    };

    const navigation = loggedInAsParent
      ? createPacoNavigation({
          includeManagementDashboard: true,
          includeManagement: false,
          includeLessons: false,
          includeAgenda: false,
          includeAccount: true,
          accountLabel: 'Uitloggen',
          onAccountClick: logoutFromNavigation
        })
      : [{ icon:'🏠', label:'Start', onClick:goStart }];

    mountPacoPageTemplate({
      mount,
      backLabel: loggedInAsParent ? '← Dashboard' : '← Start',
      backAction: loggedInAsParent ? goManagement : goStart,
      greeting:'PacoGO 🔐',
      title:resetMode ? 'Wachtwoord wijzigen' : 'Inloggen',
      icon:'🔐',
      subtitle:resetMode ? 'Stel een nieuw wachtwoord in.' : 'Log in om beheerfuncties te openen.',
      navigation,
      content
    });

    function message(text, error = false) {
      const el = document.createElement('div');
      el.className = `auth-message${error ? ' error' : ''}`;
      el.textContent = text;
      return el;
    }

    function field(id, label, type, autocomplete) {
      const wrapper = document.createElement('div');
      wrapper.className = 'auth-field';
      const labelEl = document.createElement('label');
      labelEl.htmlFor = id;
      labelEl.textContent = label;
      const input = document.createElement('input');
      input.id = id;
      input.type = type;
      input.autocomplete = autocomplete;
      wrapper.append(labelEl, input);
      return { wrapper, input };
    }

    function renderLoggedIn() {
      content.replaceChildren();
      const card = document.createElement('section');
      card.className = 'paco-template-card auth-card';
      const heading = document.createElement('h2');
      heading.textContent = 'Je bent ingelogd';
      const text = document.createElement('p');
      text.textContent = app.auth.isCreator ? 'Je hebt toegang tot de beheeromgeving.' : 'Je sessie is actief.';
      const actions = document.createElement('div');
      actions.className = 'auth-actions';
      const management = document.createElement('button');
      management.type = 'button';
      management.className = 'success';
      management.textContent = '⚙️ Naar Beheer';
      management.onclick = goManagement;
      const logout = document.createElement('button');
      logout.type = 'button';
      logout.className = 'secondary';
      logout.textContent = 'Uitloggen';
      logout.onclick = logoutFromNavigation;
      actions.append(management, logout);
      card.append(heading, text, actions);
      content.append(card);
    }

    function renderLogin(notice = '') {
      content.replaceChildren();
      const card = document.createElement('section');
      card.className = 'paco-template-card auth-card';
      const heading = document.createElement('h2');
      heading.textContent = 'Inloggen';
      const text = document.createElement('p');
      text.textContent = 'Gebruik je PacoGO-account om toegang te krijgen tot beheerfuncties.';
      const form = document.createElement('form');
      form.className = 'auth-form';
      const email = field('authEmail', 'E-mailadres', 'email', 'email');
      const password = field('authPassword', 'Wachtwoord', 'password', 'current-password');
      const actions = document.createElement('div');
      actions.className = 'auth-actions';
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.className = 'success';
      submit.textContent = 'Inloggen';
      const reset = document.createElement('button');
      reset.type = 'button';
      reset.className = 'secondary';
      reset.textContent = 'Wachtwoord vergeten';
      reset.onclick = renderResetRequest;
      const status = notice ? message(notice) : null;
      form.append(email.wrapper, password.wrapper, actions);
      actions.append(reset, submit);
      form.onsubmit = async event => {
        event.preventDefault();
        status?.remove();
        submit.disabled = true;
        try {
          const session = await app.authSession.signIn(email.input.value, password.input.value);
          app.auth.setSession(session);
          if (!app.auth.isParent) throw new Error('Dit account heeft geen PacoGO-beheertoegang.');
          goManagement();
        } catch (error) {
          card.prepend(message(error?.message || 'Inloggen mislukt.', true));
          submit.disabled = false;
        }
      };
      card.append(heading, text);
      if (status) card.append(status);
      card.append(form);
      content.append(card);
    }

    function renderResetRequest() {
      content.replaceChildren();
      const card = document.createElement('section');
      card.className = 'paco-template-card auth-card';
      const heading = document.createElement('h2');
      heading.textContent = 'Wachtwoord vergeten';
      const text = document.createElement('p');
      text.textContent = 'Vul je e-mailadres in. PacoGO stuurt een link om een nieuw wachtwoord te kiezen.';
      const form = document.createElement('form');
      form.className = 'auth-form';
      const email = field('resetEmail', 'E-mailadres', 'email', 'email');
      const actions = document.createElement('div');
      actions.className = 'auth-actions';
      const back = document.createElement('button');
      back.type = 'button';
      back.className = 'secondary';
      back.textContent = 'Terug naar inloggen';
      back.onclick = () => renderLogin();
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.className = 'success';
      submit.textContent = 'Resetlink sturen';
      form.append(email.wrapper, actions);
      actions.append(back, submit);
      form.onsubmit = async event => {
        event.preventDefault();
        submit.disabled = true;
        try {
          const redirectTo = new URL('auth.html?mode=reset', window.location.href).toString();
          await app.authSession.requestPasswordReset(email.input.value, redirectTo);
          card.prepend(message('De resetlink is verstuurd. Controleer je e-mail.'));
        } catch (error) {
          card.prepend(message(error?.message || 'De resetlink kon niet worden verstuurd.', true));
        } finally {
          submit.disabled = false;
        }
      };
      card.append(heading, text, form);
      content.append(card);
    }

    function renderPasswordUpdate() {
      content.replaceChildren();
      const card = document.createElement('section');
      card.className = 'paco-template-card auth-card';
      const heading = document.createElement('h2');
      heading.textContent = 'Nieuw wachtwoord';
      const text = document.createElement('p');
      text.textContent = 'Kies een nieuw wachtwoord voor je PacoGO-account.';
      const form = document.createElement('form');
      form.className = 'auth-form';
      const password = field('newPassword', 'Nieuw wachtwoord', 'password', 'new-password');
      const confirm = field('newPasswordConfirm', 'Nieuw wachtwoord opnieuw', 'password', 'new-password');
      const actions = document.createElement('div');
      actions.className = 'auth-actions';
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.className = 'success';
      submit.textContent = 'Wachtwoord opslaan';
      form.append(password.wrapper, confirm.wrapper, actions);
      actions.append(submit);
      form.onsubmit = async event => {
        event.preventDefault();
        if (password.input.value !== confirm.input.value) {
          card.prepend(message('De wachtwoorden zijn niet gelijk.', true));
          return;
        }
        submit.disabled = true;
        try {
          await app.authSession.updatePassword(password.input.value);
          await app.authSession.signOut();
          app.auth.setSession(null);
          renderLogin('Je wachtwoord is gewijzigd. Je kunt opnieuw inloggen.');
        } catch (error) {
          card.prepend(message(error?.message || 'Het wachtwoord kon niet worden gewijzigd.', true));
        } finally {
          submit.disabled = false;
        }
      };
      card.append(heading, text, form);
      content.append(card);
    }

    if (sessionError) {
      content.replaceChildren(message(sessionError?.message || 'Authenticatie kon niet worden geladen.', true));
    } else if (resetMode && app.auth.isLoggedIn) {
      renderPasswordUpdate();
    } else if (app.auth.isParent) {
      renderLoggedIn();
    } else {
      renderLogin();
    }
  </script>
</body>
</html>
