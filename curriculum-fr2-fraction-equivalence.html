<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — FR2 Breukequivalentie</title>
  <style>
    :root{font-family:Nunito,system-ui,sans-serif;color:#102b57;background:#f5f9fd}
    body{margin:0;padding:32px;min-height:100vh;box-sizing:border-box}
    main{max-width:980px;margin:0 auto;display:grid;gap:18px}
    .card{background:#fff;border:1px solid #d8e7f4;border-radius:22px;padding:24px;box-shadow:0 8px 24px rgba(16,43,87,.07)}
    h1,h2{margin:0} h1{font-size:30px} h2{font-size:21px}
    .muted{color:#647894;line-height:1.5}
    .question{text-align:center;font-size:26px;font-weight:900;padding:16px;border-radius:16px;background:#eef7ff}
    .models{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:22px 0}
    .model{display:grid;gap:10px;justify-items:center}
    .label{font-weight:900}
    .bar{width:min(100%,320px);display:grid;border:2px solid #102b57;border-radius:8px;overflow:hidden;min-height:56px;background:#fff}
    .cell{border-right:1px solid #102b57;display:grid;place-items:center;font-weight:900}
    .cell:last-child{border-right:0}
    .filled{background:#d9edff}
    .options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .option{padding:14px;border:2px solid #d8e7f4;border-radius:16px;background:#fbfdff;color:#102b57;cursor:pointer;font:900 18px Nunito,system-ui,sans-serif}
    .option.selected{border-color:#1787f2;background:#eef7ff}
    button.submit{margin-top:16px;border:0;border-radius:14px;padding:12px 20px;font:900 15px Nunito,system-ui,sans-serif;cursor:pointer;background:#1787f2;color:#fff}
    button:disabled{opacity:.5;cursor:not-allowed}
    .status{font-weight:900;padding:12px 14px;border-radius:14px;background:#eef8ff;color:#126fc9}
    .status.error{background:#fff0f0;color:#b42318}
    pre{margin:10px 0 0;white-space:pre-wrap;background:#f5f9fd;border-radius:14px;padding:14px;font:700 13px/1.5 ui-monospace,monospace}
    @media(max-width:700px){.models{grid-template-columns:1fr}.options{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="muted">PacoGO • FR2 • Breukequivalentie</div>
    <h1>Welke breuk heeft dezelfde waarde?</h1>
    <p class="muted">Kijk naar de twee oppervlaktemodellen en kies de breuk die dezelfde waarde weergeeft.</p>
    <div class="question">Is 1/2 gelijk aan de gekozen breuk?</div>
    <div class="models" aria-label="Twee oppervlaktemodellen">
      <div class="model">
        <div class="label">1/2</div>
        <div class="bar" style="grid-template-columns:repeat(2,1fr)">
          <div class="cell filled"></div><div class="cell"></div>
        </div>
      </div>
      <div class="model">
        <div class="label">Doelmodel: 2 van 4 delen</div>
        <div class="bar" style="grid-template-columns:repeat(4,1fr)">
          <div class="cell filled"></div><div class="cell filled"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>
    </div>
    <div class="options" id="options"></div>
    <button class="submit" id="submit" type="button">Controleren</button>
  </section>
  <section class="card">
    <h2>Wat PacoGO heeft waargenomen</h2>
    <div id="status" class="status">Kies eerst een breuk.</div>
    <pre id="trace">Nog geen observatie.</pre>
  </section>
</main>
<script type="module">
  import { createFractionEquivalenceController } from './pacogo-engine/fraction-equivalence-controller.js';
  import { createBrowserVerticalSliceRuntime } from './pacogo-engine/browser-vertical-slice.js';
  import { createCurriculumRegistry } from './pacogo-engine/curriculum-registry.js';

  const registryConfig = await fetch('./docs/curriculum/PacoGO_Curriculum_Registry_v0.2.json').then(response => response.json());
  const taskSet = await fetch('./docs/curriculum/PacoGO_Pilot_TaskSet_v0.1.json').then(response => response.json());
  const registry = createCurriculumRegistry(registryConfig);
  const runtime = createBrowserVerticalSliceRuntime({ registry, taskSet });
  const task = runtime.getTask('FR2-T01');
  const targetFraction = { numerator: 1, denominator: 2 };
  const options = [
    { id: 'eq-2-4', fraction: { numerator: 2, denominator: 4 }, label: '2/4' },
    { id: 'neq-3-4', fraction: { numerator: 3, denominator: 4 }, label: '3/4' }
  ];
  const controller = createFractionEquivalenceController({
    task,
    studentKey: 'browser-synthetic-fr2',
    renderer: {},
    targetFraction,
    options,
    provenance: { page: 'curriculum-fr2-fraction-equivalence.html' }
  });

  const status = document.querySelector('#status');
  const trace = document.querySelector('#trace');
  const optionHost = document.querySelector('#options');

  options.forEach(option => {
    const button = document.createElement('button');
    button.className = 'option';
    button.type = 'button';
    button.textContent = option.label;
    button.addEventListener('click', () => {
      try {
        controller.selectOption(option.id, 'browser');
        optionHost.querySelectorAll('.option').forEach(item => item.classList.toggle('selected', item === button));
        status.className = 'status';
        status.textContent = `Gekozen: ${option.label}. Controleer je antwoord.`;
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message;
      }
    });
    optionHost.appendChild(button);
  });

  document.querySelector('#submit').addEventListener('click', () => {
    try {
      const { evaluation, observation } = controller.submit();
      const cycle = runtime.runObservation({ observation });
      status.className = 'status';
      status.textContent = evaluation.correct
        ? `Goed. De observatie gaat door naar de PacoGO-leerengine. Volgende stap: ${cycle.next?.action || 'bepalen'}.`
        : 'Nog niet goed. Ook deze observatie gaat als informatie naar de leerengine.';
      trace.textContent = JSON.stringify({
        observation_id: observation.observation_id,
        registry_version: registry.registry_version,
        evidence_count: cycle.evidence.length,
        development: cycle.development,
        mastery: cycle.mastery,
        next: cycle.next,
        decision: cycle.decision_trace.decision,
        interaction_event_count: observation.interaction_events.length
      }, null, 2);
      document.querySelector('#submit').disabled = true;
      optionHost.querySelectorAll('.option').forEach(item => { item.disabled = true; });
    } catch (error) {
      status.className = 'status error';
      status.textContent = error.message;
    }
  });
</script>
</body>
</html>
