<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Potloden ordenen</title>
  <link rel="stylesheet" href="./src/components/page-template.css">
  <link rel="stylesheet" href="./pacogo-engine/length-order-learning-interface.css">
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { readViewContext } from './src/core/view-context.js';
    import { createLengthOrderLearningInterface } from './pacogo-engine/length-order-learning-interface.js';
    import { LENGTH_ORDER_TASKS, evaluateLengthOrder } from './pacogo-engine/length-order-task-bank.js';

    const app = createPacoGOApp({ supabaseLib: window.supabase, storage: window.localStorage });
    const context = readViewContext(new URLSearchParams(window.location.search));
    const student = context.student || '';
    const content = document.createElement('div');
    const intro = document.createElement('p');
    intro.className = 'muted';
    intro.textContent = 'Kijk goed naar de potloden. Je hoeft geen getallen te lezen: vergelijk de lengtes.';
    const progress = document.createElement('p');
    progress.className = 'muted';
    const host = document.createElement('div');
    const controls = document.createElement('div');
    controls.className = 'pacogo-length-order__actions';
    const speak = document.createElement('button');
    speak.type = 'button';
    speak.className = 'pacogo-length-order__primary';
    speak.textContent = '🔊 Luister nog een keer';
    const speechStatus = document.createElement('p');
    speechStatus.className = 'muted';
    speechStatus.setAttribute('role', 'status');
    speechStatus.setAttribute('aria-live', 'polite');
    content.append(intro, progress, host, controls, speechStatus);

    let taskIndex = 0;
    let interfaceInstance = null;
    let completed = false;
    let speechText = '';
    const speakCurrent = () => app.audio.speak(speechText, { language: 'nl', onStatus: message => { speechStatus.textContent = message; } }).catch(() => {});
    speak.addEventListener('click', speakCurrent);
    controls.appendChild(speak);

    function renderTask() {
      completed = false;
      const task = LENGTH_ORDER_TASKS[taskIndex];
      speechText = task.prompt + ' Sleep de potloden naar de juiste volgorde. Het kortste potlood komt links.';
      progress.textContent = 'Oefening ' + (taskIndex + 1) + ' van ' + LENGTH_ORDER_TASKS.length;
      interfaceInstance = createLengthOrderLearningInterface({
        mount: host,
        task,
        onCheck: order => ({ correct: evaluateLengthOrder(task, order) })
      });
      speakCurrent();
    }

    function finishTask() {
      if (completed) return;
      completed = true;
      taskIndex += 1;
      if (taskIndex < LENGTH_ORDER_TASKS.length) {
        const next = document.createElement('button');
        next.type = 'button';
        next.className = 'pacogo-length-order__primary';
        next.textContent = 'Volgende oefening';
        next.addEventListener('click', renderTask);
        host.querySelector('.pacogo-length-order__actions')?.appendChild(next);
        next.focus();
      } else {
        progress.textContent = 'Alle potloden zijn goed geordend. Goed gewerkt!';
        host.replaceChildren();
        const done = document.createElement('p');
        done.className = 'pacogo-length-order__instruction';
        done.textContent = 'Je hebt alle potloden van klein naar groot gelegd.';
        const restart = document.createElement('button');
        restart.type = 'button';
        restart.className = 'pacogo-length-order__primary';
        restart.textContent = 'OPNIEUW OEFENEN';
        restart.addEventListener('click', () => { taskIndex = 0; renderTask(); });
        host.append(done, restart);
        restart.focus();
      }
    }

    const originalCreate = createLengthOrderLearningInterface;
    // Completion is triggered from the interface's success callback.
    function renderCurrentTask() {
      const task = LENGTH_ORDER_TASKS[taskIndex];
      speechText = task.prompt + ' Sleep de potloden naar de juiste volgorde. Het kortste potlood komt links.';
      progress.textContent = 'Oefening ' + (taskIndex + 1) + ' van ' + LENGTH_ORDER_TASKS.length;
      interfaceInstance = originalCreate({ mount: host, task, onCheck: order => {
        const correct = evaluateLengthOrder(task, order);
        if (correct) queueMicrotask(finishTask);
        return { correct };
      }});
      speakCurrent();
    }
    renderTask = renderCurrentTask;

    mountPacoPageTemplate({
      mount: document.querySelector('#paco-template-mount'),
      greeting: student ? 'Hoi ' + student + '! 🐶' : 'Welkom bij PacoGO',
      title: 'Potloden van klein naar groot', icon: '✏️',
      subtitle: 'Vergelijk de lengtes en zet de potloden in de juiste volgorde.',
      navigation: createPacoNavigation({ app, active: 'skills', student, viewMode: context.mode }),
      content, layoutMode: 'practice'
    });
    renderTask();
  </script>
</body>
</html>
