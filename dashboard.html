<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Dashboard</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .dashboard-page{display:grid;gap:22px}
    .dashboard-student{font-weight:800;color:#38577d}
    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}
    .dashboard-main,.dashboard-side{display:grid;gap:18px;align-content:start}
    .dashboard-card{border:1px solid #dce9f6;border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07);padding:20px}
    .dashboard-card h2,.dashboard-card h3{margin:0;color:#102b57;font:800 25px/1.1 "Baloo 2",Nunito,sans-serif}
    .dashboard-welcome{background:linear-gradient(135deg,#eef8ff,#fff)}
    .dashboard-welcome p{margin:8px 0 0;color:#667894;line-height:1.5}
    .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .subject-card{border:2px solid #f4e8a8;border-radius:20px;background:#fffdf0;box-shadow:0 7px 0 rgba(16,43,87,.07),0 12px 24px rgba(16,43,87,.08);padding:17px;text-align:left;cursor:pointer;transition:.16s}
    .subject-card:hover{transform:translateY(-3px);box-shadow:0 10px 0 rgba(16,43,87,.07),0 16px 28px rgba(16,43,87,.11)}
    .subject-icon{font-size:42px;margin-bottom:11px}
    .subject-card h3{font-size:21px}
    .subject-card p{margin:6px 0 0;color:#667894}
    .student-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .student-card{border:2px solid #dce9f6;border-radius:20px;background:#fff;padding:20px;text-align:left;color:#102b57;box-shadow:0 8px 22px rgba(16,43,87,.07);cursor:pointer;transition:.16s}
    .student-card:hover{transform:translateY(-3px);border-color:#1787f2;background:#eef8ff}
    .student-card h2{font-size:24px}
    .student-card p{margin:6px 0 0;color:#667894}
    .stat-big{font-size:40px;font-weight:950;color:#102b57;line-height:1}
    .stat-label{margin-top:5px;color:#667894}
    .progress-wrap{margin-top:18px}
    .progress-label{display:flex;justify-content:space-between;gap:10px;color:#667894;font-size:13px;margin-bottom:7px}
    .progress{height:9px;background:#e4edf6;border-radius:999px;overflow:hidden}
    .progress-bar{height:100%;background:linear-gradient(90deg,#4dcf75,#2e9cf4);transition:width .2s}
    .dashboard-state{padding:16px 18px;border:1px solid #dce9f6;border-radius:18px;background:#fff;color:#667894}
    .dashboard-actions{display:flex;gap:10px;flex-wrap:wrap}
    .dashboard-actions button{font-weight:900}
    @media(max-width:800px){.dashboard-grid{grid-template-columns:1fr}.subject-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.subject-grid{grid-template-columns:1fr}.student-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { setStudent } from './src/core/state.js';
    import { getDashboardSubjects, getDashboardProgress, getDashboardSubjectIcon } from './src/features/dashboard/view-model.js';
    import { listStudents, isKnownStudent } from './src/features/students/students.js';

    const params = new URLSearchParams(window.location.search);
    const requestedStudent = params.get('student') || '';
    const selectedStudent = isKnownStudent(requestedStudent) ? requestedStudent : '';
    const mount = document.querySelector('#paco-template-mount');
    const app = createPacoGOApp({ supabaseLib: window.supabase });

    const goChooser = () => { window.location.href = 'dashboard.html'; };
    const goDashboard = student => { window.location.href = `dashboard.html?student=${encodeURIComponent(student)}`; };
    const goLessons = () => { window.location.href = `lessons.html?student=${encodeURIComponent(selectedStudent)}`; };
    const goManage = () => { window.location.href = 'management.html'; };

    const content = document.createElement('div');
    content.className = 'dashboard-page';

    function mountTemplate() {
      mountPacoPageTemplate({
        mount,
        backLabel: selectedStudent ? '← Mijn lessen' : '← Start',
        backAction: selectedStudent ? goLessons : goChooser,
        greeting: selectedStudent ? `Hoi ${selectedStudent}! 🐶` : 'PacoGO leren 🐾',
        title: selectedStudent ? 'Dashboard' : 'Wie gaat er leren?',
        icon: selectedStudent ? '🏠' : '👦',
        subtitle: selectedStudent ? 'Bekijk je lessen en zie hoe je ervoor staat.' : 'Kies een leerling om naar het persoonlijke dashboard te gaan.',
        navigation: selectedStudent ? [
          {icon:'🏠',label:'Dashboard',active:true,onClick:() => goDashboard(selectedStudent)},
          {icon:'📚',label:'Mijn lessen',onClick:goLessons},
          {icon:'⚙️',label:'Beheer',onClick:goManage}
        ] : [
          {icon:'🏠',label:'Start',active:true,onClick:goChooser},
          {icon:'⚙️',label:'Beheer',onClick:goManage}
        ],
        content
      });
    }

    function renderStudentChooser() {
      content.replaceChildren();
      const card = document.createElement('article');
      card.className = 'dashboard-card dashboard-welcome';
      const heading = document.createElement('h2');
      heading.textContent = 'Kies je naam';
      const intro = document.createElement('p');
      intro.textContent = 'Dan opent jouw persoonlijke dashboard met je eigen lessen en voortgang.';
      card.append(heading, intro);

      const grid = document.createElement('div');
      grid.className = 'student-grid';
      grid.style.marginTop = '15px';
      listStudents().forEach(student => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'student-card';
        const name = document.createElement('h2');
        name.textContent = `👦 ${student}`;
        const description = document.createElement('p');
        description.textContent = 'Mijn lessen →';
        button.append(name, description);
        button.addEventListener('click', () => goDashboard(student));
        grid.appendChild(button);
      });
      card.appendChild(grid);
      content.appendChild(card);
    }

    function render(records) {
      content.replaceChildren();
      const lessons = app.mapLessons(records);
      const subjects = getDashboardSubjects(lessons, selectedStudent);
      const progressStats = getDashboardProgress(lessons, selectedStudent, app.mastery);

      const toolbar = document.createElement('div');
      toolbar.className = 'dashboard-actions';
      const studentLabel = document.createElement('div');
      studentLabel.className = 'dashboard-student';
      studentLabel.textContent = `Leerling: ${selectedStudent}`;
      const switchButton = document.createElement('button');
      switchButton.type = 'button';
      switchButton.className = 'secondary';
      switchButton.textContent = 'Andere leerling';
      switchButton.addEventListener('click', goChooser);
      toolbar.append(studentLabel, switchButton);

      const grid = document.createElement('div');
      grid.className = 'dashboard-grid';

      const main = document.createElement('section');
      main.className = 'dashboard-main';

      const welcome = document.createElement('article');
      welcome.className = 'dashboard-card dashboard-welcome';
      const welcomeHeading = document.createElement('h2');
      welcomeHeading.textContent = 'Wat wil je leren?';
      const welcomeText = document.createElement('p');
      welcomeText.textContent = 'Kies hieronder een vak om direct naar je lessen te gaan.';
      welcome.append(welcomeHeading, welcomeText);
      main.appendChild(welcome);

      const subjectsCard = document.createElement('article');
      subjectsCard.className = 'dashboard-card';
      const heading = document.createElement('h2');
      heading.textContent = 'Mijn vakken';
      subjectsCard.appendChild(heading);
      const subjectGrid = document.createElement('div');
      subjectGrid.className = 'subject-grid';
      subjectGrid.style.marginTop = '15px';

      subjects.forEach(subject => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'subject-card';
        const icon = document.createElement('div');
        icon.className = 'subject-icon';
        icon.textContent = getDashboardSubjectIcon(subject.label);
        const title = document.createElement('h3');
        title.textContent = subject.label;
        const count = subject.lessons.length;
        const meta = document.createElement('p');
        meta.textContent = `${count} ${count === 1 ? 'les' : 'lessen'} · Bekijk →`;
        card.append(icon, title, meta);
        card.addEventListener('click', () => {
          window.location.href = `lessons.html?student=${encodeURIComponent(selectedStudent)}&subject=${encodeURIComponent(subject.label)}`;
        });
        subjectGrid.appendChild(card);
      });

      if (!subjectGrid.children.length) {
        const empty = document.createElement('div');
        empty.className = 'dashboard-state';
        empty.style.marginTop = '15px';
        empty.textContent = `Nog geen actieve lessen voor ${selectedStudent}.`;
        subjectsCard.appendChild(empty);
      } else {
        subjectsCard.appendChild(subjectGrid);
      }
      main.appendChild(subjectsCard);

      const side = document.createElement('aside');
      side.className = 'dashboard-side';
      const progressCard = document.createElement('article');
      progressCard.className = 'dashboard-card';
      const progressHeading = document.createElement('h3');
      progressHeading.textContent = 'Jouw voortgang';
      const lessonCount = document.createElement('div');
      lessonCount.className = 'stat-big';
      lessonCount.style.marginTop = '16px';
      lessonCount.textContent = String(progressStats.lessons);
      const lessonLabel = document.createElement('div');
      lessonLabel.className = 'stat-label';
      lessonLabel.textContent = 'lessen beschikbaar';
      const progressWrap = document.createElement('div');
      progressWrap.className = 'progress-wrap';
      const progressLabel = document.createElement('div');
      progressLabel.className = 'progress-label';
      const masteredLabel = document.createElement('span');
      masteredLabel.textContent = `${progressStats.mastered} van ${progressStats.items} onderdelen beheerst`;
      const percentLabel = document.createElement('span');
      percentLabel.textContent = `${progressStats.percent}%`;
      progressLabel.append(masteredLabel, percentLabel);
      const progressTrack = document.createElement('div');
      progressTrack.className = 'progress';
      const progressBar = document.createElement('div');
      progressBar.className = 'progress-bar';
      progressBar.style.width = `${progressStats.percent}%`;
      progressTrack.appendChild(progressBar);
      progressWrap.append(progressLabel, progressTrack);
      const masteryNote = document.createElement('p');
      masteryNote.className = 'dashboard-state';
      masteryNote.style.margin = '16px 0 0';
      masteryNote.textContent = 'Een onderdeel telt als beheerst na 3 goede antwoorden achter elkaar.';
      progressCard.append(progressHeading, lessonCount, lessonLabel, progressWrap, masteryNote);
      side.appendChild(progressCard);

      const subjectsCardSide = document.createElement('article');
      subjectsCardSide.className = 'dashboard-card';
      const subjectCountHeading = document.createElement('h3');
      subjectCountHeading.textContent = `${progressStats.subjects} ${progressStats.subjects === 1 ? 'vak' : 'vakken'}`;
      const subjectCountText = document.createElement('p');
      subjectCountText.style.cssText = 'margin:7px 0 0;color:#667894';
      subjectCountText.textContent = `Actieve vakken voor ${selectedStudent}.`;
      const lessonButton = document.createElement('button');
      lessonButton.type = 'button';
      lessonButton.className = 'secondary';
      lessonButton.style.marginTop = '14px';
      lessonButton.textContent = '📚 Naar mijn lessen';
      lessonButton.addEventListener('click', goLessons);
      subjectsCardSide.append(subjectCountHeading, subjectCountText, lessonButton);
      side.appendChild(subjectsCardSide);

      grid.append(main, side);
      content.append(toolbar, grid);
    }

    mountTemplate();
    if (!selectedStudent) {
      renderStudentChooser();
    } else {
      const state = document.createElement('div');
      state.className = 'dashboard-state';
      state.textContent = 'Dashboard laden…';
      content.appendChild(state);
      setStudent(selectedStudent);
      app.loadLessons()
        .then(records => render(records))
        .catch(error => {
          console.error('Dashboard page load error:', error);
          state.textContent = 'Het dashboard kon niet worden geladen.';
        });
    }
  </script>
</body>
</html>
