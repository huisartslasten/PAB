<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Dashboard</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .dashboard-page{display:grid;gap:22px}
    .dashboard-main{display:grid;gap:18px;align-content:start}
    .dashboard-card{border:1px solid #dce9f6;border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07);padding:20px}
    .dashboard-card h2,.dashboard-card h3{margin:0;color:#102b57;font:800 25px/1.1 "Baloo 2",Nunito,sans-serif}
    .dashboard-welcome{background:linear-gradient(135deg,#eef8ff,#fff)}
    .dashboard-welcome p{margin:8px 0 0;color:#667894;line-height:1.5}
    .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .subject-card{border:2px solid #f4e8a8;border-radius:20px;background:#fffdf0;box-shadow:0 7px 0 rgba(16,43,87,.07),0 12px 24px rgba(16,43,87,.08);padding:17px;text-align:left;cursor:pointer;transition:.16s}
    .subject-card:hover{transform:translateY(-3px);box-shadow:0 10px 0 rgba(16,43,87,.07),0 16px 28px rgba(16,43,87,.11)}
    .subject-icon{font-size:42px;margin-bottom:11px}
    .subject-card h3{font-size:21px}
    .subject-card p{margin:6px 0 0;color:#667894}
    .student-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .student-card{display:block;border:2px solid #dce9f6;border-radius:20px;background:#fff;padding:20px;text-align:left;color:#102b57;box-shadow:0 8px 22px rgba(16,43,87,.07);cursor:pointer;transition:.16s;text-decoration:none}
    .student-card:hover{transform:translateY(-3px);border-color:#1787f2;background:#eef8ff}
    .student-card h2{font-size:24px}
    .student-card p{margin:6px 0 0;color:#667894}
    .dashboard-state{padding:16px 18px;border:1px solid #dce9f6;border-radius:18px;background:#fff;color:#667894}
    .dashboard-agenda{display:grid;gap:10px;margin-top:15px}
    .dashboard-agenda-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;align-items:start;padding:12px;border:1px solid #dce9f6;border-radius:15px;background:#f8fbff;text-align:left}
    .dashboard-agenda-item.is-link{cursor:pointer}
    .dashboard-agenda-item.is-link:hover{border-color:#1787f2;background:#eef8ff}
    .agenda-icon{font-size:25px;line-height:1}
    .agenda-date{font-size:11px;font-weight:900;color:#126fc9;text-transform:uppercase;letter-spacing:.04em}
    .agenda-title{margin-top:2px;color:#102b57;font-weight:900;line-height:1.25}
    .agenda-meta{margin-top:3px;color:#667894;font-size:12px;line-height:1.35}

    /* The start page is intentionally outside the shared page template.
       It is the public learner chooser, not a normal application page. */
    .dashboard-chooser-page{min-height:100vh;margin:0;background:#1787f2;color:#102b57;font-family:Nunito,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .dashboard-chooser-hero{position:relative;width:100%;overflow:hidden;line-height:0}
    .dashboard-chooser-hero img{display:block;width:100%;height:auto;max-width:none}
    .dashboard-management-link{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 18px;border:3px solid rgba(255,255,255,.95);border-radius:24px;background:#ffd84d;color:#102b57;font:900 17px/1 "Baloo 2",Nunito,sans-serif;text-decoration:none;box-shadow:0 5px 0 rgba(16,43,87,.18),0 8px 18px rgba(16,43,87,.16)}
    .dashboard-management-link:hover{background:#ffe36f;transform:translateX(-50%) translateY(-1px)}
    .dashboard-chooser-content{width:min(980px,calc(100% - 36px));margin:0 auto;padding:38px 0 60px;text-align:center}
    .dashboard-chooser-title{display:inline-block;margin:0;padding:17px 30px;border-radius:24px;background:#fff;box-shadow:0 7px 0 rgba(16,43,87,.08),0 12px 24px rgba(16,43,87,.10);color:#102b57;font:900 clamp(28px,4vw,39px)/1 "Baloo 2",Nunito,sans-serif}
    .dashboard-chooser-students{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px}
    .dashboard-chooser-student{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:178px;padding:22px 18px;border:0;border-radius:24px;background:#fff;color:#102b57;text-decoration:none;box-shadow:0 9px 0 rgba(16,43,87,.08),0 14px 26px rgba(16,43,87,.12);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
    .dashboard-chooser-student:hover{transform:translateY(-3px);background:#f8fbff;box-shadow:0 12px 0 rgba(16,43,87,.08),0 18px 30px rgba(16,43,87,.13)}
    .dashboard-chooser-student-name{font:900 29px/1 "Baloo 2",Nunito,sans-serif}
    .dashboard-chooser-student-label{margin-top:12px;color:#667894;font:800 16px/1.2 Nunito,sans-serif}
    .dashboard-chooser-go{margin-top:17px;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:9px 19px;border-radius:15px;background:#1787f2;color:#fff;font:900 17px/1 "Baloo 2",Nunito,sans-serif;box-shadow:0 5px 0 #0d6fd4}
    @media(max-width:700px){
      .dashboard-management-link{top:12px;min-height:38px;padding:7px 14px;font-size:15px}
      .dashboard-chooser-content{width:calc(100% - 24px);padding-top:26px}
      .dashboard-chooser-students{grid-template-columns:1fr;gap:15px}
      .dashboard-chooser-student{min-height:145px}
    }
    @media(max-width:420px){.dashboard-management-link{top:9px;padding:6px 12px;font-size:14px}.dashboard-chooser-title{padding:14px 20px}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <div id="paco-chooser-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { setStudent } from './src/core/state.js';
    import { getDashboardSubjects, getDashboardProgress, getDashboardSubjectIcon, getDashboardAgendaItems } from './src/features/dashboard/view-model.js';
    import { listStudents, isKnownStudent } from './src/features/students/students.js';

    const params = new URLSearchParams(window.location.search);
    const requestedStudent = params.get('student') || '';
    const selectedStudent = isKnownStudent(requestedStudent) ? requestedStudent : '';
    const templateMount = document.querySelector('#paco-template-mount');
    const chooserMount = document.querySelector('#paco-chooser-mount');
    const app = createPacoGOApp({ supabaseLib: window.supabase });

    const goChooser = () => { window.location.href = 'dashboard.html'; };
    const goLessons = () => { window.location.href = `lessons.html?student=${encodeURIComponent(selectedStudent)}`; };

    const content = document.createElement('div');
    content.className = 'dashboard-page';

    function renderStartPage() {
      templateMount.replaceChildren();
      chooserMount.replaceChildren();

      const page = document.createElement('main');
      page.className = 'dashboard-chooser-page';

      const hero = document.createElement('header');
      hero.className = 'dashboard-chooser-hero';
      const heroImage = document.createElement('img');
      heroImage.src = 'pacogo-aruba-hero.png';
      heroImage.alt = 'PacoGO Aruba';
      const management = document.createElement('a');
      management.className = 'dashboard-management-link';
      management.href = 'management.html';
      management.textContent = 'Beheer';
      hero.append(heroImage, management);

      const chooser = document.createElement('section');
      chooser.className = 'dashboard-chooser-content';
      const title = document.createElement('h1');
      title.className = 'dashboard-chooser-title';
      title.textContent = 'Wie gaat er leren?';
      chooser.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'dashboard-chooser-students';
      listStudents().forEach(student => {
        const link = document.createElement('a');
        link.className = 'dashboard-chooser-student';
        link.href = `dashboard.html?student=${encodeURIComponent(student)}`;
        link.setAttribute('aria-label', `Dashboard van ${student}`);

        const name = document.createElement('span');
        name.className = 'dashboard-chooser-student-name';
        name.textContent = student;
        const label = document.createElement('span');
        label.className = 'dashboard-chooser-student-label';
        label.textContent = 'Mijn lessen';
        const go = document.createElement('span');
        go.className = 'dashboard-chooser-go';
        go.textContent = 'GO! →';
        link.append(name, label, go);
        grid.appendChild(link);
      });

      chooser.appendChild(grid);
      page.append(hero, chooser);
      chooserMount.appendChild(page);
    }

    if (!selectedStudent) {
      renderStartPage();
    } else {
      chooserMount.replaceChildren();
      mountPacoPageTemplate({
        mount: templateMount,
        backLabel: '← Start',
        backAction: goChooser,
        greeting: `Hoi ${selectedStudent}! 🐶`,
        title: 'Dashboard',
        icon: '🏠',
        subtitle: 'Bekijk je lessen en zie hoe je ervoor staat.',
        navigation: createPacoNavigation({ active: 'dashboard', student: selectedStudent }),
        content
      });

      function formatAgendaDate(value) {
        const date = new Date(`${String(value).slice(0, 10)}T12:00:00`);
        if (Number.isNaN(date.getTime())) return String(value || '');
        return new Intl.DateTimeFormat('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }).format(date);
      }

      function agendaItemTarget(item) {
        if (!item.lessonId) return '';
        const target = new URL('lesson-choice.html', window.location.href);
        target.searchParams.set('lesson_id', String(item.lessonId));
        target.searchParams.set('student', selectedStudent);
        return target.toString();
      }

      function renderAgenda(agendaItems) {
        const card = document.createElement('article');
        card.className = 'dashboard-card';
        const heading = document.createElement('h2');
        heading.textContent = 'Binnenkort';
        card.appendChild(heading);

        if (!agendaItems.length) {
          const empty = document.createElement('div');
          empty.className = 'dashboard-state';
          empty.style.marginTop = '15px';
          empty.textContent = 'Geen aankomende agenda-items.';
          card.appendChild(empty);
          return card;
        }

        const list = document.createElement('div');
        list.className = 'dashboard-agenda';
        agendaItems.forEach(item => {
          const target = agendaItemTarget(item);
          const row = document.createElement(target ? 'button' : 'div');
          if (target) row.type = 'button';
          row.className = `dashboard-agenda-item${target ? ' is-link' : ''}`;
          const icon = document.createElement('div');
          icon.className = 'agenda-icon';
          icon.textContent = item.icon;
          const body = document.createElement('div');
          const date = document.createElement('div');
          date.className = 'agenda-date';
          date.textContent = formatAgendaDate(item.date);
          const title = document.createElement('div');
          title.className = 'agenda-title';
          title.textContent = item.title;
          body.append(date, title);
          if (item.meta) {
            const meta = document.createElement('div');
            meta.className = 'agenda-meta';
            meta.textContent = item.meta;
            body.appendChild(meta);
          }
          row.append(icon, body);
          if (target) row.addEventListener('click', () => { window.location.href = target; });
          list.appendChild(row);
        });
        card.appendChild(list);
        return card;
      }

      function render(records) {
        content.replaceChildren();
        const lessons = app.mapLessons(records);
        const subjects = getDashboardSubjects(lessons, selectedStudent);
        const progressStats = getDashboardProgress(lessons, selectedStudent, app.mastery);
        const agendaItems = getDashboardAgendaItems(app.agenda, 4);

        const main = document.createElement('section');
        main.className = 'dashboard-main';

        const welcome = document.createElement('article');
        welcome.className = 'dashboard-card dashboard-welcome';
        const welcomeHeading = document.createElement('h2');
        welcomeHeading.textContent = 'Wat wil je leren?';
        const welcomeText = document.createElement('p');
        welcomeText.textContent = 'Kies hieronder een vak om direct naar je lessen te gaan.';
        welcome.append(welcomeHeading, welcomeText);
        main.appendChild(welcome);

        main.appendChild(renderAgenda(agendaItems));

        const subjectsCard = document.createElement('article');
        subjectsCard.className = 'dashboard-card';
        const heading = document.createElement('h2');
        heading.textContent = 'Mijn vakken';
        subjectsCard.appendChild(heading);
        const subjectGrid = document.createElement('div');
        subjectGrid.className = 'subject-grid';
        subjectGrid.style.marginTop = '15px';

        subjects.forEach(subject => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'subject-card';
          const icon = document.createElement('div');
          icon.className = 'subject-icon';
          icon.textContent = getDashboardSubjectIcon(subject.label);
          const title = document.createElement('h3');
          title.textContent = subject.label;
          const count = subject.lessons.length;
          const meta = document.createElement('p');
          meta.textContent = `${count} ${count === 1 ? 'les' : 'lessen'} · Bekijk →`;
          card.append(icon, title, meta);
          card.addEventListener('click', () => {
            window.location.href = `lessons.html?student=${encodeURIComponent(selectedStudent)}&subject=${encodeURIComponent(subject.label)}`;
          });
          subjectGrid.appendChild(card);
        });

        if (!subjectGrid.children.length) {
          const empty = document.createElement('div');
          empty.className = 'dashboard-state';
          empty.style.marginTop = '15px';
          empty.textContent = `Nog geen actieve lessen voor ${selectedStudent}.`;
          subjectsCard.appendChild(empty);
        } else {
          subjectsCard.appendChild(subjectGrid);
        }
        main.appendChild(subjectsCard);

        const subjectSummary = document.createElement('article');
        subjectSummary.className = 'dashboard-card';
        const subjectCountHeading = document.createElement('h3');
        subjectCountHeading.textContent = `${progressStats.subjects} ${progressStats.subjects === 1 ? 'vak' : 'vakken'}`;
        const subjectCountText = document.createElement('p');
        subjectCountText.style.cssText = 'margin:7px 0 0;color:#667894';
        subjectCountText.textContent = `Actieve vakken voor ${selectedStudent}.`;
        const lessonButton = document.createElement('button');
        lessonButton.type = 'button';
        lessonButton.className = 'secondary';
        lessonButton.style.marginTop = '14px';
        lessonButton.textContent = '📚 Naar mijn lessen';
        lessonButton.addEventListener('click', goLessons);
        subjectSummary.append(subjectCountHeading, subjectCountText, lessonButton);
        main.appendChild(subjectSummary);

        content.appendChild(main);
      }

      const state = document.createElement('div');
      state.className = 'dashboard-state';
      state.textContent = 'Dashboard laden…';
      content.appendChild(state);
      setStudent(selectedStudent);
      app.loadLessons()
        .then(records => render(records))
        .catch(error => {
          console.error('Dashboard page load error:', error);
          state.textContent = 'Het dashboard kon niet worden geladen.';
        });
    }
  </script>
</body>
</html>
