<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Dashboard</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .dashboard-page{display:grid;gap:22px}
    .dashboard-student{font-weight:800;color:#38577d}
    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}
    .dashboard-main,.dashboard-side{display:grid;gap:18px;align-content:start}
    .dashboard-card{border:1px solid #dce9f6;border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07);padding:20px}
    .dashboard-card h2,.dashboard-card h3{margin:0;color:#102b57;font:800 25px/1.1 "Baloo 2",Nunito,sans-serif}
    .dashboard-welcome{background:linear-gradient(135deg,#eef8ff,#fff)}
    .dashboard-welcome p{margin:8px 0 0;color:#667894;line-height:1.5}
    .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .subject-card{border:2px solid #f4e8a8;border-radius:20px;background:#fffdf0;box-shadow:0 7px 0 rgba(16,43,87,.07),0 12px 24px rgba(16,43,87,.08);padding:17px;text-align:left;cursor:pointer;transition:.16s}
    .subject-card:hover{transform:translateY(-3px);box-shadow:0 10px 0 rgba(16,43,87,.07),0 16px 28px rgba(16,43,87,.11)}
    .subject-icon{font-size:42px;margin-bottom:11px}
    .subject-card h3{font-size:21px}
    .subject-card p{margin:6px 0 0;color:#667894}
    .stat-big{font-size:40px;font-weight:950;color:#102b57;line-height:1}
    .stat-label{margin-top:5px;color:#667894}
    .progress-wrap{margin-top:18px}
    .progress-label{display:flex;justify-content:space-between;gap:10px;color:#667894;font-size:13px;margin-bottom:7px}
    .progress{height:9px;background:#e4edf6;border-radius:999px;overflow:hidden}
    .progress-bar{height:100%;background:linear-gradient(90deg,#4dcf75,#2e9cf4);transition:width .2s}
    .dashboard-state{padding:16px 18px;border:1px solid #dce9f6;border-radius:18px;background:#fff;color:#667894}
    .dashboard-actions{display:flex;gap:10px;flex-wrap:wrap}
    .dashboard-actions button{font-weight:900}
    @media(max-width:800px){.dashboard-grid{grid-template-columns:1fr}.subject-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.subject-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { mapLessonRecords } from './src/features/lessons/lesson-mapper.js';
    import { getDashboardSubjects, getDashboardProgress, getDashboardSubjectIcon } from './src/features/dashboard/view-model.js';

    const params = new URLSearchParams(window.location.search);
    const selectedStudent = params.get('student') || 'Zyon';
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    content.className = 'dashboard-page';
    const app = createPacoGOApp({ supabaseLib: window.supabase });

    const goHome = () => { window.location.href = `dashboard.html?student=${encodeURIComponent(selectedStudent)}`; };
    const goLessons = () => { window.location.href = `lessons.html?student=${encodeURIComponent(selectedStudent)}`; };
    const goManage = () => { window.location.href = 'management.html'; };
    const goStudentChooser = () => { window.location.href = 'dashboard.html'; };

    const toolbar = document.createElement('div');
    toolbar.className = 'dashboard-actions';
    const studentLabel = document.createElement('div');
    studentLabel.className = 'dashboard-student';
    studentLabel.textContent = `Leerling: ${selectedStudent}`;
    const switchButton = document.createElement('button');
    switchButton.type = 'button';
    switchButton.className = 'secondary';
    switchButton.textContent = 'Andere leerling';
    switchButton.addEventListener('click', goStudentChooser);
    toolbar.append(studentLabel, switchButton);

    const state = document.createElement('div');
    state.className = 'dashboard-state';
    state.textContent = 'Dashboard laden…';
    content.append(toolbar, state);

    mountPacoPageTemplate({
      mount,
      backLabel:'← Terug',
      backAction:goLessons,
      greeting:`Hoi ${selectedStudent}! 🐶`,
      title:'Dashboard',
      icon:'🏠',
      subtitle:'Bekijk je lessen en zie hoe je ervoor staat.',
      navigation:[
        {icon:'🏠',label:'Dashboard',active:true,onClick:goHome},
        {icon:'📚',label:'Mijn lessen',onClick:goLessons},
        {icon:'⚙️',label:'Beheer',onClick:goManage}
      ],
      content
    });

    function render(records){
      const lessons = mapLessonRecords(records);
      const subjects = getDashboardSubjects(lessons, selectedStudent);
      const progress = getDashboardProgress(lessons, selectedStudent, app.mastery);

      const grid = document.createElement('div');
      grid.className = 'dashboard-grid';

      const main = document.createElement('section');
      main.className = 'dashboard-main';

      const welcome = document.createElement('article');
      welcome.className = 'dashboard-card dashboard-welcome';
      welcome.innerHTML = `<h2>Wat wil je leren?</h2><p>Kies hieronder een vak om direct naar je lessen te gaan.</p>`;
      main.appendChild(welcome);

      const subjectsCard = document.createElement('article');
      subjectsCard.className = 'dashboard-card';
      const heading = document.createElement('h2');
      heading.textContent = 'Mijn vakken';
      subjectsCard.appendChild(heading);
      const subjectGrid = document.createElement('div');
      subjectGrid.className = 'subject-grid';
      subjectGrid.style.marginTop = '15px';

      subjects.forEach(subject => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'subject-card';
        const icon = getDashboardSubjectIcon(subject.label);
        const count = subject.lessons.length;
        card.innerHTML = `<div class="subject-icon">${icon}</div><h3>${subject.label}</h3><p>${count} ${count === 1 ? 'les' : 'lessen'} · Bekijk →</p>`;
        card.addEventListener('click', () => {
          window.location.href = `lessons.html?student=${encodeURIComponent(selectedStudent)}&subject=${encodeURIComponent(subject.label)}`;
        });
        subjectGrid.appendChild(card);
      });

      if (!subjectGrid.children.length) {
        const empty = document.createElement('div');
        empty.className = 'dashboard-state';
        empty.style.marginTop = '15px';
        empty.textContent = `Nog geen actieve lessen voor ${selectedStudent}.`;
        subjectsCard.appendChild(empty);
      } else {
        subjectsCard.appendChild(subjectGrid);
      }
      main.appendChild(subjectsCard);

      const side = document.createElement('aside');
      side.className = 'dashboard-side';
      const progressCard = document.createElement('article');
      progressCard.className = 'dashboard-card';
      progressCard.innerHTML = `<h3>Jouw voortgang</h3><div class="stat-big" style="margin-top:16px">${progress.lessons}</div><div class="stat-label">lessen beschikbaar</div><div class="progress-wrap"><div class="progress-label"><span>${progress.mastered} van ${progress.items} onderdelen beheerst</span><span>${progress.percent}%</span></div><div class="progress"><div class="progress-bar" style="width:${progress.percent}%"></div></div></div><p class="dashboard-state" style="margin:16px 0 0">Een onderdeel telt als beheerst na 3 goede antwoorden achter elkaar.</p>`;
      side.appendChild(progressCard);

      const subjectsCardSide = document.createElement('article');
      subjectsCardSide.className = 'dashboard-card';
      subjectsCardSide.innerHTML = `<h3>${progress.subjects} ${progress.subjects === 1 ? 'vak' : 'vakken'}</h3><p style="margin:7px 0 0;color:#667894">Actieve vakken voor ${selectedStudent}.</p><div class="dashboard-actions" style="margin-top:14px"><button type="button" class="secondary">📚 Naar mijn lessen</button></div>`;
      subjectsCardSide.querySelector('button').addEventListener('click', goLessons);
      side.appendChild(subjectsCardSide);

      grid.append(main, side);
      content.replaceChildren(toolbar, grid);
    }

    try {
      const records = await app.lessons.listAll();
      render(records);
    } catch (error) {
      console.error('Dashboard page load error:', error);
      state.textContent = 'Het dashboard kon niet worden geladen.';
    }
  </script>
</body>
</html>
