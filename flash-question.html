<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Flitsvraag</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <link rel="stylesheet" href="src/features/lessons/lesson-context-view.css">
  <link rel="stylesheet" href="src/features/lessons/practice-page.css">
  <link rel="stylesheet" href="src/features/lessons/flash-question.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createLessonContextField } from './src/features/lessons/lesson-context-view.js';
    import { createFlashQuestionRuntime } from './src/features/lessons/flash-question-runtime.js';
    import { createFlashQuestionView } from './src/features/lessons/flash-question-view.js';
    import { readViewContext, buildViewUrl } from './src/core/view-context.js';
    import { escapeHtml } from './src/core/html.js';

    const params = new URLSearchParams(window.location.search);
    const context = readViewContext(params);
    const lessonId = params.get('lesson_id') || '';
    const student = context.student;
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    const app = createPacoGOApp({ supabaseLib: window.supabase });
    const view = createFlashQuestionView({ documentRef: document, escapeHtml });

    const gameShell = document.createElement('main');
    gameShell.className = 'practice-page-card flash-game-shell';
    gameShell.innerHTML = `<div class="flash-head"><h1 class="flash-title">⚡ FLITSVRAAG</h1><div class="flash-stats"><div class="flash-stat"><span class="flash-stat-label">Score</span><span id="flashScore" class="flash-stat-value">0</span></div><div class="flash-stat"><span class="flash-stat-label">Maximum</span><span id="flashMaximum" class="flash-stat-value">0</span></div><div class="flash-stat"><span class="flash-stat-label">High score</span><span id="flashHighScore" class="flash-stat-value">0</span></div></div></div><div id="flashProgress" class="flash-progress-wrap"></div><div id="flashContent" class="flash-content"></div>`;
    content.appendChild(gameShell);

    const goGames = () => {
      const target = buildViewUrl('games.html', { student, mode: context.mode });
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      window.location.href = target.toString();
    };

    mountPacoPageTemplate({
      mount,
      backLabel: '← Spelletjes',
      backAction: goGames,
      greeting: `Hoi ${student}! 🐶`,
      title: 'Flitsvraag',
      icon: '⚡',
      subtitle: 'Kies snel het juiste antwoord en oefen alle vragen.',
      navigation: createPacoNavigation({ app, active: 'lessons', student, viewMode: context.mode }),
      content
    });

    async function load() {
      if (!lessonId || !student) throw new Error('Geen leerling of les geselecteerd.');
      const records = await app.loadLessons();
      const lesson = app.mapLessons(records).find(item => String(item.id) === String(lessonId));
      if (!lesson) throw new Error('Deze les kon niet worden gevonden.');

      const contextField = createLessonContextField(lesson);
      content.insertBefore(contextField, gameShell);

      const items = Array.isArray(lesson.lesson_items)
        ? lesson.lesson_items
        : Array.isArray(lesson.items)
          ? lesson.items
          : [];
      const runtime = createFlashQuestionRuntime({ items });
      let highScore = await app.gameResults.getHighScore({
        gameKey: 'flash_question',
        lessonId,
        student
      });
      highScore = highScore == null ? 0 : highScore;

      async function persistScore(score) {
        const normalizedScore = Math.max(0, Math.floor(Number(score) || 0));
        if (normalizedScore <= highScore) return;
        await app.gameResults.saveResult({
          gameKey: 'flash_question',
          lessonId,
          student,
          score: normalizedScore
        });
        highScore = normalizedScore;
      }

      function renderState() {
        const state = runtime.snapshot();
        if (state.phase === 'finished') {
          return persistScore(state.score).then(() => {
            view.renderFinished(state, highScore, restart, goGames);
          });
        }
        if (state.phase === 'result') {
          view.renderResult(state, highScore, () => {
            runtime.continueGame();
            renderState();
          });
          return Promise.resolve();
        }
        view.renderQuestion(state, answer => {
          runtime.submitAnswer(answer);
          renderState();
        }, highScore);
        return Promise.resolve();
      }

      function restart() {
        runtime.start();
        renderState();
      }

      restart();
    }

    try {
      await load();
    } catch (error) {
      console.error('Flitsvraag load error:', error);
      const node = document.createElement('div');
      node.className = 'practice-content';
      node.innerHTML = `<strong>Flitsvraag kon niet worden geladen.</strong><p class="small">${escapeHtml(error?.message || 'Onbekende fout.')}</p>`;
      gameShell.replaceChildren(node);
    }
  </script>
</body>
</html>
