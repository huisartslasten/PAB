<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Flashcards</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="src/components/page-template.css">
  <style>
    .flashcard-practice-content {
      display: grid;
      gap: 18px;
    }

    .flashcard-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .flashcard-reverse-button {
      min-height: 48px;
      padding: 10px 16px;
      border: 2px solid #cfe3f3;
      border-radius: 15px;
      background: #edf8ff;
      color: #126fc9;
      font-family: "Baloo 2", Nunito, sans-serif;
      font-size: 16px;
      font-weight: 800;
      box-shadow: none;
    }

    .flashcard-reverse-button:hover,
    .flashcard-reverse-button[aria-pressed="true"] {
      background: #dff0ff;
      border-color: #1787f2;
    }

    .flashcard-progress {
      color: #667894;
      font-family: "Baloo 2", Nunito, sans-serif;
      font-size: 18px;
      font-weight: 800;
    }

    .flashcard-card {
      width: 100%;
      min-height: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 42px;
      border: 2px solid #f4e8a8;
      border-radius: 28px;
      background: #fffdf0;
      color: #102b57;
      box-shadow: 0 8px 0 rgba(16, 43, 87, .08), 0 14px 28px rgba(16, 43, 87, .10);
      cursor: pointer;
      text-align: center;
    }

    .flashcard-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 rgba(16, 43, 87, .08), 0 16px 30px rgba(16, 43, 87, .13);
    }

    .flashcard-card:focus-visible {
      outline: 4px solid rgba(23, 135, 242, .22);
      outline-offset: 4px;
    }

    .flashcard-prompt {
      max-width: 900px;
      font-family: "Baloo 2", Nunito, sans-serif;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1.05;
      font-weight: 900;
      white-space: pre-wrap;
    }

    .flashcard-answer {
      max-width: 820px;
      padding-top: 18px;
      border-top: 2px solid #f0df9a;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.25;
      font-weight: 800;
      white-space: pre-wrap;
    }

    .flashcard-hint {
      margin-top: auto;
      color: #667894;
      font-size: 15px;
      font-weight: 700;
    }

    .flashcard-state {
      min-height: 240px;
      display: grid;
      place-items: center;
      padding: 30px;
      border: 2px solid #dce9f6;
      border-radius: 24px;
      background: #fff;
      color: #667894;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 700px) {
      .flashcard-card {
        min-height: 330px;
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>

  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { mountFlashcardPractice } from './src/features/practice/flashcards/flashcard-runtime.js';

    const params = new URLSearchParams(window.location.search);
    const lessonId = params.get('lesson_id');
    const student = params.get('student') || 'Zyon';
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');

    mountPacoPageTemplate({
      mount,
      backLabel: '← Terug',
      backAction: () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'index.html';
      },
      greeting: `Hoi ${student}! 🐶`,
      title: 'Flashcards',
      icon: '🃏',
      subtitle: 'Vraag → antwoord. Druk op Enter om verder te gaan.',
      navigation: [
        { icon: '🏠', label: 'Dashboard', onClick: () => { window.location.href = 'index.html'; } },
        {
          icon: '📚',
          label: 'Mijn lessen',
          expanded: true,
          submenu: [
            { label: 'Español' },
            { label: 'Geschiedenis' },
            { label: 'Nederlands' }
          ]
        },
        {
          icon: '📅',
          label: 'Mijn agenda',
          expanded: true,
          submenu: [
            { label: 'Agenda invoeren' },
            { label: 'Maandkalender' }
          ]
        },
        { icon: '🃏', label: 'Flashcards', active: true }
      ],
      content
    });

    mountFlashcardPractice({
      mount: content,
      lessonId,
      student
    });
  </script>
</body>
</html>
