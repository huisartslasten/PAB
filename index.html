<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacoGO!</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #ffffff;
    border-bottom: 1px solid #e5e9f0;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    color: #2563eb;
}

.logo span {
    color: #111827;
}

header button {
    border: 0;
    background: #eef2ff;
    color: #3730a3;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}

main {
    max-width: 1050px;
    margin: 0 auto;
    padding: 30px 18px 60px;
}

.hidden {
    display: none !important;
}

h1, h2, h3 {
    margin-top: 0;
}

.page-title {
    margin-bottom: 24px;
}

.subtitle {
    color: #64748b;
    margin-top: -14px;
    margin-bottom: 24px;
}

.subject-grid,
.lesson-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
}

.card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
}

.card.clickable {
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
}

.card.clickable:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 24px rgba(15, 23, 42, 0.10);
}

.card-icon {
    font-size: 35px;
    margin-bottom: 12px;
}

.card h3 {
    margin-bottom: 7px;
}

.card p {
    color: #64748b;
    margin: 0;
}

.btn {
    border: 0;
    border-radius: 11px;
    padding: 11px 17px;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-secondary {
    background: #e2e8f0;
    color: #172033;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.btn-small {
    padding: 7px 11px;
    font-size: 13px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.back-btn {
    margin-bottom: 20px;
}

.lesson-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.lesson-card .lesson-info {
    flex: 1;
}

.lesson-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: #eef2ff;
    color: #3730a3;
    font-size: 12px;
    font-weight: 700;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 11px 13px;
    font: inherit;
    background: white;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
}

.form-group {
    margin-bottom: 16px;
}

.item-editor {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
}

.item-editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.item-number {
    font-weight: 800;
    color: #475569;
}

.quiz-wrap {
    max-width: 700px;
    margin: 0 auto;
}

.quiz-progress {
    height: 9px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.quiz-progress-inner {
    height: 100%;
    background: #2563eb;
    transition: width .25s;
}

.quiz-card {
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, .08);
}

.quiz-question {
    font-size: 25px;
    font-weight: 750;
    line-height: 1.35;
    margin-bottom: 22px;
}

.quiz-answer {
    font-size: 18px;
    min-height: 130px;
}

.quiz-actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
}

.result {
    margin-top: 18px;
    padding: 15px;
    border-radius: 13px;
    font-weight: 650;
}

.result.correct {
    background: #dcfce7;
    color: #166534;
}

.result.incorrect {
    background: #fee2e2;
    color: #991b1b;
}

.result.loading {
    background: #e0f2fe;
    color: #075985;
}

.score {
    text-align: center;
    padding: 35px 20px;
}

.score-number {
    font-size: 60px;
    font-weight: 900;
    color: #2563eb;
}

.login-box {
    max-width: 430px;
    margin: 70px auto;
    background: white;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 30px rgba(15,23,42,.08);
}

.notice {
    padding: 13px 15px;
    background: #fff7ed;
    color: #9a3412;
    border-radius: 10px;
    margin-bottom: 18px;
}

.empty {
    background: white;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    color: #64748b;
}

.loading-screen {
    text-align: center;
    padding: 70px 20px;
    color: #64748b;
}

footer {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    padding: 30px;
}

@media (max-width: 600px) {
    header {
        padding: 15px;
    }

    .logo {
        font-size: 23px;
    }

    main {
        padding: 22px 13px 50px;
    }

    .quiz-card {
        padding: 22px;
    }

    .quiz-question {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Paco<span>GO!</span></div>
    <button id="parentButton" onclick="openParentLogin()">👨‍👩‍👦 Ouder</button>
</header>

<main>

    <!-- HOME -->
    <section id="homePage">
        <h1 class="page-title">Wat wil je leren?</h1>
        <p class="subtitle">Kies een vak.</p>

        <div id="subjectGrid" class="subject-grid">
            <div class="loading-screen">Lessen laden...</div>
        </div>
    </section>

    <!-- LESSONS -->
    <section id="lessonsPage" class="hidden">
        <button class="btn btn-secondary back-btn" onclick="showHome()">← Terug</button>

        <h1 id="lessonsTitle"></h1>
        <p class="subtitle">Kies een les.</p>

        <div id="lessonGrid" class="lesson-grid"></div>
    </section>

    <!-- LESSON VIEW -->
    <section id="lessonPage" class="hidden">
        <button class="btn btn-secondary back-btn" onclick="backToLessons()">← Terug</button>

        <div class="card">
            <h1 id="lessonViewTitle"></h1>
            <p id="lessonViewSubject" class="subtitle"></p>

            <button class="btn btn-primary" onclick="startQuizFromCurrentLesson()">
                ▶ Start oefenen
            </button>
        </div>
    </section>

    <!-- QUIZ -->
    <section id="quizPage" class="hidden">
        <div class="quiz-wrap">

            <button class="btn btn-secondary back-btn" onclick="leaveQuiz()">
                ← Stoppen
            </button>

            <div class="quiz-progress">
                <div id="progressBar" class="quiz-progress-inner"></div>
            </div>

            <div id="quizCard" class="quiz-card"></div>

        </div>
    </section>

    <!-- PARENT LOGIN -->
    <section id="parentLoginPage" class="hidden">

        <div class="login-box">
            <h2>Ouderlogin</h2>
            <p class="subtitle">Beheer je lessen en vragen.</p>

            <div class="form-group">
                <label>E-mail</label>
                <input id="loginEmail" type="email" autocomplete="email">
            </div>

            <div class="form-group">
                <label>Wachtwoord</label>
                <input id="loginPassword" type="password" autocomplete="current-password">
            </div>

            <div id="loginError" class="notice hidden"></div>

            <div class="toolbar">
                <button class="btn btn-primary" onclick="loginParent()">
                    Inloggen
                </button>

                <button class="btn btn-secondary" onclick="showHome()">
                    Annuleren
                </button>
            </div>
        </div>

    </section>

    <!-- PARENT DASHBOARD -->
    <section id="parentPage" class="hidden">

        <div class="toolbar">
            <button class="btn btn-secondary" onclick="showHome()">
                ← Naar website
            </button>

            <button class="btn btn-primary" onclick="newLesson()">
                + Nieuwe les
            </button>

            <button class="btn btn-danger" onclick="logoutParent()">
                Uitloggen
            </button>
        </div>

        <h1>Ouderbeheer</h1>
        <p class="subtitle">
            Hier kun je lessen, vragen en antwoorden aanpassen.
        </p>

        <div id="parentLessonGrid" class="lesson-grid"></div>

    </section>

    <!-- LESSON EDITOR -->
    <section id="editorPage" class="hidden">

        <button class="btn btn-secondary back-btn" onclick="backToParent()">
            ← Terug naar beheer
        </button>

        <h1 id="editorTitle">Les bewerken</h1>

        <div class="card">

            <div class="form-group">
                <label>Vak</label>
                <input id="editSubject">
            </div>

            <div class="form-group">
                <label>Naam van de les</label>
                <input id="editTitle">
            </div>

            <div class="form-group">
                <label>Type</label>
                <select id="editType">
                    <option value="words">Themawoorden / definities</option>
                    <option value="questions">Vragen</option>
                    <option value="dictation">Dictee</option>
                </select>
            </div>

            <h2>Vragen en antwoorden</h2>

            <div id="itemsEditor"></div>

            <div class="toolbar">
                <button class="btn btn-secondary" onclick="addEditorItem()">
                    + Vraag toevoegen
                </button>

                <button class="btn btn-success" onclick="saveLesson()">
                    💾 Opslaan
                </button>
            </div>

            <div id="saveMessage"></div>

        </div>
    </section>

</main>

<footer>
    PacoGO!
</footer>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://ncpkqrvxljxwboavxtak.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_skiKpO4UU79zWY7hskHsoA_WQxA6CFc";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   PARENT IDS
========================================================= */

const PARENT_IDS = [
    "5d0e1e5c-1dbe-4909-bd3a-81a1e7b26d09",
    "418833d5-049a-4ec9-8072-2d48a85f04b1"
];


/* =========================================================
   STATE
========================================================= */

let allLessons = [];
let currentSubject = null;
let currentLesson = null;
let currentLessonItems = [];

let quizItems = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

let editingLessonId = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getIcon(subject) {
    const s = String(subject || "").toLowerCase();

    if (s.includes("nederlands")) return "📚";
    if (s.includes("geschiedenis")) return "🏴‍☠️";
    if (s.includes("engels")) return "🇬🇧";
    if (s.includes("wiskunde")) return "🔢";
    if (s.includes("aardrijkskunde")) return "🌎";

    return "📖";
}


function showPage(id) {
    document.querySelectorAll("main > section").forEach(section => {
        section.classList.add("hidden");
    });

    document.getElementById(id).classList.remove("hidden");
}


/* =========================================================
   HOME
========================================================= */

async function loadHome() {

    showPage("homePage");

    const grid = document.getElementById("subjectGrid");

    grid.innerHTML =
        '<div class="loading-screen">Lessen laden...</div>';

    const { data, error } = await db
        .from("lessons")
        .select("*")
        .order("subject")
        .order("title");

    if (error) {
        console.error(error);

        grid.innerHTML = `
            <div class="empty">
                De lessen konden niet worden geladen.
            </div>
        `;

        return;
    }

    allLessons = data || [];

    const subjects = [
        ...new Set(
            allLessons
                .map(x => x.subject)
                .filter(Boolean)
        )
    ];

    if (!subjects.length) {
        grid.innerHTML = `
            <div class="empty">
                Er zijn nog geen lessen.
            </div>
        `;

        return;
    }

    grid.innerHTML = subjects.map(subject => `
        <div class="card clickable"
             onclick="openSubject('${escapeHtml(subject).replace(/'/g, "\\'")}')">

            <div class="card-icon">
                ${getIcon(subject)}
            </div>

            <h3>${escapeHtml(subject)}</h3>

            <p>
                ${allLessons.filter(x => x.subject === subject).length}
                ${allLessons.filter(x => x.subject === subject).length === 1
                    ? "les"
                    : "lessen"}
            </p>

        </div>
    `).join("");
}


function showHome() {
    loadHome();
}


/* =========================================================
   SUBJECTS
========================================================= */

function openSubject(subject) {

    currentSubject = subject;

    document.getElementById("lessonsTitle").textContent =
        subject;

    const lessons = allLessons.filter(
        lesson => lesson.subject === subject
    );

    const grid = document.getElementById("lessonGrid");

    grid.innerHTML = lessons.map(lesson => `
        <div class="card lesson-card">

            <div class="lesson-info">

                <span class="badge">
                    ${typeName(lesson.type)}
                </span>

                <h3 style="margin-top:12px;">
                    ${escapeHtml(lesson.title)}
                </h3>

            </div>

            <div class="lesson-actions">

                <button class="btn btn-primary"
                        onclick="openLesson(${lesson.id})">
                    Oefenen
                </button>

            </div>

        </div>
    `).join("");

    showPage("lessonsPage");
}


function typeName(type) {

    if (type === "words") return "Themawoorden";
    if (type === "questions") return "Vragen";
    if (type === "dictation") return "Dictee";

    return "Les";
}


/* =========================================================
   LESSON
========================================================= */

async function openLesson(id) {

    const lesson = allLessons.find(
        x => Number(x.id) === Number(id)
    );

    if (!lesson) return;

    currentLesson = lesson;

    const { data, error } = await db
        .from("lesson_items")
        .select("*")
        .eq("lesson_id", lesson.id)
        .order("sort_order")
        .order("id");

    if (error) {
        alert("De vragen konden niet worden geladen.");
        console.error(error);
        return;
    }

    currentLessonItems = data || [];

    document.getElementById("lessonViewTitle").textContent =
        lesson.title;

    document.getElementById("lessonViewSubject").textContent =
        `${lesson.subject} • ${currentLessonItems.length} vragen`;

    showPage("lessonPage");
}


function backToLessons() {
    if (currentSubject) {
        openSubject(currentSubject);
    } else {
        showHome();
    }
}


function startQuizFromCurrentLesson() {

    if (!currentLesson || !currentLessonItems.length) {
        alert("Deze les bevat nog geen vragen.");
        return;
    }

    startQuiz(currentLesson, currentLessonItems);
}


/* =========================================================
   QUIZ
========================================================= */

function startQuiz(lesson, items) {

    quizItems = [...items];

    // Shuffle
    quizItems.sort(() => Math.random() - 0.5);

    quizIndex = 0;
    quizScore = 0;
    quizAnswered = false;

    currentLesson = lesson;

    showPage("quizPage");

    renderQuiz();
}


function renderQuiz() {

    if (quizIndex >= quizItems.length) {
        renderQuizFinished();
        return;
    }

    const item = quizItems[quizIndex];

    quizAnswered = false;

    const percentage =
        (quizIndex / quizItems.length) * 100;

    document.getElementById("progressBar").style.width =
        percentage + "%";

    let prompt = item.question || "";

    let placeholder =
        "Typ je antwoord hier...";

    if (currentLesson.type === "dictation") {
        placeholder = "Typ het woord...";
    }

    document.getElementById("quizCard").innerHTML = `

        <div style="color:#64748b;font-weight:700;margin-bottom:10px;">
            Vraag ${quizIndex + 1} van ${quizItems.length}
        </div>

        <div class="quiz-question">
            ${escapeHtml(prompt)}
        </div>

        <textarea
            id="quizAnswer"
            class="quiz-answer"
            placeholder="${placeholder}"
            autocomplete="off"
            autocapitalize="sentences"
        ></textarea>

        <div id="quizResult"></div>

        <div class="quiz-actions">

            <button
                id="checkButton"
                class="btn btn-primary"
                onclick="checkAnswer()">
                Controleren
            </button>

        </div>
    `;

    const input = document.getElementById("quizAnswer");

    input.focus();

    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && event.ctrlKey) {
            event.preventDefault();
            checkAnswer();
        }

    });
}


/* =========================================================
   EXACT DICTATION
========================================================= */

function normalizeExact(text) {

    return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
}


function checkDictation(userAnswer, correctAnswer) {

    return normalizeExact(userAnswer) ===
           normalizeExact(correctAnswer);
}


/* =========================================================
   AI GRADING
========================================================= */

async function gradeWithAI(question, correctAnswer, userAnswer) {

    const { data, error } = await db.functions.invoke(
        "grade-answer-v2",
        {
            body: {
                question,
                correctAnswer,
                userAnswer
            }
        }
    );

    if (error) {
        console.error("AI grading error:", error);
        throw error;
    }

    if (!data) {
        throw new Error("Geen antwoord van de AI.");
    }

    return {
        correct: data.correct === true,
        feedback: data.feedback || ""
    };
}


/* =========================================================
   CHECK ANSWER
========================================================= */

async function checkAnswer() {

    if (quizAnswered) return;

    const input =
        document.getElementById("quizAnswer");

    const result =
        document.getElementById("quizResult");

    const button =
        document.getElementById("checkButton");

    const userAnswer =
        input.value.trim();

    if (!userAnswer) {
        result.innerHTML = `
            <div class="result incorrect">
                Typ eerst een antwoord.
            </div>
        `;

        input.focus();
        return;
    }

    const item = quizItems[quizIndex];

    button.disabled = true;
    input.disabled = true;

    /* -----------------------------------------
       DICTEE = GEEN AI
    ----------------------------------------- */

    if (currentLesson.type === "dictation") {

        const correctAnswer =
            item.answer || "";

        const isCorrect =
            checkDictation(
                userAnswer,
                correctAnswer
            );

        quizAnswered = true;

        if (isCorrect) {

            quizScore++;

            result.innerHTML = `
                <div class="result correct">
                    ✅ Goed!
                </div>
            `;

        } else {

            result.innerHTML = `
                <div class="result incorrect">
                    ❌ Niet goed.<br><br>
                    Het juiste woord is:
                    <strong>${escapeHtml(correctAnswer)}</strong>
                </div>
            `;

        }

        showNextButton();

        return;
    }


    /* -----------------------------------------
       OPEN ANTWOORD = AI
    ----------------------------------------- */

    result.innerHTML = `
        <div class="result loading">
            🤖 Even kijken of je antwoord dezelfde betekenis heeft...
        </div>
    `;

    try {

        const grading =
            await gradeWithAI(
                item.question,
                item.answer,
                userAnswer
            );

        quizAnswered = true;

        if (grading.correct) {

            quizScore++;

            result.innerHTML = `
                <div class="result correct">
                    ✅ Goed!<br>
                    ${escapeHtml(grading.feedback)}
                </div>
            `;

        } else {

            result.innerHTML = `
                <div class="result incorrect">
                    ❌ Nog niet helemaal.<br>
                    ${escapeHtml(grading.feedback)}
                    <br><br>
                    <strong>Een goed antwoord is bijvoorbeeld:</strong><br>
                    ${escapeHtml(item.answer)}
                </div>
            `;

        }

        showNextButton();

    } catch (error) {

        console.error(error);

        quizAnswered = true;

        result.innerHTML = `
            <div class="result incorrect">
                ⚠️ De AI-beoordeling kon niet worden uitgevoerd.
                <br><br>
                Controleer of de OpenAI API is ingesteld in Supabase.
            </div>
        `;

        showNextButton();
    }
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function showNextButton() {

    const actions =
        document.querySelector(".quiz-actions");

    actions.innerHTML = `
        <button
            class="btn btn-primary"
            onclick="nextQuestion()">
            ${quizIndex + 1 >= quizItems.length
                ? "Bekijk resultaat"
                : "Volgende →"}
        </button>
    `;
}


function nextQuestion() {

    quizIndex++;

    renderQuiz();
}


/* =========================================================
   QUIZ FINISHED
========================================================= */

function renderQuizFinished() {

    document.getElementById("progressBar").style.width =
        "100%";

    const percentage =
        Math.round(
            (quizScore / quizItems.length) * 100
        );

    document.getElementById("quizCard").innerHTML = `

        <div class="score">

            <h1>Klaar! 🎉</h1>

            <div class="score-number">
                ${quizScore}/${quizItems.length}
            </div>

            <p style="font-size:20px;">
                ${percentage}% goed
            </p>

            <br>

            <div class="toolbar" style="justify-content:center;">

                <button
                    class="btn btn-primary"
                    onclick="startQuiz(currentLesson,currentLessonItems)">
                    Opnieuw
                </button>

                <button
                    class="btn btn-secondary"
                    onclick="openLesson(${currentLesson.id})">
                    Terug naar les
                </button>

            </div>

        </div>
    `;
}


function leaveQuiz() {

    if (currentLesson) {
        openLesson(currentLesson.id);
    } else {
        showHome();
    }
}


/* =========================================================
   PARENT LOGIN
========================================================= */

function openParentLogin() {

    showPage("parentLoginPage");

    document.getElementById("loginError")
        .classList.add("hidden");
}


async function loginParent() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const errorBox =
        document.getElementById("loginError");

    errorBox.classList.add("hidden");

    if (!email || !password) {

        errorBox.textContent =
            "Vul je e-mail en wachtwoord in.";

        errorBox.classList.remove("hidden");

        return;
    }

    const { data, error } =
        await db.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        errorBox.textContent =
            "Inloggen mislukt: " + error.message;

        errorBox.classList.remove("hidden");

        return;
    }

    if (!PARENT_IDS.includes(data.user.id)) {

        await db.auth.signOut();

        errorBox.textContent =
            "Dit account heeft geen ouderrechten.";

        errorBox.classList.remove("hidden");

        return;
    }

    openParentDashboard();
}


async function logoutParent() {

    await db.auth.signOut();

    showHome();
}


/* =========================================================
   PARENT DASHBOARD
========================================================= */

async function openParentDashboard() {

    const {
        data: { user }
    } = await db.auth.getUser();

    if (!user || !PARENT_IDS.includes(user.id)) {
        showHome();
        return;
    }

    await loadParentLessons();

    showPage("parentPage");
}


async function loadParentLessons() {

    const grid =
        document.getElementById("parentLessonGrid");

    const { data, error } = await db
        .from("lessons")
        .select("*")
        .order("subject")
        .order("title");

    if (error) {

        grid.innerHTML = `
            <div class="empty">
                Lessen konden niet worden geladen.
            </div>
        `;

        return;
    }

    allLessons = data || [];

    if (!allLessons.length) {

        grid.innerHTML = `
            <div class="empty">
                Nog geen lessen.
            </div>
        `;

        return;
    }

    grid.innerHTML = allLessons.map(lesson => `

        <div class="card lesson-card">

            <div class="lesson-info">

                <span class="badge">
                    ${typeName(lesson.type)}
                </span>

                <h3 style="margin-top:12px;">
                    ${escapeHtml(lesson.title)}
                </h3>

                <p>
                    ${escapeHtml(lesson.subject)}
                </p>

            </div>

            <div class="lesson-actions">

                <button
                    class="btn btn-primary btn-small"
                    onclick="editLesson(${lesson.id})">
                    Bewerken
                </button>

                <button
                    class="btn btn-danger btn-small"
                    onclick="deleteLesson(${lesson.id})">
                    Verwijderen
                </button>

            </div>

        </div>

    `).join("");
}


function backToParent() {
    openParentDashboard();
}


/* =========================================================
   NEW LESSON
========================================================= */

function newLesson() {

    editingLessonId = null;

    document.getElementById("editorTitle").textContent =
        "Nieuwe les";

    document.getElementById("editSubject").value =
        "";

    document.getElementById("editTitle").value =
        "";

    document.getElementById("editType").value =
        "words";

    document.getElementById("itemsEditor").innerHTML =
        "";

    addEditorItem();

    showPage("editorPage");
}


/* =========================================================
   EDIT LESSON
========================================================= */

async function editLesson(id) {

    const lesson =
        allLessons.find(
            x => Number(x.id) === Number(id)
        );

    if (!lesson) return;

    editingLessonId = lesson.id;

    document.getElementById("editorTitle").textContent =
        "Les bewerken";

    document.getElementById("editSubject").value =
        lesson.subject || "";

    document.getElementById("editTitle").value =
        lesson.title || "";

    document.getElementById("editType").value =
        lesson.type || "words";

    const { data, error } = await db
        .from("lesson_items")
        .select("*")
        .eq("lesson_id", lesson.id)
        .order("sort_order")
        .order("id");

    if (error) {

        alert("Vragen konden niet worden geladen.");
        return;
    }

    const container =
        document.getElementById("itemsEditor");

    container.innerHTML = "";

    (data || []).forEach(item => {
        addEditorItem(
            item.question || "",
            item.answer || "",
            item.id
        );
    });

    if (!data || !data.length) {
        addEditorItem();
    }

    showPage("editorPage");
}


/* =========================================================
   ADD EDITOR ITEM
========================================================= */

function addEditorItem(
    question = "",
    answer = "",
    itemId = ""
) {

    const container =
        document.getElementById("itemsEditor");

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "item-editor";

    wrapper.dataset.itemId =
        itemId;

    wrapper.innerHTML = `

        <div class="item-editor-header">

            <div class="item-number">
                Vraag
            </div>

            <button
                class="btn btn-danger btn-small"
                onclick="this.closest('.item-editor').remove()">
                Verwijderen
            </button>

        </div>

        <div class="form-group">

            <label>Vraag / woord</label>

            <textarea
                class="editor-question"
                placeholder="Bijvoorbeeld: Wat betekent idool?">${escapeHtml(question)}</textarea>

        </div>

        <div class="form-group">

            <label>Juiste antwoord / definitie</label>

            <textarea
                class="editor-answer"
                placeholder="Bijvoorbeeld: iemand die je geweldig vindt">${escapeHtml(answer)}</textarea>

        </div>
    `;

    container.appendChild(wrapper);

    renumberEditorItems();
}


function renumberEditorItems() {

    document
        .querySelectorAll(".item-editor")
        .forEach((item, index) => {

            const label =
                item.querySelector(".item-number");

            label.textContent =
                "Vraag " + (index + 1);
        });
}


/* =========================================================
   SAVE LESSON
========================================================= */

async function saveLesson() {

    const subject =
        document.getElementById("editSubject")
            .value.trim();

    const title =
        document.getElementById("editTitle")
            .value.trim();

    const type =
        document.getElementById("editType")
            .value;

    const message =
        document.getElementById("saveMessage");

    message.innerHTML = "";

    if (!subject || !title) {

        message.innerHTML = `
            <div class="result incorrect">
                Vul het vak en de naam van de les in.
            </div>
        `;

        return;
    }

    const editors =
        [...document.querySelectorAll(".item-editor")];

    const items =
        editors.map((editor, index) => {

            return {
                id: editor.dataset.itemId || null,

                question:
                    editor.querySelector(".editor-question")
                        .value.trim(),

                answer:
                    editor.querySelector(".editor-answer")
                        .value.trim(),

                sort_order:
                    index
            };

        }).filter(item =>
            item.question || item.answer
        );


    /* -----------------------------------------
       CREATE LESSON
    ----------------------------------------- */

    if (!editingLessonId) {

        const { data, error } =
            await db
                .from("lessons")
                .insert({
                    subject,
                    title,
                    type
                })
                .select()
                .single();

        if (error) {

            console.error(error);

            message.innerHTML = `
                <div class="result incorrect">
                    Les kon niet worden opgeslagen.
                </div>
            `;

            return;
        }

        editingLessonId =
            data.id;

    } else {

        /* -----------------------------------------
           UPDATE LESSON
        ----------------------------------------- */

        const { error } =
            await db
                .from("lessons")
                .update({
                    subject,
                    title,
                    type
                })
                .eq("id", editingLessonId);

        if (error) {

            console.error(error);

            message.innerHTML = `
                <div class="result incorrect">
                    Les kon niet worden bijgewerkt.
                </div>
            `;

            return;
        }
    }


    /* -----------------------------------------
       SAVE ITEMS
    ----------------------------------------- */

    const existing =
        await db
            .from("lesson_items")
            .select("id")
            .eq("lesson_id", editingLessonId);

    if (existing.error) {

        console.error(existing.error);

        message.innerHTML = `
            <div class="result incorrect">
                Vragen konden niet worden opgeslagen.
            </div>
        `;

        return;
    }

    const existingIds =
        (existing.data || []).map(x => String(x.id));

    const keepIds =
        items
            .filter(x => x.id)
            .map(x => String(x.id));


    /* Delete removed items */

    const deleteIds =
        existingIds.filter(
            id => !keepIds.includes(id)
        );

    if (deleteIds.length) {

        const { error } =
            await db
                .from("lesson_items")
                .delete()
                .in("id", deleteIds);

        if (error) {
            console.error(error);
        }
    }


    /* Update existing items */

    for (const item of items) {

        if (item.id) {

            const { error } =
                await db
                    .from("lesson_items")
                    .update({
                        question: item.question,
                        answer: item.answer,
                        sort_order: item.sort_order
                    })
                    .eq("id", item.id);

            if (error) {
                console.error(error);
            }

        } else {

            const { error } =
                await db
                    .from("lesson_items")
                    .insert({
                        lesson_id: editingLessonId,
                        question: item.question,
                        answer: item.answer,
                        sort_order: item.sort_order
                    });

            if (error) {
                console.error(error);
            }
        }
    }


    message.innerHTML = `
        <div class="result correct">
            ✅ Les opgeslagen!
        </div>
    `;

    await loadParentLessons();

    setTimeout(() => {
        openParentDashboard();
    }, 700);
}


/* =========================================================
   DELETE LESSON
========================================================= */

async function deleteLesson(id) {

    const lesson =
        allLessons.find(
            x => Number(x.id) === Number(id)
        );

    if (!lesson) return;

    const confirmed =
        confirm(
            `Weet je zeker dat je "${lesson.title}" wilt verwijderen?`
        );

    if (!confirmed) return;


    /* Delete items first */

    const { error: itemError } =
        await db
            .from("lesson_items")
            .delete()
            .eq("lesson_id", id);

    if (itemError) {

        alert(
            "De vragen konden niet worden verwijderd."
        );

        console.error(itemError);

        return;
    }


    /* Delete lesson */

    const { error } =
        await db
            .from("lessons")
            .delete()
            .eq("id", id);

    if (error) {

        alert(
            "De les kon niet worden verwijderd."
        );

        console.error(error);

        return;
    }

    await loadParentLessons();
}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkExistingSession() {

    const {
        data: { session }
    } = await db.auth.getSession();

    if (
        session &&
        session.user &&
        PARENT_IDS.includes(session.user.id)
    ) {
        document.getElementById("parentButton")
            .textContent = "👨‍👩‍👦 Ouderbeheer";

    } else {

        document.getElementById("parentButton")
            .textContent = "👨‍👩‍👦 Ouder";
    }
}


/* =========================================================
   PARENT BUTTON
========================================================= */

document
    .getElementById("parentButton")
    .addEventListener("click", async function() {

        const {
            data: { session }
        } = await db.auth.getSession();

        if (
            session &&
            session.user &&
            PARENT_IDS.includes(session.user.id)
        ) {

        } else {
            openParentLogin();
        }

    });


/* =========================================================
   START
========================================================= */

async function init() {

    await checkExistingSession();

    await loadHome();
}

init();
