<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacoGo!</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f7ff;
  color:#24324a
}

header{
  background:linear-gradient(135deg,#5b5ce2,#7467f0);
  color:white;
  padding:28px 22px 32px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px rgba(77,78,180,.18)
}

header h1{
  max-width:1000px;
  margin:auto;
  font-size:32px;
  font-weight:850;
  letter-spacing:-1px
}

.container{
  max-width:1000px;
  margin:30px auto 60px;
  padding:0 22px
}

h2{
  font-size:28px;
  margin:0 0 8px;
  font-weight:800
}

h3{
  font-size:21px;
  font-weight:800
}

.card{
  background:white;
  border:0;
  border-radius:24px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 8px 30px rgba(50,70,110,.09)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px
}

.big-button{
  width:100%;
  min-height:145px;
  padding:25px;
  border-radius:24px;
  border:0;
  font-size:22px;
  font-weight:850;
  color:white;
  background:linear-gradient(135deg,#5b5ce2,#7c6cf2);
  box-shadow:0 8px 0 #4546b5;
  transition:transform .15s ease,box-shadow .15s ease
}

.big-button:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 0 #4546b5
}

.big-button:active{
  transform:translateY(3px);
  box-shadow:0 5px 0 #4546b5
}

.lesson-button{
  display:flex;
  align-items:center;
  gap:16px;
  min-height:88px;
  width:100%;
  padding:16px 20px;
  margin-bottom:14px;
  text-align:left;
  border:0;
  border-radius:22px;
  background:linear-gradient(135deg,#8b8ff7,#a9a7ff);
  color:white;
  box-shadow:0 6px 0 #7477d9,0 10px 22px rgba(80,80,180,.10);
  transition:transform .15s ease,box-shadow .15s ease
}

.lesson-button:hover{
  transform:translateX(5px);
  box-shadow:0 9px 0 #7477d9,0 14px 25px rgba(80,80,180,.14)
}

.lesson-button:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 #7477d9
}

.lesson-icon{
  width:50px;
  height:50px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:rgba(255,255,255,.22);
  font-size:27px
}

.lesson-info{
  flex:1
}

.lesson-title{
  display:block;
  font-size:18px;
  font-weight:800;
  line-height:1.25
}

.lesson-count{
  display:block;
  margin-top:5px;
  color:rgba(255,255,255,.82);
  font-size:14px;
  font-weight:600
}

.lesson-arrow{
  font-size:34px;
  font-weight:300;
  color:rgba(255,255,255,.8)
}

button{
  border:0;
  border-radius:14px;
  padding:13px 19px;
  font-size:15px;
  font-weight:750;
  cursor:pointer;
  background:#5b5ce2;
  color:white;
  transition:transform .15s ease,opacity .15s ease
}

button:hover{
  opacity:.95;
  transform:translateY(-2px)
}

button.secondary{
  background:#e9edfa;
  color:#34415a
}

button.green{
  background:#20c997
}

button.danger{
  background:#f05b6f
}

input,textarea,select{
  width:100%;
  padding:14px 15px;
  border:2px solid #e3e8f5;
  border-radius:13px;
  font-size:16px;
  background:white;
  color:#24324a;
  font-family:inherit;
  margin-top:6px;
  margin-bottom:16px
}

input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:#7467f0;
  box-shadow:0 0 0 4px rgba(116,103,240,.12)
}

textarea{
  min-height:90px;
  resize:vertical
}

label{
  font-weight:750;
  color:#34415a
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap
}

.row>*{
  flex:1
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:22px
}

.hidden{
  display:none!important
}

.word{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  align-items:center;
  margin-bottom:12px
}

.question-card{
  background:#f8f9ff;
  border:2px solid #e5e9f6;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  white-space:pre-line
}

.quiz-question{
  font-size:36px;
  line-height:1.3;
  font-weight:850;
  text-align:center;
  color:#24324a;
  background:linear-gradient(135deg,#fff,#f7f8ff);
  border-radius:28px;
  padding:50px 35px;
  margin:30px 0 22px;
  border:3px solid #e4e7ff;
  box-shadow:0 10px 0 #dfe3f7,0 15px 30px rgba(50,70,110,.10);
  white-space:pre-line
}

.quiz-answer{
  font-size:24px;
  line-height:1.5;
  text-align:center;
  padding:28px;
  margin:20px 0;
  background:linear-gradient(135deg,#f3f1ff,#eef7ff);
  color:#24324a;
  border-radius:22px;
  border:2px solid #e2e4ff;
  box-shadow:0 6px 18px rgba(50,70,110,.06);
  white-space:pre-line
}

.score{
  font-size:28px;
  font-weight:850;
  text-align:center
}

.small{
  color:#718096;
  font-size:14px
}

.error{
  background:#fff0f1;
  color:#c53045;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:16px
}

.success{
  background:#e9fbf4;
  color:#087f5b;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:16px
}

.subject-blue{
  background:linear-gradient(135deg,#3b82f6,#60a5fa)
}

.subject-purple{
  background:linear-gradient(135deg,#8b5cf6,#a78bfa)
}

.subject-green{
  background:linear-gradient(135deg,#10b981,#34d399)
}

.subject-orange{
  background:linear-gradient(135deg,#f97316,#fb923c)
}

.subject-pink{
  background:linear-gradient(135deg,#ec4899,#f472b6)
}

.subject-cyan{
  background:linear-gradient(135deg,#06b6d4,#22d3ee)
}

.subject-icon{
  display:block;
  font-size:48px;
  margin-bottom:12px
}

.subject-name{
  display:block;
  font-size:23px;
  font-weight:850
}

.subject-count{
  display:block;
  margin-top:7px;
  font-size:15px;
  font-weight:600;
  opacity:.9
}

#lessonChoice .card{
  text-align:center;
  padding:35px 30px
}

#lessonChoice h2{
  font-size:30px;
  margin-bottom:10px
}

#lessonChoice .small{
  font-size:16px;
  margin-bottom:28px
}

#lessonChoice .row{
  gap:18px
}

#lessonChoice .big-button{
  min-height:135px;
  font-size:20px
}

#lessonChoice .green{
  background:linear-gradient(135deg,#10b981,#34d399);
  box-shadow:0 7px 0 #087f5b
}

/* QUIZ / TOETS - rustige invoerlayout */
.quiz-action{
  display:flex;
  justify-content:center;
  margin:8px 0 18px
}

.quiz-listen-button{
  width:auto;
  min-height:0;
  padding:8px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  box-shadow:none;
}

.quiz-input-wrap{
  margin:18px 0 14px;
}

.quiz-input-label{
  display:block;
  text-align:left;
  margin:0 0 8px;
  font-size:15px;
  font-weight:800;
  color:#34415a
}

#quizContent #quizInput{
  width:100%;
  min-height:72px;
  margin:0 0 14px;
  padding:18px 20px;
  border:3px solid #bfc7e8;
  border-radius:18px;
  background:#fff;
  font-size:24px;
  font-weight:650;
  text-align:center;
  box-shadow:0 5px 16px rgba(50,70,110,.07);
}

#quizContent #quizInput::placeholder{
  color:#9aa5bd;
  font-weight:550;
}

#quizContent #quizInput:focus{
  border-color:#7467f0;
  box-shadow:0 0 0 5px rgba(116,103,240,.12),0 6px 18px rgba(50,70,110,.08);
}

.quiz-submit{
  display:block;
  width:auto;
  min-height:0;
  margin:0 auto;
  padding:12px 26px;
  border-radius:14px;
  font-size:16px;
  box-shadow:0 4px 0 #4546b5;
}

.quiz-submit:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 0 #4546b5
}

.quiz-submit:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #4546b5
}

#quizContent textarea#quizInput{
  min-height:150px;
  text-align:left;
  line-height:1.45;
  resize:vertical;
}

#quizContent .quiz-result{
  margin-top:16px;
}

@media(max-width:600px){
  #quizContent #quizInput{
    min-height:66px;
    font-size:21px;
  }

  #quizContent textarea#quizInput{
    min-height:130px;
  }
}

.dictation-sound{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin:10px 0 20px
}

.dictation-word{
  font-size:20px;
  font-weight:800;
  text-align:center;
  padding:18px;
  background:#f8f9ff;
  border-radius:18px;
  margin-bottom:18px
}

.quiz-progress-bar{
  height:12px;
  background:#e7eaf5;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0 20px
}

.quiz-progress-fill{
  height:100%;
  background:linear-gradient(90deg,#5b5ce2,#20c997);
  transition:width .3s ease
}

@media(max-width:600px){
  header{
    padding:23px 18px 27px;
    border-radius:0 0 24px 24px
  }

  header h1{
    font-size:26px
  }

  .container{
    margin-top:22px;
    padding:0 15px
  }

  .card{
    padding:20px;
    border-radius:20px
  }

  .big-button{
    min-height:115px;
    font-size:19px
  }

  .quiz-question{
    font-size:27px
  }

  .word{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 PacoGO!</h1>
</header>

<div class="container">

<div id="message"></div>

<!-- LOGIN -->

<section id="login" class="hidden">
  <div class="card">

    <h2>🔐 Ouder login</h2>

    <p class="small">
      Log in om lessen te maken en te bewerken.
    </p>

    <label>E-mailadres</label>
    <input
      id="loginEmail"
      type="email"
      autocomplete="email"
      placeholder="Jouw e-mailadres"
    >

    <label>Wachtwoord</label>
    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Wachtwoord"
    >

    <div id="loginError" class="error hidden"></div>

    <div class="row">
      <button onclick="loginParent()">Inloggen</button>
      <button class="secondary" onclick="showHome()">Annuleren</button>
    </div>

  </div>
</section>

<!-- HOME -->

<section id="home">

  <div class="topbar">

    <h2>Vakken</h2>

    <div class="row">

      <button
        id="loginButton"
        class="secondary"
        onclick="showLogin()"
      >
        🔐 Ouder login
      </button>

      <button
        id="logoutButton"
        class="secondary hidden"
        onclick="logoutParent()"
      >
        🚪 Uitloggen
      </button>

      <button
        id="addLessonButton"
        class="hidden"
        onclick="showAddLesson()"
      >
        ➕ Nieuwe les
      </button>

    </div>

  </div>

  <div id="subjects" class="grid"></div>

</section>

<!-- LESSON LIST -->

<section id="lessonList" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="showHome()">
      ← Terug
    </button>

    <button
      id="addLessonButton2"
      class="hidden"
      onclick="showAddLesson(currentSubject)"
    >
      ➕ Nieuwe les
    </button>

  </div>

  <h2 id="subjectTitle"></h2>

  <div id="lessons"></div>

</section>

<!-- LESSON EDITOR -->

<section id="lessonEditor" class="hidden">

  <div class="topbar">
    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>
  </div>

  <div class="card">

    <h2 id="editorTitle">Nieuwe les</h2>

    <label>Vak</label>

    <input
      id="subjectInput"
      placeholder="Bijvoorbeeld 🇬🇧 Engels"
    >

    <label>Naam van de les</label>

    <input
      id="titleInput"
      placeholder="Bijvoorbeeld Les 3 – Dieren"
    >

    <label>Type les</label>

    <select
      id="typeInput"
      onchange="changeLessonType()"
    >
      <option value="words">🎯 Woordtrainer</option>
      <option value="questions">❓ Vragen</option>
      <option value="dictation">✏️ Dictee</option>
    </select>

    <!-- WOORDTRAINER -->

    <div id="wordsEditor">

      <h3>Woorden</h3>

      <div id="wordRows"></div>

      <button
        class="secondary"
        onclick="addWordRow()"
      >
        ➕ Woord toevoegen
      </button>

    </div>

    <!-- VRAGEN -->

    <div id="questionsEditor" class="hidden">

      <h3>Vragen</h3>

      <div id="questionRows"></div>

      <button
        class="secondary"
        onclick="addQuestionRow()"
      >
        ➕ Vraag toevoegen
      </button>

    </div>

    <!-- DICTEE -->

    <div id="dictationEditor" class="hidden">

      <h3>Dicteewoorden</h3>

      <p class="small">
        Bij dictee wordt het woord uitgesproken.
        De leerling hoort het woord en typt daarna de spelling.
      </p>

      <div id="dictationRows"></div>

      <button
        class="secondary"
        onclick="addDictationRow()"
      >
        ➕ Woord toevoegen
      </button>

    </div>

    <br><br>

    <button onclick="saveLesson()">
      💾 Opslaan
    </button>

  </div>

</section>

<!-- LESSON CHOICE -->

<section id="lessonChoice" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>

  </div>

  <div class="card">

    <h2 id="choiceTitle"></h2>

    <p class="small">
      Wil je de les eerst bekijken of jezelf meteen overhoren?
    </p>

    <div class="row">

      <button
        class="big-button"
        onclick="showLesson()"
      >
        📖 Les bekijken
      </button>

      <button
        class="green big-button"
        onclick="startQuiz('practice')"
      >
        🎯 Overhoren
      </button>

      <button
        class="big-button"
        onclick="startQuiz('test')"
      >
        📝 Toets
      </button>

    </div>

  </div>

</section>

<!-- LESSON VIEW -->

<section id="lessonView" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>

    <div>

      <button
        id="editLessonButton"
        class="hidden"
        onclick="editCurrentLesson()"
      >
        ✏️ Bewerken
      </button>

      <button
        id="deleteLessonButton"
        class="danger hidden"
        onclick="deleteCurrentLesson()"
      >
        🗑️ Verwijderen
      </button>

    </div>

  </div>

  <div class="card">

    <h2 id="viewTitle"></h2>

    <p id="viewInfo" class="small"></p>

    <div id="viewItems"></div>

    <br>

    <button
      class="green big-button"
      onclick="startQuiz('practice')"
    >
      ▶️ Overhoren
    </button>

  </div>

</section>

<!-- QUIZ -->

<section id="quiz" class="hidden">

  <div class="topbar">

    <button
      class="secondary"
      onclick="showLesson()"
    >
      ← Stoppen
    </button>

  </div>

  <div class="card">

    <div id="quizProgress" class="small"></div>

    <div class="quiz-progress-bar">
      <div
        id="quizProgressFill"
        class="quiz-progress-fill"
        style="width:0%"
      ></div>
    </div>

    <div id="quizContent"></div>

  </div>

</section>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ncpkqrvxljxwboavxtak.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skiKpO4UU79zWY7hskHsoA_WQxA6CFc";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   PARENT ACCOUNTS
========================================================= */

const PARENT_IDS = new Set([
  "5d0e1e5c-1dbe-4909-bd3a-81a1e7b26d09",
  "418833d5-049a-4ec9-8072-2d48a85f04b1"
]);


/* =========================================================
   STATE
========================================================= */

let currentSession = null;

let allLessons = [];

let currentSubject = "";

let currentLesson = null;

let editingLessonId = null;

let quizItems = [];

let quizQueue = [];

let quizIndex = 0;

let quizScore = 0;

let quizAnswered = false;

let quizWrongCount = 0;

let quizMode = "practice";

let quizTotal = 0;

let quizAttempts = 0;


/* =========================================================
   AUTH
========================================================= */

function isParentLoggedIn(){
  return !!currentSession &&
    PARENT_IDS.has(currentSession.user.id);
}


function updateAuthUI(session){

  currentSession = session;

  const loggedIn =
    isParentLoggedIn();

  document
    .getElementById("loginButton")
    ?.classList
    .toggle("hidden",loggedIn);

  document
    .getElementById("logoutButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("addLessonButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("addLessonButton2")
    ?.classList
    .toggle("hidden",!loggedIn);
}


function showMessage(msg,type){

  const msgEl =
    document.getElementById("message");

  msgEl.textContent = msg;

  msgEl.className = type;

  setTimeout(()=>{
    msgEl.textContent = "";
    msgEl.className = "";
  },4000);
}


async function loginParent(){

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  if(!email||!password){
    showMessage(
      "Vul e-mailadres en wachtwoord in",
      "error"
    );
    return;
  }

  const{data,error}=
    await db.auth.signInWithPassword({email,password});

  if(error){
    document
      .getElementById("loginError")
      .classList
      .remove("hidden");
    document
      .getElementById("loginError")
      .textContent = "Login mislukt. Controleer je gegevens.";
    return;
  }

  updateAuthUI(data.session);

  showMessage("Succesvol ingelogd!","success");

  setTimeout(()=>showHome(),1000);
}


async function logoutParent(){

  await db.auth.signOut();

  currentSession = null;

  updateAuthUI(null);

  showMessage("Uitgelogd","success");
}


async function checkAuth(){

  const{data}=
    await db.auth.getSession();

  if(data.session){
    updateAuthUI(data.session);
  }
}


/* =========================================================
   NAVIGATION
========================================================= */

function showHome(){

  document.getElementById("home").classList.remove("hidden");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("lessonList").classList.add("hidden");
  document.getElementById("lessonEditor").classList.add("hidden");
  document.getElementById("lessonChoice").classList.add("hidden");
  document.getElementById("lessonView").classList.add("hidden");
  document.getElementById("quiz").classList.add("hidden");

  loadSubjects();
}


function showLogin(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}


function showAddLesson(subject){

  editingLessonId = null;

  currentSubject = subject||"";

  document.getElementById("subjectInput").value = currentSubject;

  document.getElementById("titleInput").value = "";

  document.getElementById("typeInput").value = "words";

  changeLessonType();

  clearWordRows();
  clearQuestionRows();
  clearDictationRows();

  document.getElementById("editorTitle").textContent = "Nieuwe les";

  document.getElementById("home").classList.add("hidden");
  document.getElementById("lessonList").classList.add("hidden");
  document.getElementById("lessonEditor").classList.remove("hidden");
}


function goBack(){

  if(editingLessonId||currentLesson){
    showHome();
  }else if(currentSubject){
    showSubject(currentSubject);
  }else{
    showHome();
  }
}


/* =========================================================
   SUBJECTS
========================================================= */

async function loadSubjects(){

  const{data,error}=
    await db
      .from("lessons")
      .select("subject")
      .eq("public",true);

  if(error){
    console.error("Error loading subjects:",error);
    return;
  }

  const subjectSet = new Set(
    data.map(l=>l.subject)
  );

  const subjects = Array.from(subjectSet);

  const colors = [
    "subject-blue",
    "subject-purple",
    "subject-green",
    "subject-orange",
    "subject-pink",
    "subject-cyan"
  ];

  const html = subjects
    .map((s,i)=>{

      const lessons = data.filter(
        l=>l.subject===s
      );

      const color = colors[i%colors.length];

      return `
        <div class="card ${color}" style="color:white;cursor:pointer;padding:30px;text-align:center" onclick="showSubject('${s.replace(/'/g,"\\'")}')">
          <span class="subject-icon">📚</span>
          <span class="subject-name">${s}</span>
          <span class="subject-count">${lessons.length} ${lessons.length===1?"les":"lessen"}</span>
        </div>
      `;

    })
    .join("");

  document.getElementById("subjects").innerHTML = html;
}


async function showSubject(subject){

  currentSubject = subject;

  const{data,error}=
    await db
      .from("lessons")
      .select()
      .eq("subject",subject)
      .eq("public",true)
      .order("created_at",{ascending:false});

  if(error){
    console.error("Error loading lessons:",error);
    return;
  }

  allLessons = data;

  document.getElementById("subjectTitle").textContent = subject;

  const html = data
    .map(lesson=>{

      const type = lesson.type==="words"?"🎯 Woordtrainer":lesson.type==="questions"?"❓ Vragen":"✏️ Dictee";

      return `
        <button class="lesson-button" onclick="selectLesson('${lesson.id.replace(/'/g,"\\'")}')">
          <span class="lesson-icon">${lesson.icon||"📖"}</span>
          <span class="lesson-info">
            <span class="lesson-title">${lesson.title}</span>
            <span class="lesson-count">${type}</span>
          </span>
          <span class="lesson-arrow">›</span>
        </button>
      `;

    })
    .join("");

  document.getElementById("lessons").innerHTML = html;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("lessonList").classList.remove("hidden");
}


/* =========================================================
   LESSONS
========================================================= */

function selectLesson(lessonId){

  const lesson = allLessons.find(l=>l.id===lessonId);

  if(!lesson){return;}

  currentLesson = lesson;

  document.getElementById("choiceTitle").textContent = lesson.title;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("lessonList").classList.add("hidden");
  document.getElementById("lessonChoice").classList.remove("hidden");

  if(isParentLoggedIn()){
    document.getElementById("editLessonButton").classList.remove("hidden");
    document.getElementById("deleteLessonButton").classList.remove("hidden");
  }
}


function editCurrentLesson(){

  if(!currentLesson){return;}

  editingLessonId = currentLesson.id;

  const lesson = currentLesson;

  document.getElementById("editorTitle").textContent = "Les bewerken";

  document.getElementById("subjectInput").value = lesson.subject||"";

  document.getElementById("titleInput").value = lesson.title||"";

  document.getElementById("typeInput").value = lesson.type||"words";

  changeLessonType();

  clearWordRows();
  clearQuestionRows();
  clearDictationRows();

  if(lesson.type==="words"&&lesson.content?.words){
    lesson.content.words.forEach(word=>{
      addWordRow();
      const rows = document.querySelectorAll("#wordRows .word");
      const lastRow = rows[rows.length-1];
      const inputs = lastRow.querySelectorAll("input");
      inputs[0].value = word.word||"";
      inputs[1].value = word.translation||"";
    });
  }

  if(lesson.type==="questions"&&lesson.content?.questions){
    lesson.content.questions.forEach(q=>{
      addQuestionRow();
      const rows = document.querySelectorAll("#questionRows .question-card");
      const lastRow = rows[rows.length-1];
      const inputs = lastRow.querySelectorAll("input");
      inputs[0].value = q.question||"";
      inputs[1].value = q.answer||"";
    });
  }

  if(lesson.type==="dictation"&&lesson.content?.dictation){
    lesson.content.dictation.forEach(w=>{
      addDictationRow();
      const rows = document.querySelectorAll("#dictationRows .dictation-word");
      const lastRow = rows[rows.length-1];
      const inputs = lastRow.querySelectorAll("input");
      inputs[0].value = w.word||"";
    });
  }

  document.getElementById("lessonChoice").classList.add("hidden");
  document.getElementById("lessonEditor").classList.remove("hidden");
}


async function deleteCurrentLesson(){

  if(!currentLesson){return;}

  if(!confirm("Ben je zeker dat je deze les wil verwijderen?")){
    return;
  }

  const{error}=
    await db
      .from("lessons")
      .delete()
      .eq("id",currentLesson.id);

  if(error){
    console.error("Error deleting lesson:",error);
    showMessage("Fout bij verwijderen","error");
    return;
  }

  showMessage("Les verwijderd","success");

  setTimeout(()=>showHome(),1000);
}


function changeLessonType(){

  const type =
    document.getElementById("typeInput").value;

  document
    .getElementById("wordsEditor")
    .classList
    .toggle("hidden",type!=="words");

  document
    .getElementById("questionsEditor")
    .classList
    .toggle("hidden",type!=="questions");

  document
    .getElementById("dictationEditor")
    .classList
    .toggle("hidden",type!=="dictation");
}


function addWordRow(){

  const row = document.createElement("div");

  row.className = "word";

  row.innerHTML = `
    <input type="text" placeholder="Woord (bv. gato)">
    <input type="text" placeholder="Vertaling (bv. kat)">
    <button class="secondary" onclick="this.parentElement.remove()" style="width:auto;padding:10px 14px">✕</button>
  `;

  document.getElementById("wordRows").appendChild(row);
}


function addQuestionRow(){

  const card = document.createElement("div");

  card.className = "question-card";

  card.innerHTML = `
    <input type="text" placeholder="Vraag" style="margin:0 0 12px 0">
    <input type="text" placeholder="Antwoord" style="margin:0 0 12px 0">
    <button class="secondary" onclick="this.parentElement.remove()" style="width:100%;padding:10px">Verwijderen</button>
  `;

  document.getElementById("questionRows").appendChild(card);
}


function addDictationRow(){

  const item = document.createElement("div");

  item.className = "dictation-word";

  item.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center">
      <input type="text" placeholder="Woord (bv. chocolade)" style="margin:0;flex:1">
      <button class="secondary" onclick="this.parentElement.parentElement.remove()" style="width:auto;padding:10px 14px">✕</button>
    </div>
  `;

  document.getElementById("dictationRows").appendChild(item);
}


function clearWordRows(){
  document.getElementById("wordRows").innerHTML = "";
}

function clearQuestionRows(){
  document.getElementById("questionRows").innerHTML = "";
}

function clearDictationRows(){
  document.getElementById("dictationRows").innerHTML = "";
}


async function saveLesson(){

  const subject = document.getElementById("subjectInput").value.trim();
  const title = document.getElementById("titleInput").value.trim();
  const type = document.getElementById("typeInput").value;

  if(!subject||!title){
    showMessage("Vul vak en lestitel in","error");
    return;
  }

  let content = {};

  if(type==="words"){

    const wordRows = document.querySelectorAll("#wordRows .word");

    if(wordRows.length===0){
      showMessage("Voeg minstens één woord toe","error");
      return;
    }

    content.words = Array.from(wordRows).map(row=>{
      const inputs = row.querySelectorAll("input");
      return{
        word:inputs[0].value.trim(),
        translation:inputs[1].value.trim()
      };
    }).filter(w=>w.word&&w.translation);
  }

  else if(type==="questions"){

    const questionRows = document.querySelectorAll("#questionRows .question-card");

    if(questionRows.length===0){
      showMessage("Voeg minstens één vraag toe","error");
      return;
    }

    content.questions = Array.from(questionRows).map(row=>{
      const inputs = row.querySelectorAll("input");
      return{
        question:inputs[0].value.trim(),
        answer:inputs[1].value.trim()
      };
    }).filter(q=>q.question&&q.answer);
  }

  else if(type==="dictation"){

    const dictationRows = document.querySelectorAll("#dictationRows .dictation-word");

    if(dictationRows.length===0){
      showMessage("Voeg minstens één woord toe","error");
      return;
    }

    content.dictation = Array.from(dictationRows).map(row=>{
      const input = row.querySelector("input");
      return{
        word:input.value.trim()
      };
    }).filter(w=>w.word);
  }

  const lessonData = {
    subject,
    title,
    type,
    content,
    icon:"📖",
    public:true
  };

  if(editingLessonId){

    const{error}=
      await db
        .from("lessons")
        .update(lessonData)
        .eq("id",editingLessonId);

    if(error){
      console.error("Error updating lesson:",error);
      showMessage("Fout bij opslaan","error");
      return;
    }

    showMessage("Les bijgewerkt","success");

  }else{

    const{error}=
      await db
        .from("lessons")
        .insert([lessonData]);

    if(error){
      console.error("Error creating lesson:",error);
      showMessage("Fout bij opslaan","error");
      return;
    }

    showMessage("Les opgeslagen","success");
  }

  setTimeout(()=>showHome(),1000);
}


/* =========================================================
   LESSON VIEW
========================================================= */

function showLesson(){

  if(!currentLesson){return;}

  const lesson = currentLesson;

  document.getElementById("viewTitle").textContent = lesson.title;

  const type = lesson.type==="words"?"Woordtrainer":lesson.type==="questions"?"Vragen":"Dictee";

  document.getElementById("viewInfo").textContent = `Type: ${type}`;

  let html = "";

  if(lesson.type==="words"&&lesson.content?.words){

    html = lesson.content.words
      .map(w=>`
        <div class="question-card">
          <strong>${w.word}</strong><br>
          ${w.translation}
        </div>
      `)
      .join("");

  }else if(lesson.type==="questions"&&lesson.content?.questions){

    html = lesson.content.questions
      .map(q=>`
        <div class="question-card">
          <strong>${q.question}</strong><br>
          ${q.answer}
        </div>
      `)
      .join("");

  }else if(lesson.type==="dictation"&&lesson.content?.dictation){

    html = lesson.content.dictation
      .map(w=>`
        <div class="dictation-word">${w.word}</div>
      `)
      .join("");
  }

  document.getElementById("viewItems").innerHTML = html;

  document.getElementById("lessonChoice").classList.add("hidden");
  document.getElementById("lessonView").classList.remove("hidden");
}


/* =========================================================
   QUIZ
========================================================= */

function startQuiz(mode){

  if(!currentLesson){return;}

  quizMode = mode;

  const lesson = currentLesson;

  quizItems = [];

  if(lesson.type==="words"&&lesson.content?.words){
    quizItems = lesson.content.words.map((w,i)=>({
      id:i,
      question:w.word,
      answer:w.translation.toLowerCase().trim(),
      type:"translation"
    }));
  }else if(lesson.type==="questions"&&lesson.content?.questions){
    quizItems = lesson.content.questions.map((q,i)=>({
      id:i,
      question:q.question,
      answer:q.answer.toLowerCase().trim(),
      type:"question"
    }));
  }else if(lesson.type==="dictation"&&lesson.content?.dictation){
    quizItems = lesson.content.dictation.map((w,i)=>({
      id:i,
      word:w.word,
      type:"dictation"
    }));
  }

  quizQueue = [...quizItems];

  if(quizMode==="practice"){
    for(let i=quizQueue.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [quizQueue[i],quizQueue[j]] = [quizQueue[j],quizQueue[i]];
    }
  }

  quizIndex = 0;
  quizScore = 0;
  quizWrongCount = 0;
  quizAnswered = false;
  quizTotal = quizQueue.length;
  quizAttempts = 0;

  document.getElementById("lessonChoice").classList.add("hidden");
  document.getElementById("lessonView").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  renderQuiz();
}


function renderQuiz(){

  if(quizIndex>=quizQueue.length){
    showQuizResult();
    return;
  }

  const item = quizQueue[quizIndex];

  const progress = `Vraag ${quizIndex+1} van ${quizTotal}`;

  document.getElementById("quizProgress").textContent = progress;

  document.getElementById("quizProgressFill").style.width = ((quizIndex/quizTotal)*100)+"%";

  let html = "";

  if(item.type==="translation"||item.type==="question"){

    html = `
      <div class="quiz-question">${item.question}</div>
      <div class="quiz-input-wrap">
        <label class="quiz-input-label">Jouw antwoord:</label>
        <textarea id="quizInput" placeholder="Typ je antwoord hier..." onkeypress="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();checkAnswer();}"></textarea>
      </div>
      <div style="text-align:center">
        <button class="quiz-submit" onclick="checkAnswer()">✓ Controleer</button>
      </div>
      <div id="quizResult"></div>
    `;

  }else if(item.type==="dictation"){

    html = `
      <div class="dictation-sound">🔊 Luister naar het woord:</div>
      <div style="text-align:center;margin-bottom:20px">
        <button class="quiz-listen-button" onclick="speakDictationWord()">🔊 Woord voorspreeken</button>
      </div>
      <div class="quiz-input-wrap">
        <label class="quiz-input-label">Typ het woord:</label>
        <input id="quizInput" type="text" placeholder="Typ het woord hier..." onkeypress="if(event.key==='Enter'){event.preventDefault();checkAnswer();}">
      </div>
      <div style="text-align:center">
        <button class="quiz-submit" onclick="checkAnswer()">✓ Controleer</button>
      </div>
      <div id="quizResult"></div>
    `;

    setTimeout(()=>speakDictationWord(),500);
  }

  document.getElementById("quizContent").innerHTML = html;

  document.getElementById("quizInput").focus();
}


function speakDictationWord(){

  const item = quizQueue[quizIndex];

  if(item.type!=="dictation"){return;}

  if('speechSynthesis' in window){
    const utterance = new SpeechSynthesisUtterance(item.word);
    utterance.lang = 'nl-NL';
    speechSynthesis.speak(utterance);
  }
}


function checkAnswer(){

  if(quizAnswered){
    nextQuizQuestion();
    return;
  }

  const item = quizQueue[quizIndex];

  const input = document.getElementById("quizInput");

  const userAnswer = input.value.toLowerCase().trim();

  quizAnswered = true;

  quizAttempts++;

  let isCorrect = false;

  if(item.type==="dictation"){
    isCorrect = userAnswer === item.word.toLowerCase().trim();
  }else{
    isCorrect = userAnswer === item.answer;
  }

  if(isCorrect){
    quizScore++;
  }else{
    quizWrongCount++;
  }

  const resultDiv = document.getElementById("quizResult");

  if(isCorrect){

    resultDiv.className = "success";

    resultDiv.innerHTML = `
      <strong>✓ Correct!</strong><br>
      ${item.type==="dictation"?`Het woord is: <strong>${item.word}</strong>`:``}
    `;

  }else{

    resultDiv.className = "error";

    if(item.type==="dictation"){
      resultDiv.innerHTML = `
        <strong>✗ Helaas, niet goed</strong><br>
        Het woord is: <strong>${item.word}</strong><br>
        Jij typte: <strong>${userAnswer||"(leeg)"}</strong>
      `;
    }else{
      resultDiv.innerHTML = `
        <strong>✗ Helaas, niet goed</strong><br>
        Juiste antwoord: <strong>${item.answer}</strong><br>
        Jij typte: <strong>${userAnswer||"(leeg)"}</strong>
      `;
    }
  }

  input.disabled = true;

  setTimeout(()=>{
    document.querySelector(".quiz-submit").textContent = "→ Volgende";
  },500);
}


function nextQuizQuestion(){
  quizIndex++;
  quizAnswered = false;
  renderQuiz();
}


function showQuizResult(){

  const percentage = Math.round((quizScore/quizTotal)*100);

  let message = "";
  let emoji = "";

  if(percentage===100){
    message = "Briljant! Perfect!";
    emoji = "🌟";
  }else if(percentage>=80){
    message = "Geweldig gedaan!";
    emoji = "🎉";
  }else if(percentage>=60){
    message = "Goed werk!";
    emoji = "👏";
  }else if(percentage>=40){
    message = "Niet slecht, maar oefenen kan altijd beter!";
    emoji = "💪";
  }else{
    message = "Nog wat oefenen nodig!";
    emoji = "📚";
  }

  const html = `
    <div style="text-align:center;padding:30px 0">
      <div style="font-size:64px;margin-bottom:20px">${emoji}</div>
      <div class="score">${message}</div>
      <div class="score" style="font-size:48px;color:#5b5ce2;margin:20px 0">${percentage}%</div>
      <div class="small" style="font-size:18px">Je had ${quizScore} van de ${quizTotal} correct!</div>
      <div style="margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="green big-button" onclick="startQuiz('practice')" style="min-height:120px;flex-basis:45%">🔄 Opnieuw oefenen</button>
        <button class="big-button" onclick="showLesson()" style="min-height:120px;flex-basis:45%">📖 Les bekijken</button>
        <button class="secondary big-button" onclick="showHome()" style="min-height:120px;flex-basis:100%;background:linear-gradient(135deg,#5b5ce2,#7c6cf2);color:white;font-size:24px">← Terug naar home</button>
      </div>
    </div>
  `;

  document.getElementById("quizContent").innerHTML = html;

  document.getElementById("quizProgress").innerHTML = "";

  document.getElementById("quizProgressFill").style.width = "100%";
}


/* =========================================================
   INIT
========================================================= */

checkAuth();

showHome();

</script>

</body>
</html>
