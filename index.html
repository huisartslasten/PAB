<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacoGo!</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f7ff;
  color:#24324a
}

header{
  background:linear-gradient(135deg,#5b5ce2,#7467f0);
  color:white;
  padding:28px 22px 32px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px rgba(77,78,180,.18)
}

header h1{
  max-width:1000px;
  margin:auto;
  font-size:32px;
  font-weight:850;
  letter-spacing:-1px
}

.container{
  max-width:1000px;
  margin:30px auto 60px;
  padding:0 22px
}

h2{
  font-size:28px;
  margin:0 0 8px;
  font-weight:800
}

h3{
  font-size:21px;
  font-weight:800
}

.card{
  background:white;
  border:0;
  border-radius:24px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 8px 30px rgba(50,70,110,.09)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px
}

.big-button{
  width:100%;
  min-height:145px;
  padding:25px;
  border-radius:24px;
  border:0;
  font-size:22px;
  font-weight:850;
  color:white;
  background:linear-gradient(135deg,#5b5ce2,#7c6cf2);
  box-shadow:0 8px 0 #4546b5;
  transition:transform .15s ease,box-shadow .15s ease
}

.big-button:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 0 #4546b5
}

.big-button:active{
  transform:translateY(3px);
  box-shadow:0 5px 0 #4546b5
}

.lesson-button{
  display:flex;
  align-items:center;
  gap:16px;
  min-height:88px;
  width:100%;
  padding:16px 20px;
  margin-bottom:14px;
  text-align:left;
  border:0;
  border-radius:22px;
  background:linear-gradient(135deg,#8b8ff7,#a9a7ff);
  color:white;
  box-shadow:0 6px 0 #7477d9,0 10px 22px rgba(80,80,180,.10);
  transition:transform .15s ease,box-shadow .15s ease
}

.lesson-button:hover{
  transform:translateX(5px);
  box-shadow:0 9px 0 #7477d9,0 14px 25px rgba(80,80,180,.14)
}

.lesson-button:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 #7477d9
}

.lesson-icon{
  width:50px;
  height:50px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:rgba(255,255,255,.22);
  font-size:27px
}

.lesson-info{
  flex:1
}

.lesson-title{
  display:block;
  font-size:18px;
  font-weight:800;
  line-height:1.25
}

.lesson-count{
  display:block;
  margin-top:5px;
  color:rgba(255,255,255,.82);
  font-size:14px;
  font-weight:600
}

.lesson-arrow{
  font-size:34px;
  font-weight:300;
  color:rgba(255,255,255,.8)
}

button{
  border:0;
  border-radius:14px;
  padding:13px 19px;
  font-size:15px;
  font-weight:750;
  cursor:pointer;
  background:#5b5ce2;
  color:white;
  transition:transform .15s ease,opacity .15s ease
}

button:hover{
  opacity:.95;
  transform:translateY(-2px)
}

button.secondary{
  background:#e9edfa;
  color:#34415a
}

button.green{
  background:#20c997
}

button.danger{
  background:#f05b6f
}

input,textarea,select{
  width:100%;
  padding:14px 15px;
  border:2px solid #e3e8f5;
  border-radius:13px;
  font-size:16px;
  background:white;
  color:#24324a;
  font-family:inherit;
  margin-top:6px;
  margin-bottom:16px
}

input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:#7467f0;
  box-shadow:0 0 0 4px rgba(116,103,240,.12)
}

textarea{
  min-height:90px;
  resize:vertical
}

label{
  font-weight:750;
  color:#34415a
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap
}

.row>*{
  flex:1
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:22px
}

.hidden{
  display:none!important
}

.word{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  align-items:center;
  margin-bottom:12px
}

.question-card{
  background:#f8f9ff;
  border:2px solid #e5e9f6;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  white-space:pre-line
}

.quiz-question{
  font-size:36px;
  line-height:1.3;
  font-weight:850;
  text-align:center;
  color:#24324a;
  background:linear-gradient(135deg,#fff,#f7f8ff);
  border-radius:28px;
  padding:50px 35px;
  margin:30px 0 22px;
  border:3px solid #e4e7ff;
  box-shadow:0 10px 0 #dfe3f7,0 15px 30px rgba(50,70,110,.10);
  white-space:pre-line
}

.quiz-answer{
  font-size:24px;
  line-height:1.5;
  text-align:center;
  padding:28px;
  margin:20px 0;
  background:linear-gradient(135deg,#f3f1ff,#eef7ff);
  color:#24324a;
  border-radius:22px;
  border:2px solid #e2e4ff;
  box-shadow:0 6px 18px rgba(50,70,110,.06);
  white-space:pre-line
}

.score{
  font-size:28px;
  font-weight:850;
  text-align:center
}

.small{
  color:#718096;
  font-size:14px
}

.error{
  background:#fff0f1;
  color:#c53045;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:16px
}

.success{
  background:#e9fbf4;
  color:#087f5b;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:16px
}

.subject-blue{
  background:linear-gradient(135deg,#3b82f6,#60a5fa)
}

.subject-purple{
  background:linear-gradient(135deg,#8b5cf6,#a78bfa)
}

.subject-green{
  background:linear-gradient(135deg,#10b981,#34d399)
}

.subject-orange{
  background:linear-gradient(135deg,#f97316,#fb923c)
}

.subject-pink{
  background:linear-gradient(135deg,#ec4899,#f472b6)
}

.subject-cyan{
  background:linear-gradient(135deg,#06b6d4,#22d3ee)
}

.subject-icon{
  display:block;
  font-size:48px;
  margin-bottom:12px
}

.subject-name{
  display:block;
  font-size:23px;
  font-weight:850
}

.subject-count{
  display:block;
  margin-top:7px;
  font-size:15px;
  font-weight:600;
  opacity:.9
}

#lessonChoice .card{
  text-align:center;
  padding:35px 30px
}

#lessonChoice h2{
  font-size:30px;
  margin-bottom:10px
}

#lessonChoice .small{
  font-size:16px;
  margin-bottom:28px
}

#lessonChoice .row{
  gap:18px
}

#lessonChoice .big-button{
  min-height:135px;
  font-size:20px
}

#lessonChoice .green{
  background:linear-gradient(135deg,#10b981,#34d399);
  box-shadow:0 7px 0 #087f5b
}

.dictation-sound{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin:10px 0 20px
}

.dictation-word{
  font-size:20px;
  font-weight:800;
  text-align:center;
  padding:18px;
  background:#f8f9ff;
  border-radius:18px;
  margin-bottom:18px
}

.quiz-progress-bar{
  height:12px;
  background:#e7eaf5;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0 20px
}

.quiz-progress-fill{
  height:100%;
  background:linear-gradient(90deg,#5b5ce2,#20c997);
  transition:width .3s ease
}

@media(max-width:600px){
  header{
    padding:23px 18px 27px;
    border-radius:0 0 24px 24px
  }

  header h1{
    font-size:26px
  }

  .container{
    margin-top:22px;
    padding:0 15px
  }

  .card{
    padding:20px;
    border-radius:20px
  }

  .big-button{
    min-height:115px;
    font-size:19px
  }

  .quiz-question{
    font-size:27px
  }

  .word{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 PacoGO!</h1>
</header>

<div class="container">

<div id="message"></div>

<!-- LOGIN -->

<section id="login" class="hidden">
  <div class="card">

    <h2>🔐 Ouder login</h2>

    <p class="small">
      Log in om lessen te maken en te bewerken.
    </p>

    <label>E-mailadres</label>
    <input
      id="loginEmail"
      type="email"
      autocomplete="email"
      placeholder="Jouw e-mailadres"
    >

    <label>Wachtwoord</label>
    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Wachtwoord"
    >

    <div id="loginError" class="error hidden"></div>

    <div class="row">
      <button onclick="loginParent()">Inloggen</button>
      <button class="secondary" onclick="showHome()">Annuleren</button>
    </div>

  </div>
</section>

<!-- HOME -->

<section id="home">

  <div class="topbar">

    <h2>Vakken</h2>

    <div class="row">

      <button
        id="loginButton"
        class="secondary"
        onclick="showLogin()"
      >
        🔐 Ouder login
      </button>

      <button
        id="logoutButton"
        class="secondary hidden"
        onclick="logoutParent()"
      >
        🚪 Uitloggen
      </button>

      <button
        id="addLessonButton"
        class="hidden"
        onclick="showAddLesson()"
      >
        ➕ Nieuwe les
      </button>

    </div>

  </div>

  <div id="subjects" class="grid"></div>

</section>

<!-- LESSON LIST -->

<section id="lessonList" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="showHome()">
      ← Terug
    </button>

    <button
      id="addLessonButton2"
      class="hidden"
      onclick="showAddLesson(currentSubject)"
    >
      ➕ Nieuwe les
    </button>

  </div>

  <h2 id="subjectTitle"></h2>

  <div id="lessons"></div>

</section>

<!-- LESSON EDITOR -->

<section id="lessonEditor" class="hidden">

  <div class="topbar">
    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>
  </div>

  <div class="card">

    <h2 id="editorTitle">Nieuwe les</h2>

    <label>Vak</label>

    <input
      id="subjectInput"
      placeholder="Bijvoorbeeld 🇬🇧 Engels"
    >

    <label>Naam van de les</label>

    <input
      id="titleInput"
      placeholder="Bijvoorbeeld Les 3 – Dieren"
    >

    <label>Type les</label>

    <select
      id="typeInput"
      onchange="changeLessonType()"
    >
      <option value="words">🎯 Woordtrainer</option>
      <option value="questions">❓ Vragen</option>
      <option value="dictation">✏️ Dictee</option>
    </select>

    <!-- WOORDTRAINER -->

    <div id="wordsEditor">

      <h3>Woorden</h3>

      <div id="wordRows"></div>

      <button
        class="secondary"
        onclick="addWordRow()"
      >
        ➕ Woord toevoegen
      </button>

    </div>

    <!-- VRAGEN -->

    <div id="questionsEditor" class="hidden">

      <h3>Vragen</h3>

      <div id="questionRows"></div>

      <button
        class="secondary"
        onclick="addQuestionRow()"
      >
        ➕ Vraag toevoegen
      </button>

    </div>

    <!-- DICTEE -->

    <div id="dictationEditor" class="hidden">

      <h3>Dicteewoorden</h3>

      <p class="small">
        Bij dictee wordt het woord uitgesproken.
        De leerling hoort het woord en typt daarna de spelling.
      </p>

      <div id="dictationRows"></div>

      <button
        class="secondary"
        onclick="addDictationRow()"
      >
        ➕ Woord toevoegen
      </button>

    </div>

    <br><br>

    <button onclick="saveLesson()">
      💾 Opslaan
    </button>

  </div>

</section>

<!-- LESSON CHOICE -->

<section id="lessonChoice" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>

  </div>

  <div class="card">

    <h2 id="choiceTitle"></h2>

    <p class="small">
      Wil je de les eerst bekijken, overhoren of een toets maken?
    </p>

    <div class="row">

      <button
        class="big-button"
        onclick="showLesson()"
      >
        📖 Les bekijken
      </button>

      <button
        class="green big-button"
        onclick="startPractice()"
      >
        ▶️ Overhoren
      </button>

      <button
        class="big-button"
        onclick="startTest()"
      >
        📝 Toets
      </button>

    </div>

  </div>

</section>

<!-- LESSON VIEW -->

<section id="lessonView" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>

    <div>

      <button
        id="editLessonButton"
        class="hidden"
        onclick="editCurrentLesson()"
      >
        ✏️ Bewerken
      </button>

      <button
        id="deleteLessonButton"
        class="danger hidden"
        onclick="deleteCurrentLesson()"
      >
        🗑️ Verwijderen
      </button>

    </div>

  </div>

  <div class="card">

    <h2 id="viewTitle"></h2>

    <p id="viewInfo" class="small"></p>

    <div id="viewItems"></div>

    <br>

    <div class="row">
      <button
        class="green big-button"
        onclick="startPractice()"
      >
        ▶️ Overhoren
      </button>

      <button
        class="big-button"
        onclick="startTest()"
      >
        📝 Toets
      </button>
    </div>

  </div>

</section>

<!-- QUIZ -->

<section id="quiz" class="hidden">

  <div class="topbar">

    <button
      class="secondary"
      onclick="showLesson()"
    >
      ← Stoppen
    </button>

  </div>

  <div class="card">

    <div id="quizProgress" class="small"></div>

    <div class="quiz-progress-bar">
      <div
        id="quizProgressFill"
        class="quiz-progress-fill"
        style="width:0%"
      ></div>
    </div>

    <div id="quizContent"></div>

  </div>

</section>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ncpkqrvxljxwboavxtak.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skiKpO4UU79zWY7hskHsoA_WQxA6CFc";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   PARENT ACCOUNTS
========================================================= */

const PARENT_IDS = new Set([
  "5d0e1e5c-1dbe-4909-bd3a-81a1e7b26d09",
  "418833d5-049a-4ec9-8072-2d48a85f04b1"
]);


/* =========================================================
   STATE
========================================================= */

let currentSession = null;

let allLessons = [];

let currentSubject = "";

let currentLesson = null;

let editingLessonId = null;

let quizItems = [];

let quizQueue = [];

let quizIndex = 0;

let quizScore = 0;

let quizAnswered = false;

let quizWrongCount = 0;

let quizIsTest = false;

let quizMistakes = 0;


/* =========================================================
   AUTH
========================================================= */

function isParentLoggedIn(){
  return !!currentSession &&
    PARENT_IDS.has(currentSession.user.id);
}


function updateAuthUI(session){

  currentSession = session;

  const loggedIn =
    isParentLoggedIn();

  document
    .getElementById("loginButton")
    ?.classList
    .toggle("hidden",loggedIn);

  document
    .getElementById("logoutButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("addLessonButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("addLessonButton2")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("editLessonButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("deleteLessonButton")
    ?.classList
    .toggle("hidden",!loggedIn);
}


function requireParent(){

  if(!isParentLoggedIn()){

    showMessage(
      "Alleen ouders kunnen lessen wijzigen. Log eerst in.",
      "error"
    );

    showHome();

    return false;
  }

  return true;
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initializeApp(){

  const {
    data:{session}
  } = await db.auth.getSession();

  updateAuthUI(session);

  await loadLessons();
}


db.auth.onAuthStateChange(
  (_event,session)=>{
    updateAuthUI(session);
  }
);


/* =========================================================
   LOAD LESSONS
========================================================= */

async function loadLessons(){

  showMessage(
    "Lessen laden...",
    "success"
  );

  const {
    data,
    error
  } = await db
    .from("lessons")
    .select(`
      id,
      subject,
      title,
      type,
      lesson_items(
        id,
        question,
        answer,
        sort_order
      )
    `)
    .order("id");

  if(error){

    showMessage(
      "Fout bij laden: "+error.message,
      "error"
    );

    return;
  }

  allLessons = data || [];

  allLessons.forEach(
    lesson=>{

      lesson.lesson_items =
        (lesson.lesson_items || [])
          .sort(
            (a,b)=>
              a.sort_order-b.sort_order
          );

    }
  );

  hideMessage();

  showHome();
}


/* =========================================================
   MESSAGES
========================================================= */

function showMessage(text,type){

  const el =
    document.getElementById("message");

  el.className = type || "";

  el.textContent = text;
}


function hideMessage(){

  const el =
    document.getElementById("message");

  el.textContent = "";

  el.className = "";
}


/* =========================================================
   NAVIGATION
========================================================= */

function hideAll(){

  [
    "home",
    "lessonList",
    "lessonEditor",
    "lessonView",
    "lessonChoice",
    "quiz",
    "login"
  ]
  .forEach(
    id=>
      document
        .getElementById(id)
        .classList
        .add("hidden")
  );
}


function showHome(){

  hideAll();

  document
    .getElementById("home")
    .classList
    .remove("hidden");

  const subjects =
    [...new Set(
      allLessons.map(l=>l.subject)
    )];

  const container =
    document.getElementById("subjects");

  container.innerHTML = "";

  if(!subjects.length){

    container.innerHTML =
      "<p>Nog geen vakken.</p>";

    return;
  }

  const icons = {

    Nederlands:"📚",
    Engels:"🇬🇧",
    Rekenen:"🔢",
    Geschiedenis:"🏴‍☠️",
    Aardrijkskunde:"🌍",
    Biologie:"🧬",
    Natuur:"🔬",
    Frans:"🇫🇷",
    Spaans:"🇪🇸"

  };

  const colors = [

    "subject-blue",
    "subject-purple",
    "subject-green",
    "subject-orange",
    "subject-pink",
    "subject-cyan"

  ];

  subjects.forEach(
    (subject,index)=>{

      const lessons =
        allLessons.filter(
          l=>l.subject===subject
        );

      const btn =
        document.createElement("button");

      btn.className =
        "big-button "+
        colors[index%colors.length];

      const icon =
        icons[subject] || "🎮";

      btn.innerHTML = `

        <span class="subject-icon">
          ${icon}
        </span>

        <span class="subject-name">
          ${escapeHtml(subject)}
        </span>

        <span class="subject-count">
          ${lessons.length}
          ${lessons.length===1?"les":"lessen"}
        </span>

      `;

      btn.onclick =
        ()=>showSubject(subject);

      container.appendChild(btn);

    }
  );
}


function showSubject(subject){

  currentSubject = subject;

  currentLesson = null;

  hideAll();

  document
    .getElementById("lessonList")
    .classList
    .remove("hidden");

  document
    .getElementById("subjectTitle")
    .textContent = subject;

  const container =
    document.getElementById("lessons");

  container.innerHTML = "";

  allLessons
    .filter(l=>l.subject===subject)
    .forEach(
      lesson=>{

        const btn =
          document.createElement("button");

        btn.className =
          "lesson-button";

        let icon;

        if(lesson.type==="questions"){
          icon="❓";
        }
        else if(lesson.type==="dictation"){
          icon="✏️";
        }
        else{
          icon="🎯";
        }

        btn.innerHTML = `

          <span class="lesson-icon">
            ${icon}
          </span>

          <span class="lesson-info">

            <span class="lesson-title">
              ${escapeHtml(lesson.title)}
            </span>

            <span class="lesson-count">
              ${lesson.lesson_items.length}
              ${lesson.lesson_items.length===1?"item":"items"}
            </span>

          </span>

          <span class="lesson-arrow">
            ›
          </span>

        `;

        btn.onclick =
          ()=>openLesson(lesson.id);

        container.appendChild(btn);

      }
    );
}


function openLesson(id){

  currentLesson =
    allLessons.find(
      l=>l.id===id
    );

  if(!currentLesson)return;

  hideAll();

  document
    .getElementById("lessonChoice")
    .classList
    .remove("hidden");

  document
    .getElementById("choiceTitle")
    .textContent =
      currentLesson.title;
}


function showLesson(id){

  if(id){
    currentLesson =
      allLessons.find(
        l=>l.id===id
      );
  }

  if(!currentLesson)return;

  hideAll();

  document
    .getElementById("lessonView")
    .classList
    .remove("hidden");

  document
    .getElementById("viewTitle")
    .textContent =
      currentLesson.title;

  let typeName;

  if(currentLesson.type==="questions"){
    typeName="vragen";
  }
  else if(currentLesson.type==="dictation"){
    typeName="dicteewoorden";
  }
  else{
    typeName="woorden";
  }

  document
    .getElementById("viewInfo")
    .textContent =
      `${currentLesson.subject} • ${currentLesson.lesson_items.length} ${typeName}`;

  const container =
    document.getElementById("viewItems");

  container.innerHTML = "";

  currentLesson.lesson_items
    .forEach(
      (item,i)=>{

        const div =
          document.createElement("div");

        div.className =
          "question-card";

        if(currentLesson.type==="words"){

          div.innerHTML = `
            <strong>
              ${i+1}. ${escapeHtml(item.question)}
            </strong>

            <span>
              → ${escapeHtml(item.answer)}
            </span>
          `;

        }

        else if(currentLesson.type==="dictation"){

          div.innerHTML = `
            <strong>
              ${i+1}. ✏️ ${escapeHtml(item.answer)}
            </strong>
          `;

        }

        else{

          div.innerHTML = `
            <strong>
              ${i+1}. ${escapeHtml(item.question)}
            </strong>

            <br>

            <span class="small">
              Antwoord:
              ${escapeHtml(item.answer)}
            </span>
          `;

        }

        container.appendChild(div);

      }
    );
}

/* =========================================================
   SAVE LESSON
========================================================= */

async function saveLesson(){

  if(!requireParent())return;

  const subject =
    document
      .getElementById("subjectInput")
      .value
      .trim();

  const title =
    document
      .getElementById("titleInput")
      .value
      .trim();

  const type =
    document
      .getElementById("typeInput")
      .value;

  if(!subject || !title){

    showMessage(
      "Vul het vak en de naam van de les in.",
      "error"
    );

    return;
  }

  let items = [];


  /* WOORDTRAINER */

  if(type==="words"){

    document
      .querySelectorAll("#wordRows .word")
      .forEach(
        (row,i)=>{

          const inputs =
            row.querySelectorAll("input");

          const question =
            inputs[0].value.trim();

          const answer =
            inputs[1].value.trim();

          if(question && answer){

            items.push({
              question,
              answer,
              sort_order:i+1
            });

          }

        }
      );
  }


  /* VRAGEN */

  else if(type==="questions"){

    document
      .querySelectorAll("#questionRows .question-card")
      .forEach(
        (card,i)=>{

          const fields =
            card.querySelectorAll("textarea");

          const question =
            fields[0].value.trim();

          const answer =
            fields[1].value.trim();

          if(question && answer){

            items.push({
              question,
              answer,
              sort_order:i+1
            });

          }

        }
      );
  }


  /* DICTEE */

  else if(type==="dictation"){

    document
      .querySelectorAll("#dictationRows .word")
      .forEach(
        (row,i)=>{

          const input =
            row.querySelector("input");

          const word =
            input.value.trim();

          if(word){

            items.push({

              question:word,

              answer:word,

              sort_order:i+1

            });

          }

        }
      );
  }


  if(!items.length){

    showMessage(
      "Voeg minstens één item toe.",
      "error"
    );

    return;
  }


  showMessage(
    "Opslaan...",
    "success"
  );


  let lessonId =
    editingLessonId;


  /* BESTAANDE LES */

  if(editingLessonId){

    const {
      error
    } = await db
      .from("lessons")
      .update({
        subject,
        title,
        type
      })
      .eq(
        "id",
        editingLessonId
      );

    if(error){

      showMessage(
        "Fout: "+error.message,
        "error"
      );

      return;
    }


    const {
      error:itemDeleteError
    } = await db
      .from("lesson_items")
      .delete()
      .eq(
        "lesson_id",
        editingLessonId
      );

    if(itemDeleteError){

      showMessage(
        "Fout bij verwijderen oude items: "+
        itemDeleteError.message,
        "error"
      );

      return;
    }

  }


  /* NIEUWE LES */

  else{

    const {
      data,
      error
    } = await db
      .from("lessons")
      .insert({
        subject,
        title,
        type
      })
      .select()
      .single();

    if(error){

      showMessage(
        "Fout: "+error.message,
        "error"
      );

      return;
    }

    lessonId = data.id;
  }


  const rows =
    items.map(
      item=>({

        lesson_id:lessonId,

        question:item.question,

        answer:item.answer,

        sort_order:item.sort_order

      })
    );


  const {
    error:itemError
  } = await db
    .from("lesson_items")
    .insert(rows);


  if(itemError){

    showMessage(
      "Fout bij opslaan items: "+
      itemError.message,
      "error"
    );

    return;
  }


  await loadLessons();

  currentLesson =
    allLessons.find(
      l=>l.id===lessonId
    );

  if(currentLesson){
    showLesson();
  }
}

/* =========================================================
   QUIZ / TRAINING / TEST
========================================================= */

function shuffle(items){
  const copy = [...items];
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}

function startPractice(){
  startQuizMode(false);
}

function startTest(){
  startQuizMode(true);
}

function startQuiz(){
  startPractice();
}

function startQuizMode(isTest){
  if(!currentLesson || !currentLesson.lesson_items.length){
    return;
  }

  quizItems = shuffle(currentLesson.lesson_items);
  quizQueue = [...quizItems];
  quizIndex = 0;
  quizScore = 0;
  quizWrongCount = 0;
  quizMistakes = 0;
  quizAnswered = false;
  quizIsTest = isTest;

  hideAll();
  document.getElementById("quiz").classList.remove("hidden");
  showQuizItem();
}

function updateQuizProgress(){
  const remaining = Math.max(quizQueue.length - quizIndex, 0);
  const total = Math.max(quizItems.length, 1);
  const completed = Math.max(total - remaining, 0);
  const percentage = Math.min((completed / total) * 100, 100);

  document.getElementById("quizProgressFill").style.width = percentage + "%";

  if(quizIsTest){
    document.getElementById("quizProgress").textContent =
      `Vraag ${Math.min(quizIndex+1,total)} van ${total} • nog ${remaining}`;
  }else{
    document.getElementById("quizProgress").textContent =
      remaining === 1 ? "Nog 1 woord" : `Nog ${remaining} woorden`;
  }
}

function speakDictationWord(){
  if(!currentLesson || currentLesson.type!=="dictation") return;
  const item = quizQueue[quizIndex];
  if(!item) return;

  window.speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(item.answer);
  speech.lang = "en-US";
  speech.rate = .75;
  speech.pitch = 1;
  window.speechSynthesis.speak(speech);
}

function showQuizItem(){
  if(quizIndex >= quizQueue.length){
    finishQuiz();
    return;
  }

  const item = quizQueue[quizIndex];
  const container = document.getElementById("quizContent");
  quizAnswered = false;
  updateQuizProgress();

  if(currentLesson.type === "dictation"){
    container.innerHTML = `
      <div class="quiz-question">🔊 Luister en typ het woord</div>
      <div class="dictation-sound">Het woord wordt automatisch uitgesproken.</div>
      <button class="big-button" onclick="speakDictationWord()">🔊 Nog een keer luisteren</button>
      <input id="quizInput" placeholder="Typ het woord..." autocomplete="off"
        onkeydown="if(event.key==='Enter')checkDictationAnswer()">
      <button class="big-button" onclick="checkDictationAnswer()">Controleren</button>
      <div id="quizResult"></div>
    `;
    setTimeout(()=>{
      speakDictationWord();
      document.getElementById("quizInput")?.focus();
    },350);
    return;
  }

  if(currentLesson.type === "words"){
    container.innerHTML = `
      <div class="quiz-question">${escapeHtml(item.question)}</div>
      <input id="quizInput" placeholder="Typ je antwoord..." autocomplete="off"
        onkeydown="if(event.key==='Enter')checkWordAnswer()">
      <button class="big-button" onclick="checkWordAnswer()">Controleren</button>
      <div id="quizResult"></div>
    `;
    setTimeout(()=>document.getElementById("quizInput")?.focus(),100);
    return;
  }

  container.innerHTML = `
    <div class="quiz-question">${escapeHtml(item.question)}</div>
    <textarea id="quizInput" placeholder="Typ je antwoord..."></textarea>
    <button class="big-button" onclick="checkQuestionAnswer()">
      ${quizIsTest ? "Antwoord opslaan" : "Antwoord bekijken"}
    </button>
    <div id="quizResult"></div>
  `;
}

function normalizeAnswer(value){
  return String(value || "").trim().toLowerCase();
}

function checkWordAnswer(){
  if(quizAnswered) return;

  const input = document.getElementById("quizInput");
  const given = normalizeAnswer(input.value);
  const item = quizQueue[quizIndex];
  const correct = normalizeAnswer(item.answer);

  input.disabled = true;
  quizAnswered = true;

  if(given === correct){
    quizScore++;

    if(quizIsTest){
      showTestNextButton("Goed", true);
    }else{
      document.getElementById("quizResult").innerHTML = `
        <div class="success">🟢 Goed!</div>
        <button onclick="nextQuizItem()">Volgende →</button>
      `;
    }
  }else{
    quizWrongCount++;
    quizMistakes++;

    if(quizIsTest){
      showTestNextButton("Antwoord opgeslagen", false);
    }else{
      // Fout antwoord gaat terug in de trainingslijst.
      quizQueue.push(item);
      document.getElementById("quizResult").innerHTML = `
        <div class="error">
          🔴 Niet goed. Dit woord komt later opnieuw terug.
        </div>
        <button onclick="nextQuizItem()">Volgende →</button>
      `;
    }
  }
}

function checkDictationAnswer(){
  if(quizAnswered) return;

  const input = document.getElementById("quizInput");
  const given = normalizeAnswer(input.value);
  const item = quizQueue[quizIndex];
  const correct = normalizeAnswer(item.answer);

  input.disabled = true;
  quizAnswered = true;

  if(given === correct){
    quizScore++;
    if(quizIsTest){
      showTestNextButton("Goed", true);
    }else{
      document.getElementById("quizResult").innerHTML = `
        <div class="success">🟢 Goed gespeld!</div>
        <button onclick="nextQuizItem()">Volgende →</button>
      `;
    }
  }else{
    quizWrongCount++;
    quizMistakes++;
    if(quizIsTest){
      showTestNextButton("Antwoord opgeslagen", false);
    }else{
      quizQueue.push(item);
      document.getElementById("quizResult").innerHTML = `
        <div class="error">🔴 Niet goed. Dit woord komt later opnieuw terug.</div>
        <button onclick="nextQuizItem()">Volgende →</button>
      `;
    }
  }
}

function checkQuestionAnswer(){
  if(quizAnswered) return;

  const input = document.getElementById("quizInput");
  const given = normalizeAnswer(input.value);
  const item = quizQueue[quizIndex];
  const correct = normalizeAnswer(item.answer);

  input.disabled = true;
  quizAnswered = true;

  if(quizIsTest){
    if(given === correct) quizScore++;
    else quizMistakes++;
    showTestNextButton("Antwoord opgeslagen", given === correct);
    return;
  }

  document.getElementById("quizResult").innerHTML = `
    <div class="quiz-answer">${escapeHtml(item.answer)}</div>
    <p style="text-align:center">Had je het goed?</p>
    <div class="row">
      <button class="green" onclick="questionCorrect()">🟢 Ik had het goed</button>
      <button class="danger" onclick="questionWrong()">🔴 Ik had het fout</button>
    </div>
  `;
}

function showTestNextButton(label, wasCorrect){
  document.getElementById("quizResult").innerHTML = `
    <div class="small" style="text-align:center;margin:15px 0">
      Antwoord opgeslagen. Je ziet de uitslag pas aan het einde.
    </div>
    <button onclick="nextQuizItem()">Volgende →</button>
  `;
}

function questionCorrect(){
  if(quizAnswered !== true) return;
  quizScore++;
  nextQuizItem();
}

function questionWrong(){
  if(quizAnswered !== true) return;
  quizWrongCount++;
  quizMistakes++;
  nextQuizItem();
}

function nextQuizItem(){
  quizIndex++;
  showQuizItem();
}

function finishQuiz(){
  const total = quizItems.length;
  const percentage = total ? Math.round((quizScore/total)*100) : 0;

  document.getElementById("quizProgress").textContent =
    quizIsTest ? "Toets klaar!" : "Training klaar!";
  document.getElementById("quizProgressFill").style.width = "100%";

  if(quizIsTest){
    const grade = Math.round((percentage / 10) * 10) / 10;
    document.getElementById("quizContent").innerHTML = `
      <div class="score">
        📝 Toets klaar!<br><br>
        <div style="font-size:64px">${grade.toFixed(1)}</div>
        <br>
        ${quizScore} van ${total} goed
      </div>
      <br>
      <button class="big-button" onclick="startTest()">🔄 Opnieuw</button>
      <br><br>
      <button class="secondary big-button" onclick="showLesson()">← Terug naar de les</button>
    `;
  }else{
    document.getElementById("quizContent").innerHTML = `
      <div class="score">
        🎉 Training klaar!<br><br>
        Alle woorden zijn goed beantwoord.<br><br>
        ${quizMistakes === 0 ? "Alles in één keer goed!" : `${quizMistakes} fout antwoord${quizMistakes===1?"":"en"} opnieuw geoefend.`}
      </div>
      <br>
      <button class="big-button" onclick="startPractice()">🔄 Opnieuw oefenen</button>
      <br><br>
      <button class="secondary big-button" onclick="showLesson()">← Terug naar de les</button>
    `;
  }
}

    );

/* =========================================================
   SECURITY / HTML ESCAPING
========================================================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(text){

  return escapeHtml(text);
}


/* =========================================================
   LOGIN
========================================================= */

function showLogin(){

  hideAll();

  document
    .getElementById("login")
    .classList
    .remove("hidden");

  document
    .getElementById("loginError")
    .classList
    .add("hidden");
}


async function loginParent(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const error =
    document
      .getElementById("loginError");


  error
    .classList
    .add("hidden");

  error.textContent = "";


  if(!email || !password){

    error.textContent =
      "Vul je e-mailadres en wachtwoord in.";

    error
      .classList
      .remove("hidden");

    return;
  }


  const {
    data,
    error:loginError
  } =
    await db.auth.signInWithPassword({
      email,
      password
    });


  if(loginError){

    error.textContent =
      "Inloggen mislukt. Controleer je e-mailadres en wachtwoord.";

    error
      .classList
      .remove("hidden");

    return;
  }


  if(
    !PARENT_IDS.has(
      data.user.id
    )
  ){

    await db.auth.signOut();

    error.textContent =
      "Dit account heeft geen ouderrechten.";

    error
      .classList
      .remove("hidden");

    return;
  }


  showHome();
}


async function logoutParent(){

  const {
    error
  } =
    await db.auth.signOut();

  if(error){

    showMessage(
      "Uitloggen mislukt: "+
      error.message,
      "error"
    );

    return;
  }

  currentSession = null;

  updateAuthUI(null);

  showHome();
}
