<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PacoGO!</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#4f46e5;--primary2:#3730a3;--danger:#dc2626;--success:#16a34a;--border:#e5e7eb;--shadow:0 8px 24px rgba(23,32,51,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;border-radius:12px;padding:11px 16px;background:var(--primary);color:#fff;font-weight:700}button:hover{background:var(--primary2)}button.secondary{background:#eef2ff;color:#3730a3}button.danger{background:#fee2e2;color:#b91c1c}button.success{background:#dcfce7;color:#166534}button.big{font-size:18px;padding:15px 20px}.hidden{display:none!important}.container{max-width:1000px;margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.topbar h2{margin:0}.row{display:flex;gap:10px;flex-wrap:wrap}.brand{font-size:30px;font-weight:900;margin:0}.subtitle{color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.subject-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.subject-icon{font-size:38px}.subject-title{font-size:21px;font-weight:800}.subject-blue{border-top:6px solid #3b82f6}.subject-purple{border-top:6px solid #8b5cf6}.subject-green{border-top:6px solid #22c55e}.subject-orange{border-top:6px solid #f97316}.subject-pink{border-top:6px solid #ec4899}.subject-cyan{border-top:6px solid #06b6d4}.lesson-card{cursor:pointer}.lesson-card:hover{transform:translateY(-2px);transition:.15s}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800;margin-bottom:9px}.type-dictation{background:#fff7ed;color:#c2410c}.type-question{background:#f0fdf4;color:#15803d}.type-word{background:#eff6ff;color:#1d4ed8}.editor-row{background:#f8fafc;border:1px solid var(--border);padding:14px;border-radius:14px;margin:10px 0}.field{margin-bottom:14px}.field label{display:block;font-weight:750;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:100px;resize:vertical}.message{padding:12px 14px;border-radius:12px;margin:14px 0}.message.error{background:#fee2e2;color:#991b1b}.message.success{background:#dcfce7;color:#166534}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px}.choice{padding:25px;border-radius:18px;background:#fff;border:2px solid var(--border);box-shadow:var(--shadow);text-align:left}.choice:hover{border-color:#a5b4fc}.choice .emoji{font-size:38px}.choice h3{margin:8px 0 5px}.choice p{color:var(--muted);margin:0}.practice-box{max-width:700px;margin:0 auto;text-align:center}.prompt{font-size:34px;font-weight:900;margin:30px 0 22px;white-space:pre-line}.answer-input{font-size:22px;padding:15px;text-align:center}.feedback{font-size:18px;font-weight:800;min-height:30px;margin:15px 0}.progress-wrap{margin:15px 0 25px}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:7px}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#4f46e5,#7c3aed);transition:width .25s}.speaker{font-size:18px;background:#eef2ff;color:#3730a3}.speaker:hover{background:#e0e7ff}.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.mc-grid button{background:#f8fafc;color:var(--text);border:2px solid var(--border);text-align:left}.mc-grid button:hover{border-color:#818cf8;background:#eef2ff}.result-score{font-size:54px;font-weight:900;color:var(--primary);margin:20px 0}.result-item{padding:12px;border-bottom:1px solid var(--border);text-align:left}.correct{color:#15803d}.incorrect{color:#b91c1c}.login-card{max-width:420px;margin:40px auto}.small{font-size:13px;color:var(--muted)}.section-title{margin-top:28px}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:16px}.danger-text{color:#b91c1c}.remove-row{float:right;background:#fee2e2;color:#b91c1c;padding:6px 10px}.test-instructions{background:#eef2ff;padding:14px;border-radius:12px;color:#3730a3}.self-buttons{display:flex;justify-content:center;gap:10px;margin-top:18px}.question-answer{white-space:pre-line;background:#f8fafc;border-radius:14px;padding:18px;text-align:left;margin:20px 0}.dictation-word{font-size:20px;color:var(--muted)}
@media(max-width:600px){.container{padding:16px}.topbar{align-items:flex-start;flex-direction:column}.prompt{font-size:28px}.mc-grid{grid-template-columns:1fr}.brand{font-size:26px}}
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div><h1 class="brand">📚 PacoGO!</h1><div class="subtitle">Leren, oefenen en jezelf testen.</div></div>
  </header>

  <main id="home" class="page">
    <div class="topbar"><h2>Vakken</h2><div class="row">
      <button id="loginButton" class="secondary" onclick="showLogin()">🔐 Ouder login</button>
      <button id="logoutButton" class="secondary hidden" onclick="logoutParent()">🚪 Uitloggen</button>
      <button id="addLessonButton" class="hidden" onclick="showAddLesson()">➕ Nieuwe les</button>
    </div></div>
    <div id="subjects" class="grid"></div>
  </main>

  <main id="subject" class="page hidden">
    <div class="topbar"><div><button class="secondary" onclick="showHome()">← Terug</button><h2 id="subjectTitle" style="margin-top:14px"></h2></div></div>
    <div id="lessons" class="grid"></div>
    <div class="row" style="margin-top:18px"><button id="addLessonButton2" class="hidden" onclick="showAddLesson(currentSubject)">➕ Nieuwe les</button></div>
  </main>

  <main id="lessonChoice" class="page hidden">
    <button class="secondary" onclick="goBack()">← Terug</button>
    <div class="card" style="margin-top:18px"><h2 id="choiceTitle"></h2><div id="choiceMeta" class="small"></div></div>
    <div id="choiceGrid" class="choice-grid"></div>
  </main>

  <main id="lessonView" class="page hidden">
    <div class="topbar"><div><button class="secondary" onclick="goBack()">← Terug</button><h2 id="lessonTitle" style="margin-top:14px"></h2></div><div id="lessonAdminButtons" class="row"><button id="editLessonButton" class="hidden" onclick="editCurrentLesson()">✏️ Bewerken</button><button id="deleteLessonButton" class="danger hidden" onclick="deleteCurrentLesson()">🗑️ Verwijderen</button></div></div>
    <div id="lessonContent"></div>
  </main>

  <main id="editor" class="page hidden">
    <button class="secondary" onclick="goBack()">← Annuleren</button>
    <div class="card" style="margin-top:18px"><h2 id="editorTitle">Nieuwe les</h2>
      <div class="field"><label for="lessonSubject">Vak</label><input id="lessonSubject" placeholder="Bijvoorbeeld Nederlands"></div>
      <div class="field"><label for="lessonName">Naam van de les</label><input id="lessonName" placeholder="Bijvoorbeeld Week 4"></div>
      <div class="field"><label for="lessonType">Onderdeel</label><select id="lessonType" onchange="changeLessonType()"><option value="words">🎯 Woordtrainer</option><option value="questions">❓ Vragen</option><option value="dictation">✏️ Dictee</option></select></div>
      <div id="wordEditor"></div><div id="questionEditor" class="hidden"></div><div id="dictationEditor" class="hidden"></div>
      <div class="row" style="margin-top:18px"><button onclick="addCurrentRow()">➕ Rij toevoegen</button><button class="success" onclick="saveLesson()">💾 Les opslaan</button></div>
      <div id="editorError" class="message error hidden"></div>
    </div>
  </main>

  <main id="login" class="page hidden"><button class="secondary" onclick="showHome()">← Terug</button><div class="card login-card"><h2>🔐 Ouder login</h2><div class="field"><label for="loginEmail">E-mailadres</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label for="loginPassword">Wachtwoord</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button class="big" onclick="loginParent()">Inloggen</button><div id="loginError" class="message error hidden"></div></div></main>

  <main id="practice" class="page hidden"><button class="secondary" onclick="leaveActivity()">← Stoppen</button><div class="card practice-box" style="margin-top:18px"><h2 id="practiceTitle"></h2><div id="practiceProgress" class="progress-wrap"></div><div id="practiceContent"></div></div></main>

  <main id="test" class="page hidden"><button class="secondary" onclick="leaveActivity()">← Stoppen</button><div class="card practice-box" style="margin-top:18px"><h2 id="testTitle"></h2><div id="testProgress" class="progress-wrap"></div><div id="testContent"></div></div></main>

  <main id="result" class="page hidden"><div class="card practice-box"><h2 id="resultTitle"></h2><div id="resultScore" class="result-score"></div><div id="resultDetails"></div><div class="row" style="justify-content:center;margin-top:22px"><button onclick="showLessonChoice(currentLesson)">Nog een keer</button><button class="secondary" onclick="goBack()">Terug naar les</button></div></div></main>

  <div id="globalMessage"></div>
</div>

<script>
const SUPABASE_URL = 'https://ncpkqrvxljxwboavxtak.supabase.co';
const SUPABASE_KEY = 'sb_publishable_skiKpO4UU79zWY7hskHsoA_WQxA6CFc';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PARENT_IDS = new Set(['5d0e1e5c-1dbe-4909-bd3a-81a1e7b26d09','418833d5-049a-4ec9-8072-2d48a85f04b1']);
let currentSession=null,currentSubject=null,currentLesson=null,lessons=[];
let activity=null;

function isParentLoggedIn(){return !!currentSession&&PARENT_IDS.has(currentSession.user.id)}
function updateAuthUI(session){currentSession=session;const logged=isParentLoggedIn();document.getElementById('loginButton')?.classList.toggle('hidden',logged);document.getElementById('logoutButton')?.classList.toggle('hidden',!logged);document.getElementById('addLessonButton')?.classList.toggle('hidden',!logged);document.getElementById('addLessonButton2')?.classList.toggle('hidden',!logged);document.getElementById('editLessonButton')?.classList.toggle('hidden',!logged);document.getElementById('deleteLessonButton')?.classList.toggle('hidden',!logged)}
function requireParent(){if(!isParentLoggedIn()){showMessage('Alleen ouders kunnen lessen wijzigen. Log eerst in.','error');showHome();return false}return true}
function hideAll(){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));window.speechSynthesis?.cancel()}
function showHome(){hideAll();document.getElementById('home').classList.remove('hidden');renderSubjects()}
function showLogin(){hideAll();document.getElementById('login').classList.remove('hidden');document.getElementById('loginError').classList.add('hidden')}
function showMessage(text,type='success'){const box=document.getElementById('globalMessage');box.innerHTML='<div class="message '+type+'">'+escapeHtml(text)+'</div>';setTimeout(()=>box.innerHTML='',3500)}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function normalize(v){return String(v??'').trim().toLowerCase()}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function typeLabel(type){return type==='words'?'🎯 Woordtrainer':type==='dictation'?'✏️ Dictee':'❓ Vragen'}
function typeClass(type){return type==='words'?'type-word':type==='dictation'?'type-dictation':'type-question'}
function subjectClass(s){const map={Nederlands:'subject-blue',Engels:'subject-purple',Rekenen:'subject-green',Geschiedenis:'subject-orange',Aardrijkskunde:'subject-cyan',Biologie:'subject-green',Natuur:'subject-orange',Frans:'subject-pink',Spaans:'subject-purple'};return map[s]||'subject-blue'}
function subjectIcon(s){const map={Nederlands:'📚',Engels:'🇬🇧',Rekenen:'🔢',Geschiedenis:'🏴‍☠️',Aardrijkskunde:'🌍',Biologie:'🧬',Natuur:'🔬',Frans:'🇫🇷',Spaans:'🇪🇸'};return map[s]||'🎮'}

async function initializeApp(){const {data:{session}}=await db.auth.getSession();updateAuthUI(session);await loadLessons()}
db.auth.onAuthStateChange((_event,session)=>updateAuthUI(session));

async function loadLessons(){const {data,error}=await db.from('lessons').select('*, lesson_items(*)').order('id',{ascending:true});if(error){showMessage('Lessen laden mislukt: '+error.message,'error');return}lessons=(data||[]).map(l=>({...l,lesson_items:(l.lesson_items||[]).sort((a,b)=>(a.sort_order??0)-(b.sort_order??0))}));showHome()}
function renderSubjects(){const el=document.getElementById('subjects');const names=[...new Set(lessons.map(l=>l.subject))];if(!names.length){el.innerHTML='<div class="empty">Nog geen lessen. Een ouder kan rechtsboven een les toevoegen.</div>';return}el.innerHTML=names.map(s=>{const count=lessons.filter(l=>l.subject===s).length;return `<div class="card subject-card ${subjectClass(s)}" onclick="showSubject('${escapeAttr(s)}')"><div><div class="subject-icon">${subjectIcon(s)}</div><div class="subject-title">${escapeHtml(s)}</div></div><div class="small">${count} ${count===1?'les':'lessen'}</div></div>`}).join('')}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#96;')}
function showSubject(subject){currentSubject=subject;hideAll();document.getElementById('subject').classList.remove('hidden');document.getElementById('subjectTitle').textContent=subject;const ls=lessons.filter(l=>l.subject===subject);const el=document.getElementById('lessons');el.innerHTML=ls.length?ls.map(l=>`<div class="card lesson-card" onclick="openLesson(${l.id})"><span class="badge ${typeClass(l.type)}">${typeLabel(l.type)}</span><h3>${escapeHtml(l.title)}</h3><div class="small">${l.lesson_items.length} ${l.lesson_items.length===1?'onderdeel':'onderdelen'}</div></div>`).join(''):'<div class="empty">Nog geen lessen in dit vak.</div>'}
function openLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;currentLesson=l;hideAll();document.getElementById('lessonChoice').classList.remove('hidden');document.getElementById('choiceTitle').textContent=l.title;document.getElementById('choiceMeta').textContent=`${l.subject} · ${typeLabel(l.type)} · ${l.lesson_items.length} items`;const g=document.getElementById('choiceGrid');if(l.type==='words'){g.innerHTML=`<button class="choice" onclick="startPractice('words')"><div class="emoji">🎯</div><h3>Oefenen</h3><p>Fouten komen later opnieuw terug totdat je ze beheerst.</p></button><button class="choice" onclick="startTest('words')"><div class="emoji">📝</div><h3>Toets</h3><p>Alle woorden één keer, zonder hulp.</p></button><button class="choice" onclick="showLesson()"><div class="emoji">📖</div><h3>Bekijken</h3><p>Bekijk de woorden en antwoorden.</p></button>`}else if(l.type==='dictation'){g.innerHTML=`<button class="choice" onclick="startPractice('dictation')"><div class="emoji">✏️</div><h3>Oefenen</h3><p>Luister, typ en herhaal fouten totdat de spelling goed is.</p></button><button class="choice" onclick="startTest('dictation')"><div class="emoji">📝</div><h3>Toets</h3><p>Luister en schrijf alle woorden. Feedback komt pas aan het einde.</p></button><button class="choice" onclick="showLesson()"><div class="emoji">📖</div><h3>Bekijken</h3><p>Bekijk de dicteewoorden.</p></button>`}else{g.innerHTML=`<button class="choice" onclick="startQuestions()"><div class="emoji">❓</div><h3>Vragen maken</h3><p>Beantwoord de vragen en controleer jezelf.</p></button><button class="choice" onclick="showLesson()"><div class="emoji">📖</div><h3>Bekijken</h3><p>Bekijk vragen en antwoorden.</p></button>`}}
function showLesson(){hideAll();document.getElementById('lessonView').classList.remove('hidden');document.getElementById('lessonTitle').textContent=currentLesson.title;const admin=isParentLoggedIn();document.getElementById('editLessonButton').classList.toggle('hidden',!admin);document.getElementById('deleteLessonButton').classList.toggle('hidden',!admin);const el=document.getElementById('lessonContent');el.innerHTML=currentLesson.lesson_items.length?currentLesson.lesson_items.map((it,i)=>`<div class="card" style="margin-bottom:10px"><strong>${i+1}. ${escapeHtml(it.question)}</strong><div style="margin-top:8px;white-space:pre-line">${escapeHtml(it.answer)}</div></div>`).join(''):'<div class="empty">Deze les heeft nog geen items.</div>'}
function goBack(){if(activity){activity=null}if(currentSubject)showSubject(currentSubject);else showHome()}
function leaveActivity(){window.speechSynthesis?.cancel();activity=null;showLessonChoice(currentLesson)}
function showLessonChoice(l){currentLesson=l;openLesson(l.id)}

function showAddLesson(subject=''){if(!requireParent())return;hideAll();document.getElementById('editor').classList.remove('hidden');document.getElementById('editorTitle').textContent='Nieuwe les';document.getElementById('lessonSubject').value=subject||currentSubject||'';document.getElementById('lessonName').value='';document.getElementById('lessonType').value='words';document.getElementById('editorError').classList.add('hidden');resetEditorRows();changeLessonType()}
function resetEditorRows(){document.getElementById('wordEditor').innerHTML='';document.getElementById('questionEditor').innerHTML='';document.getElementById('dictationEditor').innerHTML='';addWordRow();addWordRow()}
function changeLessonType(){const t=document.getElementById('lessonType').value;document.getElementById('wordEditor').classList.toggle('hidden',t!=='words');document.getElementById('questionEditor').classList.toggle('hidden',t!=='questions');document.getElementById('dictationEditor').classList.toggle('hidden',t!=='dictation');if(t==='questions'&&!document.getElementById('questionEditor').children.length){addQuestionRow();addQuestionRow()}if(t==='dictation'&&!document.getElementById('dictationEditor').children.length){addDictationRow();addDictationRow()}if(t==='words'&&!document.getElementById('wordEditor').children.length){addWordRow();addWordRow()}}
function rowHtml(content,kind){return `<div class="editor-row"><button class="remove-row" type="button" onclick="this.parentElement.remove()">✕</button>${content}</div>`}
function addWordRow(q='',a=''){document.getElementById('wordEditor').insertAdjacentHTML('beforeend',rowHtml(`<div class="field"><label>Nederlands / vraag</label><input class="word-q" value="${escapeAttr(q)}" placeholder="bijvoorbeeld huis"></div><div class="field"><label>Antwoord</label><input class="word-a" value="${escapeAttr(a)}" placeholder="bijvoorbeeld house"></div>`,'word'))}
function addQuestionRow(q='',a=''){document.getElementById('questionEditor').insertAdjacentHTML('beforeend',rowHtml(`<div class="field"><label>Vraag</label><textarea class="question-q" placeholder="Bijvoorbeeld: Wat betekent democratie?">${escapeHtml(q)}</textarea></div><div class="field"><label>Antwoord / uitleg</label><textarea class="question-a" placeholder="Schrijf hier het antwoord of de uitleg.">${escapeHtml(a)}</textarea></div>`,'question'))}
function addDictationRow(w=''){document.getElementById('dictationEditor').insertAdjacentHTML('beforeend',rowHtml(`<div class="field"><label>Dicteewoord</label><input class="dictation-w" value="${escapeAttr(w)}" placeholder="bijvoorbeeld beautiful"></div><div class="small">Dit woord wordt tijdens het dictee uitgesproken en niet op het scherm getoond.</div>`,'dictation'))}
function addCurrentRow(){const t=document.getElementById('lessonType').value;if(t==='words')addWordRow();else if(t==='questions')addQuestionRow();else addDictationRow()}
function collectItems(){const t=document.getElementById('lessonType').value;let items=[];if(t==='words')document.querySelectorAll('#wordEditor .editor-row').forEach((r,i)=>{const q=r.querySelector('.word-q').value.trim(),a=r.querySelector('.word-a').value.trim();if(q&&a)items.push({question:q,answer:a,sort_order:i})});if(t==='questions')document.querySelectorAll('#questionEditor .editor-row').forEach((r,i)=>{const q=r.querySelector('.question-q').value.trim(),a=r.querySelector('.question-a').value.trim();if(q&&a)items.push({question:q,answer:a,sort_order:i})});if(t==='dictation')document.querySelectorAll('#dictationEditor .editor-row').forEach((r,i)=>{const w=r.querySelector('.dictation-w').value.trim();if(w)items.push({question:w,answer:w,sort_order:i})});return items}
async function saveLesson(){if(!requireParent())return;const subject=document.getElementById('lessonSubject').value.trim(),title=document.getElementById('lessonName').value.trim(),type=document.getElementById('lessonType').value,items=collectItems(),err=document.getElementById('editorError');if(!subject||!title||!items.length){err.textContent='Vul het vak, de lestitel en minstens één item in.';err.classList.remove('hidden');return}err.classList.add('hidden');let lessonId=currentLesson?.id;let error;if(lessonId){({error}=await db.from('lessons').update({subject,title,type}).eq('id',lessonId));if(!error){({error}=await db.from('lesson_items').delete().eq('lesson_id',lessonId));if(!error){({error}=await db.from('lesson_items').insert(items.map(x=>({...x,lesson_id:lessonId})))});}}}else{const res=await db.from('lessons').insert({subject,title,type}).select().single();error=res.error;lessonId=res.data?.id;if(!error){({error}=await db.from('lesson_items').insert(items.map(x=>({...x,lesson_id:lessonId})))});}}if(error){err.textContent='Opslaan mislukt: '+error.message;err.classList.remove('hidden');return}currentSubject=subject;currentLesson=null;await loadLessons();showMessage('Les opgeslagen.','success')}
function editCurrentLesson(){if(!requireParent())return;const l=currentLesson;hideAll();document.getElementById('editor').classList.remove('hidden');document.getElementById('editorTitle').textContent='Les bewerken';document.getElementById('lessonSubject').value=l.subject;document.getElementById('lessonName').value=l.title;document.getElementById('lessonType').value=l.type;document.getElementById('wordEditor').innerHTML='';document.getElementById('questionEditor').innerHTML='';document.getElementById('dictationEditor').innerHTML='';l.lesson_items.forEach(it=>{if(l.type==='words')addWordRow(it.question,it.answer);else if(l.type==='questions')addQuestionRow(it.question,it.answer);else addDictationRow(it.question)});changeLessonType()}
async function deleteCurrentLesson(){if(!requireParent())return;if(!confirm('Deze hele les verwijderen?'))return;const {error}=await db.from('lessons').delete().eq('id',currentLesson.id);if(error){showMessage('Verwijderen mislukt: '+error.message,'error');return}const s=currentSubject;currentLesson=null;await loadLessons();currentSubject=s;showSubject(s);showMessage('Les verwijderd.','success')}
async function logoutParent(){const {error}=await db.auth.signOut();if(error){showMessage('Uitloggen mislukt: '+error.message,'error');return}currentSession=null;updateAuthUI(null);showHome()}
async function loginParent(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,error=document.getElementById('loginError');error.classList.add('hidden');const res=await db.auth.signInWithPassword({email,password});if(res.error){error.textContent='Inloggen mislukt. Controleer je e-mailadres en wachtwoord.';error.classList.remove('hidden');return}showHome()}

function startPractice(type){window.speechSynthesis?.cancel();activity={kind:'practice',type,items:shuffle(currentLesson.lesson_items),remaining:new Set(currentLesson.lesson_items.map(x=>x.id)),attempts:0,current:null,mode:null};hideAll();document.getElementById('practice').classList.remove('hidden');document.getElementById('practiceTitle').textContent=type==='dictation'?'✏️ Dictee oefenen':'🎯 Woordtrainer oefenen';renderPractice()}
function updatePracticeProgress(){const total=currentLesson.lesson_items.length,mastered=total-activity.remaining.size,pct=total?mastered/total*100:0;document.getElementById('practiceProgress').innerHTML=`<div class="progress-label"><span>${mastered} / ${total} beheerst</span><span>Nog ${total-mastered}</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>`}
function pickPracticeItem(){const rem=[...activity.remaining];if(!rem.length){finishPractice();return null}const candidates=currentLesson.lesson_items.filter(x=>activity.remaining.has(x.id));return candidates[Math.floor(Math.random()*candidates.length)]}
function renderPractice(){updatePracticeProgress();const item=pickPracticeItem();if(!item)return;activity.current=item;activity.mode=activity.type==='dictation'?'typing':(Math.random()<.72?'typing':'mc');const el=document.getElementById('practiceContent');if(activity.type==='dictation'){el.innerHTML=`<div class="dictation-word">Luister goed en schrijf het woord.</div><div style="margin:22px"><button class="speaker big" onclick="speakDictation()">🔊 Nog een keer</button></div><input id="practiceAnswer" class="answer-input" autofocus autocomplete="off" placeholder="Typ het woord"><div id="practiceFeedback" class="feedback"></div><button class="big" onclick="checkPractice()">Controleren</button>`;setTimeout(()=>{speakDictation();document.getElementById('practiceAnswer')?.focus()},350)}else if(activity.mode==='typing'){el.innerHTML=`<div class="small">Typ het Engelse antwoord.</div><div class="prompt">${escapeHtml(item.question)}</div><input id="practiceAnswer" class="answer-input" autofocus autocomplete="off" placeholder="Typ je antwoord"><div id="practiceFeedback" class="feedback"></div><button class="big" onclick="checkPractice()">Controleren</button>`}else{const opts=shuffle([item.answer,...shuffle(currentLesson.lesson_items.filter(x=>x.id!==item.id)).slice(0,3).map(x=>x.answer)]);el.innerHTML=`<div class="small">Kies het juiste antwoord.</div><div class="prompt">${escapeHtml(item.question)}</div><div class="mc-grid">${opts.map(o=>`<button onclick="checkPracticeMC('${escapeAttr(o)}')">${escapeHtml(o)}</button>`).join('')}</div><div id="practiceFeedback" class="feedback"></div>`}}
function speakDictation(){if(!activity?.current)return;const u=new SpeechSynthesisUtterance(activity.current.answer);u.lang='en-US';u.rate=.82;u.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
function checkPracticeMC(answer){const ok=normalize(answer)===normalize(activity.current.answer);const f=document.getElementById('practiceFeedback');if(ok){f.textContent='Goed! Nu moet je dit woord nog zelf kunnen typen.';f.className='feedback correct';setTimeout(()=>{activity.mode='typing';renderTypingAfterMC()},650)}else{f.textContent='Nog niet. Dit woord komt later terug.';f.className='feedback incorrect';setTimeout(()=>{renderPractice()},800)}}
function renderTypingAfterMC(){const item=activity.current;updatePracticeProgress();document.getElementById('practiceContent').innerHTML=`<div class="small">Typ nu zelf het antwoord.</div><div class="prompt">${escapeHtml(item.question)}</div><input id="practiceAnswer" class="answer-input" autofocus autocomplete="off" placeholder="Typ je antwoord"><div id="practiceFeedback" class="feedback"></div><button class="big" onclick="checkPractice()">Controleren</button>`;document.getElementById('practiceAnswer')?.focus()}
function checkPractice(){const input=document.getElementById('practiceAnswer');if(!input)return;const ok=normalize(input.value)===normalize(activity.current.answer),f=document.getElementById('practiceFeedback');activity.attempts++;if(ok){activity.remaining.delete(activity.current.id);f.textContent='✅ Goed gespeld!';f.className='feedback correct';setTimeout(renderPractice,650)}else{f.textContent='❌ Nog niet goed. Het woord komt later opnieuw terug.';f.className='feedback incorrect';setTimeout(renderPractice,900)}}
function finishPractice(){window.speechSynthesis?.cancel();const total=currentLesson.lesson_items.length;document.getElementById('practiceProgress').innerHTML=`<div class="progress-label"><span>🎉 ${total} / ${total} beheerst</span><span>Klaar!</span></div><div class="progress"><div class="progress-bar" style="width:100%"></div></div>`;document.getElementById('practiceContent').innerHTML=`<div class="result-score">🎉 Klaar!</div><p>Je hebt alle ${total} ${activity.type==='dictation'?'dicteewoorden':'woorden'} goed kunnen maken.</p><button class="big" onclick="showLessonChoice(currentLesson)">Terug naar de les</button>`;activity=null}

function startTest(type){window.speechSynthesis?.cancel();activity={kind:'test',type,items:shuffle(currentLesson.lesson_items),index:0,answers:[]};hideAll();document.getElementById('test').classList.remove('hidden');document.getElementById('testTitle').textContent=type==='dictation'?'✏️ Dictee toets':'📝 Woordtrainer toets';renderTest()}
function updateTestProgress(){const total=activity.items.length,i=activity.index;const pct=total?i/total*100:0;document.getElementById('testProgress').innerHTML=`<div class="progress-label"><span>Vraag ${Math.min(i+1,total)} van ${total}</span><span>${i} gemaakt</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>`}
function renderTest(){updateTestProgress();const item=activity.items[activity.index],el=document.getElementById('testContent');if(activity.type==='dictation'){el.innerHTML=`<div class="test-instructions">Luister naar het woord en typ precies wat je hoort. Je krijgt pas aan het einde te zien wat goed en fout was.</div><div style="margin:25px"><button class="speaker big" onclick="speakTest()">🔊 Luister</button></div><input id="testAnswer" class="answer-input" autofocus autocomplete="off" placeholder="Typ het woord"><div style="height:18px"></div><button class="big" onclick="submitTest()">Volgende →</button>`;setTimeout(()=>{speakTest();document.getElementById('testAnswer')?.focus()},350)}else{el.innerHTML=`<div class="test-instructions">Typ het Engelse antwoord. Je krijgt pas aan het einde de uitslag.</div><div class="prompt">${escapeHtml(item.question)}</div><input id="testAnswer" class="answer-input" autofocus autocomplete="off" placeholder="Typ je antwoord"><div style="height:18px"></div><button class="big" onclick="submitTest()">Volgende →</button>`;document.getElementById('testAnswer')?.focus()}}
function speakTest(){if(!activity?.current&&activity?.items){}const item=activity.items[activity.index];const u=new SpeechSynthesisUtterance(item.answer);u.lang='en-US';u.rate=.82;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
function submitTest(){const item=activity.items[activity.index],input=document.getElementById('testAnswer'),value=input?.value??'';activity.answers.push({item,value,correct:normalize(value)===normalize(item.answer)});activity.index++;if(activity.index>=activity.items.length){finishTest()}else renderTest()}
function finishTest(){window.speechSynthesis?.cancel();const total=activity.items.length,correct=activity.answers.filter(x=>x.correct).length,note=Math.round((correct/total*10)*10)/10;hideAll();document.getElementById('result').classList.remove('hidden');document.getElementById('resultTitle').textContent=activity.type==='dictation'?'✏️ Dictee klaar!':'📝 Toets klaar!';document.getElementById('resultScore').textContent=`${note.toFixed(1)}`;document.getElementById('resultDetails').innerHTML=`<p><strong>${correct} van ${total}</strong> goed.</p>`+activity.answers.map((x,i)=>`<div class="result-item ${x.correct?'correct':'incorrect'}"><strong>${i+1}. ${escapeHtml(x.item.question)}</strong><br>Jouw antwoord: ${escapeHtml(x.value||'—')}<br>${x.correct?'✓ Goed':'✗ Goed antwoord: '+escapeHtml(x.item.answer)}</div>`).join('');activity=null}
function startQuestions(){activity={kind:'questions',items:shuffle(currentLesson.lesson_items),index:0};hideAll();document.getElementById('practice').classList.remove('hidden');document.getElementById('practiceTitle').textContent='❓ Vragen';renderQuestion()}
function renderQuestion(){const item=activity.items[activity.index];document.getElementById('practiceProgress').innerHTML=`<div class="progress-label"><span>Vraag ${activity.index+1} van ${activity.items.length}</span></div><div class="progress"><div class="progress-bar" style="width:${activity.index/activity.items.length*100}%"></div></div>`;document.getElementById('practiceContent').innerHTML=`<div class="prompt">${escapeHtml(item.question)}</div><textarea id="questionAnswer" class="answer-input" style="width:100%;min-height:130px;text-align:left" placeholder="Schrijf je antwoord..."></textarea><div class="row" style="justify-content:center;margin-top:15px"><button class="big" onclick="revealQuestion()">Antwoord bekijken</button></div>`}
function revealQuestion(){const item=activity.items[activity.index],answer=document.getElementById('questionAnswer').value;document.getElementById('practiceContent').innerHTML=`<div class="prompt">${escapeHtml(item.question)}</div><div class="question-answer"><strong>Jouw antwoord:</strong><br>${escapeHtml(answer||'—')}<hr><strong>Voorbeeldantwoord:</strong><br>${escapeHtml(item.answer)}</div><div class="self-buttons"><button class="success" onclick="nextQuestion(true)">✓ Goed</button><button class="danger" onclick="nextQuestion(false)">✗ Nog niet</button></div>`}
function nextQuestion(){activity.index++;if(activity.index>=activity.items.length){document.getElementById('practiceContent').innerHTML=`<div class="result-score">Klaar!</div><p>Je hebt alle vragen bekeken.</p><button class="big" onclick="showLessonChoice(currentLesson)">Terug naar de les</button>`;activity=null;return}renderQuestion()}

function showLessonChoiceCompat(){openLesson(currentLesson.id)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(document.activeElement?.id==='practiceAnswer')checkPractice();if(document.activeElement?.id==='testAnswer')submitTest()}});
initializeApp();
</script>
</body>
</html>
