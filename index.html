<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacoGO!</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f7ff;
  color:#24324a
}

header{
  background:linear-gradient(135deg,#5b5ce2,#7467f0);
  color:white;
  padding:28px 22px 32px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px rgba(77,78,180,.18)
}

header h1{
  max-width:1000px;
  margin:auto;
  font-size:32px;
  font-weight:850;
  letter-spacing:-1px
}

.container{
  max-width:1000px;
  margin:30px auto 60px;
  padding:0 22px
}

h2{
  font-size:28px;
  margin:0 0 8px;
  font-weight:800
}

h3{
  font-size:21px;
  font-weight:800
}

.card{
  background:white;
  border-radius:24px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 8px 30px rgba(50,70,110,.09)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px
}

.big-button{
  width:100%;
  min-height:145px;
  padding:25px;
  border-radius:24px;
  border:0;
  font-size:22px;
  font-weight:850;
  color:white;
  background:linear-gradient(135deg,#5b5ce2,#7c6cf2);
  box-shadow:0 8px 0 #4546b5;
  transition:transform .15s ease,box-shadow .15s ease;
  cursor:pointer
}

.big-button:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 0 #4546b5
}

.big-button:active{
  transform:translateY(3px);
  box-shadow:0 5px 0 #4546b5
}

.lesson-button{
  display:flex;
  align-items:center;
  gap:16px;
  min-height:88px;
  width:100%;
  padding:16px 20px;
  margin-bottom:14px;
  text-align:left;
  border:0;
  border-radius:22px;
  background:linear-gradient(135deg,#8b8ff7,#a9a7ff);
  color:white;
  box-shadow:0 6px 0 #7477d9,0 10px 22px rgba(80,80,180,.10);
  cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease
}

.lesson-button:hover{
  transform:translateX(5px);
  box-shadow:0 9px 0 #7477d9,0 14px 25px rgba(80,80,180,.14)
}

.lesson-button:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 #7477d9
}

.lesson-icon{
  width:50px;
  height:50px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:rgba(255,255,255,.22);
  font-size:27px
}

.lesson-info{
  flex:1
}

.lesson-title{
  display:block;
  font-size:18px;
  font-weight:800;
  line-height:1.25
}

.lesson-count{
  display:block;
  margin-top:5px;
  color:rgba(255,255,255,.82);
  font-size:14px;
  font-weight:600
}

.lesson-arrow{
  font-size:34px;
  font-weight:300;
  color:rgba(255,255,255,.8)
}

button{
  border:0;
  border-radius:14px;
  padding:13px 19px;
  font-size:15px;
  font-weight:750;
  cursor:pointer;
  background:#5b5ce2;
  color:white;
  transition:transform .15s ease,opacity .15s ease
}

button:hover{
  opacity:.95;
  transform:translateY(-2px)
}

button.secondary{
  background:#e9edfa;
  color:#34415a
}

button.green{
  background:#20c997
}

button.danger{
  background:#f05b6f
}

input,textarea,select{
  width:100%;
  padding:14px 15px;
  border:2px solid #e3e8f5;
  border-radius:13px;
  font-size:16px;
  background:white;
  color:#24324a;
  font-family:inherit;
  margin-top:6px;
  margin-bottom:16px
}

input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:#7467f0;
  box-shadow:0 0 0 4px rgba(116,103,240,.12)
}

textarea{
  min-height:90px;
  resize:vertical
}

label{
  font-weight:750;
  color:#34415a
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap
}

.row>*{
  flex:1
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:22px
}

.hidden{
  display:none!important
}

.word{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  align-items:center;
  margin-bottom:12px
}

.question-card{
  background:#f8f9ff;
  border:2px solid #e5e9f6;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  white-space:pre-line
}

.quiz-question{
  font-size:36px;
  line-height:1.3;
  font-weight:850;
  text-align:center;
  color:#24324a;
  background:linear-gradient(135deg,#fff,#f7f8ff);
  border-radius:28px;
  padding:50px 35px;
  margin:30px 0 22px;
  border:3px solid #e4e7ff;
  box-shadow:0 10px 0 #dfe3f7,0 15px 30px rgba(50,70,110,.10);
  white-space:pre-line
}

.score{
  font-size:28px;
  font-weight:850;
  text-align:center
}

.small{
  color:#718096;
  font-size:14px
}

.error{
  background:#fff0f1;
  color:#c53045;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:16px
}

.success{
  background:#e9fbf4;
  color:#087f5b;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:16px
}

.subject-blue{
  background:linear-gradient(135deg,#3b82f6,#60a5fa)
}

.subject-purple{
  background:linear-gradient(135deg,#8b5cf6,#a78bfa)
}

.subject-green{
  background:linear-gradient(135deg,#10b981,#34d399)
}

.subject-orange{
  background:linear-gradient(135deg,#f97316,#fb923c)
}

.subject-pink{
  background:linear-gradient(135deg,#ec4899,#f472b6)
}

.subject-cyan{
  background:linear-gradient(135deg,#06b6d4,#22d3ee)
}

.subject-icon{
  display:block;
  font-size:48px;
  margin-bottom:12px
}

.subject-name{
  display:block;
  font-size:23px;
  font-weight:850
}

.subject-count{
  display:block;
  margin-top:7px;
  font-size:15px;
  font-weight:600;
  opacity:.9
}

#lessonChoice .card{
  text-align:center;
  padding:35px 30px
}

#lessonChoice h2{
  font-size:30px;
  margin-bottom:10px
}

#lessonChoice .small{
  font-size:16px;
  margin-bottom:28px
}

#lessonChoice .row{
  gap:18px
}

#lessonChoice .big-button{
  min-height:135px;
  font-size:20px
}

#lessonChoice .green{
  background:linear-gradient(135deg,#10b981,#34d399);
  box-shadow:0 7px 0 #087f5b
}

.quiz-action{
  display:flex;
  justify-content:center;
  margin:8px 0 18px
}

.quiz-listen-button{
  width:auto;
  min-height:0;
  padding:8px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  box-shadow:none
}

.quiz-input-wrap{
  margin:18px 0 14px
}

.quiz-input-label{
  display:block;
  text-align:left;
  margin:0 0 8px;
  font-size:15px;
  font-weight:800;
  color:#34415a
}

#quizContent #quizInput{
  width:100%;
  min-height:72px;
  margin:0 0 14px;
  padding:18px 20px;
  border:3px solid #bfc7e8;
  border-radius:18px;
  background:#fff;
  font-size:24px;
  font-weight:650;
  text-align:center;
  box-shadow:0 5px 16px rgba(50,70,110,.07)
}

#quizContent textarea#quizInput{
  min-height:150px;
  text-align:left;
  line-height:1.45;
  resize:vertical
}

.quiz-submit{
  display:block;
  width:auto;
  min-height:0;
  margin:0 auto;
  padding:12px 26px;
  border-radius:14px;
  font-size:16px;
  box-shadow:0 4px 0 #4546b5
}

.dictation-sound{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin:10px 0 20px
}

.dictation-word{
  font-size:20px;
  font-weight:800;
  text-align:center;
  padding:18px;
  background:#f8f9ff;
  border-radius:18px;
  margin-bottom:18px
}

.quiz-progress-bar{
  height:12px;
  background:#e7eaf5;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0 20px
}

.quiz-progress-fill{
  height:100%;
  background:linear-gradient(90deg,#5b5ce2,#20c997);
  transition:width .3s ease
}

.empty-state{
  text-align:center;
  padding:45px 20px;
  color:#718096
}

.empty-state .emoji{
  font-size:55px;
  margin-bottom:15px
}

@media(max-width:600px){

  header{
    padding:23px 18px 27px;
    border-radius:0 0 24px 24px
  }

  header h1{
    font-size:26px
  }

  .container{
    margin-top:22px;
    padding:0 15px
  }

  .card{
    padding:20px;
    border-radius:20px
  }

  .big-button{
    min-height:115px;
    font-size:19px
  }

  .quiz-question{
    font-size:27px
  }

  .word{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 PacoGO!</h1>
</header>

<div class="container">

<div id="message"></div>

<!-- LOGIN -->

<section id="login" class="hidden">

  <div class="card">

    <h2>🔐 Ouder login</h2>

    <p class="small">
      Log in om lessen te maken en te bewerken.
    </p>

    <label>E-mailadres</label>
    <input
      id="loginEmail"
      type="email"
      autocomplete="email"
      placeholder="Jouw e-mailadres"
    >

    <label>Wachtwoord</label>
    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Wachtwoord"
    >

    <div id="loginError" class="error hidden"></div>

    <div class="row">
      <button onclick="loginParent()">Inloggen</button>
      <button class="secondary" onclick="showHome()">Annuleren</button>
    </div>

  </div>

</section>


<!-- HOME -->

<section id="home">

  <div class="topbar">

    <h2>Vakken</h2>

    <div class="row">

      <button
        id="loginButton"
        class="secondary"
        onclick="showLogin()"
      >
        🔐 Ouder login
      </button>

      <button
        id="logoutButton"
        class="secondary hidden"
        onclick="logoutParent()"
      >
        🚪 Uitloggen
      </button>

      <button
        id="addLessonButton"
        class="hidden"
        onclick="showAddLesson()"
      >
        ➕ Nieuwe les
      </button>

    </div>

  </div>

  <div id="subjects" class="grid"></div>

</section>


<!-- LESSON LIST -->

<section id="lessonList" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="showHome()">
      ← Terug
    </button>

    <button
      id="addLessonButton2"
      class="hidden"
      onclick="showAddLesson(currentSubject)"
    >
      ➕ Nieuwe les
    </button>

  </div>

  <h2 id="subjectTitle"></h2>

  <div id="lessons"></div>

</section>


<!-- LESSON EDITOR -->

<section id="lessonEditor" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>

  </div>

  <div class="card">

    <h2 id="editorTitle">Nieuwe les</h2>

    <label>Vak</label>

    <input
      id="subjectInput"
      placeholder="Bijvoorbeeld 🇬🇧 Engels"
    >

    <label>Naam van de les</label>

    <input
      id="titleInput"
      placeholder="Bijvoorbeeld Les 3 – Dieren"
    >

    <label>Type les</label>

    <select
      id="typeInput"
      onchange="changeLessonType()"
    >
      <option value="words">🎯 Woordtrainer</option>
      <option value="questions">❓ Vragen</option>
      <option value="dictation">✏️ Dictee</option>
    </select>


    <!-- WOORDEN -->

    <div id="wordsEditor">

      <h3>Woorden</h3>

      <div id="wordRows"></div>

      <button
        class="secondary"
        onclick="addWordRow()"
      >
        ➕ Woord toevoegen
      </button>

    </div>


    <!-- VRAGEN -->

    <div id="questionsEditor" class="hidden">

      <h3>Vragen</h3>

      <div id="questionRows"></div>

      <button
        class="secondary"
        onclick="addQuestionRow()"
      >
        ➕ Vraag toevoegen
      </button>

    </div>


    <!-- DICTEE -->

    <div id="dictationEditor" class="hidden">

      <h3>Dicteewoorden</h3>

      <p class="small">
        Bij dictee wordt het woord uitgesproken.
        De leerling hoort het woord en typt daarna de spelling.
      </p>

      <div id="dictationRows"></div>

      <button
        class="secondary"
        onclick="addDictationRow()"
      >
        ➕ Woord toevoegen
      </button>

    </div>

    <br><br>

    <button onclick="saveLesson()">
      💾 Opslaan
    </button>

  </div>

</section>


<!-- LESSON CHOICE -->

<section id="lessonChoice" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>

  </div>

  <div class="card">

    <h2 id="choiceTitle"></h2>

    <p class="small">
      Wil je de les eerst bekijken of jezelf meteen overhoren?
    </p>

    <div class="row">

      <button
        class="big-button"
        onclick="showLesson()"
      >
        📖 Les bekijken
      </button>

      <button
        class="green big-button"
        onclick="startQuiz('practice')"
      >
        🎯 Overhoren
      </button>

      <button
        class="big-button"
        onclick="startQuiz('test')"
      >
        📝 Toets
      </button>

    </div>

  </div>

</section>


<!-- LESSON VIEW -->

<section id="lessonView" class="hidden">

  <div class="topbar">

    <button class="secondary" onclick="goBack()">
      ← Terug
    </button>

    <div>

      <button
        id="editLessonButton"
        class="hidden"
        onclick="editCurrentLesson()"
      >
        ✏️ Bewerken
      </button>

      <button
        id="deleteLessonButton"
        class="danger hidden"
        onclick="deleteCurrentLesson()"
      >
        🗑️ Verwijderen
      </button>

    </div>

  </div>

  <div class="card">

    <h2 id="viewTitle"></h2>

    <p id="viewInfo" class="small"></p>

    <div id="viewItems"></div>

    <br>

    <button
      class="green big-button"
      onclick="startQuiz('practice')"
    >
      ▶️ Overhoren
    </button>

  </div>

</section>


<!-- QUIZ -->

<section id="quiz" class="hidden">

  <div class="topbar">

    <button
      class="secondary"
      onclick="showLesson()"
    >
      ← Stoppen
    </button>

  </div>

  <div class="card">

    <div id="quizProgress" class="small"></div>

    <div class="quiz-progress-bar">
      <div
        id="quizProgressFill"
        class="quiz-progress-fill"
        style="width:0%"
      ></div>
    </div>

    <div id="quizContent"></div>

  </div>

</section>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ncpkqrvxljxwboavxtak.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skiKpO4UU79zWY7hskHsoA_WQxA6CFc";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   PARENT ACCOUNTS
========================================================= */

const PARENT_IDS = new Set([
  "5d0e1e5c-1dbe-4909-bd3a-81a1e7b26d09",
  "418833d5-049a-4ec9-8072-2d48a85f04b1"
]);


/* =========================================================
   STATE
========================================================= */

let currentSession = null;
let allLessons = [];
let currentSubject = "";
let currentLesson = null;
let editingLessonId = null;

let quizItems = [];
let quizQueue = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizWrongCount = 0;
let quizMode = "practice";
let quizTotal = 0;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value){
  return escapeHtml(value);
}


function showMessage(msg,type){

  const msgEl =
    document.getElementById("message");

  msgEl.textContent = msg;
  msgEl.className = type;

  setTimeout(()=>{
    msgEl.textContent = "";
    msgEl.className = "";
  },4000);
}


/* =========================================================
   AUTH
========================================================= */

function isParentLoggedIn(){

  return !!currentSession &&
    PARENT_IDS.has(currentSession.user.id);
}


function updateAuthUI(session){

  currentSession = session;

  const loggedIn =
    isParentLoggedIn();

  document
    .getElementById("loginButton")
    ?.classList
    .toggle("hidden",loggedIn);

  document
    .getElementById("logoutButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("addLessonButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("addLessonButton2")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("editLessonButton")
    ?.classList
    .toggle("hidden",!loggedIn);

  document
    .getElementById("deleteLessonButton")
    ?.classList
    .toggle("hidden",!loggedIn);
}


async function loginParent(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    showMessage(
      "Vul e-mailadres en wachtwoord in",
      "error"
    );

    return;
  }

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    const loginError =
      document.getElementById("loginError");

    loginError.textContent =
      "Login mislukt. Controleer je gegevens.";

    loginError.classList.remove("hidden");

    return;
  }

  document
    .getElementById("loginError")
    .classList
    .add("hidden");

  updateAuthUI(data.session);

  showMessage(
    "Succesvol ingelogd!",
    "success"
  );

  setTimeout(
    ()=>showHome(),
    500
  );
}


async function logoutParent(){

  await db.auth.signOut();

  currentSession = null;

  updateAuthUI(null);

  showMessage(
    "Uitgelogd",
    "success"
  );

  showHome();
}


async function checkAuth(){

  const {data} =
    await db.auth.getSession();

  updateAuthUI(data.session || null);
}


/* =========================================================
   NAVIGATION
========================================================= */

function hideAllSections(){

  [
    "home",
    "login",
    "lessonList",
    "lessonEditor",
    "lessonChoice",
    "lessonView",
    "quiz"
  ].forEach(id=>{
    document
      .getElementById(id)
      .classList
      .add("hidden");
  });
}


function showHome(){

  hideAllSections();

  document
    .getElementById("home")
    .classList
    .remove("hidden");

  loadSubjects();
}


function showLogin(){

  hideAllSections();

  document
    .getElementById("login")
    .classList
    .remove("hidden");

  document
    .getElementById("loginEmail")
    .focus();
}


function showAddLesson(subject){

  if(!isParentLoggedIn()){

    showMessage(
      "Je moet als ouder ingelogd zijn.",
      "error"
    );

    return;
  }

  editingLessonId = null;
  currentLesson = null;

  currentSubject = subject || "";

  document
    .getElementById("subjectInput")
    .value = currentSubject;

  document
    .getElementById("titleInput")
    .value = "";

  document
    .getElementById("typeInput")
    .value = "words";

  clearWordRows();
  clearQuestionRows();
  clearDictationRows();

  addWordRow();

  changeLessonType();

  document
    .getElementById("editorTitle")
    .textContent = "Nieuwe les";

  hideAllSections();

  document
    .getElementById("lessonEditor")
    .classList
    .remove("hidden");
}


function goBack(){

  if(
    document
      .getElementById("lessonEditor")
      .classList
      .contains("hidden") === false
  ){

    if(currentSubject){
      showSubject(currentSubject);
    }else{
      showHome();
    }

    return;
  }

  if(currentLesson){

    if(currentSubject){
      showSubject(currentSubject);
    }else{
      showHome();
    }

    return;
  }

  showHome();
}


/* =========================================================
   SUBJECTS
========================================================= */

async function loadSubjects(){

  const subjectsEl =
    document.getElementById("subjects");

  subjectsEl.innerHTML = `
    <div class="card empty-state">
      <div class="emoji">⏳</div>
      <div>Vakken laden...</div>
    </div>
  `;

  const {data,error} =
    await db
      .from("lessons")
      .select("id,subject,title,type,created_at")
      .order("created_at",{ascending:false});

  if(error){

    console.error(
      "Error loading subjects:",
      error
    );

    subjectsEl.innerHTML = `
      <div class="card error">
        <strong>De lessen konden niet worden geladen.</strong><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }

  allLessons = data || [];

  if(allLessons.length === 0){

    subjectsEl.innerHTML = `
      <div class="card empty-state">
        <div class="emoji">📚</div>
        <strong>Nog geen lessen</strong>
      </div>
    `;

    return;
  }

  const subjectMap = new Map();

  allLessons.forEach(lesson=>{

    const subject =
      lesson.subject || "Overig";

    if(!subjectMap.has(subject)){
      subjectMap.set(subject,[]);
    }

    subjectMap.get(subject).push(lesson);
  });

  const colors = [
    "subject-blue",
    "subject-purple",
    "subject-green",
    "subject-orange",
    "subject-pink",
    "subject-cyan"
  ];

  const subjects =
    Array.from(subjectMap.entries());

  subjectsEl.innerHTML =
    subjects.map(([subject,lessons],index)=>{

      const color =
        colors[index % colors.length];

      return `
        <div
          class="card ${color}"
          style="color:white;cursor:pointer;padding:30px;text-align:center"
          data-subject="${escapeAttribute(subject)}"
          onclick="showSubject(this.dataset.subject)"
        >

          <span class="subject-icon">📚</span>

          <span class="subject-name">
            ${escapeHtml(subject)}
          </span>

          <span class="subject-count">
            ${lessons.length}
            ${lessons.length === 1 ? "les" : "lessen"}
          </span>

        </div>
      `;

    }).join("");
}

async function showSubject(subject){

  document
    .getElementById("subjectTitle")

      </div>
    `;

  const {data,error} =
    await db
      .from("lessons")
      .select("id,subject,title,type,created_at")
      .eq("subject",subject)
      .order("created_at",{ascending:false});

  if(error){

    console.error(
      "Error loading lessons:",
      error
    );

    document
      .getElementById("lessons")
      .innerHTML = `
        <div class="error">
          ${escapeHtml(error.message)}
        </div>

  }

  allLessons = data || [];

          <div class="emoji">📖</div>
          <strong>Geen lessen gevonden.</strong>

  }

  const html =
    allLessons.map(lesson=>{

        lesson.type === "words"

          : lesson.type === "questions"
            ? "❓ Vragen"
            : "✏️ Dictee";

      return `
        <button
          class="lesson-button"
          data-id="${lesson.id}"
          onclick="selectLesson(this.dataset.id)"
        >

            ${lesson.type === "words"
              ? "🎯"
              : lesson.type === "questions"

          <span class="lesson-info">

            <span class="lesson-title">
              ${escapeHtml(lesson.title)}
            </span>

            <span class="lesson-count">
              ${type}
            </span>

          </span>

          <span class="lesson-arrow">›</span>

        </button>
      `;

    }).join("");

  document
    .getElementById("lessons")
    .innerHTML = html;
}


/* =========================================================
   LOAD LESSON WITH ITEMS
========================================================= */

async function loadLesson(lessonId){

  const {data:lesson,error:lessonError} =
    await db
      .from("lessons")
      .select("id,subject,title,type,created_at")
      .eq("id",lessonId)
      .single();

  if(lessonError){
    throw lessonError;
  }

  const {data:items,error:itemError} =
    await db
      .from("lesson_items")
      .select("id,lesson_id,question,answer,sort_order")
      .eq("lesson_id",lessonId)
      .order("sort_order",{ascending:true});

  if(itemError){
    throw itemError;
  }

  lesson.items = items || [];

  return lesson;
}


/* =========================================================
   SELECT LESSON
========================================================= */

async function selectLesson(lessonId){

  try{

    currentLesson =
      await loadLesson(lessonId);

    currentSubject =
      currentLesson.subject;

    document
      .getElementById("choiceTitle")
      .textContent =
      currentLesson.title;

    hideAllSections();

    document

  }catch(error){

    console.error(
      "Error loading lesson:",
      error
    );

    showMessage(
      "De les kon niet worden geladen: " +
      error.message,
      "error"
    );
  }
}

========================================================= */

async function editCurrentLesson(){

  if(!isParentLoggedIn()){
    showMessage(
      "Je moet als ouder ingelogd zijn.",
      "error"
    );
    return;
  }

  if(!currentLesson){
    return;
  }

  editingLessonId =
    currentLesson.id;

  document
    .getElementById("editorTitle")
    .textContent = "Les bewerken";

  document
    .getElementById("subjectInput")
    .value =
      currentLesson.subject || "";

  document
    .getElementById("titleInput")
    .value =
      currentLesson.title || "";

  document
    .getElementById("typeInput")
    .value =
      currentLesson.type || "words";

  clearWordRows();
  clearQuestionRows();
  clearDictationRows();

  const items =
    currentLesson.items || [];

  if(currentLesson.type === "words"){

    items.forEach(item=>{

      addWordRow();

      const rows =
        document.querySelectorAll(
          "#wordRows .word"
        );

      const last =
        rows[rows.length - 1];

      const inputs =
        last.querySelectorAll("input");

      inputs[0].value =
        item.question || "";

      inputs[1].value =
        item.answer || "";
    });

    if(items.length === 0){
      addWordRow();
    }
  }


  if(currentLesson.type === "questions"){

    items.forEach(item=>{

      addQuestionRow();

      const rows =
        document.querySelectorAll(
          "#questionRows .question-card"
        );

      const last =
        rows[rows.length - 1];

      const inputs =
        last.querySelectorAll("input");

      inputs[0].value =
        item.question || "";

      inputs[1].value =
        item.answer || "";
    });

    if(items.length === 0){
      addQuestionRow();
    }
  }


  if(currentLesson.type === "dictation"){

    items.forEach(item=>{

      addDictationRow();

      const rows =
        document.querySelectorAll(
          "#dictationRows .dictation-word"
        );

      const last =
        rows[rows.length - 1];

      const input =
        last.querySelector("input");

      input.value =
        item.question || "";
    });

    if(items.length === 0){
      addDictationRow();
    }
  }

  changeLessonType();

  hideAllSections();

  document
    .getElementById("lessonEditor")
    .classList
    .remove("hidden");
}

/* =========================================================
   SAVE LESSON
========================================================= */

async function saveLesson(){

  if(!isParentLoggedIn()){

    showMessage(
      "Je moet als ouder ingelogd zijn.",
      "error"
    );

    return;
  }

  const subject =
    document
      .getElementById("subjectInput")
      .value
      .trim();

  const title =
    document
      .getElementById("titleInput")
      .value
      .trim();

  const type =
    document
      .getElementById("typeInput")
      .value;

  if(!subject || !title){

    showMessage(
      "Vul vak en lestitel in.",
      "error"
    );

    return;
  }

  let items = [];


  /* WOORDEN */

  if(type === "words"){

    const rows =
      document.querySelectorAll(
        "#wordRows .word"
      );

    items =
      Array.from(rows)
        .map((row,index)=>{

          const inputs =
            row.querySelectorAll("input");

          return {
            question:
              inputs[0].value.trim(),

            answer:
              inputs[1].value.trim(),

            sort_order:
              index + 1
          };

        })
        .filter(
          item =>
            item.question &&
            item.answer
        );
  }


  /* VRAGEN */

  if(type === "questions"){

    const rows =
      document.querySelectorAll(
        "#questionRows .question-card"
      );

    items =
      Array.from(rows)
        .map((row,index)=>{

          const inputs =
            row.querySelectorAll("input");

          return {
            question:
              inputs[0].value.trim(),

            answer:
              inputs[1].value.trim(),

            sort_order:
              index + 1
          };

        })
        .filter(
          item =>
            item.question &&
            item.answer
        );
  }


  /* DICTEE */

  if(type === "dictation"){

    const rows =
      document.querySelectorAll(
        "#dictationRows .dictation-word"
      );

    items =
      Array.from(rows)
        .map((row,index)=>{

          const input =
            row.querySelector("input");

          const word =
            input.value.trim();

          return {
            question:word,
            answer:word,
            sort_order:index + 1
          };

        })
        .filter(
          item =>
            item.question
        );
  }


  if(items.length === 0){

    showMessage(
      "Voeg minstens één item toe.",
      "error"
    );

    return;
  }


  /* =====================================================
     UPDATE EXISTING LES
  ===================================================== */

  if(editingLessonId){

    const {error:lessonError} =
      await db
        .from("lessons")
        .update({
          subject,
          title,
          type
        })
        .eq("id",editingLessonId);

    if(lessonError){

      console.error(
        lessonError
      );

      showMessage(
        "Fout bij opslaan: " +
        lessonError.message,
        "error"
      );

      return;
    }


    /* Oude items verwijderen */

    const {error:deleteError} =
      await db
        .from("lesson_items")
        .delete()
        .eq(
          "lesson_id",
          editingLessonId
        );

    if(deleteError){

      console.error(
        deleteError
      );

      showMessage(
        "Fout bij bijwerken van de lesitems: " +
        deleteError.message,
        "error"
      );

      return;
    }


    /* Nieuwe items plaatsen */

    const rowsToInsert =
      items.map(item=>({
        lesson_id:
          editingLessonId,

        question:
          item.question,

        answer:
          item.answer,

        sort_order:
          item.sort_order
      }));

    const {error:itemError} =
      await db
        .from("lesson_items")
        .insert(rowsToInsert);

    if(itemError){

      console.error(
        itemError
      );

      showMessage(
        "Les opgeslagen, maar items konden niet worden toegevoegd: " +
        itemError.message,
        "error"
      );

      return;
    }

    showMessage(
      "Les bijgewerkt!",
      "success"
    );

  }


  /* =====================================================
     NIEUWE LES
  ===================================================== */

  else{

    const {data:lesson,error:lessonError} =
      await db
        .from("lessons")
        .insert([{
          subject,
          title,
          type
        }])
        .select()
        .single();

    if(lessonError){

      console.error(
        lessonError
      );

      showMessage(
        "Fout bij maken van les: " +
        lessonError.message,
        "error"
      );

      return;
    }


    const rowsToInsert =
      items.map(item=>({

        lesson_id:
          lesson.id,

        question:
          item.question,

        answer:
          item.answer,

        sort_order:
          item.sort_order

      }));


    const {error:itemError} =
      await db
        .from("lesson_items")
        .insert(rowsToInsert);


    if(itemError){

      console.error(
        itemError
      );

      /*
       * Probeer de lege les op te ruimen
       * wanneer de items niet konden worden opgeslagen.
       */

      await db
        .from("lessons")
        .delete()
        .eq("id",lesson.id);

      showMessage(
        "Les kon niet volledig worden opgeslagen: " +
        itemError.message,
        "error"
      );

      return;
    }

    showMessage(
      "Les opgeslagen!",
      "success"
    );
  }


  editingLessonId = null;

  setTimeout(
    ()=>showHome(),
    700
  );
}

/* =========================================================
   QUIZ
========================================================= */

function startQuiz(mode){

  if(!currentLesson){
    return;
  }

  quizMode = mode;

  const lesson =
    currentLesson;

  quizItems = [];


  if(lesson.type === "words"){

    quizItems =
      lesson.items.map((item,index)=>({

        id:index,

        question:
          item.question,

        answer:
          item.answer
            .toLowerCase()
            .trim(),

        type:"translation"

      }));
  }


  if(lesson.type === "questions"){

    quizItems =
      lesson.items.map((item,index)=>({

        id:index,

        question:
          item.question,

        answer:
          item.answer
            .toLowerCase()
            .trim(),

        type:"question"

      }));
  }


  if(lesson.type === "dictation"){

    quizItems =
      lesson.items.map((item,index)=>({

        id:index,

        word:
          item.question,

        type:"dictation"

      }));
  }


  if(quizItems.length === 0){

    showMessage(
      "Deze les bevat geen vragen.",
      "error"
    );

    return;
  }


  quizQueue =
    [...quizItems];


  if(quizMode === "practice"){

    for(
      let i = quizQueue.length - 1;
      i > 0;
      i--
    ){

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        quizQueue[i],
        quizQueue[j]
      ] =
      [
        quizQueue[j],
        quizQueue[i]
      ];
    }
  }


  quizIndex = 0;
  quizScore = 0;
  quizWrongCount = 0;
  quizAnswered = false;
  quizTotal = quizQueue.length;


  hideAllSections();

  document
    .getElementById("quiz")
    .classList
    .remove("hidden");

  renderQuiz();
}


/* =========================================================
   RENDER QUIZ
========================================================= */

function renderQuiz(){

  if(quizIndex >= quizQueue.length){

    showQuizResult();

    return;
  }

  quizAnswered = false;

  const item =
    quizQueue[quizIndex];

  const progress =
    `Vraag ${quizIndex + 1} van ${quizTotal}`;

  document
    .getElementById("quizProgress")
    .textContent =
      progress;

  document
    .getElementById("quizProgressFill")
    .style.width =
      ((quizIndex / quizTotal) * 100) + "%";


  let html = "";


  if(
    item.type === "translation" ||
    item.type === "question"
  ){

    html = `

      <div class="quiz-question">
        ${escapeHtml(item.question)}
      </div>

      <div class="quiz-input-wrap">

        <label class="quiz-input-label">
          Jouw antwoord:
        </label>

        <textarea
          id="quizInput"
          placeholder="Typ je antwoord hier..."
          onkeypress="
            if(event.key==='Enter'&&!event.shiftKey){
              event.preventDefault();
              checkAnswer();
            }
          "
        ></textarea>

      </div>

      <div style="text-align:center">

        <button
          class="quiz-submit"
          onclick="checkAnswer()"
        >
          ✓ Controleer
        </button>

      </div>

      <div id="quizResult"></div>

    `;
  }


  if(item.type === "dictation"){

    html = `

      <div class="dictation-sound">
        🔊 Luister naar het woord
      </div>

      <div style="text-align:center;margin-bottom:20px">

        <button
          class="quiz-listen-button"
          onclick="speakDictationWord()"
        >
          🔊 Woord opnieuw horen
        </button>

      </div>

      <div class="quiz-input-wrap">

        <label class="quiz-input-label">
          Typ het woord:
        </label>

        <input
          id="quizInput"
          type="text"
          placeholder="Typ het woord hier..."
          onkeypress="
            if(event.key==='Enter'){
              event.preventDefault();
              checkAnswer();
            }
          "
        >

      </div>

      <div style="text-align:center">

        <button
          class="quiz-submit"
          onclick="checkAnswer()"
        >
          ✓ Controleer
        </button>

      </div>

      <div id="quizResult"></div>

    `;
  }


  document
    .getElementById("quizContent")
    .innerHTML =
      html;

  const input =
    document.getElementById("quizInput");

  input.focus();


  if(item.type === "dictation"){

    setTimeout(
      ()=>speakDictationWord(),
      400
    );
  }
}


/* =========================================================
   SPEECH
========================================================= */

function speakDictationWord(){

  if(!quizQueue[quizIndex]){
    return;
  }

  const item =
    quizQueue[quizIndex];

  if(item.type !== "dictation"){
    return;
  }

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        item.word
      );

    utterance.lang =
      "nl-NL";

    utterance.rate =
      0.85;

    speechSynthesis.speak(
      utterance
    );
  }
}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

  if(quizAnswered){

    nextQuizQuestion();

    return;
  }

  const item =
    quizQueue[quizIndex];

  const input =
    document.getElementById("quizInput");

  const userAnswer =
    input.value
      .toLowerCase()
      .trim();

  quizAnswered = true;

  let isCorrect = false;


  if(item.type === "dictation"){

    isCorrect =
      userAnswer ===
      item.word
        .toLowerCase()
        .trim();

  }else{

    isCorrect =
      userAnswer ===
      item.answer;
  }


  if(isCorrect){
    quizScore++;
  }else{
    quizWrongCount++;
  }


  const resultDiv =
    document.getElementById(
      "quizResult"
    );


  if(isCorrect){

    resultDiv.className =
      "success";

    resultDiv.innerHTML = `
      <strong>✓ Correct!</strong>
    `;

  }else{

    resultDiv.className =
      "error";

    if(item.type === "dictation"){

      resultDiv.innerHTML = `
        <strong>✗ Helaas, niet goed</strong><br>
        Het juiste woord is:
        <strong>${escapeHtml(item.word)}</strong><br>
        Jij typte:
        <strong>${escapeHtml(userAnswer || "(leeg)")}</strong>
      `;

    }else{

      resultDiv.innerHTML = `
        <strong>✗ Helaas, niet goed</strong><br>
        Juiste antwoord:<br>
        <strong>${escapeHtml(item.answer)}</strong><br><br>
        Jij typte:<br>
        <strong>${escapeHtml(userAnswer || "(leeg)")}</strong>
      `;
    }
  }


  input.disabled = true;


  const button =
    document.querySelector(
      ".quiz-submit"
    );

  button.textContent =
    "→ Volgende";
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuizQuestion(){

  quizIndex++;

  quizAnswered = false;

  renderQuiz();
}


/* =========================================================
   QUIZ RESULT
========================================================= */

function showQuizResult(){

  const percentage =
    quizTotal === 0
      ? 0
      : Math.round(
          (quizScore / quizTotal) * 100
        );

  let message = "";
  let emoji = "";


  if(percentage === 100){

    message =
      "Briljant! Perfect!";

    emoji = "🌟";

  }else if(percentage >= 80){

    message =
      "Geweldig gedaan!";

    emoji = "🎉";

  }else if(percentage >= 60){

    message =
      "Goed werk!";

    emoji = "👏";

  }else if(percentage >= 40){

    message =
      "Niet slecht, maar oefenen kan altijd beter!";

    emoji = "💪";

  }else{

    message =
      "Nog wat oefenen nodig!";

    emoji = "📚";
  }


  const html = `

    <div
      style="text-align:center;padding:30px 0"
    >

      <div
        style="font-size:64px;margin-bottom:20px"
      >
        ${emoji}
      </div>

      <div class="score">
        ${message}
      </div>

      <div
        class="score"
        style="font-size:48px;color:#5b5ce2;margin:20px 0"
      >
        ${percentage}%
      </div>

      <div
        class="small"
        style="font-size:18px"
      >
        Je had
        ${quizScore}
        van de
        ${quizTotal}
        correct!
      </div>

      <div
        style="
          margin-top:30px;
          display:flex;
          gap:12px;
          justify-content:center;
          flex-wrap:wrap
        "
      >

        <button
          class="green big-button"
          onclick="startQuiz('practice')"
          style="min-height:120px;flex-basis:45%"
        >
          🔄 Opnieuw oefenen
        </button>

        <button
          class="big-button"
          onclick="showLesson()"
          style="min-height:120px;flex-basis:45%"
        >
          📖 Les bekijken
        </button>

        <button
          class="big-button"
          onclick="showHome()"
          style="
            min-height:120px;
            flex-basis:100%;
            font-size:24px
          "
        >
          ← Terug naar home
        </button>

      </div>

    </div>

  `;


  document
    .getElementById("quizContent")
    .innerHTML =
      html;

  document
    .getElementById("quizProgress")
    .textContent =
      "Klaar!";

  document
    .getElementById("quizProgressFill")
    .style.width =
      "100%";
}

  }

(async function(){

  await checkAuth();

</script>
