<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacoGO!</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 18px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 16px 60px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      margin: 5px 4px 5px 0;
    }

    button:hover {
      opacity: .9;
    }

    button.secondary {
      background: #64748b;
    }

    button.danger {
      background: #dc2626;
    }

    button.green {
      background: #16a34a;
    }

    button.small {
      padding: 8px 12px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin: 6px 0 14px;
      font-family: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .lesson-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .lesson-card h3 {
      margin: 0 0 5px;
    }

    .muted {
      color: #64748b;
      font-size: 14px;
    }

    .item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item-number {
      font-weight: bold;
    }

    .answer-box {
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      padding: 15px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .quiz-question {
      font-size: 23px;
      font-weight: bold;
      margin: 20px 0;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    .top-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .warning {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      main {
        padding: 15px 10px 40px;
      }

      .card {
        padding: 16px;
      }

      button {
        width: 100%;
        margin-right: 0;
      }

      .item-header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 PacoGO!</h1>
  <button id="logoutBtn" class="secondary hidden" onclick="logout()">Uitloggen</button>
</header>

<main>

  <!-- LOGIN -->
  <section id="loginSection" class="card">
    <h2>Ouder login</h2>

    <label>E-mail</label>
    <input id="emailInput" type="email" placeholder="E-mail">

    <label>Wachtwoord</label>
    <input id="passwordInput" type="password" placeholder="Wachtwoord">

    <button onclick="login()">Inloggen</button>

    <p id="loginMessage" class="muted"></p>
  </section>


  <!-- HOME -->
  <section id="homeSection" class="hidden">

    <div class="card">
      <h2>📚 PacoGO!</h2>
      <p>Kies een vak.</p>

      <div id="subjectsContainer"></div>

      <button class="green" onclick="showAddLesson()">
        ➕ Nieuwe les
      </button>
    </div>

  </section>


  <!-- LESSON LIST -->
  <section id="lessonListSection" class="hidden">

    <div class="card">

      <div class="top-buttons">
        <button class="secondary" onclick="goHome()">← Terug</button>
      </div>

      <h2 id="lessonListTitle">Lessen</h2>

      <div id="lessonsContainer"></div>

    </div>

  </section>


  <!-- LESSON EDITOR -->
  <section id="editorSection" class="hidden">

    <div class="card">

      <div class="top-buttons">
        <button class="secondary" onclick="cancelEditor()">← Annuleren</button>
      </div>

      <h2 id="editorTitle">Nieuwe les</h2>

      <label>Vak</label>
      <input id="lessonSubject" type="text" placeholder="Bijvoorbeeld Nederlands">

      <label>Naam van de les</label>
      <input id="lessonTitle" type="text" placeholder="Bijvoorbeeld Les 1">

      <label>Type les</label>
      <select id="lessonType" onchange="changeLessonType()">
        <option value="words">Woorden</option>
        <option value="questions">Vragen & antwoorden</option>
        <option value="dictation">Dictee</option>
      </select>

      <div id="editorItems"></div>

      <button class="green" onclick="addEditorItem()">
        ➕ Item toevoegen
      </button>

      <br><br>

      <button onclick="saveLesson()">
        💾 Les opslaan
      </button>

      <button
        id="deleteLessonButton"
        class="danger hidden"
        onclick="deleteCurrentLesson()">
        🗑️ Les verwijderen
      </button>

      <p id="saveMessage" class="muted"></p>

    </div>

  </section>


  <!-- LESSON CHOICE -->
  <section id="lessonChoiceSection" class="hidden">

    <div class="card">

      <button class="secondary" onclick="goBackToLessons()">← Terug</button>

      <h2 id="choiceTitle"></h2>

      <p>Wat wil je doen?</p>

      <button onclick="showLessonContent()">
        📖 Les bekijken
      </button>

      <button onclick="startQuiz()">
        🎯 Overhoren
      </button>

      <button id="editLessonChoiceButton" class="secondary" onclick="editCurrentLesson()">
        ✏️ Les bewerken
      </button>

    </div>

  </section>


  <!-- LESSON VIEW -->
  <section id="lessonViewSection" class="hidden">

    <div class="card">

      <button class="secondary" onclick="backToLessonChoice()">← Terug</button>

      <h2 id="viewTitle"></h2>

      <div id="lessonContent"></div>

      <br>

      <button onclick="startQuiz()">
        🎯 Nu overhoren
      </button>

    </div>

  </section>


  <!-- QUIZ -->
  <section id="quizSection" class="hidden">

    <div class="card">

      <button class="secondary" onclick="backToLessonChoice()">← Stoppen</button>

      <div id="quizContent"></div>

    </div>

  </section>

</main>


<script>

  // ============================================================
  // SUPABASE
  // ============================================================

  const SUPABASE_URL =
    "https://ncpkqrvxljxwboavxtak.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_skiKpO4UU79zWY7hskHsoA_WQxA6CFc";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


  // Deze IDs mogen zichtbaar zijn.
  // De echte beveiliging gebeurt door Supabase RLS.
  const PARENT_IDS = [
    "5d0e1e5c-1dbe-4909-bd3a-81a1e7b26d09",
    "418833d5-049a-4ec9-8072-2d48a85f04b1"
  ];


  let lessons = [];
  let currentSubject = null;
  let currentLesson = null;
  let editingLessonId = null;

  let quizItems = [];
  let quizIndex = 0;
  let quizScore = 0;


  // ============================================================
  // INITIALISATIE
  // ============================================================

  document.addEventListener("DOMContentLoaded", async () => {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();

    if (session) {
      await checkUser(session);
    } else {
      showOnly("loginSection");
    }

  });


  // ============================================================
  // AUTH
  // ============================================================

  async function login() {

    const email =
      document.getElementById("emailInput").value.trim();

    const password =
      document.getElementById("passwordInput").value;

    const message =
      document.getElementById("loginMessage");

    message.textContent = "Inloggen...";

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.textContent =
        "Inloggen mislukt: " + error.message;
      return;
    }

    await checkUser(data.session);
  }


  async function checkUser(session) {

    if (!session || !session.user) {
      showOnly("loginSection");
      return;
    }

    const userId = session.user.id;

    if (!PARENT_IDS.includes(userId)) {

      await supabaseClient.auth.signOut();

      document.getElementById("loginMessage").textContent =
        "Dit account heeft geen ouderrechten.";

      showOnly("loginSection");
      return;
    }

    document.getElementById("logoutBtn")
      .classList.remove("hidden");

    await loadLessons();

    showHome();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("logoutBtn")
      .classList.add("hidden");

    showOnly("loginSection");
  }


  // ============================================================
  // SCHERMEN
  // ============================================================

  function showOnly(sectionId) {

    const sections = [
      "loginSection",
      "homeSection",
      "lessonListSection",
      "editorSection",
      "lessonChoiceSection",
      "lessonViewSection",
      "quizSection"
    ];

    sections.forEach(id => {
      document.getElementById(id)
        .classList.add("hidden");
    });

    document.getElementById(sectionId)
      .classList.remove("hidden");
  }


  function showHome() {

    showOnly("homeSection");

    renderSubjects();
  }


  function goHome() {

    currentSubject = null;
    currentLesson = null;

    showHome();
  }


  function goBackToLessons() {

    if (currentSubject) {
      showLessonList(currentSubject);
    } else {
      showHome();
    }
  }


  function backToLessonChoice() {

    if (currentLesson) {
      document.getElementById("choiceTitle").textContent =
        currentLesson.title;

      showOnly("lessonChoiceSection");
    }
  }


  function cancelEditor() {

    if (currentLesson && editingLessonId) {
      backToLessonChoice();
    } else {
      goHome();
    }
  }


  // ============================================================
  // LESSEN LADEN
  // ============================================================

  async function loadLessons() {

    const {
      data,
      error
    } = await supabaseClient
      .from("lessons")
      .select(`
        *,
        lesson_items (
          id,
          lesson_id,
          question,
          answer,
          sort_order
        )
      `)
      .order("created_at", {
        ascending: true
      });

    if (error) {

      console.error(error);

      alert(
        "De lessen konden niet worden geladen:\n" +
        error.message
      );

      return;
    }

    lessons = data || [];

    lessons.forEach(lesson => {

      lesson.lesson_items =
        (lesson.lesson_items || [])
          .sort((a, b) =>
            (a.sort_order || 0) -
            (b.sort_order || 0)
          );

    });
  }


  // ============================================================
  // VAKKEN
  // ============================================================

  function renderSubjects() {

    const container =
      document.getElementById("subjectsContainer");

    container.innerHTML = "";

    const subjects = [
      ...new Set(
        lessons
          .map(l => l.subject)
          .filter(Boolean)
      )
    ];

    if (subjects.length === 0) {

      container.innerHTML =
        `<p class="muted">
          Er zijn nog geen lessen.
        </p>`;

      return;
    }

    subjects.forEach(subject => {

      const button =
        document.createElement("button");

      button.textContent =
        "📘 " + subject;

      button.onclick = () =>
        showLessonList(subject);

      container.appendChild(button);
    });
  }


  // ============================================================
  // LESSENLIJST
  // ============================================================

  function showLessonList(subject) {

    currentSubject = subject;

    document.getElementById("lessonListTitle")
      .textContent = subject;

    const container =
      document.getElementById("lessonsContainer");

    container.innerHTML = "";

    const subjectLessons =
      lessons.filter(l => l.subject === subject);

    if (subjectLessons.length === 0) {

      container.innerHTML =
        `<p class="muted">
          Geen lessen gevonden.
        </p>`;

    } else {

      subjectLessons.forEach(lesson => {

        const div =
          document.createElement("div");

        div.className = "lesson-card";

        const count =
          lesson.lesson_items
            ? lesson.lesson_items.length
            : 0;

        div.innerHTML = `
          <h3>${escapeHtml(lesson.title)}</h3>

          <p class="muted">
            ${getTypeName(lesson.type)}
            · ${count} items
          </p>

          <button>
            ▶️ Openen
          </button>
        `;

        div.querySelector("button")
          .onclick = () => openLesson(lesson.id);

        container.appendChild(div);
      });
    }

    showOnly("lessonListSection");
  }


  // ============================================================
  // LES OPENEN
  // ============================================================

  function openLesson(id) {

    currentLesson =
      lessons.find(l => l.id === id);

    if (!currentLesson) return;

    document.getElementById("choiceTitle")
      .textContent = currentLesson.title;

    showOnly("lessonChoiceSection");
  }


  // ============================================================
  // LES BEKIJKEN
  // ============================================================

  function showLessonContent() {

    if (!currentLesson) return;

    document.getElementById("viewTitle")
      .textContent = currentLesson.title;

    const container =
      document.getElementById("lessonContent");

    container.innerHTML = "";

    const items =
      currentLesson.lesson_items || [];

    if (items.length === 0) {

      container.innerHTML =
        "<p>Deze les bevat nog geen items.</p>";

    } else {

      items.forEach((item, index) => {

        const div =
          document.createElement("div");

        div.className = "item";

        if (currentLesson.type === "words") {

          div.innerHTML = `
            <strong>${index + 1}. ${escapeHtml(item.question)}</strong>
            <div class="answer-box">
              ${escapeHtml(item.answer)}
            </div>
          `;

        } else if (currentLesson.type === "questions") {

          div.innerHTML = `
            <strong>${index + 1}. ${escapeHtml(item.question)}</strong>
            <div class="answer-box">
              ${escapeHtml(item.answer)}
            </div>
          `;

        } else if (currentLesson.type === "dictation") {

          div.innerHTML = `
            <strong>${index + 1}.</strong>
            <p class="muted">
              Luister en schrijf het woord op tijdens het overhoren.
            </p>
          `;

        }

        container.appendChild(div);
      });
    }

    showOnly("lessonViewSection");
  }


  // ============================================================
  // NIEUWE LES
  // ============================================================

  function showAddLesson() {

    editingLessonId = null;
    currentLesson = null;

    document.getElementById("editorTitle")
      .textContent = "Nieuwe les";

    document.getElementById("lessonSubject")
      .value = currentSubject || "";

    document.getElementById("lessonTitle")
      .value = "";

    document.getElementById("lessonType")
      .value = "words";

    document.getElementById("deleteLessonButton")
      .classList.add("hidden");

    document.getElementById("saveMessage")
      .textContent = "";

    changeLessonType();

    showOnly("editorSection");
  }


  // ============================================================
  // BESTAANDE LES BEWERKEN
  // ============================================================

  function editCurrentLesson() {

    if (!currentLesson) return;

    editingLessonId = currentLesson.id;

    document.getElementById("editorTitle")
      .textContent = "Les bewerken";

    document.getElementById("lessonSubject")
      .value = currentLesson.subject || "";

    document.getElementById("lessonTitle")
      .value = currentLesson.title || "";

    document.getElementById("lessonType")
      .value = currentLesson.type || "words";

    document.getElementById("deleteLessonButton")
      .classList.remove("hidden");

    document.getElementById("saveMessage")
      .textContent = "";

    changeLessonType();

    const container =
      document.getElementById("editorItems");

    container.innerHTML = "";

    const items =
      currentLesson.lesson_items || [];

    items.forEach(item => {
      addEditorItem(item);
    });

    if (items.length === 0) {
      addEditorItem();
    }

    showOnly("editorSection");
  }


  // ============================================================
  // TYPE LES
  // ============================================================

  function changeLessonType() {

    const type =
      document.getElementById("lessonType").value;

    const container =
      document.getElementById("editorItems");

    container.innerHTML = "";

    if (type === "words") {

      addEditorItem();
      addEditorItem();

    } else {

      addEditorItem();
    }
  }


  function getTypeName(type) {

    if (type === "words")
      return "Woorden";

    if (type === "questions")
      return "Vragen & antwoorden";

    if (type === "dictation")
      return "Dictee";

    return type;
  }


  // ============================================================
  // EDITOR ITEM TOEVOEGEN
  // ============================================================

  function addEditorItem(existingItem = null) {

    const type =
      document.getElementById("lessonType").value;

    const container =
      document.getElementById("editorItems");

    const div =
      document.createElement("div");

    div.className = "item";

    if (type === "words") {

      div.innerHTML = `
        <div class="item-header">
          <span class="item-number"></span>
          <button
            type="button"
            class="danger small"
            onclick="removeEditorItem(this)">
            Verwijderen
          </button>
        </div>

        <label>Woord / vraag</label>
        <input
          class="question-input"
          type="text"
          placeholder="Bijvoorbeeld hond"
          value="${escapeAttribute(existingItem?.question || "")}">

        <label>Antwoord</label>
        <input
          class="answer-input"
          type="text"
          placeholder="Bijvoorbeeld dog"
          value="${escapeAttribute(existingItem?.answer || "")}">
      `;

    } else if (type === "questions") {

      div.innerHTML = `
        <div class="item-header">
          <span class="item-number"></span>
          <button
            type="button"
            class="danger small"
            onclick="removeEditorItem(this)">
            Verwijderen
          </button>
        </div>

        <label>Vraag</label>
        <textarea
          class="question-input"
          placeholder="Typ hier de vraag...">${escapeHtml(existingItem?.question || "")}</textarea>

        <label>Juiste/modelantwoord</label>
        <textarea
          class="answer-input"
          placeholder="Typ hier het antwoord...">${escapeHtml(existingItem?.answer || "")}</textarea>
      `;

    } else if (type === "dictation") {

      div.innerHTML = `
        <div class="item-header">
          <span class="item-number"></span>
          <button
            type="button"
            class="danger small"
            onclick="removeEditorItem(this)">
            Verwijderen
          </button>
        </div>

        <label>Woord</label>
        <input
          class="question-input"
          type="text"
          placeholder="Bijvoorbeeld elephant"
          value="${escapeAttribute(existingItem?.question || "")}">
      `;
    }

    container.appendChild(div);

    updateItemNumbers();
  }


  function removeEditorItem(button) {

    const item =
      button.closest(".item");

    if (item) {
      item.remove();
    }

    updateItemNumbers();
  }


  function updateItemNumbers() {

    const items =
      document.querySelectorAll("#editorItems .item");

    items.forEach((item, index) => {

      const number =
        item.querySelector(".item-number");

      if (number) {
        number.textContent =
          "Item " + (index + 1);
      }

    });
  }


  // ============================================================
  // LES OPSLAAN
  // ============================================================

  async function saveLesson() {

    const message =
      document.getElementById("saveMessage");

    message.textContent = "Opslaan...";

    const subject =
      document.getElementById("lessonSubject")
        .value.trim();

    const title =
      document.getElementById("lessonTitle")
        .value.trim();

    const type =
      document.getElementById("lessonType")
        .value;

    if (!subject) {

      message.textContent =
        "Vul een vak in.";

      return;
    }

    if (!title) {

      message.textContent =
        "Vul een naam voor de les in.";

      return;
    }

    const editorItems =
      document.querySelectorAll("#editorItems .item");

    const items = [];

    editorItems.forEach((item, index) => {

      const question =
        item.querySelector(".question-input")
          ?.value.trim() || "";

      const answer =
        item.querySelector(".answer-input")
          ?.value.trim() || "";

      if (question) {

        items.push({
          question,
          answer,
          sort_order: index
        });

      }
    });


    if (items.length === 0) {

      message.textContent =
        "Voeg minstens één item toe.";

      return;
    }


    try {

      // --------------------------------------------------------
      // BESTAANDE LES
      // --------------------------------------------------------

      if (editingLessonId) {

        const {
          error: lessonError
        } = await supabaseClient
          .from("lessons")
          .update({
            subject,
            title,
            type
          })
          .eq("id", editingLessonId);

        if (lessonError)
          throw lessonError;


        // Eerst oude items verwijderen
        const {
          error: deleteError
        } = await supabaseClient
          .from("lesson_items")
          .delete()
          .eq("lesson_id", editingLessonId);

        if (deleteError)
          throw deleteError;


        // Nieuwe items opslaan
        const rows =
          items.map(item => ({
            lesson_id: editingLessonId,
            question: item.question,
            answer: item.answer,
            sort_order: item.sort_order
          }));

        const {
          error: insertError
        } = await supabaseClient
          .from("lesson_items")
          .insert(rows);

        if (insertError)
          throw insertError;


        message.textContent =
          "Les opgeslagen!";

      }

      // --------------------------------------------------------
      // NIEUWE LES
      // --------------------------------------------------------

      else {

        const {
          data: newLesson,
          error: lessonError
        } = await supabaseClient
          .from("lessons")
          .insert({
            subject,
            title,
            type
          })
          .select()
          .single();

        if (lessonError)
          throw lessonError;


        const rows =
          items.map(item => ({
            lesson_id: newLesson.id,
            question: item.question,
            answer: item.answer,
            sort_order: item.sort_order
          }));

        const {
          error: insertError
        } = await supabaseClient
          .from("lesson_items")
          .insert(rows);

        if (insertError)
          throw insertError;


        message.textContent =
          "Nieuwe les opgeslagen!";
      }


      // Alles opnieuw ophalen
      await loadLessons();

      // De huidige les opnieuw zoeken
      if (editingLessonId) {

        currentLesson =
          lessons.find(
            lesson => lesson.id === editingLessonId
          );

      }

      // Even wachten zodat gebruiker ziet dat het gelukt is
      setTimeout(() => {

        if (currentLesson) {
          openLesson(currentLesson.id);
        } else {
          showLessonList(subject);
        }

      }, 500);


    } catch (error) {

      console.error(error);

      message.textContent =
        "Opslaan mislukt: " + error.message;
    }
  }


  // ============================================================
  // LES VERWIJDEREN
  // ============================================================

  async function deleteCurrentLesson() {

    if (!editingLessonId) {
      return;
    }

    const lesson =
      lessons.find(
        l => l.id === editingLessonId
      );

    if (!lesson) {
      return;
    }


    // ========================================================
    // BELANGRIJK:
    // EERST BEVESTIGING
    // ========================================================

    const confirmed = confirm(
      `Weet je zeker dat je de les "${lesson.title}" wilt verwijderen?\n\n` +
      `Deze actie kan niet ongedaan worden.`
    );


    // Gebruiker kiest "Annuleren"
    if (!confirmed) {
      return;
    }


    // Gebruiker heeft "OK" gekozen
    const button =
      document.getElementById("deleteLessonButton");

    button.disabled = true;
    button.textContent = "Verwijderen...";


    try {

      // Eerst de items verwijderen.
      // Hierdoor werkt verwijderen ook wanneer
      // de foreign key nog geen ON DELETE CASCADE heeft.

      const {
        error: itemsError
      } = await supabaseClient
        .from("lesson_items")
        .delete()
        .eq("lesson_id", editingLessonId);

      if (itemsError)
        throw itemsError;


      // Daarna de les zelf verwijderen.

      const {
        error: lessonError
      } = await supabaseClient
        .from("lessons")
        .delete()
        .eq("id", editingLessonId);

      if (lessonError)
        throw lessonError;


      // Lokale gegevens opnieuw ophalen
      await loadLessons();

      currentLesson = null;
      editingLessonId = null;

      alert("De les is verwijderd.");

      showHome();


    } catch (error) {

      console.error(error);

      alert(
        "De les kon niet worden verwijderd:\n\n" +
        error.message
      );

      button.disabled = false;
      button.textContent = "🗑️ Les verwijderen";
    }
  }


  // ============================================================
  // QUIZ
  // ============================================================

  function startQuiz() {

    if (!currentLesson) return;

    const items =
      currentLesson.lesson_items || [];

    if (items.length === 0) {

      alert("Deze les bevat nog geen vragen.");

      return;
    }

    quizItems =
      [...items]
        .sort(() => Math.random() - 0.5);

    quizIndex = 0;
    quizScore = 0;

    showOnly("quizSection");

    showNextQuizQuestion();
  }


  function showNextQuizQuestion() {

    if (quizIndex >= quizItems.length) {

      showQuizResult();

      return;
    }

    const item =
      quizItems[quizIndex];

    const container =
      document.getElementById("quizContent");

    let html = `

      <p class="muted">
        Vraag ${quizIndex + 1} van ${quizItems.length}
      </p>

      <div class="quiz-question">
        ${escapeHtml(item.question)}
      </div>
    `;


    if (currentLesson.type === "questions") {

      html += `

        <textarea
          id="quizAnswer"
          placeholder="Typ je antwoord..."
        ></textarea>

        <button onclick="showQuestionAnswer()">
          Antwoord bekijken
        </button>

        <div id="answerArea"></div>
      `;

    } else {

      html += `

        <input
          id="quizAnswer"
          type="text"
          placeholder="Typ je antwoord..."
          onkeydown="if(event.key === 'Enter') checkQuizAnswer()"
        >

        <button onclick="checkQuizAnswer()">
          Controleer
        </button>

        <div id="answerArea"></div>
      `;
    }

    container.innerHTML = html;

    const input =
      document.getElementById("quizAnswer");

    if (input) {
      input.focus();
    }


    // Dictee automatisch uitspreken
    if (currentLesson.type === "dictation") {

      setTimeout(() => {

        speakDictationWord(item.question);

      }, 400);
    }
  }


  // ============================================================
  // WOORDEN / DICTEE CONTROLEREN
  // ============================================================

  function checkQuizAnswer() {

    const item =
      quizItems[quizIndex];

    const input =
      document.getElementById("quizAnswer");

    const userAnswer =
      input.value.trim().toLowerCase();

    const correctAnswer =
      (
        currentLesson.type === "dictation"
          ? item.question
          : item.answer
      )
      .trim()
      .toLowerCase();


    const answerArea =
      document.getElementById("answerArea");


    if (!userAnswer) {

      answerArea.innerHTML =
        `<p>Typ eerst een antwoord.</p>`;

      return;
    }


    if (userAnswer === correctAnswer) {

      quizScore++;

      answerArea.innerHTML = `
        <div class="answer-box">
          <strong>✅ Goed!</strong>
        </div>

        <button onclick="nextQuizQuestion()">
          Volgende
        </button>
      `;

    } else {

      answerArea.innerHTML = `
        <div class="warning">
          <strong>❌ Niet helemaal.</strong>
          <br><br>
          Het juiste antwoord is:
          <strong>${escapeHtml(correctAnswer)}</strong>
        </div>

        <button onclick="nextQuizQuestion()">
          Volgende
        </button>
      `;
    }


    input.disabled = true;
  }


  // ============================================================
  // VRAGEN MET OPEN ANTWOORD
  // ============================================================

  function showQuestionAnswer() {

    const item =
      quizItems[quizIndex];

    const container =
      document.getElementById("answerArea");

    container.innerHTML = `

      <div class="answer-box">
        <strong>Modelantwoord:</strong>
        <br><br>
        ${escapeHtml(item.answer)}
      </div>

      <p>
        Heeft je antwoord dit ongeveer goed?
      </p>

      <button
        class="green"
        onclick="markQuestionCorrect()">
        ✅ Goed
      </button>

      <button
        class="danger"
        onclick="markQuestionWrong()">
        ❌ Fout
      </button>
    `;

    document.getElementById("quizAnswer")
      .disabled = true;
  }


  function markQuestionCorrect() {

    quizScore++;

    nextQuizQuestion();
  }


  function markQuestionWrong() {

    nextQuizQuestion();
  }


  function nextQuizQuestion() {

    quizIndex++;

    showNextQuizQuestion();
  }


  // ============================================================
  // QUIZ RESULTAAT
  // ============================================================

  function showQuizResult() {

    const percentage =
      Math.round(
        (quizScore / quizItems.length) * 100
      );

    const container =
      document.getElementById("quizContent");

    container.innerHTML = `

      <div class="score">
        🎉 Klaar!
      </div>

      <p style="text-align:center;font-size:20px;">
        ${quizScore} van ${quizItems.length} goed
      </p>

      <p style="text-align:center;font-size:18px;">
        ${percentage}%
      </p>

      <br>

      <button onclick="startQuiz()">
        🔄 Nog een keer
      </button>

      <button
        class="secondary"
        onclick="backToLessonChoice()">
        ← Terug naar de les
      </button>
    `;
  }


  // ============================================================
  // DICTEE
  // ============================================================

  function speakDictationWord(word) {

    if (!window.speechSynthesis) {
      return;
    }

    window.speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(word);

    speech.lang = "en-US";
    speech.rate = 0.75;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
  }


  // ============================================================
  // HELPERS
  // ============================================================

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return escapeHtml(value);
  }

</script>
