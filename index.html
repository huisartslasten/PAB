<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Leertrainer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f3f7ff;
  color: #24324a;
}

/* HEADER */

header {
  background: linear-gradient(135deg, #5b5ce2, #7467f0);
  color: white;
  padding: 28px 22px 32px;
  border-radius: 0 0 30px 30px;
  box-shadow: 0 8px 25px rgba(77, 78, 180, .18);
}

header h1 {
  max-width: 1000px;
  margin: auto;
  font-size: 32px;
  font-weight: 850;
  letter-spacing: -1px;
}

/* MAIN */

.container {
  max-width: 1000px;
  margin: 30px auto 60px;
  padding: 0 22px;
}

/* HEADINGS */

h2 {
  font-size: 28px;
  margin: 0 0 8px;
  font-weight: 800;
}

h3 {
  font-size: 21px;
  font-weight: 800;
}

/* CARDS */

.card {
  background: white;
  border: 0;
  border-radius: 24px;
  padding: 28px;
  margin-bottom: 22px;
  box-shadow: 0 8px 30px rgba(50, 70, 110, .09);
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 20px;
}

/* BIG BUTTONS / SUBJECT CARDS */

.big-button {
  width: 100%;
  min-height: 145px;
  padding: 25px;
  border-radius: 24px;
  border: 0;
  font-size: 22px;
  font-weight: 850;
  color: white;
  background: linear-gradient(135deg, #5b5ce2, #7c6cf2);
  box-shadow: 0 8px 0 #4546b5;
  transition: transform .15s ease, box-shadow .15s ease;
}

.big-button:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 0 #4546b5;
}

.big-button:active {
  transform: translateY(3px);
  box-shadow: 0 5px 0 #4546b5;
}

/* LESSONS */

.lesson-button {
  width: 100%;
  text-align: left;
  padding: 20px 22px;
  margin-bottom: 12px;
  border-radius: 18px;
  border: 2px solid #e5eaff;
  background: white;
  color: #24324a;
  font-size: 18px;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(50, 70, 110, .06);
  transition: transform .15s ease, border-color .15s ease;
}

.lesson-button:hover {
  transform: translateX(4px);
  border-color: #7467f0;
}

/* NORMAL BUTTONS */

button {
  border: 0;
  border-radius: 14px;
  padding: 13px 19px;
  font-size: 15px;
  font-weight: 750;
  cursor: pointer;
  background: #5b5ce2;
  color: white;
  transition: transform .15s ease, opacity .15s ease;
}

button:hover {
  opacity: .95;
  transform: translateY(-2px);
}

button.secondary {
  background: #e9edfa;
  color: #34415a;
}

button.green {
  background: #20c997;
}

button.danger {
  background: #f05b6f;
}

/* FORM */

input,
textarea,
select {
  width: 100%;
  padding: 14px 15px;
  border: 2px solid #e3e8f5;
  border-radius: 13px;
  font-size: 16px;
  background: white;
  color: #24324a;
  font-family: inherit;
  margin-top: 6px;
  margin-bottom: 16px;
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: #7467f0;
  box-shadow: 0 0 0 4px rgba(116, 103, 240, .12);
}

textarea {
  min-height: 90px;
  resize: vertical;
}

label {
  font-weight: 750;
  color: #34415a;
}

/* LAYOUT */

.row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.row > * {
  flex: 1;
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.hidden {
  display: none;
}

/* WORDS */

.word {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

/* QUESTIONS */

.question-card {
  background: #f8f9ff;
  border: 2px solid #e5e9f6;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 15px;
}

/* QUIZ */

.quiz-question {
  font-size: 34px;
  line-height: 1.3;
  font-weight: 850;
  text-align: center;
  color: #24324a;
  margin: 45px 0 30px;
}

.quiz-answer {
  font-size: 24px;
  line-height: 1.4;
  text-align: center;
  padding: 25px;
  margin: 20px 0;
  background: #f0efff;
  color: #24324a;
  border-radius: 20px;
}

/* SCORE */

.score {
  font-size: 28px;
  font-weight: 850;
  text-align: center;
}

/* SMALL TEXT */

.small {
  color: #718096;
  font-size: 14px;
}

/* MESSAGES */

.error {
  background: #fff0f1;
  color: #c53045;
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 16px;
}

.success {
  background: #e9fbf4;
  color: #087f5b;
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 16px;
}

/* MOBILE */

@media (max-width: 600px) {

  header {
    padding: 23px 18px 27px;
    border-radius: 0 0 24px 24px;
  }

  header h1 {
    font-size: 26px;
  }

  .container {
    margin-top: 22px;
    padding: 0 15px;
  }

  .card {
    padding: 20px;
    border-radius: 20px;
  }

  .big-button {
    min-height: 115px;
    font-size: 19px;
  }

  .quiz-question {
    font-size: 27px;
  }

  .word {
    grid-template-columns: 1fr;
  }
}
  .subject-blue {
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
}

.subject-purple {
  background: linear-gradient(135deg, #8b5cf6, #a78bfa);
}

.subject-green {
  background: linear-gradient(135deg, #10b981, #34d399);
}

.subject-orange {
  background: linear-gradient(135deg, #f97316, #fb923c);
}

.subject-pink {
  background: linear-gradient(135deg, #ec4899, #f472b6);
}

.subject-cyan {
  background: linear-gradient(135deg, #06b6d4, #22d3ee);
}

.subject-icon {
  display: block;
  font-size: 48px;
  margin-bottom: 12px;
}

.subject-name {
  display: block;
  font-size: 23px;
  font-weight: 850;
}

.subject-count {
  display: block;
  margin-top: 7px;
  font-size: 15px;
  font-weight: 600;
  opacity: .9;
}
</style>


</head>

<body>

<header>
  <h1>📚 Mijn Leertrainer</h1>
</header>

<div class="container">

  <div id="message"></div>

  <!-- HOME -->
  <section id="home">
    <div class="topbar">
      <h2>Vakken</h2>
      <button onclick="showAddLesson()">➕ Nieuwe les</button>
    </div>

    <div id="subjects" class="grid"></div>
  </section>

  <!-- LESSONS -->
  <section id="lessonList" class="hidden">
    <div class="topbar">
      <button class="secondary" onclick="showHome()">← Terug</button>
      <button onclick="showAddLesson(currentSubject)">➕ Nieuwe les</button>
    </div>

    <h2 id="subjectTitle"></h2>
    <div id="lessons"></div>
  </section>

  <!-- ADD / EDIT LESSON -->
  <section id="lessonEditor" class="hidden">
    <div class="topbar">
      <button class="secondary" onclick="goBack()">← Terug</button>
    </div>

    <div class="card">
      <h2 id="editorTitle">Nieuwe les</h2>

      <label>Vak</label>
      <input id="subjectInput" placeholder="Bijvoorbeeld 🇬🇧 Engels">

      <label>Naam van de les</label>
      <input id="titleInput" placeholder="Bijvoorbeeld Les 3 – Dieren">

      <label>Type les</label>
      <select id="typeInput" onchange="changeLessonType()">
        <option value="words">📖 Woordjes</option>
        <option value="questions">❓ Vragen</option>
      </select>

      <!-- WOORDEN -->
      <div id="wordsEditor">
        <h3>Woorden</h3>
        <div id="wordRows"></div>

        <button class="secondary" onclick="addWordRow()">
          ➕ Woord toevoegen
        </button>
      </div>

      <!-- VRAGEN -->
      <div id="questionsEditor" class="hidden">
        <h3>Vragen</h3>
        <div id="questionRows"></div>

        <button class="secondary" onclick="addQuestionRow()">
          ➕ Vraag toevoegen
        </button>
      </div>

      <br><br>

      <button onclick="saveLesson()">💾 Opslaan</button>
    </div>
  </section>

<!-- LESSON CHOICE -->
<section id="lessonChoice" class="hidden">
  <div class="topbar">
    <button class="secondary" onclick="goBack()">← Terug</button>
  </div>

  <div class="card">
    <h2 id="choiceTitle"></h2>
    <p class="small">
      Wil je de les eerst bekijken of jezelf meteen overhoren?
    </p>

    <div class="row">
      <button class="big-button" onclick="showLesson()">
        📖 Les bekijken
      </button>

      <button class="green big-button" onclick="startQuiz()">
        ▶️ Direct overhoren
      </button>
    </div>
  </div>
</section>
  
  <!-- LESSON VIEW -->
  <section id="lessonView" class="hidden">
    <div class="topbar">
      <button class="secondary" onclick="goBack()">← Terug</button>

      <div>
        <button onclick="editCurrentLesson()">✏️ Bewerken</button>
        <button class="danger" onclick="deleteCurrentLesson()">🗑️ Verwijderen</button>
      </div>
    </div>

    <div class="card">
      <h2 id="viewTitle"></h2>
      <p id="viewInfo" class="small"></p>

      <div id="viewItems"></div>

      <br>

      <button class="green big-button" onclick="startQuiz()">
        ▶️ Start de quiz
      </button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <button class="secondary" onclick="showLesson()">← Stoppen</button>
    </div>

    <div class="card">
      <div id="quizProgress" class="small"></div>
      <div id="quizContent"></div>
    </div>
  </section>

</div>

<script>

const SUPABASE_URL = "https://ncpkqrvxljxwboavxtak.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skiKpO4UU79zWY7hskHsoA_WQxA6CFc";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allLessons = [];
let currentSubject = "";
let currentLesson = null;
let editingLessonId = null;

let quizItems = [];
let quizIndex = 0;
let quizScore = 0;


/* =========================
   LESSEN LADEN
========================= */

async function loadLessons() {

  showMessage("Lessen laden...", "success");

  const { data, error } = await db
    .from("lessons")
    .select(`
      id,
      subject,
      title,
      type,
      lesson_items(
        id,
        question,
        answer,
        sort_order
      )
    `)
    .order("id");

  if (error) {
    showMessage(
      "Fout bij laden: " + error.message,
      "error"
    );
    return;
  }

  allLessons = data || [];

  allLessons.forEach(lesson => {

    lesson.lesson_items =
      (lesson.lesson_items || [])
      .sort((a, b) =>
        a.sort_order - b.sort_order
      );

  });

  hideMessage();

  showHome();
}


/* =========================
   MELDINGEN
========================= */

function showMessage(text, type) {

  const el = document.getElementById("message");

  el.className = type || "";
  el.textContent = text;
}


function hideMessage() {

  const el = document.getElementById("message");

  el.textContent = "";
  el.className = "";
}


/* =========================
   SCHERMEN
========================= */

function hideAll() {

  [
    "home",
    "lessonList",
    "lessonEditor",
    "lessonView",
    "lessonChoice",
    "quiz"
  ].forEach(id => {

    document
      .getElementById(id)
      .classList
      .add("hidden");

  });
}


/* =========================
   HOME
========================= */

  function showHome() {

  hideAll();

  document
    .getElementById("home")
    .classList
    .remove("hidden");

  const subjects =
    [...new Set(
      allLessons.map(l => l.subject)
    )];

  const container =
    document.getElementById("subjects");

  container.innerHTML = "";

  if (!subjects.length) {

    container.innerHTML =
      "<p>Nog geen vakken.</p>";

    return;
  }

  const icons = {
    "Nederlands": "📚",
    "Engels": "🇬🇧",
    "Rekenen": "🔢",
    "Geschiedenis": "🏴‍☠️",
    "Aardrijkskunde": "🌍",
    "Biologie": "🧬",
    "Natuur": "🔬",
    "Frans": "🇫🇷",
    "Spaans": "🇪🇸"
  };

  const colors = [
    "subject-blue",
    "subject-purple",
    "subject-green",
    "subject-orange",
    "subject-pink",
    "subject-cyan"
  ];

  subjects.forEach((subject, index) => {

    const lessons =
      allLessons.filter(
        l => l.subject === subject
      );

    const btn =
      document.createElement("button");

    btn.className =
      "big-button " +
      colors[index % colors.length];

    const icon =
      icons[subject] || "🎮";

    btn.innerHTML = `
      <span class="subject-icon">${icon}</span>
      <span class="subject-name">${escapeHtml(subject)}</span>
      <span class="subject-count">
        ${lessons.length} ${lessons.length === 1 ? "les" : "lessen"}
      </span>
    `;

    btn.onclick = () =>
      showSubject(subject);

    container.appendChild(btn);

  });
}

/* =========================
   VAK
========================= */

function showSubject(subject) {

  currentSubject = subject;
  currentLesson = null;

  hideAll();

  document
    .getElementById("lessonList")
    .classList
    .remove("hidden");

  document
    .getElementById("subjectTitle")
    .textContent = subject;

  const container =
    document.getElementById("lessons");

  container.innerHTML = "";

  const lessons =
    allLessons.filter(
      l => l.subject === subject
    );

  lessons.forEach(lesson => {

    const btn =
      document.createElement("button");

    btn.className =
      "lesson-button";

    btn.innerHTML = `
      ${lesson.type === "questions" ? "❓" : "📖"}
      ${escapeHtml(lesson.title)}
      <br>
      <span class="small">
        ${lesson.lesson_items.length} items
      </span>
    `;

  btn.onclick = () => openLesson(lesson.id);

    container.appendChild(btn);

  });
}


/* =========================
   LES VIEW
========================= */
function openLesson(id) {
  currentLesson = allLessons.find(l => l.id === id);
  if (!currentLesson) return;

  hideAll();

  document.getElementById("lessonChoice").classList.remove("hidden");
  document.getElementById("choiceTitle").textContent = currentLesson.title;
}
function showLesson(id) {

  if (id) {

    currentLesson =
      allLessons.find(
        l => l.id === id
      );

  }

  if (!currentLesson) return;

  hideAll();

  document
    .getElementById("lessonView")
    .classList
    .remove("hidden");

  document
    .getElementById("viewTitle")
    .textContent =
    currentLesson.title;

  document
    .getElementById("viewInfo")
    .textContent =
    `${currentLesson.subject} •
     ${currentLesson.lesson_items.length}
     ${
       currentLesson.type === "questions"
       ? "vragen"
       : "woorden"
     }`;

  const container =
    document.getElementById("viewItems");

  container.innerHTML = "";

  currentLesson.lesson_items
    .forEach((item, i) => {

      const div =
        document.createElement("div");

      div.className =
        "question-card";

      if (currentLesson.type === "words") {

        div.innerHTML = `
          <strong>
            ${i + 1}.
            ${escapeHtml(item.question)}
          </strong>

          <span>
            →
            ${escapeHtml(item.answer)}
          </span>
        `;

      } else {

        div.innerHTML = `
          <strong>
            ${i + 1}.
            ${escapeHtml(item.question)}
          </strong>

          <br>

          <span class="small">
            Antwoord:
            ${escapeHtml(item.answer)}
          </span>
        `;

      }

      container.appendChild(div);

    });
}


/* =========================
   NIEUWE LES
========================= */

function showAddLesson(subject = "") {

  hideAll();

  document
    .getElementById("lessonEditor")
    .classList
    .remove("hidden");

  editingLessonId = null;

  document
    .getElementById("editorTitle")
    .textContent = "Nieuwe les";

  document
    .getElementById("subjectInput")
    .value = subject;

  document
    .getElementById("titleInput")
    .value = "";

  document
    .getElementById("typeInput")
    .value = "words";

  document
    .getElementById("wordRows")
    .innerHTML = "";

  document
    .getElementById("questionRows")
    .innerHTML = "";

  addWordRow();
  addWordRow();
}


/* =========================
   TYPE LES
========================= */

function changeLessonType() {

  const type =
    document.getElementById("typeInput").value;

  document
    .getElementById("wordsEditor")
    .classList
    .toggle(
      "hidden",
      type !== "words"
    );

  document
    .getElementById("questionsEditor")
    .classList
    .toggle(
      "hidden",
      type !== "questions"
    );

  if (
    type === "questions" &&
    document
      .getElementById("questionRows")
      .children.length === 0
  ) {

    addQuestionRow();

  }
}


/* =========================
   WOORD TOEVOEGEN
========================= */

function addWordRow(
  question = "",
  answer = ""
) {

  const row =
    document.createElement("div");

  row.className = "word";

  row.innerHTML = `
    <input
      placeholder="Nederlands"
      value="${escapeAttr(question)}"
    >

    <input
      placeholder="Engels"
      value="${escapeAttr(answer)}"
    >

    <button
      class="danger"
      onclick="this.parentElement.remove()"
    >
      ✕
    </button>
  `;

  document
    .getElementById("wordRows")
    .appendChild(row);
}


/* =========================
   VRAAG TOEVOEGEN
========================= */

function addQuestionRow(
  question = "",
  answer = "",
  insertBefore = null
) {

  const card =
    document.createElement("div");

  card.className =
    "question-card";

  card.innerHTML = `
    <label>Vraag</label>

    <textarea
      placeholder="Typ hier de vraag..."
    >${escapeHtml(question)}</textarea>

    <label>Modelantwoord</label>

    <textarea
      placeholder="Typ hier het juiste antwoord..."
    >${escapeHtml(answer)}</textarea>

    <div class="row">

      <button
        class="secondary"
        onclick="insertQuestionBefore(
          this.parentElement.parentElement
        )"
      >
        ➕ Hier invoegen
      </button>

      <button
        class="danger"
        onclick="this.parentElement.parentElement.remove()"
      >
        🗑️ Verwijderen
      </button>

    </div>
  `;

  const container =
    document.getElementById("questionRows");

  if (insertBefore) {

    container.insertBefore(
      card,
      insertBefore
    );

  } else {

    container.appendChild(card);

  }
}


/* =========================
   VRAAG ERVOOR INVOEGEN
========================= */

function insertQuestionBefore(card) {

  addQuestionRow(
    "",
    "",
    card
  );

}


/* =========================
   LES OPSLAAN
========================= */

async function saveLesson() {

  const subject =
    document
      .getElementById("subjectInput")
      .value
      .trim();

  const title =
    document
      .getElementById("titleInput")
      .value
      .trim();

  const type =
    document
      .getElementById("typeInput")
      .value;

  if (!subject || !title) {

    showMessage(
      "Vul het vak en de naam van de les in.",
      "error"
    );

    return;
  }

  let items = [];


  /* WOORDEN */

  if (type === "words") {

    document
      .querySelectorAll("#wordRows .word")
      .forEach((row, i) => {

        const inputs =
          row.querySelectorAll("input");

        const question =
          inputs[0]
            .value
            .trim();

        const answer =
          inputs[1]
            .value
            .trim();

        if (question && answer) {

          items.push({
            question,
            answer,
            sort_order: i + 1
          });

        }

      });

  }


  /* VRAGEN */

  else {

    document
      .querySelectorAll(
        "#questionRows .question-card"
      )
      .forEach((card, i) => {

        const fields =
          card.querySelectorAll("textarea");

        const question =
          fields[0]
            .value
            .trim();

        const answer =
          fields[1]
            .value
            .trim();

        if (question && answer) {

          items.push({
            question,
            answer,
            sort_order: i + 1
          });

        }

      });

  }


  if (!items.length) {

    showMessage(
      "Voeg minstens één item toe.",
      "error"
    );

    return;
  }

  showMessage(
    "Opslaan...",
    "success"
  );

  let lessonId =
    editingLessonId;


  /* BESTAANDE LES */

  if (editingLessonId) {

    const { error } =
      await db
        .from("lessons")
        .update({
          subject,
          title,
          type
        })
        .eq(
          "id",
          editingLessonId
        );

    if (error) {

      showMessage(
        "Fout: " +
        error.message,
        "error"
      );

      return;
    }

    await db
      .from("lesson_items")
      .delete()
      .eq(
        "lesson_id",
        editingLessonId
      );

  }


  /* NIEUWE LES */

  else {

    const { data, error } =
      await db
        .from("lessons")
        .insert({
          subject,
          title,
          type
        })
        .select()
        .single();

    if (error) {

      showMessage(
        "Fout: " +
        error.message,
        "error"
      );

      return;
    }

    lessonId =
      data.id;
  }


  /* ITEMS OPSLAAN */

  const rows =
    items.map(item => ({
      lesson_id: lessonId,
      question: item.question,
      answer: item.answer,
      sort_order: item.sort_order
    }));

  const { error: itemError } =
    await db
      .from("lesson_items")
      .insert(rows);

  if (itemError) {

    showMessage(
      "Fout bij opslaan items: " +
      itemError.message,
      "error"
    );

    return;
  }

  await loadLessons();

  currentLesson =
    allLessons.find(
      l => l.id === lessonId
    );

  if (currentLesson) {

    showLesson();

  }
}


/* =========================
   LES BEWERKEN
========================= */

function editCurrentLesson() {

  if (!currentLesson) return;

  hideAll();

  document
    .getElementById("lessonEditor")
    .classList
    .remove("hidden");

  editingLessonId =
    currentLesson.id;

  document
    .getElementById("editorTitle")
    .textContent =
    "Les bewerken";

  document
    .getElementById("subjectInput")
    .value =
    currentLesson.subject;

  document
    .getElementById("titleInput")
    .value =
    currentLesson.title;

  document
    .getElementById("typeInput")
    .value =
    currentLesson.type;

  document
    .getElementById("wordRows")
    .innerHTML = "";

  document
    .getElementById("questionRows")
    .innerHTML = "";


  if (currentLesson.type === "words") {

    currentLesson.lesson_items
      .forEach(item => {

        addWordRow(
          item.question,
          item.answer
        );

      });

  } else {

    currentLesson.lesson_items
      .forEach(item => {

        addQuestionRow(
          item.question,
          item.answer
        );

      });

  }

  changeLessonType();
}


/* =========================
   LES VERWIJDEREN
========================= */

async function deleteCurrentLesson() {

  if (!currentLesson) return;

  if (
    !confirm(
      `Weet je zeker dat je "${currentLesson.title}" wilt verwijderen?`
    )
  ) {
    return;
  }

  const { error } =
    await db
      .from("lessons")
      .delete()
      .eq(
        "id",
        currentLesson.id
      );

  if (error) {

    showMessage(
      "Fout bij verwijderen: " +
      error.message,
      "error"
    );

    return;
  }

  currentLesson = null;

  await loadLessons();
}


/* =========================
   QUIZ STARTEN
========================= */

function startQuiz() {

  if (
    !currentLesson ||
    !currentLesson.lesson_items.length
  ) {
    return;
  }

  quizItems =
    [...currentLesson.lesson_items]
      .sort(
        () => Math.random() - 0.5
      );

  quizIndex = 0;
  quizScore = 0;

  hideAll();

  document
    .getElementById("quiz")
    .classList
    .remove("hidden");

  showQuizItem();
}


/* =========================
   QUIZ ITEM
========================= */

function showQuizItem() {

  if (
    quizIndex >= quizItems.length
  ) {

    finishQuiz();

    return;
  }

  const item =
    quizItems[quizIndex];

  document
    .getElementById("quizProgress")
    .textContent =
    `Vraag ${quizIndex + 1} van ${quizItems.length}`;

  const container =
    document.getElementById("quizContent");


  /* WOORDJES QUIZ */

  if (
    currentLesson.type === "words"
  ) {

    container.innerHTML = `

      <div class="quiz-question">
        ${escapeHtml(item.question)}
      </div>

      <input
        id="quizInput"
        placeholder="Typ je antwoord..."
        autocomplete="off"
        onkeydown="
          if(event.key==='Enter')
          checkWordAnswer()
        "
      >

      <button
        class="big-button"
        onclick="checkWordAnswer()"
      >
        Controleren
      </button>

      <div id="quizResult"></div>
    `;

    setTimeout(() => {

      const input =
        document.getElementById(
          "quizInput"
        );

      if (input) {
        input.focus();
      }

    }, 100);

  }


  /* VRAGEN QUIZ */

  else {

    container.innerHTML = `

      <div class="quiz-question">
        ${escapeHtml(item.question)}
      </div>

      <textarea
        id="quizInput"
        placeholder="Typ je antwoord..."
      ></textarea>

      <button
        class="big-button"
        onclick="showQuestionAnswer()"
      >
        Antwoord bekijken
      </button>

      <div id="quizResult"></div>
    `;

  }
}


/* =========================
   WOORD ANTWOORD
========================= */

function checkWordAnswer() {

  const input =
    document.getElementById(
      "quizInput"
    );

  const result =
    document.getElementById(
      "quizResult"
    );

  const given =
    input.value
      .trim()
      .toLowerCase();

  const correct =
    quizItems[quizIndex]
      .answer
      .trim()
      .toLowerCase();


  if (given === correct) {

    quizScore++;

    result.innerHTML = `

      <div class="success">
        🟢 Goed!
      </div>

      <button
        onclick="nextQuizItem()"
      >
        Volgende →
      </button>

    `;

  } else {

    result.innerHTML = `

      <div class="error">

        🔴 Niet helemaal.

        <br><br>

        Het juiste antwoord is:
        <strong>
          ${escapeHtml(
            quizItems[quizIndex].answer
          )}
        </strong>

      </div>

      <button
        onclick="nextQuizItem()"
      >
        Volgende →
      </button>

    `;

  }

  input.disabled = true;
}


/* =========================
   VRAAG ANTWOORD
========================= */

function showQuestionAnswer() {

  const input =
    document.getElementById(
      "quizInput"
    );

  const result =
    document.getElementById(
      "quizResult"
    );

  input.disabled = true;

  result.innerHTML = `

    <div class="quiz-answer">
      ${escapeHtml(
        quizItems[quizIndex].answer
      )}
    </div>

    <p style="text-align:center">
      Had je het goed?
    </p>

    <div class="row">

      <button
        class="green"
        onclick="questionCorrect()"
      >
        🟢 Ik had het goed
      </button>

      <button
        class="danger"
        onclick="questionWrong()"
      >
        🔴 Ik had het fout
      </button>

    </div>

  `;
}


/* =========================
   GOED / FOUT
========================= */

function questionCorrect() {

  quizScore++;

  nextQuizItem();
}


function questionWrong() {

  nextQuizItem();
}


function nextQuizItem() {

  quizIndex++;

  showQuizItem();
}


/* =========================
   QUIZ KLAAR
========================= */

function finishQuiz() {

  document
    .getElementById("quizProgress")
    .textContent = "Klaar!";

  document
    .getElementById("quizContent")
    .innerHTML = `

      <div class="score">

        🎉 Quiz klaar!

        <br><br>

        ${quizScore}
        van
        ${quizItems.length}
        goed

      </div>

      <br>

      <button
        class="big-button"
        onclick="startQuiz()"
      >
        🔄 Opnieuw
      </button>

      <br><br>

      <button
        class="secondary big-button"
        onclick="showLesson()"
      >
        ← Terug naar de les
      </button>

    `;
}


/* =========================
   TERUG
========================= */

function goBack() {

  if (currentLesson && currentSubject) {
    showSubject(currentSubject);
  } else {
    showHome();
  }

}


/* =========================
   VEILIGE HTML
========================= */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeAttr(text) {

  return escapeHtml(text);

}


/* =========================
   START
========================= */

loadLessons();

</script>

</html>
