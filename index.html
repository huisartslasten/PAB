```html
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woordentrainer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #1f2937;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 700px;
  padding: 24px 16px 40px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 32px;
}

h2 {
  margin-top: 28px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin: 0 0 28px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 17px;
  cursor: pointer;
  margin-top: 10px;
  background: #2563eb;
  color: white;
}

button.green {
  background: #16a34a;
}

button.secondary {
  background: #e5e7eb;
  color: #111827;
}

button.delete {
  width: auto;
  margin: 0;
  padding: 8px 10px;
  font-size: 13px;
  background: #fee2e2;
  color: #991b1b;
}

.subject {
  padding: 20px;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  margin: 12px 0;
  cursor: pointer;
  font-size: 20px;
  background: #fafafa;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: .15s;
}

.subject:hover {
  background: #f0f6ff;
  transform: translateY(-1px);
}

.subject-count {
  color: #6b7280;
  font-size: 14px;
}

.lesson {
  padding: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  margin: 10px 0;
  cursor: pointer;
  font-size: 18px;
  background: #fafafa;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.lesson:hover {
  background: #f0f6ff;
}

.lesson-name {
  flex: 1;
}

.progress {
  color: #6b7280;
  text-align: center;
  margin-bottom: 18px;
}

.word {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 30px 0;
}

input,
textarea,
select {
  width: 100%;
  padding: 14px;
  border: 2px solid #d1d5db;
  border-radius: 12px;
  font-size: 18px;
  margin-top: 8px;
  background: white;
}

textarea {
  min-height: 180px;
  resize: vertical;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

.feedback {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin: 18px 0;
  min-height: 28px;
}

.score {
  text-align: center;
  font-size: 28px;
  margin: 25px 0;
}

.hidden {
  display: none !important;
}

.small {
  font-size: 14px;
  color: #6b7280;
  text-align: center;
  margin-top: 18px;
  line-height: 1.5;
}

.example {
  background: #f9fafb;
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  line-height: 1.5;
  margin-top: 12px;
}

.back {
  margin-bottom: 15px;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 20px;
}
</style>
</head>

<body>

<div class="app">
<div class="card">

<!-- ================= HOME / VAKKEN ================= -->

<div id="home">

  <h1>📚 Woordentrainer</h1>

  <p class="subtitle">
    Kies eerst een vak
  </p>

  <h2>📚 Vakken</h2>

  <div id="subjectList"></div>

  <button class="green" onclick="showAddLesson()">
    ＋ Les toevoegen
  </button>

  <p class="small">
    Je lessen worden automatisch opgeslagen in deze browser.
  </p>

</div>


<!-- ================= LESSEN ================= -->

<div id="lessonsPage" class="hidden">

  <button class="secondary back" onclick="goHome()">
    ← Terug naar vakken
  </button>

  <h1 id="subjectTitle"></h1>

  <p class="subtitle">
    Kies een les
  </p>

  <div id="lessonList"></div>

  <button class="green" onclick="showAddLesson()">
    ＋ Nieuwe les toevoegen
  </button>

</div>


<!-- ================= LES TOEVOEGEN ================= -->

<div id="addLesson" class="hidden">

  <h1>➕ Les toevoegen</h1>

  <p class="subtitle">
    Maak zelf een nieuwe les
  </p>

  <label for="subjectSelect">
    Vak
  </label>

  <select id="subjectSelect"></select>

  <label for="newSubject">
    Of maak een nieuw vak
  </label>

  <input
    id="newSubject"
    placeholder="Bijvoorbeeld: Aardrijkskunde"
  >

  <label for="lessonTitle">
    Naam van de les
  </label>

  <input
    id="lessonTitle"
    placeholder="Bijvoorbeeld: Les 3 – Dieren"
  >

  <label for="wordInput">
    Woorden
  </label>

  <textarea
    id="wordInput"
    placeholder="Zet steeds één woordpaar per regel:

hond = dog
kat = cat
paard = horse"
  ></textarea>

  <div class="example">
    <strong>Gebruik dit formaat:</strong><br>
    hond = dog<br>
    kat = cat<br>
    paard = horse
  </div>

  <button class="green" onclick="saveLesson()">
    💾 Les opslaan
  </button>

  <button class="secondary" onclick="goHome()">
    ← Annuleren
  </button>

</div>


<!-- ================= QUIZ ================= -->

<div id="quiz" class="hidden">

  <div class="progress" id="progress"></div>

  <div class="word" id="word"></div>

  <input
    id="answer"
    autocomplete="off"
    placeholder="Typ je antwoord"
  >

  <button id="checkBtn" onclick="checkAnswer()">
    Controleer
  </button>

  <div class="feedback" id="feedback"></div>

  <button
    class="secondary hidden"
    id="nextBtn"
    onclick="nextWord()"
  >
    Volgend woord →
  </button>

  <button
    class="secondary"
    onclick="goHome()"
  >
    ← Terug naar vakken
  </button>

</div>


<!-- ================= RESULTAAT ================= -->

<div id="result" class="hidden">

  <h1>🎉 Klaar!</h1>

  <div class="score" id="score"></div>

  <button onclick="restart()">
    Nog een keer
  </button>

  <button
    class="secondary"
    onclick="goHome()"
  >
    Andere les
  </button>

</div>

</div>
</div>


<script>

/* =====================================================
   STANDAARD LESSEN
   ===================================================== */

const defaultLessons = [

  {
    subject: "🇬🇧 Engels",
    title: "Les 1 – Basiswoorden",
    words: [
      ["hond", "dog"],
      ["kat", "cat"],
      ["huis", "house"],
      ["stoel", "chair"],
      ["tafel", "table"],
      ["boek", "book"],
      ["water", "water"],
      ["zon", "sun"],
      ["vriend", "friend"],
      ["school", "school"]
    ]
  },

  {
    subject: "🇬🇧 Engels",
    title: "Les 2 – School",
    words: [
      ["school", "school"],
      ["leraar", "teacher"],
      ["leerling", "student"],
      ["boek", "book"],
      ["pen", "pen"],
      ["potlood", "pencil"],
      ["schrift", "notebook"],
      ["tafel", "desk"],
      ["stoel", "chair"],
      ["les", "lesson"]
    ]
  }

];


/* =====================================================
   DATA LADEN
   ===================================================== */

let lessons = loadLessons();

let currentSubject = null;
let currentLessonIndex = null;
let currentLesson = [];
let currentIndex = 0;
let score = 0;
let answered = false;


/* =====================================================
   LOCAL STORAGE
   ===================================================== */

function loadLessons() {

  const saved = localStorage.getItem("woordentrainer_lessons");

  if (saved) {

    try {

      const data = JSON.parse(saved);

      /*
       * Oude lessen uit je vorige versie hadden
       * nog geen vak. Die geven we automatisch
       * het vak Engels.
       */

      return data.map(lesson => {

        if (!lesson.subject) {
          lesson.subject = "🇬🇧 Engels";
        }

        return lesson;

      });

    } catch (e) {

      return defaultLessons;

    }

  }

  return defaultLessons;
}


function saveLessons() {

  localStorage.setItem(
    "woordentrainer_lessons",
    JSON.stringify(lessons)
  );

}


/* =====================================================
   VAKKEN WEERGEVEN
   ===================================================== */

function renderSubjects() {

  const list = document.getElementById("subjectList");

  list.innerHTML = "";

  const subjects = [...new Set(
    lessons.map(lesson => lesson.subject)
  )];

  if (subjects.length === 0) {

    list.innerHTML =
      '<div class="empty">Nog geen vakken.</div>';

    return;
  }


  subjects.forEach(subject => {

    const count = lessons.filter(
      lesson => lesson.subject === subject
    ).length;


    const item = document.createElement("div");

    item.className = "subject";

    item.onclick = () => showSubject(subject);


    const name = document.createElement("div");

    name.textContent = subject;


    const amount = document.createElement("div");

    amount.className = "subject-count";

    amount.textContent =
      count + (count === 1 ? " les" : " lessen");


    item.appendChild(name);

    item.appendChild(amount);

    list.appendChild(item);

  });

}


/* =====================================================
   VAK OPENEN
   ===================================================== */

function showSubject(subject) {

  currentSubject = subject;

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("addLesson")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("lessonsPage")
    .classList.remove("hidden");


  document.getElementById("subjectTitle")
    .textContent = subject;


  renderLessons(subject);

}


/* =====================================================
   LESSEN WEERGEVEN
   ===================================================== */

function renderLessons(subject) {

  const list = document.getElementById("lessonList");

  list.innerHTML = "";


  const subjectLessons = lessons
    .map((lesson, index) => ({
      lesson,
      index
    }))
    .filter(item => item.lesson.subject === subject);


  if (subjectLessons.length === 0) {

    list.innerHTML =
      '<div class="empty">Nog geen lessen voor dit vak.</div>';

    return;

  }


  subjectLessons.forEach(item => {

    const row = document.createElement("div");

    row.className = "lesson";


    const name = document.createElement("div");

    name.className = "lesson-name";

    name.textContent = item.lesson.title;

    name.onclick = () =>
      startLesson(item.index);


    const deleteButton =
      document.createElement("button");

    deleteButton.className = "delete";

    deleteButton.textContent = "Verwijder";


    deleteButton.onclick = function(event) {

      event.stopPropagation();

      deleteLesson(item.index);

    };


    row.appendChild(name);

    row.appendChild(deleteButton);

    list.appendChild(row);

  });

}


/* =====================================================
   LES TOEVOEGEN
   ===================================================== */

function showAddLesson() {

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("lessonsPage")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("addLesson")
    .classList.remove("hidden");


  document.getElementById("lessonTitle").value = "";

  document.getElementById("wordInput").value = "";

  document.getElementById("newSubject").value = "";


  populateSubjectSelect();

}


/* =====================================================
   VAK SELECTEREN
   ===================================================== */

function populateSubjectSelect() {

  const select =
    document.getElementById("subjectSelect");

  select.innerHTML = "";


  const subjects = [...new Set(
    lessons.map(lesson => lesson.subject)
  )];


  if (subjects.length === 0) {

    const option =
      document.createElement("option");

    option.textContent = "Maak een nieuw vak";

    option.value = "";

    select.appendChild(option);

    return;

  }


  subjects.forEach(subject => {

    const option =
      document.createElement("option");

    option.value = subject;

    option.textContent = subject;

    select.appendChild(option);

  });

}


/* =====================================================
   LES OPSLAAN
   ===================================================== */

function saveLesson() {

  const selectedSubject =
    document.getElementById("subjectSelect").value.trim();

  const newSubject =
    document.getElementById("newSubject").value.trim();

  const subject =
    newSubject || selectedSubject;


  const title =
    document.getElementById("lessonTitle")
      .value.trim();


  const raw =
    document.getElementById("wordInput")
      .value.trim();


  if (!subject) {

    alert("Kies een vak of maak een nieuw vak.");

    return;

  }


  if (!title) {

    alert("Geef de les een naam.");

    return;

  }


  if (!raw) {

    alert("Voer ten minste één woordpaar in.");

    return;

  }


  const words = [];

  const badLines = [];


  raw.split(/\r?\n/).forEach((line, index) => {

    const trimmed = line.trim();

    if (!trimmed) return;


    const parts = trimmed.split("=");


    if (parts.length < 2) {

      badLines.push(index + 1);

      return;

    }


    const question =
      parts[0].trim();

    const answer =
      parts.slice(1).join("=").trim();


    if (question && answer) {

      words.push([
        question,
        answer
      ]);

    } else {

      badLines.push(index + 1);

    }

  });


  if (badLines.length) {

    alert(
      "Deze regels zijn niet goed ingevuld: " +
      badLines.join(", ") +
      ". Gebruik bijvoorbeeld: hond = dog"
    );

    return;

  }


  lessons.push({

    subject: subject,

    title: title,

    words: words

  });


  saveLessons();


  currentSubject = subject;


  showSubject(subject);

}


/* =====================================================
   LES VERWIJDEREN
   ===================================================== */

function deleteLesson(index) {

  if (
    confirm(
      `Wil je "${lessons[index].title}" verwijderen?`
    )
  ) {

    lessons.splice(index, 1);

    saveLessons();

    renderSubjects();

    if (currentSubject) {

      renderLessons(currentSubject);

    }

  }

}


/* =====================================================
   LES STARTEN
   ===================================================== */

function startLesson(index) {

  currentLessonIndex = index;


  currentLesson =
    [...lessons[index].words]
      .sort(() => Math.random() - 0.5);


  currentIndex = 0;

  score = 0;

  answered = false;


  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("lessonsPage")
    .classList.add("hidden");

  document.getElementById("addLesson")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.remove("hidden");


  showWord();

}


/* =====================================================
   WOORD TONEN
   ===================================================== */

function showWord() {

  const item =
    currentLesson[currentIndex];


  document.getElementById("progress")
    .textContent =
      `Woord ${currentIndex + 1} van ${currentLesson.length}`;


  document.getElementById("word")
    .textContent = item[0];


  document.getElementById("answer")
    .value = "";


  document.getElementById("answer")
    .focus();


  document.getElementById("feedback")
    .textContent = "";


  document.getElementById("checkBtn")
    .classList.remove("hidden");


  document.getElementById("nextBtn")
    .classList.add("hidden");


  answered = false;

}


/* =====================================================
   ANTWOORD CONTROLEREN
   ===================================================== */

function normalize(text) {

  return text
    .trim()
    .toLowerCase();

}


function checkAnswer() {

  if (answered) return;


  const input =
    normalize(
      document.getElementById("answer").value
    );


  const correct =
    normalize(
      currentLesson[currentIndex][1]
    );


  const feedback =
    document.getElementById("feedback");


  answered = true;


  if (input === correct) {

    score++;

    feedback.textContent = "✅ Goed!";

  } else {

    feedback.textContent =
      `❌ Het juiste antwoord is: ${currentLesson[currentIndex][1]}`;

  }


  document.getElementById("checkBtn")
    .classList.add("hidden");


  document.getElementById("nextBtn")
    .classList.remove("hidden");

}


/* =====================================================
   VOLGEND WOORD
   ===================================================== */

function nextWord() {

  currentIndex++;


  if (
    currentIndex >= currentLesson.length
  ) {

    showResult();

  } else {

    showWord();

  }

}


/* =====================================================
   RESULTAAT
   ===================================================== */

function showResult() {

  document.getElementById("quiz")
    .classList.add("hidden");


  document.getElementById("result")
    .classList.remove("hidden");


  document.getElementById("score")
    .textContent =
      `Je hebt ${score} van ${currentLesson.length} goed!`;

}


/* =====================================================
   OPNIEUW
   ===================================================== */

function restart() {

  startLesson(currentLessonIndex);

}


/* =====================================================
   TERUG NAAR VAKKEN
   ===================================================== */

function goHome() {

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("addLesson")
    .classList.add("hidden");

  document.getElementById("lessonsPage")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("home")
    .classList.remove("hidden");


  renderSubjects();

}


/* =====================================================
   ENTER = CONTROLEREN / VOLGEND WOORD
   ===================================================== */

document
  .getElementById("answer")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      if (!answered) {

        checkAnswer();

      } else {

        nextWord();

      }

    }

  });


/* =====================================================
   START
   ===================================================== */

renderSubjects();

</script>

</body>
</html>
