font:800 15px "Baloo 2",Nunito,sans-serif;cursor:pointer}.lesson-type-menu button:hover{background:#eaf4ff;color:#126fc9}.lesson-type-native,.word-part-role{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none}.lesson-test-date-box,.lesson-ai-box,.spelling-labels-box{padding:12px;border:2px solid #dce9f6;border-radius:18px;background:#f7fbff;color:#102b57}.lesson-test-date-toggle{font-weight:900;display:flex;align-items:center;gap:8px;color:#102b57}.lesson-ai-instruction{margin-top:9px}.spelling-labels-box h3{margin:0 0 8px;color:#102b57}
    .editor-row{position:relative;margin:4px 0;padding:9px 12px 9px 48px;border:2px solid #cfe1f0;border-radius:18px;background:#fff;color:#102b57;box-shadow:0 4px 10px rgba(16,43,87,.05);counter-increment:editorrow}.editor-row:before{content:counter(editorrow);position:absolute;left:11px;top:11px;width:25px;height:25px;border-radius:50%;background:#dff0ff;color:#126fc9;font-weight:900;display:flex;align-items:center;justify-content:center}.word-parts-section{margin-bottom:7px;padding:7px 10px;background:#fbfdff;border:2px solid #d7e7f5;border-radius:14px}.word-parts-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}.word-parts-head label{font-size:17px;font-weight:900;color:#173b70}.word-part-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px 40px;gap:6px;align-items:center;margin:3px 0}.word-question-parts,.word-answer-parts,.question-answer-parts,.dictation-answer-parts,.math-answer-parts,.spelling-answer-parts{display:flex;flex-direction:column;gap:1px}.word-part-role-select{position:relative}.word-part-role-button{width:100%;height:40px;border:2px solid #bfe6ff;border-radius:13px;background:#eef8ff;color:#126fc9;padding:6px 11px;font-weight:900;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.word-part-role-button.role-extra{background:#fee5e3;border-color:#f4c9c5;color:#b91c1c}.word-part-role-menu{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);padding:6px;border:2px solid #8bcfff;border-radius:14px;background:#fff;box-shadow:0 12px 28px rgba(16,43,87,.16)}.word-part-role-menu button{width:100%;display:block;padding:9px;border:0;border-radius:9px;background:#fff;color:#102b57;text-align:left;font-weight:800;cursor:pointer}.word-part-role-menu button:hover{background:#eaf7ff}.word-part-role-menu .role-extra-option{color:#b91c1c}.word-part-remove,.remove-row{border:0;border-radius:11px;background:#fee5e3;color:#b91c1c;box-shadow:none;cursor:pointer}.word-part-remove{width:38px;height:38px}.remove-row{position:absolute;right:8px;top:8px;width:36px;height:36px}.word-add-line,.question-insert-button{border:2px solid #bfe6ff!important;border-radius:11px!important;background:#eef8ff!important;color:#126fc9!important;box-shadow:none!important;font-weight:900!important}.word-add-line-bottom{display:block;margin:4px 0 0 auto}.word-extra-note,.small{font-size:13px;color:#667894}.word-rules-box{padding:8px;border:2px solid #d7e7f5;border-radius:14px;background:#f7fbff;color:#102b57}.word-rules-title{font-weight:900;color:#173b70;margin-bottom:5px}.word-rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.word-rule-field{display:flex;flex-direction:column;min-width:0}.word-rule-field label{display:flex;align-items:flex-start;min-height:29px;font-weight:800;margin-bottom:4px;color:#102b57}.word-editor-hint{margin-top:6px;border:2px solid #d7e7f5;border-radius:14px;background:#f7fbff;overflow:hidden}.word-editor-hint label{display:flex;align-items:center;min-height:0;padding:7px 10px;margin:0;font-weight:900;color:#102b57;background:#f7fbff}.dictation-spellcheck{margin-top:6px;font-size:13px}.date-picker{background:#f7fbff;border:2px solid #dce9f6;border-radius:14px;padding:9px;margin-top:8px;max-width:560px}.date-picker-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.date-picker-title{font:800 20px/1 "Baloo 2",Nunito,sans-serif;color:#102b57}.date-picker-nav{width:40px;height:40px;padding:0;border-radius:12px;background:#eaf4ff;color:#126fc9;box-shadow:none}.date-picker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.date-picker-weekday{text-align:center;font-size:12px;font-weight:900;color:#667894;padding:4px}.date-picker-day{min-height:42px;padding:6px;border-radius:10px;background:#fff;color:#102b57;border:2px solid transparent;box-shadow:none;font-weight:850}.date-picker-day:hover{background:#eaf7ff;border-color:#8bcfff}.date-picker-day.selected{background:#1787f2;color:#fff;border-color:#0d6fd4}.date-picker-day.today{border-color:#ffc928}.date-picker-day.empty{visibility:hidden}.date-picker-help{font-size:12px;color:#667894;margin-top:8px;text-align:center}.message{padding:12px 14px;border-radius:12px}.message.error{background:#fee5e3;color:#991b1b}.hidden{display:none!important}@media(max-width:900px){.editor-top-grid{grid-template-columns:1fr}.editor-top-left{display:grid;grid-template-rows:none;gap:0}.editor-top-left .field input{min-height:52px}}@media(max-width:700px){.word-rules-grid{grid-template-columns:1fr}.word-part-row{grid-template-columns:minmax(0,1fr) 40px;grid-template-areas:"input remove" "role remove"}.word-part-role-select{grid-area:role}.editor-student-buttons{display:grid;grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createLessonEditorApplication } from './src/features/lessons/lesson-editor-application.js';
    import { createLessonEditorPage } from './src/features/lessons/lesson-editor-page.js';
    import { readViewContext, buildViewUrl } from './src/core/view-context.js';

    const context=readViewContext(new URLSearchParams(window.location.search));
    const params=new URLSearchParams(window.location.search);
    const lessonId=params.get('lesson_id');
    const student=context.student;
    const mount=document.querySelector('#paco-template-mount');
    const content=document.createElement('div');
    content.className='lesson-editor-page';
    const app=createPacoGOApp({supabaseLib:window.supabase});
    const editorApp=createLessonEditorApplication({
      lessonService:app.lessons,
      storage:window.localStorage,
      initializeSession:()=>app.initializeSession(),
      isParent:()=>app.auth.isParent,
      refreshLessons:()=>app.loadLessons()
    });
    const goManagement=()=>{window.location.href=buildViewUrl('management.html',{student,mode:'management'}).toString();};

    mountPacoPageTemplate({
      mount,
      backLabel:'← Beheer',
      backAction:goManagement,
      greeting:'PacoGO beheer ⚙️',
      title:lessonId?'Les bewerken':'Nieuwe les',
      icon:'📚',
      subtitle:'Maak of bewerk een les met de bestaande lesvormen en velden.',
      navigation:createPacoNavigation({app,active:'management',student,includeCreator:true}),
      content
    });

    async function load(){
      await app.initializeSession();
      if(!app.auth.isParent){content.textContent='Je hebt geen toegang tot lesbeheer.';return;}
      let lesson=null;
      if(lessonId){
        const records=await app.loadLessons();
        lesson=app.mapLessons(records).find(item=>String(item.id)===String(lessonId))||null;
        if(!lesson){content.textContent='Deze les kon niet worden gevonden.';return;}
        const calendarEntry=editorApp.calendar.getAll().find(item=>Number(item.lessonId)===Number(lesson.id)&&item.student===lesson.student);
        lesson={...lesson,testDate:calendarEntry?.date||''};
      }
      createLessonEditorPage({root:content,runtime:editorApp.editor,initialLesson:lesson,student:student||lesson?.student||''});
    }
    load().catch(error=>{console.error('Lesson editor load error:',error);content.textContent='De leseditor kon niet worden geladen.';});
  </script>
</body>
</html>
