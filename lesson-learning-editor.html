<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Leerstof bewerken</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .learning-editor-shell{display:grid;gap:14px;color:#102b57}.learning-editor{display:grid;gap:14px}.learning-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.learning-head h2{font:900 28px/1.05 "Baloo 2",Nunito,sans-serif}.learning-card{border:2px solid #cfe3f3;border-radius:20px;background:#fff;padding:15px;box-shadow:0 6px 18px rgba(16,43,87,.06)}.learning-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.learning-number{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dff0ff;color:#126fc9;font-weight:900}.learning-card-title{flex:1}.learning-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.learning-toolbar button{width:auto;padding:7px 10px}.learning-toolbar button.is-active{background:#1787f2;color:#fff;border-color:#0d6fd4;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 4px 0 rgba(13,111,212,.18)}.learning-content{min-height:150px;border:1px solid #cfe3f3;border-radius:12px;padding:12px;line-height:1.55;outline:none;color:#102b57;background:#fff}.learning-content:focus{border-color:#1787f2;box-shadow:0 0 0 2px #eaf4ff}.learning-content .learning-size-large{font-size:1.35em}.learning-content .learning-size-small{font-size:.8em}.learning-image{margin-top:10px}.learning-image img{display:block;max-width:100%;max-height:240px;border-radius:14px}.learning-image-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}.learning-image-actions button{width:auto}.learning-insert-button{display:block;width:100%!important;margin:0;padding:9px 12px!important;border:2px solid #bfe6ff!important;border-radius:11px!important;background:#eef8ff!important;color:#126fc9!important;box-shadow:none!important;font-weight:900!important}.learning-insert-button:hover{background:#e2f2ff!important;border-color:#8bcfff!important}.learning-empty,.learning-status{padding:16px;border-radius:16px}.learning-empty{border:2px dashed #cfe3f3;background:#fbfdff;color:#667894;text-align:center}.learning-status{background:#eef8ff;color:#126fc9;font-weight:800}.learning-size-note{font-size:13px;color:#667894;font-weight:700;margin:-2px 0 6px}.learning-save-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  </style>
</head>
<body><div id="paco-template-mount"></div>
<script type="module">
import { mountPacoPageTemplate } from './src/components/page-template.js';
import { createPacoNavigation } from './src/components/page-navigation.js';
import { createPacoGOApp } from './src/app/bootstrap.js';
import { readViewContext, applyViewContext, buildViewUrl } from './src/core/view-context.js';

const params=new URLSearchParams(window.location.search);
const context=readViewContext(params);
const lessonId=params.get('lesson_id');
const mount=document.querySelector('#paco-template-mount');
const content=document.createElement('div');
const app=createPacoGOApp({supabaseLib:window.supabase});
let lesson=null;
let cards=[];
let activeEditor=null;

mountPacoPageTemplate({
  mount,
  backLabel:'← Les bewerken',
  backAction:()=>{const url=buildViewUrl('lesson-editor.html',{student:context.student,mode:context.mode});if(lessonId)url.searchParams.set('lesson_id',lessonId);window.location.href=url.toString()},
  greeting:'PacoGO beheer ⚙️',
  title:'Leerstof',
  icon:'📖',
  subtitle:'Maak van deze les hapklare leerkaarten met tekst en afbeeldingen.',
  navigation:createPacoNavigation({app,active:'management',student:context.student,includeCreator:true}),
  content
});

function newCard(){return {id:null,title:'',content:'',image_id:null,image:null,pendingFile:null,pendingUrl:null}}
function addCard(afterIndex=cards.length-1){cards.splice(afterIndex+1,0,newCard());render()}
function removeCard(index){const card=cards[index];if(card.pendingUrl)URL.revokeObjectURL(card.pendingUrl);cards.splice(index,1);render()}
function moveCard(index,direction){const target=index+direction;if(target<0||target>=cards.length)return;[cards[index],cards[target]]=[cards[target],cards[index]];render()}

const SIZE_COMMAND={small:'2',normal:'3',large:'6'};
const SIZE_CLASS={small:'learning-size-small',large:'learning-size-large'};
function selectionInside(editor){const selection=window.getSelection();if(!selection?.rangeCount)return null;const range=selection.getRangeAt(0);if(!editor.contains(range.commonAncestorContainer))return null;return {selection,range}}
function normalizeFontSizeMarkup(editor){editor.querySelectorAll('font[size]').forEach(font=>{const size=Object.entries(SIZE_COMMAND).find(([,value])=>value===font.getAttribute('size'))?.[0]||'normal';const replacement=document.createElement('span');if(SIZE_CLASS[size])replacement.className=SIZE_CLASS[size];while(font.firstChild)replacement.appendChild(font.firstChild);font.replaceWith(replacement)})}
function setSizeButtonState(editor,size){const toolbar=editor.parentElement?.querySelector('.learning-toolbar');if(!toolbar)return;toolbar.querySelectorAll('button[data-format="small"],button[data-format="normal"],button[data-format="large"]').forEach(button=>button.classList.toggle('is-active',button.dataset.format===size))}
function currentSize(editor){const selected=selectionInside(editor);if(!selected)return editor.dataset.typingSize||'normal';let node=selected.range.startContainer;if(node.nodeType===Node.TEXT_NODE)node=node.parentElement;const sized=node?.closest?.('.learning-size-large,.learning-size-small');if(sized?.classList.contains('learning-size-large'))return 'large';if(sized?.classList.contains('learning-size-small'))return 'small';return editor.dataset.typingSize||'normal'}
function applyTextSize(editor,size){editor.focus();activeEditor=editor;editor.dataset.typingSize=size;setSizeButtonState(editor,size);const selected=selectionInside(editor);if(!selected)return;try{document.execCommand('styleWithCSS',false,true);document.execCommand('fontSize',false,SIZE_COMMAND[size]);normalizeFontSizeMarkup(editor);editor.dispatchEvent(new Event('input',{bubbles:true}))}catch(error){console.error('Learning text size error:',error)}}
function applyFormat(editor,type,button){editor.focus();activeEditor=editor;if(type==='bold'||type==='italic'){document.execCommand(type,false);button.classList.toggle('is-active',document.queryCommandState(type));editor.dispatchEvent(new Event('input',{bubbles:true}));return}applyTextSize(editor,type)}
function updateFormatState(){if(!activeEditor||document.activeElement!==activeEditor)return;const toolbar=activeEditor.parentElement?.querySelector('.learning-toolbar');if(!toolbar)return;toolbar.querySelectorAll('button[data-format="bold"],button[data-format="italic"]').forEach(button=>{button.classList.toggle('is-active',document.queryCommandState(button.dataset.format))});setSizeButtonState(activeEditor,currentSize(activeEditor))}
document.addEventListener('selectionchange',updateFormatState);

function bindImage(card,input,preview){input.addEventListener('change',()=>{const file=input.files?.[0];if(!file||!file.type.startsWith('image/'))return;if(card.pendingUrl)URL.revokeObjectURL(card.pendingUrl);card.pendingFile=file;card.pendingUrl=URL.createObjectURL(file);preview.src=card.pendingUrl;preview.hidden=false})}
function createInsertButton(index){const button=document.createElement('button');button.type='button';button.className='learning-insert-button';button.textContent='➕ Leerkaart';button.onclick=()=>addCard(index);return button}
function createSaveFeedback(){const box=document.createElement('div');box.className='learning-status';box.innerHTML='<strong>✓ Leerstof opgeslagen.</strong><div class="learning-save-actions"></div>';const actions=box.querySelector('.learning-save-actions');const view=document.createElement('button');view.type='button';view.className='success';view.textContent='👀 Leerstof bekijken';view.onclick=()=>{const url=buildViewUrl('lesson-learning.html',{student:context.student,mode:context.mode});url.searchParams.set('lesson_id',lessonId);window.location.href=url.toString()};const back=document.createElement('button');back.type='button';back.className='secondary';back.textContent='← Terug naar les';back.onclick=()=>{const url=buildViewUrl('lesson-editor.html',{student:context.student,mode:context.mode});if(lessonId)url.searchParams.set('lesson_id',lessonId);window.location.href=url.toString()};actions.append(view,back);return box}
function render(){content.replaceChildren();const shell=document.createElement('div');shell.className='card learning-editor-shell';const page=document.createElement('div');page.className='learning-editor';const head=document.createElement('div');head.className='learning-head';const title=document.createElement('div');title.innerHTML=`<h2>${escapeHtml(lesson?.title||'Leerstof')}</h2><div class="small">${escapeHtml(lesson?.subject||'')} · ${escapeHtml(lesson?.student||context.student||'')}</div>`;const tools=document.createElement('div');tools.className='learning-toolbar';const preview=document.createElement('button');preview.type='button';preview.className='secondary';preview.textContent='👀 Bekijken';preview.onclick=()=>{const url=buildViewUrl('lesson-learning.html',{student:context.student,mode:context.mode});url.searchParams.set('lesson_id',lessonId);window.location.href=url.toString()};tools.append(preview);head.append(title,tools);page.append(head);
if(!cards.length){const empty=document.createElement('div');empty.className='learning-empty';empty.innerHTML='<strong>Deze les heeft nog geen leerkaarten.</strong><br>Voeg hieronder de eerste kaart toe.';page.append(empty,createInsertButton(-1))}
cards.forEach((card,index)=>{const article=document.createElement('article');article.className='learning-card';const top=document.createElement('div');top.className='learning-card-head';const number=document.createElement('div');number.className='learning-number';number.textContent=String(index+1);const cardTitle=document.createElement('input');cardTitle.type='text';cardTitle.className='learning-card-title paco-template-input-lg';cardTitle.placeholder='Titel van deze leerkaart';cardTitle.value=card.title||'';cardTitle.addEventListener('input',()=>card.title=cardTitle.value);const up=document.createElement('button');up.type='button';up.className='secondary';up.textContent='↑';up.onclick=()=>moveCard(index,-1);const down=document.createElement('button');down.type='button';down.className='secondary';down.textContent='↓';down.onclick=()=>moveCard(index,1);const del=document.createElement('button');del.type='button';del.className='paco-template-remove-button';del.setAttribute('aria-label','Leerkaart verwijderen');del.title='Leerkaart verwijderen';del.textContent='✕';del.onclick=()=>removeCard(index);top.append(number,cardTitle,up,down,del);article.append(top);
const format=document.createElement('div');format.className='learning-toolbar';[['bold','B'],['italic','I'],['small','Kleiner'],['normal','Normaal'],['large','Groter']].forEach(([type,label])=>{const button=document.createElement('button');button.type='button';button.className='secondary';button.dataset.format=type;button.textContent=label;button.addEventListener('mousedown',event=>event.preventDefault());button.onclick=()=>applyFormat(editor,type,button);format.append(button)});article.append(format);
const sizeNote=document.createElement('div');sizeNote.className='learning-size-note';sizeNote.textContent='Tekstgrootte voor nieuwe tekst: normaal';article.append(sizeNote);
const editor=document.createElement('div');editor.className='learning-content';editor.contentEditable='true';editor.innerHTML=card.content||'';editor.dataset.typingSize='normal';editor.addEventListener('focus',()=>{activeEditor=editor;updateFormatState();updateSizeNote(editor,sizeNote)});editor.addEventListener('input',()=>{normalizeFontSizeMarkup(editor);card.content=editor.innerHTML;updateSizeNote(editor,sizeNote)});article.append(editor);
function updateSizeNote(target,note){const size=currentSize(target);note.textContent=`Tekstgrootte voor nieuwe tekst: ${size==='large'?'groot':size==='small'?'klein':'normaal'}`}
const image=document.createElement('div');image.className='learning-image';const previewImage=document.createElement('img');previewImage.alt='';previewImage.hidden=true;if(card.image?.url)previewImage.src=card.image.url;else if(card.pendingUrl){previewImage.src=card.pendingUrl;previewImage.hidden=false}else previewImage.hidden=true;image.append(previewImage);const actions=document.createElement('div');actions.className='learning-image-actions';const input=document.createElement('input');input.type='file';input.accept='image/jpeg,image/png,image/webp';input.className='paco-template-file-input';const choose=document.createElement('button');choose.type='button';choose.className='paco-template-file-button';choose.textContent=card.image_id?'Afbeelding vervangen':'Afbeelding toevoegen';choose.onclick=()=>input.click();const remove=document.createElement('button');remove.type='button';remove.className='paco-template-remove-button';remove.setAttribute('aria-label','Afbeelding verwijderen');remove.title='Afbeelding verwijderen';remove.textContent='✕';remove.hidden=!card.image_id&&!card.pendingFile;remove.onclick=()=>{if(card.pendingUrl)URL.revokeObjectURL(card.pendingUrl);card.pendingFile=null;card.pendingUrl=null;card.image_id=null;card.image=null;render()};actions.append(choose,remove,input);image.append(actions);bindImage(card,input,previewImage);article.append(image);page.append(article,createInsertButton(index))});
const save=document.createElement('button');save.type='button';save.className='success';save.textContent='💾 Leerstof opslaan';save.onclick=saveCards;page.append(save);shell.append(page);content.append(shell)}
async function saveCards(){const status=document.createElement('div');status.className='learning-status';status.textContent='Leerstof opslaan…';content.append(status);const uploaded=[];try{for(const card of cards){if(card.pendingFile){const media=await app.learningContent.uploadCardImage(lessonId,card.pendingFile);card.image_id=media.id;uploaded.push(media.id);card.pendingFile=null;if(card.pendingUrl){URL.revokeObjectURL(card.pendingUrl);card.pendingUrl=null}}}await app.learningContent.replaceForLesson(lessonId,cards);cards=await app.learningContent.listForLesson(lessonId);render();content.append(createSaveFeedback())}catch(error){for(const id of uploaded){try{await app.learningContent.removeCardImage(id)}catch(cleanupError){console.error('Learning image cleanup error:',cleanupError)}}console.error('Learning content save error:',error);status.textContent=error?.message||'De leerstof kon niet worden opgeslagen.'}}
function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
async function load(){await app.initializeSession();if(!app.auth.isParent)throw new Error('Je hebt geen toegang tot lesbeheer.');if(!lessonId)throw new Error('Geen les geselecteerd.');if(context.isManagement)applyViewContext(context,{canManage:app.auth.isParent});else applyViewContext(context);const records=await app.loadLessons();lesson=app.mapLessons(records).find(item=>String(item.id)===String(lessonId));if(!lesson)throw new Error('Deze les kon niet worden gevonden.');cards=await app.learningContent.listForLesson(lessonId);render()}
load().catch(error=>{console.error('Learning editor load error:',error);content.innerHTML=`<div class="card learning-editor-shell"><div class="learning-empty"><strong>De leerstofeditor kon niet worden geladen.</strong><br>${escapeHtml(error?.message||'Onbekende fout.')}</div></div>`});
</script></body></html>
