<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Leerstof</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .learning-editor{display:grid;gap:14px}.learning-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.learning-card{border:2px solid #cfe3f3;border-radius:20px;background:#fff;padding:15px;box-shadow:0 6px 18px rgba(16,43,87,.06)}.learning-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.learning-card-title{flex:1;font-weight:900;color:#102b57}.learning-card textarea{min-height:140px;resize:vertical;line-height:1.5}.learning-image-drop{min-height:130px;border:2px dashed #9ecdf2;border-radius:16px;background:#f7fbff;display:grid;place-items:center;text-align:center;color:#667894;padding:12px;cursor:pointer;margin-top:10px}.learning-image-drop.dragover{background:#eaf4ff;border-color:#1787f2;color:#126fc9}.learning-image-preview{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:auto}.learning-actions{display:flex;gap:7px;flex-wrap:wrap}.learning-actions button{width:auto}.learning-status{padding:12px 14px;border-radius:14px;background:#eef8ff;color:#126fc9;font-weight:800}.learning-empty{padding:18px;border:2px dashed #cfe3f3;border-radius:18px;background:#fbfdff;color:#667894;text-align:center}.learning-toolbar{display:flex;gap:8px;flex-wrap:wrap}.learning-toolbar button{width:auto}.learning-number{width:34px;height:34px;border-radius:50%;background:#dff0ff;color:#126fc9;display:grid;place-items:center;font-weight:900}.danger{background:#fff0ef!important;color:#a43d3d!important;border-color:#efcccc!important}@media(max-width:700px){.learning-card-head{align-items:flex-start}.learning-image-drop{min-height:110px}}
  </style>
</head>
<body><div id="paco-template-mount"></div>
<script type="module">
import { mountPacoPageTemplate } from './src/components/page-template.js';
import { createPacoNavigation } from './src/components/page-navigation.js';
import { createPacoGOApp } from './src/app/bootstrap.js';
import { readViewContext, applyViewContext, buildViewUrl } from './src/core/view-context.js';

const params=new URLSearchParams(window.location.search); const context=readViewContext(params); const lessonId=params.get('lesson_id');
const mount=document.querySelector('#paco-template-mount'); const content=document.createElement('div'); const app=createPacoGOApp({supabaseLib:window.supabase});
let lesson=null; let cards=[]; let dirtyImages=new Map();

mountPacoPageTemplate({mount,backLabel:'← Les bewerken',backAction:()=>{const url=buildViewUrl('lesson-editor.html',{student:context.student,mode:context.mode});if(lessonId)url.searchParams.set('lesson_id',lessonId);window.location.href=url.toString()},greeting:'PacoGO beheer ⚙️',title:'Leerstof',icon:'📖',subtitle:'Maak van de les hapklare leerkaarten met tekst en afbeeldingen.',navigation:createPacoNavigation({app,active:'management',student:context.student,includeCreator:true}),content});

function escape(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function learningUrl(){const url=buildViewUrl('lesson-learning.html',{student:lesson?.student||context.student,mode:context.mode});url.searchParams.set('lesson_id',lessonId);return url.toString()}
function addCard(card={}){cards.push({id:card.id||null,title:card.title||'',content:card.content||'',image_id:card.image_id||null,image:card.image||null,sort_order:cards.length});render()}
function moveCard(index,direction){const target=index+direction;if(target<0||target>=cards.length)return;[cards[index],cards[target]]=[cards[target],cards[index]];cards.forEach((card,i)=>card.sort_order=i);render()}
function removeCard(index){const card=cards[index];if(card.image_id)dirtyImages.set(Number(card.image_id),true);cards.splice(index,1);cards.forEach((item,i)=>item.sort_order=i);render()}
function bindImageDrop(card,index,drop){const input=drop.querySelector('input[type=file]');const handle=async file=>{if(!file||!file.type.startsWith('image/'))return;drop.querySelector('.learning-image-help').textContent='Afbeelding uploaden…';try{const uploaded=await app.learningContent.saveCardImage(lessonId,file);if(cards[index].image_id)dirtyImages.set(Number(cards[index].image_id),true);cards[index].image_id=uploaded.id;cards[index].image=uploaded;render()}catch(error){drop.querySelector('.learning-image-help').textContent=error?.message||'Afbeelding kon niet worden opgeslagen.'}};drop.addEventListener('click',()=>input.click());input.addEventListener('change',()=>handle(input.files?.[0]));drop.addEventListener('dragover',event=>{event.preventDefault();drop.classList.add('dragover')});drop.addEventListener('dragleave',()=>drop.classList.remove('dragover'));drop.addEventListener('drop',event=>{event.preventDefault();drop.classList.remove('dragover');handle(event.dataTransfer?.files?.[0])});drop.addEventListener('paste',event=>{const file=[...(event.clipboardData?.files||[])].find(item=>item.type.startsWith('image/'));if(file)handle(file)})}
function render(){content.replaceChildren();const page=document.createElement('div');page.className='learning-editor';const head=document.createElement('div');head.className='learning-head';head.innerHTML=`<div><h2 style="margin:0;color:#102b57">${escape(lesson?.title||'Leerstof')}</h2><div class="small">${escape(lesson?.subject||'')} · ${escape(lesson?.student||context.student||'')}</div></div>`;const toolbar=document.createElement('div');toolbar.className='learning-toolbar';const add=document.createElement('button');add.type='button';add.className='success';add.textContent='➕ Leerkaart';add.onclick=()=>addCard();const preview=document.createElement('button');preview.type='button';preview.textContent='👀 Bekijken';preview.onclick=()=>window.location.href=learningUrl();toolbar.append(add,preview);head.append(toolbar);page.append(head);
if(!cards.length){const empty=document.createElement('div');empty.className='learning-empty';empty.innerHTML='<strong>Deze les heeft nog geen leerkaarten.</strong><br>Maak bijvoorbeeld 5–10 korte kaarten voor de stof over Azië.';page.append(empty)}
cards.forEach((card,index)=>{const article=document.createElement('article');article.className='learning-card';const top=document.createElement('div');top.className='learning-card-head';top.innerHTML=`<div class="learning-number">${index+1}</div>`;const title=document.createElement('input');title.className='learning-card-title';title.placeholder='Titel van deze leerkaart';title.value=card.title;title.addEventListener('input',()=>{card.title=title.value});top.append(title);const up=document.createElement('button');up.type='button';up.textContent='↑';up.title='Omhoog';up.onclick=()=>moveCard(index,-1);const down=document.createElement('button');down.type='button';down.textContent='↓';down.title='Omlaag';down.onclick=()=>moveCard(index,1);const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Verwijderen';del.onclick=()=>removeCard(index);top.append(up,down,del);article.append(top);const text=document.createElement('textarea');text.placeholder='Schrijf hier een kort stukje leerstof. Houd het overzichtelijk: één onderwerp per kaart.';text.value=card.content;text.addEventListener('input',()=>{card.content=text.value});article.append(text);const drop=document.createElement('div');drop.className='learning-image-drop';drop.tabIndex=0;drop.innerHTML=card.image?.url?`<div><img class="learning-image-preview" src="${escape(card.image.url)}" alt=""><div class="learning-image-help">Sleep een nieuwe afbeelding hierheen of klik om te vervangen.</div></div>`:`<div><strong>🖼️ Afbeelding toevoegen</strong><div class="learning-image-help">Sleep een JPEG, PNG of WebP hierheen, klik hier of plak een afbeelding.</div></div><input type="file" accept="image/jpeg,image/png,image/webp" hidden>`;article.append(drop);bindImageDrop(card,index,drop);page.append(article)});
const bottom=document.createElement('div');bottom.className='learning-actions';const save=document.createElement('button');save.type='button';save.className='success';save.textContent='💾 Leerstof opslaan';save.onclick=saveCards;bottom.append(save);const status=document.createElement('div');status.id='learningStatus';status.className='learning-status';status.hidden=true;bottom.append(status);page.append(bottom);content.append(page)}
async function saveCards(){const status=document.querySelector('#learningStatus');status.hidden=false;status.textContent='Leerstof opslaan…';try{cards.forEach((card,i)=>card.sort_order=i);await app.learningContent.replaceForLesson(lessonId,cards);for(const [id] of dirtyImages){try{await app.learningContent.removeCardImage(id)}catch(error){console.error('Learning image cleanup error:',error)}}dirtyImages.clear();cards=await app.learningContent.listForLesson(lessonId);status.textContent='Opgeslagen.';render()}catch(error){console.error('Learning content save error:',error);status.textContent=error?.message||'De leerstof kon niet worden opgeslagen.'}}
async function load(){await app.initializeSession();if(!app.auth.isParent){content.textContent='Je hebt geen toegang tot lesbeheer.';return}if(!lessonId)throw new Error('Geen les geselecteerd.');if(context.isManagement)applyViewContext(context,{canManage:app.auth.isParent});else applyViewContext(context);const records=await app.loadLessons();lesson=app.mapLessons(records).find(item=>String(item.id)===String(lessonId));if(!lesson)throw new Error('Deze les kon niet worden gevonden.');cards=await app.learningContent.listForLesson(lessonId);render()}
load().catch(error=>{console.error('Learning editor load error:',error);content.innerHTML=`<div class="learning-empty"><strong>De leerstofeditor kon niet worden geladen.</strong><br>${escape(error?.message||'Onbekende fout.')}</div>`});
</script></body></html>
