<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PacoGO — Beheer</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <link rel="stylesheet" href="src/features/management/student-card-view.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .management-page{display:grid;gap:18px}.management-section{display:grid;gap:14px;padding:20px;border:1px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07)}.management-state{padding:16px 18px;border:1px solid #dce9f6;border-radius:16px;background:#f7fbff;color:#667894;font-weight:700}.management-student-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.management-section h2{margin:0;font:800 25px/1.1 "Baloo 2",Nunito,sans-serif;color:#102b57}@media(max-width:900px){.management-student-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.management-student-cards{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="paco-template-mount"></div>
<script type="module">
import { mountPacoPageTemplate } from './src/components/page-template.js';
import { createPacoNavigation } from './src/components/page-navigation.js';
import { createPacoGOApp } from './src/app/bootstrap.js';
import { createAgendaRuntimeEntry } from './src/features/agenda/runtime-entry.js';
import { listStudents } from './src/features/students/students.js';
import { renderStudentManagementCards } from './src/features/management/student-card-view.js';
import { readViewContext, applyViewContext, buildViewUrl, getViewContext } from './src/core/view-context.js';

const context=readViewContext(new URLSearchParams(window.location.search));
const selectedStudent=context.student;
const mount=document.querySelector('#paco-template-mount');const content=document.createElement('div');content.className='management-page';const state=document.createElement('div');state.className='management-state';state.textContent='Beheer laden…';content.appendChild(state);const app=createPacoGOApp({supabaseLib:window.supabase});const management=app.management;
function selectManagementStudent(student){window.location.href=buildViewUrl('lessons.html',{student,mode:'management'}).toString()}
const navigation=createPacoNavigation({includeManagement:false,includeManagementTools:true,includeCreator:true,includeManagementStudentSelector:true,managementStudents:listStudents(),student:selectedStudent,viewMode:context.mode,onSelectManagementStudent:selectManagementStudent});
mountPacoPageTemplate({mount,backLabel:'← Dashboard',backAction:()=>{window.location.href='dashboard.html'},greeting:'PacoGO beheer ⚙️',title:'Beheer',icon:'⚙️',subtitle:selectedStudent?`Beheer voor ${selectedStudent}.`:'Kies links een leerling om haar gedeelde leerlingomgeving te openen.',navigation,content});
const studentCards=document.createElement('div');studentCards.className='management-student-cards';const studentSection=document.createElement('section');studentSection.className='management-section';const studentHeading=document.createElement('h2');studentHeading.textContent='Leerlingen';studentSection.append(studentHeading,studentCards);const openNewLessonFor=student=>{const target=buildViewUrl('lesson-editor.html',{student,mode:'management'});window.location.href=target.toString()};const openMonthCalendar=student=>{window.location.href=buildViewUrl('month-calendar.html',{student,mode:'management'}).toString()};const agenda=createAgendaRuntimeEntry({storage:localStorage,documentRef:document,db:app.db,currentStudent:()=>getViewContext().student,lessons:()=>app.state.lessons,demoItems:()=>[],now:()=>new Date()});
function renderStudents(){renderStudentManagementCards(studentCards,{students:management.getStudents(),lessons:app.state.lessons,getAgendaItems:student=>agenda.buildAgendaItemsForRender(student),onSelect:selectManagementStudent,onCreateLesson:openNewLessonFor,onOpenMonthCalendar:openMonthCalendar,onOpenStudent:selectManagementStudent})}
async function initializeManagement(){try{const session=await app.initializeSession();if(!session){window.location.href='auth.html';return}if(!app.auth.isParent){state.textContent='Je hebt geen toegang tot Beheer.';return}if(context.isManagement)applyViewContext(context,{canManage:app.auth.isParent});await management.loadAllLessons();renderStudents();content.replaceChildren(studentSection)}catch(error){console.error('Management page load error:',error);state.textContent='Beheer kon niet worden geladen.'}}
initializeManagement();
</script></body></html>
