<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PacoGO — Beheer</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .management-page{display:grid;gap:18px}
    .management-section{display:grid;gap:14px;padding:20px;border:1px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07)}
    .management-state{padding:16px 18px;border:1px solid #dce9f6;border-radius:16px;background:#f7fbff;color:#667894;font-weight:700}
    .management-student-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .management-student-card{display:grid;gap:14px;align-content:start;padding:18px;border:2px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(16,43,87,.07);min-width:0}
    .management-student-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .management-student-name{border:0;background:none;padding:0;color:#102b57;font:900 25px/1.1 "Baloo 2",Nunito,sans-serif;cursor:pointer;text-align:left}
    .management-student-name:hover{color:#126fc9}
    .management-student-open{border:0;background:none;padding:5px 0;color:#126fc9;font:900 14px/1.1 "Baloo 2",Nunito,sans-serif;cursor:pointer;white-space:nowrap}
    .management-student-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .management-student-action{border:0;border-radius:14px;padding:12px 10px;background:#eaf4ff;color:#126fc9;font:900 15px/1.1 "Baloo 2",Nunito,sans-serif;cursor:pointer}
    .management-student-action:hover{background:#dff0ff}
    .management-student-section{display:grid;gap:8px}
    .management-student-section-label{color:#667894;font:900 13px/1.1 Nunito,sans-serif;letter-spacing:.03em}
    .management-subject-chips{display:flex;flex-wrap:wrap;gap:7px}
    .management-subject-chip{padding:7px 10px;border:1px solid #cfe3f3;border-radius:12px;background:#f7fbff;color:#17365f;font:800 14px/1.1 Nunito,sans-serif}
    .management-student-muted{color:#667894;font-size:13px}
    .management-student-agenda{padding-top:2px;border-top:1px solid #dce9f6}
    .management-agenda-preview{display:grid;gap:7px}
    .management-agenda-preview-item{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:start;padding:7px 0}
    .management-agenda-date{color:#126fc9;font:900 13px/1.2 Nunito,sans-serif}
    .management-agenda-title{color:#102b57;font:800 14px/1.25 Nunito,sans-serif;min-width:0}
    .management-section h2{margin:0;font:800 25px/1.1 "Baloo 2",Nunito,sans-serif;color:#102b57}
    @media(max-width:900px){.management-student-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){.management-student-cards{grid-template-columns:1fr}.management-student-card-top{align-items:flex-start;flex-direction:column}.management-student-open{padding:0}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createAgendaRuntimeEntry } from './src/features/agenda/runtime-entry.js';
    import { renderStudentManagementCards } from './src/features/management/student-card-view.js';

    const mount=document.querySelector('#paco-template-mount');
    const content=document.createElement('div');
    content.className='management-page';
    const state=document.createElement('div');
    state.className='management-state';
    state.textContent='Beheer laden…';
    content.appendChild(state);

    mountPacoPageTemplate({
      mount,
      backLabel:'← Dashboard',
      backAction:()=>{window.location.href='dashboard.html';},
      greeting:'PacoGO beheer ⚙️',
      title:'Beheer',
      icon:'⚙️',
      subtitle:'Kies een leerling om direct naar de belangrijkste acties en de komende week te gaan.',
      navigation:createPacoNavigation({
        includeManagement:false,
        includeManagementTools:true,
        includeCreator:true
      }),
      content
    });

    const app=createPacoGOApp({supabaseLib:window.supabase});
    const management=app.management;
    const studentCards=document.createElement('div');
    studentCards.className='management-student-cards';
    const studentSection=document.createElement('section');
    studentSection.className='management-section';
    const studentHeading=document.createElement('h2');
    studentHeading.textContent='Leerlingen';
    studentSection.append(studentHeading,studentCards);

    const openNewLessonFor=student=>{window.location.href=`lesson-editor.html?student=${encodeURIComponent(student)}`;};
    const openMonthCalendar=student=>{window.location.href=`month-calendar.html?student=${encodeURIComponent(student)}`;};
    const openStudent=student=>{window.location.href=`dashboard.html?student=${encodeURIComponent(student)}`;};

    const agenda=createAgendaRuntimeEntry({
      storage:localStorage,
      documentRef:document,
      db:app.db,
      currentStudent:()=>management.getSelectedStudent() || '',
      lessons:()=>app.state.lessons,
      demoItems:()=>[],
      now:()=>new Date()
    });

    function renderStudents(){
      renderStudentManagementCards(studentCards,{
        students:management.getStudents(),
        lessons:app.state.lessons,
        getAgendaItems:student=>agenda.buildAgendaItemsForRender(student),
        onSelect:student=>{
          management.selectStudent(student);
          renderStudents();
        },
        onCreateLesson:openNewLessonFor,
        onOpenMonthCalendar:openMonthCalendar,
        onOpenStudent:openStudent
      });
    }

    async function initializeManagement(){
      try{
        const session=await app.initializeSession();
        if(!session){window.location.href='auth.html';return;}
        if(!app.auth.isParent){state.textContent='Je hebt geen toegang tot Beheer.';return;}

        const selected=management.getSelectedStudent()||management.getStudents()[0];
        if(selected) management.selectStudent(selected);
        await management.loadLessons();
        renderStudents();
        content.replaceChildren(studentSection);
      }catch(error){
        console.error('Management page load error:',error);
        state.textContent='Beheer kon niet worden geladen.';
      }
    }

    initializeManagement();
  </script>
</body>
</html>
