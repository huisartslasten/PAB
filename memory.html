<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Memory</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <link rel="stylesheet" href="src/features/lessons/lesson-context-view.css">
  <link rel="stylesheet" href="src/features/lessons/memory.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createLessonContextField } from './src/features/lessons/lesson-context-view.js';
    import { createMemoryRuntime } from './src/features/lessons/memory-runtime.js';
    import { createMemoryView } from './src/features/lessons/memory-view.js';
    import { readViewContext, buildViewUrl } from './src/core/view-context.js';
    import { escapeHtml } from './src/core/html.js';

    const params = new URLSearchParams(window.location.search);
    const context = readViewContext(params);
    const lessonId = params.get('lesson_id') || '';
    const student = context.student;
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    const app = createPacoGOApp({ supabaseLib: window.supabase });
    const view = createMemoryView({ documentRef: document, escapeHtml });
    let timingMode = 'manual';
    let revealTimer = null;

    const goGames = () => {
      const target = buildViewUrl('games.html', { student, mode: context.mode });
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      window.location.href = target.toString();
    };

    mountPacoPageTemplate({
      mount,
      backLabel: '← Spelletjes',
      backAction: goGames,
      greeting: `Hoi ${student}! 🐶`,
      title: 'Memory',
      icon: '🧠',
      subtitle: 'Vind de vraag en het bijbehorende antwoord.',
      navigation: createPacoNavigation({ app, active: 'lessons', student, viewMode: context.mode }),
      content
    });

    async function load() {
      if (!lessonId || !student) throw new Error('Geen leerling of les geselecteerd.');
      const records = await app.loadLessons();
      const lesson = app.mapLessons(records).find(item => String(item.id) === String(lessonId));
      if (!lesson) throw new Error('Deze les kon niet worden gevonden.');

      const contextField = createLessonContextField(lesson);
      content.appendChild(contextField);
      const gameMount = document.createElement('div');
      content.appendChild(gameMount);

      const items = Array.isArray(lesson.lesson_items) ? lesson.lesson_items : Array.isArray(lesson.items) ? lesson.items : [];
      const runtime = createMemoryRuntime({ items });

      function clearRevealTimer() {
        if (revealTimer !== null) {
          window.clearTimeout(revealTimer);
          revealTimer = null;
        }
      }

      function resolveTurn() {
        clearRevealTimer();
        if (runtime.snapshot().phase !== 'checking') return;
        runtime.resolveTurn();
        renderState();
      }

      function renderState() {
        const state = runtime.snapshot();
        clearRevealTimer();
        gameMount.replaceChildren(view.render({
          state,
          timingMode,
          onTimingModeChange: nextMode => {
            timingMode = nextMode;
            renderState();
          },
          onResolveTurn: resolveTurn,
          onCardSelect: cardId => {
            runtime.selectCard(cardId);
            renderState();
          },
          onFinished: () => {
            runtime.start();
            renderState();
          }
        }));

        if (state.phase === 'checking' && timingMode !== 'manual') {
          const delay = Number(timingMode) * 1000;
          revealTimer = window.setTimeout(resolveTurn, delay);
        }
      }

      runtime.start();
      renderState();
    }

    try {
      await load();
    } catch (error) {
      console.error('Memory load error:', error);
      content.replaceChildren();
      const node = document.createElement('div');
      node.className = 'practice-page-card';
      node.innerHTML = `<strong>Memory kon niet worden geladen.</strong><p class="small">${escapeHtml(error?.message || 'Onbekende fout.')}</p>`;
      content.appendChild(node);
    }
  </script>
</body>
</html>
