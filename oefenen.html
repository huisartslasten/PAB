<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Oefenen</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <style>
    .practice-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .practice-choice-card{min-height:180px;display:flex;flex-direction:column;justify-content:space-between;padding:18px;border:2px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 6px 0 rgba(16,43,87,.06),0 10px 22px rgba(16,43,87,.07);transition:.16s}
    .practice-choice-card.available{background:#fffdf0;border-color:#f4e8a8}
    .practice-choice-card.available:hover{transform:translateY(-3px);box-shadow:0 9px 0 rgba(16,43,87,.07),0 14px 26px rgba(16,43,87,.1)}
    .practice-choice-icon{height:72px;border-radius:17px;background:#eef8ff;display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:14px}
    .practice-choice-card.available .practice-choice-icon{background:#fff6cf}
    .practice-choice-card h2{margin:0 0 5px;font-family:"Baloo 2",Nunito,sans-serif;font-size:25px;line-height:1;color:#102b57}
    .practice-choice-card p{margin:0;color:#667894;font-size:14px;line-height:1.35}
    .practice-choice-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
    .practice-choice-tag{padding:5px 9px;border-radius:999px;background:#eaf4ff;color:#126fc9;font-size:11px;font-weight:900}
    .practice-choice-button{border:0;border-radius:12px;padding:9px 14px;background:#1787f2;color:#fff;font:800 14px Nunito;box-shadow:0 3px 0 #0d6fd4;cursor:pointer}
    .practice-choice-button:hover{background:#0d6fd4}
    @media(max-width:1000px){.practice-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){.practice-choice-grid{grid-template-columns:1fr}.practice-choice-card{min-height:180px}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>

  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';

    const params = new URLSearchParams(window.location.search);
    const lessonId = params.get('lesson_id') || '';
    const student = params.get('student') || 'Zyon';
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');

    const grid = document.createElement('div');
    grid.className = 'practice-choice-grid';

    const cards = [
      { icon:'🃏', title:'Flashcards', text:'Oefen de inhoud van deze les met korte vraag-en-antwoordkaarten.', available:true },
      { icon:'🎮', title:'Spelletjes', text:'Straks kun je deze les ook oefenen met leuke spelletjes.', available:false },
      { icon:'✏️', title:'Oefenen', text:'Een gerichte oefenvorm voor de inhoud van deze les.', available:false },
      { icon:'❓', title:'Vragen & antwoorden', text:'Oefen met vragen en controleer daarna je antwoord.', available:false },
      { icon:'🔄', title:'Herhalen', text:'Kom terug op onderdelen die je nog extra wilt oefenen.', available:false }
    ];

    cards.forEach(card => {
      const article = document.createElement('article');
      article.className = `practice-choice-card${card.available ? ' available' : ''}`;

      const top = document.createElement('div');
      const icon = document.createElement('div');
      icon.className = 'practice-choice-icon';
      icon.textContent = card.icon;
      const title = document.createElement('h2');
      title.textContent = card.title;
      const text = document.createElement('p');
      text.textContent = card.text;
      top.append(icon, title, text);

      const footer = document.createElement('div');
      footer.className = 'practice-choice-footer';
      const tag = document.createElement('span');
      tag.className = 'practice-choice-tag';
      tag.textContent = card.available ? 'Beschikbaar' : 'Binnenkort';
      footer.appendChild(tag);

      if (card.available) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'practice-choice-button';
        button.textContent = 'Oefenen →';
        button.addEventListener('click', () => {
          const target = new URL('flashcards-template.html', window.location.href);
          if (lessonId) target.searchParams.set('lesson_id', lessonId);
          target.searchParams.set('student', student);
          window.location.href = target.toString();
        });
        footer.appendChild(button);
      }

      article.append(top, footer);
      grid.appendChild(article);
    });

    content.appendChild(grid);

    mountPacoPageTemplate({
      mount,
      backLabel: '← Terug',
      backAction: () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'index.html';
      },
      greeting: `Hoi ${student}! 🐶`,
      title: 'Oefenen',
      icon: '✏️',
      subtitle: 'Kies hoe je met deze les wilt oefenen.',
      navigation: [
        { icon:'🏠', label:'Dashboard', onClick:() => { window.location.href='index.html'; } },
        { icon:'📚', label:'Mijn lessen', expanded:true, submenu:[
          { label:'Español' }, { label:'Geschiedenis' }, { label:'Nederlands' }
        ] },
        { icon:'📝', label:'Toetsen' },
        { icon:'📅', label:'Mijn agenda', expanded:true, submenu:[
          { label:'Agenda invoeren' }, { label:'Maandkalender' }
        ] }
      ],
      content
    });
  </script>
</body>
</html>
