<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Oefenen</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="src/components/page-template.css">
  <link rel="stylesheet" href="src/features/lessons/lesson-context-view.css">
  <style>
    .practice-mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    .practice-mode-card{min-height:190px;border:2px solid #dce9f6;border-radius:22px;background:#fff;box-shadow:0 7px 20px rgba(16,43,87,.07);padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:.16s}
    .practice-mode-card:hover{transform:translateY(-2px);box-shadow:0 12px 27px rgba(16,43,87,.11)}
    .practice-mode-card.active{background:#fffdf0;border-color:#f4e8a8}
    .practice-mode-icon{height:72px;border-radius:17px;background:#eef8ff;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:13px}
    .practice-mode-card.active .practice-mode-icon{background:#fff6cf}
    .practice-mode-card h2{margin:0;color:#102b57;font:800 24px/1 "Baloo 2",Nunito,sans-serif}
    .practice-mode-card p{margin:8px 0 0;color:#667894;line-height:1.4}
    .practice-mode-action{margin-top:15px;font-size:12px;font-weight:900;color:#126fc9}
    .practice-mode-card.planned{cursor:default;opacity:.68}
    .practice-mode-card.planned:hover{transform:none;box-shadow:0 7px 20px rgba(16,43,87,.07)}
    .practice-mode-card.planned .practice-mode-action{color:#667894}
    .practice-state{padding:16px 18px;border:1px solid #dce9f6;border-radius:18px;background:#fff;color:#667894}
    @media(max-width:700px){.practice-mode-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { getActivePracticeModes, getPracticeModes } from './src/features/practice/practice-domain.js';
    import { createLessonContextField } from './src/features/lessons/lesson-context-view.js';
    import { readViewContext, buildViewUrl } from './src/core/view-context.js';

    const params = new URLSearchParams(window.location.search);
    const context = readViewContext(params);
    const lessonId = params.get('lesson_id') || '';
    const student = context.student;
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    const app = createPacoGOApp({ supabaseLib: window.supabase });
    const targetPaths = { flashcards: 'flashcards-template.html', 'practice-test': 'oefentoets.html' };
    const modeMeta = {
      flashcards: { icon: '🃏', description: 'Oefen met vraag en antwoord en draai de kaart om als je klaar bent.' },
      'practice-test': { icon: '📝', description: 'Maak een oefentoets met alle vragen van deze les.' },
      games: { icon: '🎮', description: 'Speel leerzame spelletjes met deze les.' }
    };

    const goLessonChoice = () => {
      const target = buildViewUrl('lesson-choice.html', { student, mode: context.mode });
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      window.location.href = target.toString();
    };

    mountPacoPageTemplate({
      mount,
      backLabel: '← Leskeuze',
      backAction: goLessonChoice,
      greeting: `Hoi ${student}! 🐶`,
      title: 'Oefenen',
      icon: '✏️',
      subtitle: 'Kies hoe je deze les wilt oefenen.',
      navigation: createPacoNavigation({ app, active: 'lessons', student, viewMode: context.mode }),
      content
    });

    function openMode(mode) {
      const path = targetPaths[mode.id];
      if (!path) return;
      const target = buildViewUrl(path, { student, mode: context.mode });
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      window.location.href = target.toString();
    }

    function render(lesson) {
      content.replaceChildren();
      if (!lessonId || !lesson) {
        const state = document.createElement('div');
        state.className = 'practice-state';
        state.textContent = lessonId ? 'Deze les kon niet worden gevonden.' : 'Geen les geselecteerd.';
        content.appendChild(state);
        return;
      }

      const lessonField = createLessonContextField(lesson);
      const grid = document.createElement('div');
      grid.className = 'practice-mode-grid';
      getPracticeModes().forEach(mode => {
        const active = mode.status === 'active';
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `practice-mode-card${active ? ' active' : ' planned'}`;
        card.disabled = !active;
        const meta = modeMeta[mode.id] || { icon: '📘', description: '' };
        card.innerHTML = `<div><div class="practice-mode-icon">${meta.icon}</div><h2>${mode.label}</h2><p>${meta.description}</p></div><div class="practice-mode-action">${active ? 'Openen →' : 'Binnenkort beschikbaar'}</div>`;
        if (active && getActivePracticeModes().some(candidate => candidate.id === mode.id)) card.addEventListener('click', () => openMode(mode));
        grid.appendChild(card);
      });
      lessonField.appendChild(grid);
      content.appendChild(lessonField);
    }

    if (!lessonId || !student) {
      render(null);
    } else {
      try {
        const records = await app.loadLessons();
        const lesson = app.mapLessons(records).find(item => String(item.id) === String(lessonId));
        render(lesson || null);
      } catch (error) {
        console.error('Practice menu load error:', error);
        render(null);
      }
    }
  </script>
</body>
</html>
