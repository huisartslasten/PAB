<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Oefenen</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="src/components/page-template.css">
  <style>
    .practice-page-content{display:grid;gap:18px}
    .practice-progress{min-height:24px;color:#667894;font-family:"Baloo 2",Nunito,sans-serif;font-size:18px;font-weight:800}
    .practice-progress .progress-label{display:flex;justify-content:space-between;gap:16px;margin-bottom:7px}
    .practice-progress .progress{height:12px;overflow:hidden;border-radius:999px;background:#e7eef6}
    .practice-progress .progress-bar{height:100%;border-radius:999px;background:#1787f2}
    .practice-content{display:grid;gap:18px}
    .practice-hint{display:flex;align-items:flex-start;gap:12px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
    .practice-hint-button{min-height:48px;padding:10px 20px;border:2px solid #cfe3f3;border-radius:15px;background:#edf8ff;color:#126fc9;font-family:"Baloo 2",Nunito,sans-serif;font-size:17px;font-weight:900;box-shadow:0 3px 0 rgba(16,43,87,.08);cursor:pointer}
    .practice-hint-button:hover{background:#dff0ff;border-color:#1787f2}
    .practice-hint-box{max-width:760px;padding:13px 16px;border:2px solid #f0df9a;border-radius:15px;background:#fffdf0;color:#102b57;text-align:left;font-size:16px;line-height:1.45}
    .practice-hint-box strong{display:block;margin-bottom:3px;font-family:"Baloo 2",Nunito,sans-serif;font-size:17px}
    .practice-hint-box.hidden{display:none}
    .practice-loading{min-height:220px;display:grid;place-items:center;padding:30px;border:2px solid #dce9f6;border-radius:24px;background:#fff;color:#667894;font-size:18px;font-weight:800;text-align:center}
    .practice-question-card{padding:26px;border:2px solid #dce9f6;border-radius:24px;background:#fff}
    .practice-content .prompt{font-family:"Baloo 2",Nunito,sans-serif;font-size:clamp(30px,4vw,48px);line-height:1.08;font-weight:900;color:#102b57;text-align:center;white-space:pre-wrap}
    .practice-content .answer-input{min-height:52px;border:2px solid #cfe3f3;border-radius:15px;padding:12px 15px;font:700 18px Nunito,sans-serif}
    .practice-content .big{min-height:50px;padding:11px 20px;border-radius:15px;font:900 17px Nunito,sans-serif;cursor:pointer}
    .practice-content .feedback{margin-top:12px}
    .practice-content .question-answer{padding:20px;border:2px solid #dce9f6;border-radius:18px;background:#f8fbff;line-height:1.55}
    .practice-content .self-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
    .practice-content .self-buttons button{min-height:50px;padding:10px 22px;border-radius:15px;font:900 17px Nunito,sans-serif;cursor:pointer}
    @media(max-width:700px){.practice-hint{justify-content:stretch}.practice-hint-button{width:100%}}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createPracticePresentation } from './src/features/lessons/practice-presentation.js';
    import { escapeHtml } from './src/utils/text.js';

    const params = new URLSearchParams(window.location.search);
    const lessonId = params.get('lesson_id') || '';
    const student = params.get('student') || 'Zyon';
    const mount = document.querySelector('#paco-template-mount');
    const practiceRoot = document.createElement('div');
    practiceRoot.id = 'practice';
    practiceRoot.className = 'practice-page-content';

    const progress = document.createElement('div');
    progress.id = 'practiceProgress';
    progress.className = 'practice-progress';

    const content = document.createElement('div');
    content.id = 'practiceContent';
    content.className = 'practice-content';

    const loading = document.createElement('div');
    loading.className = 'practice-loading';
    loading.textContent = 'Oefenen laden…';
    content.appendChild(loading);
    practiceRoot.append(progress, content);

    const goDashboard = () => {
      const target = new URL('dashboard.html', window.location.href);
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };
    const goAgenda = () => {
      const target = new URL('index.html', window.location.href);
      target.searchParams.set('view', 'agenda');
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };
    const goLessons = () => {
      const target = new URL('lessons.html', window.location.href);
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };
    const goLessonChoice = () => {
      const target = new URL('lesson-choice.html', window.location.href);
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };

    const template = mountPacoPageTemplate({
      mount,
      backLabel:'← Leskeuze',
      backAction:goLessonChoice,
      greeting:`Hoi ${student}! 🐶`,
      title:'Oefenen',
      icon:'✏️',
      subtitle:'Oefen deze les stap voor stap.',
      navigation:[
        { icon:'🏠', label:'Dashboard', onClick:goDashboard },
        { icon:'📚', label:'Mijn lessen', onClick:goLessons },
        { icon:'✏️', label:'Oefenen', active:true },
        { icon:'📅', label:'Mijn agenda', onClick:goAgenda }
      ],
      content:practiceRoot
    });

    const app = createPacoGOApp({ supabaseLib: window.supabase });
    const titleElement = template.querySelector('.paco-template-page-header h1');
    const presentation = createPracticePresentation({
      documentRef: document,
      windowRef: window,
      getLesson: () => window.__pacoGOPracticeLesson || null,
      getStudent: () => student,
      db: app.db,
      masteryService: app.mastery,
      audioService: app.audio,
      escapeHtml,
      hideAll: () => {},
      showLessonChoice: goLessonChoice,
      refreshPageSidebars: () => {},
      speechCancel: () => app.audio.stop(),
      pageElement: practiceRoot,
      titleElement,
      progressElement: progress,
      contentElement: content
    });

    try {
      if (!lessonId) throw new Error('Geen les geselecteerd.');
      const records = await app.loadLessons();
      const lesson = app.mapLessons(records).find(candidate => String(candidate.id) === String(lessonId));
      if (!lesson) throw new Error('Deze les kon niet worden gevonden.');
      window.__pacoGOPracticeLesson = lesson;
      content.replaceChildren();
      presentation.start(lesson.type || 'words');
    } catch (error) {
      console.error('Practice load error:', error);
      progress.replaceChildren();
      content.innerHTML = `<div class="practice-loading">${escapeHtml(error.message || 'Oefenen kon niet worden geladen.')}</div>`;
    }
  </script>
</body>
</html>
