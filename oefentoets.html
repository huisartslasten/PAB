<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Oefentoets</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .test-shell{max-width:820px;margin:auto}.test-progress{margin-bottom:20px}.test-content{background:#fff;border:1px solid #dce9f6;border-radius:22px;padding:24px;box-shadow:0 10px 28px rgba(16,43,87,.09)}
    .test-instructions,.small{color:#667894;line-height:1.45}.prompt{margin:24px 0;font-size:30px;font-weight:900;color:#102b57}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px;color:#173b70}.answer-input{width:100%;padding:14px;border:1px solid #cdddec;border-radius:14px;background:#fff;color:#102b57;font-size:18px}.big{border:0;border-radius:14px;padding:13px 18px;background:#1787f2;color:#fff;font-weight:900;cursor:pointer}.big:disabled{opacity:.6;cursor:wait}.speaker{font-size:18px}.result-card{text-align:center}.result-score{font-size:48px;font-weight:950;color:#102b57}.result-details{text-align:left;margin-top:22px}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.result-actions button{border:0;border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}.result-actions .primary{background:#1787f2;color:#fff}.result-actions .secondary{background:#eaf4ff;color:#0d6fd4}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createPracticeTestRuntime } from './src/features/lessons/practice-test-runtime.js';
    import { createPlayerTestView } from './src/features/lessons/player-test-view.js';
    import { createPlayerResultRenderer } from './src/features/lessons/player-result-renderer.js';
    import { escapeHtml } from './src/core/html.js';

    const params = new URLSearchParams(window.location.search);
    const lessonId = params.get('lesson_id') || '';
    const student = params.get('student') || 'Zyon';
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    const app = createPacoGOApp({ supabaseLib: window.supabase });

    const screen = document.createElement('main');
    screen.className = 'test-shell';
    screen.innerHTML = '<div id="test"><div id="testTitle" class="prompt" style="margin-top:0"></div><div id="testProgress" class="test-progress"></div><div id="testContent" class="test-content"></div></div><div id="result" class="result-card hidden"><div class="test-content"><h2 id="resultTitle"></h2><div id="resultScore" class="result-score"></div><div id="resultDetails" class="result-details"></div><div class="result-actions"><button id="retryButton" class="primary" type="button">Nog een keer</button><button id="backButton" class="secondary" type="button">← Leskeuze</button></div></div></div>';
    content.appendChild(screen);

    const goChoice = () => {
      const target = new URL('lesson-choice.html', window.location.href);
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };

    const backToPractice = () => {
      const target = new URL('oefenen.html', window.location.href);
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };

    const hideAll = () => {
      screen.querySelector('#test')?.classList.add('hidden');
      screen.querySelector('#result')?.classList.add('hidden');
    };

    mountPacoPageTemplate({
      mount,
      backLabel: '← Oefenen',
      backAction: backToPractice,
      greeting: `Hoi ${student}! 🐶`,
      title: 'Oefentoets',
      icon: '📝',
      subtitle: 'Beantwoord alle vragen. De uitslag komt aan het einde.',
      navigation: createPacoNavigation({ active:'lessons', student }),
      content
    });

    const languageFor = lesson => {
      const subject = String(lesson?.subject || '').toLowerCase();
      if (subject.includes('engels') || subject.includes('english')) return 'en';
      if (subject.includes('spaans') || subject.includes('spanish')) return 'es';
      if (subject.includes('frans') || subject.includes('french')) return 'fr';
      if (subject.includes('duits') || subject.includes('german')) return 'de';
      if (subject.includes('portugees') || subject.includes('portuguese')) return 'pt';
      return 'nl';
    };

    let runtime = null;
    let testView = null;
    let resultRenderer = null;
    let lesson = null;

    function currentAnswer() {
      const type = runtime?.session?.type || lesson?.type || 'words';
      if (type === 'spelling') {
        return `${document.getElementById('testPerfect')?.value.trim() || ''} || ${document.getElementById('testAdjective')?.value.trim() || ''}`;
      }
      return document.getElementById('testAnswer')?.value.trim() || '';
    }

    function renderCurrent() {
      const session = runtime.session;
      const item = session.currentItem();
      if (!item) return;
      document.getElementById('testTitle').textContent = 'Oefentoets';
      testView.render({ item, index: session.index, total: session.total, type: session.type });
    }

    async function submitTest() {
      const answer = currentAnswer();
      if (!answer.replaceAll(' || ', '').trim()) return;
      const button = document.querySelector('#testContent .big:last-child');
      if (button) { button.disabled = true; button.textContent = 'Controleren…'; }
      try {
        const result = await runtime.submit(answer);
        if (result.done) {
          hideAll();
          screen.querySelector('#result')?.classList.remove('hidden');
          resultRenderer.render({ result: runtime.result() });
          return;
        }
        renderCurrent();
      } finally {
        if (button?.isConnected) button.disabled = false;
      }
    }

    async function speakTest() {
      const item = runtime?.session?.currentItem();
      if (!item) return;
      await app.audio.speak(item.answer, { language: languageFor(lesson) });
    }

    window.submitTest = submitTest;
    window.speakTest = speakTest;

    async function load() {
      if (!lessonId) throw new Error('Geen les geselecteerd.');
      const records = await app.loadLessons();
      lesson = app.mapLessons(records).find(item => String(item.id) === String(lessonId));
      if (!lesson) throw new Error('Deze les kon niet worden gevonden.');

      hideAll();
      screen.querySelector('#test')?.classList.remove('hidden');
      runtime = createPracticeTestRuntime({ lesson, db: app.db, gradeAnswer: app.grading.gradeAnswer });
      testView = createPlayerTestView({ documentRef: document, escapeHtml, speakTest });
      resultRenderer = createPlayerResultRenderer({ documentRef: document, escapeHtml });
      runtime.start();
      renderCurrent();
    }

    document.getElementById('retryButton').addEventListener('click', load);
    document.getElementById('backButton').addEventListener('click', goChoice);

    try {
      await load();
    } catch (error) {
      console.error('Practice test load error:', error);
      const testContent = screen.querySelector('#testContent');
      if (testContent) {
        testContent.innerHTML = `<strong>De oefentoets kon niet worden geladen.</strong><p class="small">${escapeHtml(error?.message || 'Onbekende fout.')}</p>`;
      }
    }
  </script>
</body>
</html>
