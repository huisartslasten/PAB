<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Oefentoets</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <link rel="stylesheet" href="src/features/lessons/practice-page.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createPracticePresentation } from './src/features/lessons/practice-presentation.js';
    import { escapeHtml } from './src/core/html.js';

    const params = new URLSearchParams(window.location.search);
    const lessonId = params.get('lesson_id') || '';
    const student = params.get('student') || 'Zyon';
    const mount = document.querySelector('#paco-template-mount');
    const app = createPacoGOApp({ supabaseLib: window.supabase });
    const content = document.createElement('main');
    content.className = 'practice-page-card';
    content.innerHTML = '<div id="practiceProgress" class="practice-progress"></div><div id="practiceContent" class="practice-content"></div>';

    const goBack = () => {
      const target = new URL('oefenen.html', window.location.href);
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };

    const goLessonChoice = () => {
      const target = new URL('lesson-choice.html', window.location.href);
      if (lessonId) target.searchParams.set('lesson_id', lessonId);
      target.searchParams.set('student', student);
      window.location.href = target.toString();
    };

    mountPacoPageTemplate({
      mount,
      backLabel: '← Oefenen',
      backAction: goBack,
      greeting: `Hoi ${student}! 🐶`,
      title: 'Oefentoets',
      icon: '📝',
      subtitle: 'Beantwoord alle vragen. Je krijgt per vraag feedback, maar de oefentoets telt niet mee als echte toets.',
      navigation: createPacoNavigation({ app, active: 'lessons', student }),
      content
    });

    const shuffle = items => {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [result[index], result[swap]] = [result[swap], result[index]];
      }
      return result;
    };

    try {
      if (!lessonId) throw new Error('Geen les geselecteerd.');
      const records = await app.loadLessons();
      const lesson = app.mapLessons(records).find(item => String(item.id) === String(lessonId));
      if (!lesson) throw new Error('Deze les kon niet worden gevonden.');

      const presentation = createPracticePresentation({
        documentRef: document,
        windowRef: window,
        getLesson: () => ({ ...lesson, practiceMode: 'assessment' }),
        getStudent: () => student,
        db: app.db,
        audioService: app.audio,
        shuffle,
        random: Math.random,
        escapeHtml,
        hideAll: () => {},
        showLessonChoice: goLessonChoice,
        refreshPageSidebars: () => {},
        speechCancel: () => window.speechSynthesis?.cancel(),
        aiCheckAnswers: lesson.ai_check_answers !== false,
        pageElement: content,
        progressElement: document.getElementById('practiceProgress'),
        contentElement: document.getElementById('practiceContent')
      });

      presentation.start(lesson.type || 'words');
    } catch (error) {
      console.error('Practice test load error:', error);
      document.getElementById('practiceContent').innerHTML = `<div class="practice-loading">${escapeHtml(error?.message || 'De oefentoets kon niet worden geladen.')}</div>`;
    }
  </script>
</body>
</html>
