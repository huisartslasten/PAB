<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1787f2">
<title>PacoGO — Huiswerkfoto</title>
<style>
body{margin:0;background:#eef8ff;color:#102b57;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}
.card{max-width:520px;margin:0 auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 35px rgba(16,43,87,.12)}
h1{font-size:30px;margin:0 0 8px}.sub{color:#667894;line-height:1.5}
.camera{display:block;width:100%;padding:18px;margin:18px 0 10px;border:0;border-radius:16px;background:#1787f2;color:#fff;font-size:20px;font-weight:800}
.upload{display:block;width:100%;padding:16px;margin:0 0 12px;border:0;border-radius:16px;background:#eef6ff;color:#126fc9;font-size:18px;font-weight:800}
.file-input{display:none}
.preview{width:100%;max-height:55vh;object-fit:contain;border-radius:16px;margin-top:12px;background:#f7fbff}
.send{display:none;width:100%;padding:16px;border:0;border-radius:16px;background:#43b96b;color:#fff;font-size:19px;font-weight:800;margin-top:14px}
.status{min-height:28px;margin-top:14px;font-weight:700}.paw{font-size:48px}.small{font-size:13px;color:#667894;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<div class="paw">🐾</div>
<h1>Foto naar PacoGO</h1>
<div class="sub">Maak een foto van het huiswerk. PacoGO op de computer krijgt hem automatisch.</div>
<button id="cameraButton" class="camera" type="button">📷 Maak foto</button>
<button id="uploadButton" class="upload" type="button">📁 Kies foto uit telefoon</button>
<input id="cameraFile" class="file-input" type="file" accept="image/*" capture="environment">
<input id="uploadFile" class="file-input" type="file" accept="image/*">
<img id="preview" class="preview" style="display:none" alt="Voorbeeld">
<button id="send" class="send">📤 Stuur foto naar PacoGO</button>
<div id="status" class="status"></div>
<div class="small">Je kunt deze pagina sluiten nadat de foto is verzonden.</div>
</div>
<script>
const endpoint="https://ncpkqrvxljxwboavxtak.supabase.co/functions/v1/photo-upload-v1";
const token=new URLSearchParams(location.search).get("token")||"";
const fileInput=document.getElementById("file"),preview=document.getElementById("preview"),send=document.getElementById("send"),status=document.getElementById("status");
let selected=null;
function prepare(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);canvas.toBlob(b=>b?resolve(b):reject(new Error("Foto verwerken mislukt")),"image/jpeg",.78)};img.onerror=()=>reject(new Error("Foto kon niet worden gelezen"));img.src=URL.createObjectURL(file)})}
function chooseFile(file){if(!file)return;selected=file;preview.src=URL.createObjectURL(file);preview.style.display="block";send.style.display="block";status.textContent="Foto klaar. Controleer hem en stuur hem naar PacoGO."}
cameraButton.onclick=()=>cameraFile.click();
uploadButton.onclick=()=>uploadFile.click();
cameraFile.onchange=()=>chooseFile(cameraFile.files&&cameraFile.files[0]);
uploadFile.onchange=()=>chooseFile(uploadFile.files&&uploadFile.files[0]);
if(!token){status.textContent="⚠️ Ongeldige QR-code.";cameraButton.disabled=true;uploadButton.disabled=true}else{
send.onclick=async()=>{if(!selected)return;send.disabled=true;status.textContent="📤 Foto wordt verstuurd...";try{const blob=await prepare(selected),reader=new FileReader(),data=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)}),r=await fetch(endpoint+"?token="+encodeURIComponent(token),{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({image:data})}),out=await r.json();if(!r.ok||!out.ok)throw new Error(out.error||"Versturen mislukt");status.textContent="✅ Foto staat in PacoGO! Je kunt deze pagina sluiten.";send.textContent="✅ Verzonden"}catch(e){status.textContent="⚠️ "+e.message;send.disabled=false}};
}
</script>
</body>
</html>
