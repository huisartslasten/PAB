<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacoGO — Toetsgeschiedenis</title>
  <link rel="stylesheet" href="src/components/page-template.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .history-shell{width:100%}.history-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.history-toolbar label{font-weight:800;color:#173b70}.history-toolbar select{min-width:190px;padding:10px 12px;border:1px solid #cdddec;border-radius:12px;background:#fff;color:#102b57;font:inherit}.history-content{display:grid;gap:12px}.history-loading,.history-error{padding:18px;background:#fff;border:1px solid #dce9f6;border-radius:16px;color:#526784}.history-error{color:#8b2d2d}.card.empty{padding:18px;background:#fff;border:1px solid #dce9f6;border-radius:16px}.test-history-item{background:#fff;border:1px solid #dce9f6;border-radius:16px;overflow:hidden}.test-history-item summary{cursor:pointer;list-style:none;padding:16px 18px}.test-history-item summary::-webkit-details-marker{display:none}.test-history-main{display:flex;justify-content:space-between;gap:18px;align-items:center}.test-history-summary{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}.test-history-summary span{padding:5px 9px;border-radius:999px;background:#edf5fc}.history-errors{color:#9b3b3b}.history-ok{color:#237047}.test-history-details{padding:0 18px 18px}.test-history-score{font-size:20px;font-weight:900;color:#102b57;margin-bottom:12px}.result-item{padding:10px 12px;border-top:1px solid #e8eff6}.result-item.correct{background:#f2fbf6}.result-item.incorrect{background:#fff7f7}.small{color:#667894;line-height:1.45}
  </style>
</head>
<body>
  <div id="paco-template-mount"></div>
  <script type="module">
    import { mountPacoPageTemplate } from './src/components/page-template.js';
    import { createPacoNavigation } from './src/components/page-navigation.js';
    import { createPacoGOApp } from './src/app/bootstrap.js';
    import { createTestHistoryRenderer } from './src/features/test-history/test-history-renderer.js';
    import { escapeHtml } from './src/core/html.js';

    const params = new URLSearchParams(window.location.search);
    const requestedStudent = params.get('student') || '';
    const mount = document.querySelector('#paco-template-mount');
    const content = document.createElement('div');
    content.className = 'history-shell';
    content.innerHTML = `
      <div class="history-toolbar">
        <label for="historyStudent">Leerling</label>
        <select id="historyStudent">
          <option value="">Alle leerlingen</option>
        </select>
      </div>
      <div id="testHistoryContent" class="history-content">
        <div class="history-loading">Toetsgeschiedenis laden…</div>
      </div>`;

    const app = createPacoGOApp({ supabaseLib: window.supabase });
    const historyContent = content.querySelector('#testHistoryContent');
    const studentSelect = content.querySelector('#historyStudent');

    const goManagement = () => { window.location.href = 'management.html'; };

    mountPacoPageTemplate({
      mount,
      backLabel: '← Beheer',
      backAction: goManagement,
      greeting: 'PacoGO beheer ⚙️',
      title: 'Toetsgeschiedenis',
      icon: '📝',
      subtitle: 'Bekijk gemaakte toetsen en de antwoorden per vraag.',
      navigation: createPacoNavigation({
        app,
        active: 'test-history',
        student: requestedStudent,
        includeAgenda: false
      }),
      content
    });

    const renderAttempts = createTestHistoryRenderer({
      getLessons: () => app.state.lessons,
      escapeHtml,
      documentRef: document
    });

    function renderError(error) {
      historyContent.innerHTML = `<div class="history-error"><strong>De toetsgeschiedenis kon niet worden geladen.</strong><p class="small">${escapeHtml(error?.message || 'Onbekende fout.')}</p></div>`;
    }

    function populateStudentFilter(attempts) {
      const students = [...new Set((attempts || []).map(attempt => String(attempt.student || '').trim()).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'nl-NL'));
      studentSelect.replaceChildren(new Option('Alle leerlingen', ''));
      students.forEach(student => studentSelect.appendChild(new Option(student, student)));
      if (requestedStudent && students.includes(requestedStudent)) studentSelect.value = requestedStudent;
    }

    async function loadHistory(studentFilter = '') {
      historyContent.innerHTML = '<div class="history-loading">Toetsgeschiedenis laden…</div>';
      try {
        const attempts = await app.testHistory.listAttempts(studentFilter);
        renderAttempts(attempts, studentFilter);
        return attempts;
      } catch (error) {
        console.error('Test history load error:', error);
        renderError(error);
        return [];
      }
    }

    async function initialize() {
      await app.initializeSession();
      if (!app.auth.isParent) {
        historyContent.innerHTML = '<div class="history-error"><strong>Geen toegang.</strong><p class="small">Toetsgeschiedenis is alleen beschikbaar in de beheeromgeving.</p></div>';
        return;
      }

      await app.loadLessons();
      const attempts = await loadHistory();
      populateStudentFilter(attempts);
      if (requestedStudent) await loadHistory(requestedStudent);
    }

    studentSelect.addEventListener('change', async () => {
      const target = new URL(window.location.href);
      if (studentSelect.value) target.searchParams.set('student', studentSelect.value);
      else target.searchParams.delete('student');
      window.history.replaceState({}, '', target.toString());
      await loadHistory(studentSelect.value);
    });

    initialize().catch(error => {
      console.error('Test history initialization error:', error);
      renderError(error);
    });
  </script>
</body>
</html>
