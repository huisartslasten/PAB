<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>PacoGO player runtime entry browser fixture</title></head>
<body>
<div id="testContent"><input id="testAnswer"><button class="big" type="button">Volgende</button></div>
<script type="module">
  import { createPlayerRuntimeEntry } from '/src/features/lessons/player-runtime-entry.js';

  window.__events = [];
  const persistence = {
    async saveTestResult(payload) {
      window.__events.push(payload);
      return { attempt: { id: 77 }, answers: payload.answers };
    }
  };
  const lesson = {
    id: 42,
    title: 'Woordentoets',
    subject: 'Nederlands',
    type: 'words',
    ai_check_answers: true,
    lesson_items: [
      { id: 1, question: 'appel', answer: 'fruit' },
      { id: 2, question: 'peer', answer: 'boom' }
    ]
  };
  const entry = createPlayerRuntimeEntry({
    lesson,
    student: 'Zyon',
    persistence,
    gradeAnswer: async (expected, given) => ({ correct: expected === given, feedback: '' }),
    renderResult: async result => { window.__result = result; },
    cancelSpeech: () => {},
    clearActivity: () => {},
    clock: () => '2026-10-06T00:00:00.000Z'
  });

  entry.startTest({
    items: lesson.lesson_items,
    shuffle: items => items,
    startedAt: '2026-10-05T23:00:00.000Z'
  });

  window.submitTest = () => entry.submitTest({ type: lesson.type });
  window.playerState = () => ({ index: entry.runtime.session.index, answers: entry.runtime.session.answers });
</script>
</body>
</html>
